contenuti:
  hook: È l'unico gas nobile radioattivo, esce dal terreno senza che nessuno lo veda, e in
    molti paesi è la seconda causa di tumore al polmone dopo il fumo.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il radon è il più denso dei gas nobili e l''unico radioattivo: nasce dal decadimento
      dell''uranio e del torio nelle rocce, filtra attraverso il suolo e si accumula negli
      scantinati e nei piani bassi delle case. Non ha odore, colore né sapore, e la sua pericolosità
      è tutta in ciò che produce decadendo.'
    visual: Un rivelatore di radon appoggiato sul pavimento di uno scantinato
    attendibilita: documentato
  - id: l_emanazione
    sezione: storia
    testo: Nel 1900 il fisico tedesco Friedrich Ernst Dorn osservò che i composti del radio
      emettevano un gas radioattivo, che chiamò emanazione del radio. Non era il primo a vedere
      qualcosa del genere — fenomeni simili erano stati notati con il torio e con l'attinio
      — ma fu il primo a studiarne sistematicamente il comportamento.
    visual: Un apparato di vetro che raccoglie un gas sopra un sale di radio
    attendibilita: documentato
  - id: tre_emanazioni
    sezione: storia
    testo: Per un decennio si parlò di tre emanazioni distinte, chiamate radon, thoron e actinon
      a seconda dell'elemento da cui uscivano. Si capì poi che erano tre isotopi dello stesso
      elemento, prodotti da tre catene di decadimento diverse, con emivite che vanno da pochi
      secondi a pochi giorni.
    visual: Tre catene di decadimento radioattivo disegnate a confronto
    attendibilita: documentato
  - id: il_nome
    sezione: storia
    testo: Nel 1910 William Ramsay e Robert Whytlaw-Gray, che ne avevano isolato una quantità
      sufficiente per misurarne la densità, proposero di chiamarlo niton, dal latino nitens,
      «splendente», per il bagliore che i suoi composti emettono al buio. Il nome radon, derivato
      dall'isotopo più stabile, si impose e fu adottato ufficialmente nel 1923.
    visual: Una fiala che emette un debole bagliore in una stanza buia
    attendibilita: documentato
  - id: l_ultimo_della_colonna
    sezione: storia
    testo: 'Con il radon la colonna dei gas nobili era completa: elio, neon, argon, cripton,
      xenon e radon, sei elementi trovati in sedici anni, cinque dei quali da William Ramsay.
      L''ultimo arrivava però da una strada diversa da tutti gli altri: non dall''aria liquida,
      ma dalla radioattività, cioè dal campo di ricerca che stava per riscrivere la chimica
      dall''interno.'
    visual: La colonna completa dei gas nobili in una tavola periodica
    attendibilita: documentato
  - id: radioattivita
    sezione: caratteristiche
    testo: 'L''isotopo più stabile, il radon-222, ha un''emivita di 3,8 giorni e discende
      dal radio-226, che a sua volta discende dall''uranio-238: ogni roccia che contiene uranio
      ne produce di continuo. Decadendo emette particelle alfa e si trasforma in una serie
      di isotopi solidi di polonio, piombo e bismuto, anch''essi radioattivi.'
    visual: La catena di decadimento dell'uranio-238 fino al piombo
    attendibilita: documentato
  - id: perche_e_pericoloso
    sezione: caratteristiche
    testo: 'Il pericolo non è il gas in sé, che essendo nobile non si lega a nulla e viene
      in gran parte espirato, ma i suoi figli: sono solidi, si attaccano al pulviscolo dell''aria,
      vengono inalati e restano nei polmoni, dove continuano a emettere particelle alfa a
      contatto diretto con le cellule. Le agenzie sanitarie lo indicano come la seconda causa
      di tumore al polmone dopo il fumo di sigaretta, e come la prima fra chi non ha mai fumato;
      nei soli Stati Uniti gli si attribuiscono circa ventunmila morti l''anno.'
    visual: Particelle di pulviscolo con isotopi attaccati, in uno schema polmonare
    attendibilita: documentato
  - id: proprieta_fisiche
    sezione: caratteristiche
    testo: È il più denso dei gas nobili — circa otto volte l'aria — ed è per questo che si
      accumula in basso, nei sotterranei e nei vespai. Liquefa a 211 kelvin, e come gli altri
      gas nobili pesanti forma qualche composto con il fluoro, che però nessuno studia volentieri,
      vista l'emivita.
    visual: Un modello di casa in sezione con la distribuzione del gas nei piani bassi
    attendibilita: documentato
  - id: dove_si_trova
    sezione: caratteristiche
    testo: La quantità di radon che entra in un edificio dipende dalla geologia del terreno
      — i graniti e i tufi vulcanici ne producono più delle rocce sedimentarie — e dal modo
      in cui l'edificio è costruito e ventilato. È la ragione per cui le mappe del rischio
      radon somigliano alle carte geologiche più che a quelle dell'inquinamento.
    visual: Una carta del rischio radon sovrapposta a una carta geologica
    attendibilita: documentato
  - id: usi_salute_pubblica
    sezione: usi
    testo: L'impiego principale del radon, oggi, è essere misurato. Le agenzie sanitarie raccomandano
      di controllarne la concentrazione nelle abitazioni con rivelatori passivi lasciati in
      posa per mesi — sono scatolette economiche che registrano le tracce delle particelle
      alfa — e dove i valori superano le soglie si interviene con la ventilazione dei vespai
      e la depressurizzazione del suolo sotto la platea. Sono tecniche edilizie semplici,
      che abbattono la concentrazione di un ordine di grandezza e che in molti paesi sono
      obbligatorie nelle nuove costruzioni delle zone a rischio.
    visual: Un impianto di depressurizzazione del suolo installato in una casa
    attendibilita: documentato
  - id: usi_storici
    sezione: usi
    testo: Nella prima metà del Novecento il radon veniva raccolto in capsule d'oro e usato
      in radioterapia per irradiare i tumori dall'interno, prima che sorgenti più maneggevoli
      lo sostituissero. Nello stesso periodo, e con molto meno fondamento, acque e terme «radioattive»
      venivano pubblicizzate come benefiche proprio per il loro contenuto di radon.
    visual: Una vecchia pubblicità di acque termali radioattive
    attendibilita: documentato
  - id: usi_geologia
    sezione: usi
    testo: 'In geologia il radon serve da tracciante: la sua concentrazione nel suolo e nelle
      falde cambia quando le rocce si fratturano, e per questo viene monitorato nelle aree
      sismiche e sui vulcani. È un indicatore utile a ricostruire ciò che succede sottoterra,
      anche se l''idea di usarlo per prevedere i terremoti non ha finora prodotto un metodo
      affidabile.'
    visual: Una stazione di monitoraggio del radon su un fianco vulcanico
    attendibilita: discusso
  - id: curiosita_case
    sezione: curiosita
    testo: 'Il problema del radon domestico è emerso in modo clamoroso nel 1984, quando un
      tecnico di una centrale nucleare della Pennsylvania fece scattare i rivelatori di contaminazione
      entrando al lavoro, non uscendo. La sorgente non era la centrale: era casa sua, costruita
      su una formazione geologica ricca di uranio.'
    attendibilita: documentato
  - id: curiosita_gas_nobile
    sezione: curiosita
    testo: 'Il radon è l''unico elemento della tavola periodica che nella vita di tutti i
      giorni si incontra soltanto come rischio da misurare. Non serve a fare niente, non lo
      si compra, non lo si maneggia: esiste, esce dal terreno, e l''unica cosa che se ne fa
      è tenerlo fuori di casa.'
    attendibilita: documentato
