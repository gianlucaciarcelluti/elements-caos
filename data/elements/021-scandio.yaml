  note_cronologia: 'Corrisponde all''eka-boro previsto da Mendeleev nel 1869: fu Per Teodor
    Cleve, non Nilson, a riconoscere la corrispondenza e a segnalarla a Mendeleev. Il metallo
    fu prodotto per la prima volta nel 1937, per elettrolisi di cloruri fusi.'
