  epoca: nucleare
  isolamento_anno: null
  note_cronologia: Primo dei sei elementi consecutivi sintetizzati al GSI di Darmstadt. Cinque
    atomi di bohrio-262 ottenuti nel 1981 da bismuto-209 e cromo-54, con la catena di decadimenti
    agganciata a isotopi noti di fermio e californio. Dubna aveva rivendicato l'elemento nel
    1976 con la stessa reazione, ma su eventi di fissione spontanea che la commissione internazionale
    ha giudicato insufficienti; il merito dell'idea del metodo — la fusione fredda, cioè la
    fusione a bassa energia di eccitazione — resta però sovietico. Il nome proposto dal GSI
    era nielsbohrium, abbreviato in bohrium dalla IUPAC nel 1994 e definitivo dal 1997.
  controversia: null
