nome: Bismuto
nome_en: Bismuth
scoperta:
  anno: 1500
  anno_stimato: true
  scopritori: []
  luogo: null
  epoca: antichita
  isolamento_anno: 1753
  note_cronologia: 'Data convenzionale degli alchimisti europei, come le altre dell''antichità:
    intorno al 1500 il bismuto è materiale corrente nelle miniere e nelle tipografie sassoni,
    ma è considerato una varietà di piombo o di stagno. La distinzione come metallo autonomo
    è di Georgius Agricola nel 1546; la dimostrazione sperimentale che non è né piombo né
    stagno arriva da Claude François Geoffroy nel 1753.'
  controversia: 'Il bismuto non ha una data di scoperta perché non ha avuto una scoperta.
    È stato usato per secoli, ma sempre sotto il nome di qualcos''altro: piombo, stagno,
    antimonio, di volta in volta. La data del 1500 adottata qui è una convenzione che indica
    quando il materiale è già ben presente nella pratica mineraria e tipografica dell''Europa
    centrale, non un riconoscimento. Georgius Agricola, nel 1546, è il primo a trattarlo
    esplicitamente come un metallo distinto della famiglia di piombo e stagno; ma bisogna
    aspettare Johann Heinrich Pott nel 1739 e soprattutto Claude François Geoffroy nel 1753
    perché la separazione dal piombo sia dimostrata sperimentalmente e accettata. Fra la
    data convenzionale e il riconoscimento corrono più di due secoli e mezzo.'
