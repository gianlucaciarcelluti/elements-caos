contenuti:
  hook: 'Per secoli il bismuto è stato scambiato per piombo, per stagno, per antimonio. È
    l''ultimo elemento stabile della tavola periodica, tranne che non lo è: nel 2003 si è
    scoperto che decade anche lui, con un''emivita un miliardo di volte l''età dell''universo.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il bismuto è un metallo pesante dal riflesso appena rosato, fragile, che fonde
      a una temperatura bassissima per un metallo. Sta nella tavola periodica subito dopo
      il piombo, e la sua storia è quella di un elemento che nessuno ha mai avuto motivo di
      distinguere dai vicini, perché a occhio e alla lavorazione somigliava troppo a loro.'
    visual: Lingotto di bismuto con la superficie appena rosata accanto a uno di piombo grigio
    attendibilita: documentato
  - id: confusione
    sezione: storia
    testo: 'Il bismuto è fra i primi metalli che l''umanità ha maneggiato, e insieme fra gli
      ultimi a ricevere un nome proprio. Il problema è che sta in mezzo: fonde poco sopra
      i duecentosettanta gradi come lo stagno, è pesante e tenero come il piombo, e cristallizza
      fragile come l''antimonio. Chiunque lo trovasse lo classificava come una varietà di
      uno dei tre, e nei minerali si presenta spesso insieme a loro, il che rendeva l''equivoco
      quasi obbligato.'
    visual: Quattro campioni affiancati di piombo, stagno, antimonio e bismuto, difficili da
      distinguere
    attendibilita: documentato
  - id: usi_precoloniali
    sezione: storia
    testo: 'Le tracce del suo impiego precedono di molto la sua identificazione, e arrivano
      da luoghi lontanissimi fra loro. Nel sito inca di Machu Picchu è stata trovata una lama
      di bronzo che contiene bismuto in lega, e nell''Europa centrale del tardo Medioevo il
      metallo è già materiale corrente per i caratteri da stampa e per le leghe basso-fondenti.
      In nessuno di questi casi chi lo usava sapeva di usare un elemento a sé.'
    visual: Caratteri tipografici in lega di piombo, stagno e bismuto in una cassetta da stampatore
    attendibilita: documentato
  - id: agricola
    sezione: storia
    testo: 'Il primo a metterlo per iscritto come metallo distinto è Georgius Agricola, il
      grande trattatista della mineralogia sassone, in un''opera del 1546: lo colloca in una
      famiglia insieme a piombo e stagno, il che è già un passo avanti rispetto a considerarlo
      lo stesso materiale. I minatori dell''epoca lo chiamavano tectum argenti, tetto d''argento,
      perché lo trovavano sopra i filoni argentiferi ed erano convinti che fosse argento in
      formazione, non ancora maturo.'
    visual: Pagina illustrata di un trattato minerario del Cinquecento con la sezione di un
      filone
    attendibilita: documentato
  - id: geoffroy
    sezione: storia
    testo: 'La prova sperimentale arriva con due secoli di ritardo. Nel 1739 Johann Heinrich
      Pott ne studia le proprietà a Berlino, e nel 1753 il francese Claude François Geoffroy
      dimostra in modo accettato dalla comunità che il bismuto non è né piombo né stagno ma
      un metallo autonomo; Carl Wilhelm Scheele e Torbern Bergman ne completano il quadro
      poco dopo. Il bismuto entra così nella chimica per sottrazione, cioè dimostrando ciò
      che non è: un percorso opposto a quello di quasi tutti gli altri elementi.'
    visual: Banco da laboratorio settecentesco con i campioni di piombo e bismuto separati
      e etichettati
    attendibilita: documentato
  - id: caratteristiche_dilatazione
    sezione: caratteristiche
    testo: 'Il bismuto ha una stranezza che condivide quasi solo con l''acqua: solidificando
      si dilata invece di contrarsi, di circa il tre per cento. È una proprietà che sembra
      da curiosità e che è stata invece decisiva in tipografia, perché una lega che si espande
      raffreddando riempie perfettamente lo stampo e riproduce ogni dettaglio del carattere,
      compensando il ritiro degli altri componenti.'
    visual: Colata di lega tipografica che riempie una matrice fino ai bordi più sottili
    attendibilita: documentato
  - id: caratteristiche_fisiche
    sezione: caratteristiche
    testo: 'Gli altri primati del bismuto sono tutti in negativo, e insieme lo definiscono.
      È il metallo più diamagnetico che si conosca, cioè quello che un campo magnetico respinge
      con più forza: una scaglia di bismuto sospesa fra due magneti resta in aria da sola.
      Ha inoltre la conducibilità termica più bassa di tutti i metalli con l''unica eccezione
      del mercurio, e una conducibilità elettrica scarsa. È, in breve, il meno metallico dei
      metalli.'
    visual: Scaglia di bismuto in levitazione stabile fra due magneti al neodimio
    attendibilita: documentato
  - id: caratteristiche_radioattivita
    sezione: caratteristiche
    testo: 'Fino al 2003 il bismuto-209 era considerato l''isotopo stabile più pesante esistente
      in natura, e con lui il bismuto era l''ultimo elemento stabile della tavola. Quell''anno
      un gruppo guidato da Pierre de Marcillac, all''Istituto di astrofisica spaziale di Orsay,
      riuscì a rivelarne il decadimento alfa con un rivelatore criogenico: centoventotto eventi
      in cinque giorni. L''emivita risultante è di circa venti miliardi di miliardi di anni,
      oltre un miliardo di volte l''età dell''universo, il che significa che dal punto di vista
      pratico il bismuto resta stabile quanto qualunque altra cosa.'
    visual: Spettro del rivelatore criogenico con il picco alfa a 3,14 megaelettronvolt evidenziato
    attendibilita: documentato
  - id: usi_farmaco
    sezione: usi
    testo: 'A dispetto della posizione fra piombo e polonio, il bismuto è notevolmente poco
      tossico, e questo gli ha aperto la farmacologia. Il subsalicilato di bismuto è il principio
      attivo dei preparati contro diarrea e disturbi gastrici venduti in tutto il mondo, e
      i composti di bismuto entrano nelle terapie di eradicazione dell''Helicobacter pylori,
      il batterio responsabile della maggior parte delle ulcere gastriche.'
    visual: Flacone di sospensione al subsalicilato di bismuto con il caratteristico rosa
    attendibilita: documentato
  - id: usi_sostituto_piombo
    sezione: usi
    testo: 'La bassa tossicità gli ha aperto anche il ruolo di sostituto del piombo, man mano
      che le normative ambientali ne hanno ristretto l''uso: saldature per impianti di acqua
      potabile, pallini da caccia, contrappesi, schermature radiologiche. Restano poi le leghe
      basso-fondenti, come il metallo di Wood, che fondono sotto i settanta gradi e servono
      da fusibile termico negli impianti antincendio a sprinkler: il tappo si scioglie con
      il calore e l''acqua parte da sola.'
    visual: Testa di sprinkler antincendio con il tappo di lega fusibile ancora integro
    attendibilita: documentato
  - id: curiosita_cristalli
    sezione: curiosita
    testo: 'Il bismuto è probabilmente l''elemento più fotogenico della tavola periodica. Fondendolo
      e lasciandolo raffreddare lentamente si formano cristalli a scaletta, con gli spigoli
      che crescono più in fretta delle facce e generano una geometria di terrazze concentriche;
      lo strato sottilissimo di ossido che si forma in superficie produce per interferenza
      colori accesi che vanno dal giallo al blu. Il basso punto di fusione fa sì che l''esperimento
      riesca su un fornello di casa.'
    visual: Cristallo di bismuto a terrazze concentriche con l'iridescenza dal giallo al blu
    attendibilita: documentato
  - id: curiosita_nome
    sezione: curiosita
    testo: 'L''origine del nome resta incerta e le ipotesi si accavallano: dal tedesco weisse
      Masse, massa bianca, o da wis mat, prato bianco, forse dal nome di una località mineraria.
      La forma latinizzata bisemutum, da cui deriva il simbolo Bi, è stata coniata solo nel
      Cinquecento. Anche nel nome, insomma, il bismuto è arrivato tardi e senza certezze.'
    visual: Voci di lessico minerario tedesco cinquecentesco con le varianti del nome
    attendibilita: documentato
  pronuncia: []
