  luogo: Parigi, Francia
  epoca: spettroscopia
  isolamento_anno: 1878
  note_cronologia: 'Primo dei tre elementi previsti da Mendeleev a essere trovato: corrisponde
    all''eka-alluminio descritto nel 1871. Fu Mendeleev stesso, dopo l''annuncio, a segnalare
    che la densità misurata da Lecoq de Boisbaudran era troppo bassa; la misura rifatta su
    campione più puro diede ragione alla previsione.'
