contenuti:
  hook: Mendeleev aveva lasciato una casella vuota sotto l'alluminio e ne aveva descritto
    l'occupante prima che esistesse. Quando qualcuno lo trovò, gli scrisse per dirgli che
    aveva misurato male la densità.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il gallio è un metallo argenteo che fonde a 29,8 gradi: un pezzo tenuto nel palmo
      della mano diventa liquido in pochi minuti. Da liquido bagna il vetro e la pelle, e
      solidificando si espande invece di contrarsi, come fa l''acqua. Non se ne vedono oggetti
      perché non serve a fare oggetti: serve a fare semiconduttori.'
    visual: Un frammento di gallio che fonde nel palmo di una mano
    attendibilita: documentato
  - id: la_casella_vuota
    sezione: storia
    testo: 'Nel 1869 Dmitrij Mendeleev aveva ordinato gli elementi per peso atomico e si era
      trovato con dei buchi. Invece di ignorarli, li usò: se la tavola era una legge di natura,
      quei buchi erano elementi non ancora trovati, e le proprietà dei vicini dicevano quali
      dovessero essere. Nel 1871 descrisse l''occupante della casella sotto l''alluminio,
      lo chiamò eka-alluminio e ne indicò peso atomico, densità, punto di fusione basso e
      il modo in cui lo si sarebbe trovato.'
    visual: La tavola periodica di Mendeleev del 1871 con le caselle vuote
    attendibilita: documentato
  - id: le_due_righe_viola
    sezione: storia
    testo: Nel 1875 Paul-Émile Lecoq de Boisbaudran esaminava allo spettroscopio un campione
      di sfalerite dei Pirenei, un minerale di zinco, e vi trovò due righe viola che non appartenevano
      a nulla di conosciuto. Ne isolò il metallo per elettrolisi in poche settimane, e lo
      chiamò gallio.
    visual: Due righe viola in uno spettro accanto a un campione di sfalerite
    attendibilita: documentato
  - id: la_lettera_di_mendeleev
    sezione: storia
    testo: 'Poco dopo l''annuncio, Lecoq de Boisbaudran ricevette una lettera da Pietroburgo:
      Mendeleev gli faceva notare che il nuovo elemento era il suo eka-alluminio e che la
      densità misurata, 4,7 grammi per centimetro cubo, doveva essere sbagliata, perché la
      teoria ne prevedeva quasi sei. Il francese rifece la misura su un campione più puro
      e trovò 5,9. La tavola periodica aveva corretto un dato sperimentale.'
    visual: Una lettera manoscritta accanto a una bilancia da laboratorio
    attendibilita: documentato
  - id: il_nome
    sezione: storia
    testo: 'Sul nome si discusse. Gallia è il nome latino della Francia, ma gallus in latino
      significa gallo, e il cognome dello scopritore, Lecoq, in francese vuol dire esattamente
      la stessa cosa: molti lessero il battesimo come una firma nascosta. Lecoq de Boisbaudran
      smentì per iscritto nel 1877, dichiarando di aver pensato soltanto alla Francia.'
    visual: Un gallo inciso su un'illustrazione ottocentesca accanto a una carta di Francia
    attendibilita: discusso
  - id: cosa_cambio
    sezione: storia
    testo: L'effetto della vicenda fu enorme e riguardava la tavola più che l'elemento. Fino
      ad allora la periodicità era uno schema utile; una previsione verificata nei dettagli,
      e capace perfino di smentire una misura, la trasformò in una legge su cui si poteva
      contare. Nei dieci anni successivi la stessa cosa sarebbe accaduta altre due volte,
      con lo scandio e con il germanio.
    visual: Tre caselle della tavola periodica evidenziate una accanto all'altra
    attendibilita: documentato
  - id: fusione_bassa
    sezione: caratteristiche
    testo: 'Il punto di fusione a 29,8 gradi e il punto di ebollizione a oltre 2200 fanno
      del gallio il metallo con l''intervallo di stato liquido più ampio che si conosca: resta
      liquido per più di duemila gradi. È la ragione per cui riempie i termometri ad alta
      temperatura, dove il mercurio bollirebbe.'
    visual: Un termometro industriale a gallio accanto a un forno
    attendibilita: documentato
  - id: espansione_e_vetro
    sezione: caratteristiche
    testo: Solidificando aumenta di volume di circa il tre per cento, e questo lo rende capace
      di rompere i contenitori in cui lo si congela; da liquido bagna la maggior parte delle
      superfici, vetro compreso, il che lo rende scomodo da maneggiare quanto è comodo da
      fondere. In lega con indio e stagno forma il galinstano, liquido già a meno diciannove
      gradi, che ha sostituito il mercurio nei termometri clinici.
    visual: Un termometro clinico al galinstano accanto a uno tradizionale
    attendibilita: documentato
  - id: fragilita_dei_metalli
    sezione: caratteristiche
    testo: 'Il gallio liquido penetra nei bordi dei grani cristallini dell''alluminio e ne
      distrugge la coesione: una goccia su una lattina la rende fragile come carta nel giro
      di ore. Per questa ragione è vietato a bordo degli aerei in quantità significative,
      e nei laboratori si tiene lontano dalle strutture leggere.'
    visual: Una lamina di alluminio che si sbriciola dopo il contatto con il gallio
    attendibilita: documentato
  - id: usi_semiconduttori
    sezione: usi
    testo: Quasi tutto il gallio prodotto finisce in composti semiconduttori. L'arseniuro
      di gallio è il materiale dei circuiti a microonde e dei componenti veloci, e delle celle
      solari ad alta efficienza per i satelliti; il nitruro di gallio è quello dei LED blu
      e violetti e dei diodi laser, e negli ultimi anni è diventato il materiale dell'elettronica
      di potenza, che regge tensioni e frequenze dove il silicio non arriva.
    visual: Un wafer di arseniuro di gallio con i circuiti stampati sopra
    attendibilita: documentato
  - id: usi_led
    sezione: usi
    testo: 'Il LED bianco delle lampade di casa è, sotto il rivestimento giallo, un LED blu
      al nitruro di indio e gallio: il fosforo che lo copre converte parte di quel blu in
      giallo, e la somma dà il bianco. La stessa famiglia di materiali fa i laser dei lettori
      Blu-ray e i LED delle insegne.'
    visual: Un LED bianco visto da vicino, con il chip blu sotto il fosforo giallo
    attendibilita: documentato
  - id: produzione
    sezione: usi
    testo: 'Il gallio non ha minerali propri e si ricava come sottoprodotto: soprattutto dalla
      bauxite lavorata per l''alluminio, in misura minore dai residui dello zinco. La produzione
      è concentrata in pochi paesi — nel 2023 la Cina ne forniva circa l''ottanta per cento
      — e questo lo ha reso una delle materie prime che compaiono negli elenchi dei materiali
      critici.'
    visual: Un impianto per la lavorazione della bauxite
    attendibilita: documentato
  - id: curiosita_cucchiaino
    sezione: curiosita
    testo: 'Il gallio è protagonista di uno scherzo classico da laboratorio: un cucchiaino
      fuso e colato in uno stampo sembra un normale cucchiaino di metallo, finché non lo si
      immerge nel tè caldo, dove scompare in pochi secondi lasciando una pozza argentea sul
      fondo della tazza.'
    attendibilita: tradizionale
  - id: curiosita_neutrini
    sezione: curiosita
    testo: 'Per trent''anni il gallio è servito a osservare il Sole in un modo che nessun
      telescopio permette: gli esperimenti sui neutrini solari usavano decine di tonnellate
      di cloruro di gallio in caverne sotterranee, perché un neutrino che colpisce un nucleo
      di gallio-71 lo trasforma in germanio-71, e contando quegli atomi si contano i neutrini
      arrivati dal nucleo del Sole.'
    attendibilita: documentato
  pronuncia:
  - termine: Paul-Émile Lecoq de Boisbaudran
    ipa: pɔl emil ləkɔk də bwabodʁɑ̃
    nota: Francese.
  - termine: Dmitrij Mendeleev
    ipa: ˈdmʲitrʲɪj mʲɪnʲdʲɪˈlʲejɪf
    nota: Russo.
