numero_atomico: 102
simbolo: 'No'
nome: Nobelio
nome_en: Nobelium
scoperta:
  anno: 1958
  anno_stimato: false
  scopritori:
  - albert-ghiorso
  - torbjorn-sikkeland
  - john-walton
  - glenn-seaborg
  luogo: Berkeley, California
  epoca: nucleare
  isolamento_anno: null
  note_cronologia: Attribuzione contesa, e il dato adottato non è quello che oggi la IUPAC
    riconosce. La cronologia di riferimento assegna l'elemento alla squadra di Berkeley del
    1958 — Ghiorso, Sikkeland, Walton e Seaborg, compressi nella fonte in «Ghiorso et al.»
    — mentre il Transfermium Working Group ha assegnato nel 1992 la priorità a Dubna. Cambiare
    il dato sposterebbe il nobelio dopo il laurenzio nell'ordine di lettura, e la divergenza
    è dichiarata qui invece di essere risolta in silenzio.
  controversia: 'Tre rivendicazioni per lo stesso elemento: Stoccolma nel 1957 (mai confermata,
    ma il nome è suo), Berkeley nel 1958 (assegnazione poi messa in dubbio) e Dubna, a cui
    il Transfermium Working Group ha riconosciuto la priorità nel 1992 sulla base del rapporto
    del 1966. Il nome è rimasto quello proposto da chi non ha scoperto l''elemento.'
