  isolamento_anno: 1808
  note_cronologia: 'Black distingue la magnesia alba dalla calce viva nella tesi di
    laurea in medicina discussa a Edimburgo nel 1754 e nella memoria che ne deriva,
    letta davanti alla Philosophical Society di Edimburgo nel 1755. Il metallo è
    isolato per via elettrochimica da Humphry Davy nel 1808; Antoine Bussy ne ottiene
    una forma coerente e lavorabile nel 1831.'
