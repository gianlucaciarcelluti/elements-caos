  note_cronologia: Individuato nello spettro della cromosfera solare durante l'eclissi del
    18 agosto 1868 da Pierre Jules César Janssen, e riconosciuto come elemento nuovo da Norman
    Lockyer, che gli diede il nome. Trovato sulla Terra solo nel 1895 da William Ramsay, nella
    clevite, e indipendentemente da Per Teodor Cleve e Nils Abraham Langlet a Uppsala.
