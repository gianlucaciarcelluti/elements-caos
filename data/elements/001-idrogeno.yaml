numero_atomico: 1
simbolo: H
nome: Idrogeno
nome_en: Hydrogen
scoperta:
  anno: 1671
  anno_stimato: false
  scopritori:
  - robert-boyle
  luogo: Oxford
  epoca: alchimia
  isolamento_anno: 1671
  note_cronologia: 'Data della produzione di "aria infiammabile" da parte di Boyle
    facendo agire olio di vitriolo su limatura di ferro. Il riconoscimento come sostanza
    distinta è di Henry Cavendish nel 1766; il nome idrogeno lo assegna Lavoisier nel 1783.'
  controversia: 'L''idrogeno è un elemento senza uno scopritore che regga davvero. La data
    qui adottata, il 1671, è quella in cui Robert Boyle descrive l''aria che si sviluppa
    facendo agire l''olio di vitriolo sulla limatura di ferro: una descrizione accurata di
    come produrre idrogeno, ma non di che cosa fosse. Boyle non ne annota nemmeno
    l''infiammabilità, e nel suo quadro concettuale quella era aria comune modificata, non
    una sostanza nuova. Non era neppure il primo: Paracelso aveva osservato lo stesso
    fenomeno intorno al 1520 sciogliendo metalli nell''acido, e Théodore Turquet de Mayerne
    lo ripete nel 1650. Il riconoscimento vero arriva un secolo dopo Boyle, nel 1766, quando
    Henry Cavendish presenta alla Royal Society quell''"aria infiammabile" come una sostanza
    a sé, ne misura la densità — sette-undici volte più leggera dell''aria — e nel 1781
    dimostra che bruciando produce acqua. È a Cavendish che la storiografia corrente
    attribuisce la scoperta, e il nome arriva solo nel 1783 da Lavoisier. Fra il primo a
    produrlo e il primo a capirlo corrono due secoli e mezzo.'
