  luogo: null
  epoca: pneumatica
  isolamento_anno: 1886
  note_cronologia: 'Scheele nel 1771 prepara e studia l''acido fluoridrico dalla fluorite,
    riconoscendo che contiene qualcosa di nuovo; nel 1810 André-Marie Ampère ipotizza che
    l''acido contenga un elemento analogo al cloro, e in una lettera a Humphry Davy del 26
    agosto 1812 propone per esso il nome fluorine. L''elemento libero è ottenuto solo il 26
    giugno 1886 da Henri Moissan, centoquindici anni dopo.'
  controversia: null
