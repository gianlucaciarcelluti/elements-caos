  note_cronologia: 'Scoperta contesa: William Crookes vide per primo la riga verde e pubblicò
    il 30 marzo 1861, ma fu Claude-Auguste Lamy, in Francia, a isolare il metallo e a caratterizzarlo.
    Alla Mostra internazionale di Londra del 1862 furono premiati entrambi.'
