contenuti:
  hook: Una riga verde in uno spettro, e due chimici che la videro quasi insieme in due paesi
    diversi. Ne nacque un elemento nuovo, una disputa di priorità e il veleno preferito dai
    romanzi gialli.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il tallio è un metallo tenero, grigio-azzurro, che si taglia con un coltello e
      che a contatto con l''aria si opacizza in fretta. È anche uno degli elementi più tossici
      della tavola periodica: i suoi sali sono solubili, quasi insapori, e il corpo li scambia
      per potassio, il che ne ha fatto per decenni lo strumento di chi avvelenava.'
    visual: Un pezzo di tallio metallico opacizzato conservato sotto olio
    attendibilita: documentato
  - id: residui_di_fabbrica
    sezione: storia
    testo: Nel 1861 William Crookes stava cercando tellurio nei residui di una fabbrica di
      acido solforico, la fanghiglia che si accumula nelle camere di piombo e che in quegli
      anni era diventata la miniera preferita dei chimici. Puntandoci lo spettroscopio trovò
      una riga verde brillante che non corrispondeva a nulla di noto, e ne dedusse un elemento
      nuovo.
    visual: Fanghi verdastri raccolti sul fondo di una camera di piombo
    attendibilita: documentato
  - id: nome_thallos
    sezione: storia
    testo: 'Il nome lo prese dal greco thallos, «germoglio», per il verde tenero di quella
      riga: come il cesio, il rubidio e l''indio, anche il tallio si chiama con il colore
      della propria luce. Crookes pubblicò il 30 marzo 1861, con in mano soltanto lo spettro.'
    visual: Una riga verde brillante isolata in uno spettro di emissione
    attendibilita: documentato
  - id: disputa_lamy
    sezione: storia
    testo: 'Quasi contemporaneamente, in Francia, Claude-Auguste Lamy lavorava sugli stessi
      residui e trovava la stessa riga. Lamy però andò oltre: isolò il metallo, ne misurò
      le proprietà e ne presentò un lingotto. Alla Mostra internazionale di Londra del 1862
      furono premiati entrambi, con motivazioni diverse, e la disputa su chi avesse davvero
      scoperto il tallio andò avanti per anni.'
    visual: Un lingotto metallico esposto in una vetrina espositiva ottocentesca
    attendibilita: documentato
  - id: chi_ha_scoperto
    sezione: storia
    testo: 'Il caso mise in luce una domanda che la spettroscopia aveva reso urgente: scoprire
      un elemento significa vederne la traccia o tenerlo in mano? Crookes aveva visto per
      primo, Lamy aveva isolato per primo, e il credito che le tavole assegnano oggi a Crookes
      riflette una scelta — l''osservazione conta più dell''isolamento — che il progetto stesso
      di catalogare gli elementi ha dovuto fare decine di volte.'
    visual: Due pubblicazioni scientifiche del 1861 messe a confronto
    attendibilita: discusso
  - id: crookes_dopo
    sezione: storia
    testo: Per Crookes fu l'inizio di una carriera anomala. Con i tubi a vuoto che portano
      il suo nome studiò i raggi catodici, aprendo la strada alla fisica delle particelle,
      e insieme dedicò anni allo spiritismo, cercando con gli stessi strumenti di misura una
      prova sperimentale dei fenomeni medianici. La stessa fiducia nello strumento che gli
      aveva fatto trovare un elemento lo portò molto lontano dalla chimica.
    visual: Un tubo a raggi catodici di Crookes acceso in una stanza buia
    attendibilita: documentato
  - id: due_stati
    sezione: caratteristiche
    testo: 'Il tallio ha due stati di ossidazione, +1 e +3, e a differenza dei suoi vicini
      di colonna preferisce nettamente il primo: gli elettroni esterni dell''orbitale s restano
      legati e non partecipano, un effetto che si accentua scendendo lungo il gruppo. Lo ione
      Tl⁺ ha carica e raggio simili a quelli del potassio, e questa somiglianza è la chiave
      della sua tossicità.'
    visual: Modelli a sfera degli ioni tallio e potassio a confronto
    attendibilita: documentato
  - id: tossicita
    sezione: caratteristiche
    testo: 'Le pompe che spostano il potassio dentro e fuori dalle cellule accettano il tallio
      senza distinguerlo, e una volta dentro l''elemento blocca i processi che dipendono dal
      potassio, dai nervi ai follicoli dei capelli. I sali sono solubili, quasi insapori e
      privi di odore: sono le tre proprietà che, sommate, hanno guadagnato al tallio il soprannome
      di «veleno degli avvelenatori». L''antidoto esiste ed è il blu di Prussia, che lo lega
      nell''intestino e ne impedisce il riassorbimento.'
    visual: Un flacone da farmacia con il blu di Prussia in polvere
    attendibilita: documentato
  - id: fisiche
    sezione: caratteristiche
    testo: 'È un metallo pesante, tenero e malleabile, che fonde a 304 gradi e all''aria si
      ricopre di un ossido scuro; per questo si conserva sotto olio o in atmosfera inerte.
      In natura non si trova libero: sta in tracce nelle piriti e nei solfuri di zinco e piombo,
      e si ricava dai fumi e dai residui della loro tostatura.'
    visual: Un campione di pirite dorata con inclusioni scure
    attendibilita: documentato
  - id: usi_rivelatori
    sezione: usi
    testo: 'L''impiego principale sfrutta una proprietà elettronica: aggiungere una piccola
      quantità di tallio ai cristalli di ioduro di sodio o di cesio li rende molto più efficienti
      nel convertire i raggi gamma in lampi di luce. Su questo si reggono i rivelatori a scintillazione
      usati in medicina nucleare, nei controlli di sicurezza e nella ricerca di sorgenti radioattive.'
    visual: Un cristallo di ioduro di sodio drogato al tallio in un rivelatore
    attendibilita: documentato
  - id: usi_ottica_e_medicina
    sezione: usi
    testo: 'I cristalli di bromuro e ioduro di tallio, venduti con la sigla KRS-5, sono fra
      i pochi materiali trasparenti all''infrarosso lontano, e servono da finestre e lenti
      negli strumenti che lavorano a quelle lunghezze d''onda. In medicina il tallio-201 è
      stato per anni il tracciante della scintigrafia cardiaca: entra nelle cellule del muscolo
      cardiaco al posto del potassio e mostra quali zone ricevono sangue e quali no.'
    visual: Un'immagine scintigrafica del cuore in falsi colori
    attendibilita: documentato
  - id: usi_abbandonati
    sezione: usi
    testo: 'Gli impieghi che ne consumavano di più sono stati vietati quasi ovunque: il solfato
      di tallio, insapore e inodore, era il topicida e l''insetticida domestico del Novecento,
      e proprio la sua diffusione nelle case ha alimentato la casistica degli avvelenamenti
      accidentali e non.'
    visual: Una vecchia scatola di topicida con l'etichetta consumata
    attendibilita: documentato
  - id: curiosita_christie
    sezione: curiosita
    testo: 'Agatha Christie, che durante la guerra aveva lavorato in farmacia, fece morire
      di tallio un personaggio di Un cavallo per la strega, del 1961, descrivendone i sintomi
      con precisione clinica: il malessere gastrico, il formicolio ai piedi e, settimane dopo,
      la caduta dei capelli.'
    attendibilita: documentato
  - id: curiosita_diagnosi
    sezione: curiosita
    testo: 'A quel romanzo si attribuiscono almeno due vite salvate: nel 1977 un''infermiera,
      Marsha Maitland, riconobbe l''avvelenamento di una bambina di diciannove mesi proprio
      dai sintomi che aveva letto in quelle pagine, e un secondo caso emerse quando una copia
      del libro fu trovata fra gli oggetti di un condannato per avvelenamento.'
    attendibilita: documentato
  - id: curiosita_temperatura
    sezione: curiosita
    testo: 'Il tallio ha dato anche un contributo silenzioso alla superconduttività ad alta
      temperatura: alcuni degli ossidi cuprati che negli anni Ottanta hanno alzato la temperatura
      critica sopra i cento kelvin contengono tallio, e sono stati fra i primi materiali a
      diventare superconduttori sopra il punto di ebollizione dell''azoto liquido, cioè con
      un refrigerante che costa poco.'
    attendibilita: documentato
  pronuncia:
  - termine: William Crookes
