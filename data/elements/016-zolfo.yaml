nome: Zolfo
nome_en: Sulfur
scoperta:
  anno: -2000
  anno_stimato: true
  scopritori: []
  luogo: null
  epoca: antichita
  isolamento_anno: null
  note_cronologia: 'Nessuno ha isolato lo zolfo: si raccoglie già puro attorno ai vulcani.
    La data convenzionale indica l''uso corrente nel Mediterraneo e in Egitto; il riconoscimento
    come elemento chimico è di Lavoisier, nel 1777.'
  controversia: 'Datare lo zolfo significa scegliere che cosa contare. Il minerale nativo
    è disponibile e riconoscibile da sempre attorno ai crateri, e le testimonianze del suo
    impiego arrivano da fronti diversi che non coincidono: il papiro Ebers, in Egitto, ne
    registra l''uso in un unguento oftalmico intorno al 1550 a.C.; i testi cinesi nominano
    lo shiliuhuang dal VI secolo a.C.; l''Odissea lo fa bruciare a Odisseo per purificare
    la sala. Nessuna di queste date è la scoperta, perché non c''è stato niente da scoprire:
    la data del 2000 a.C. adottata qui è una convenzione che colloca lo zolfo fra i materiali
    già correnti nell''età del bronzo, non un evento documentato.'
