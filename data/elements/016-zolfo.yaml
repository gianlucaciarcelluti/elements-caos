contenuti:
  hook: 'Lo zolfo non è stato scoperto da nessuno: giace giallo e puro sui fianchi dei vulcani,
    dove chiunque può raccoglierlo. Il problema, per l''antichità, non era trovarlo ma capire
    che cosa fosse quella pietra che bruciava con fiamma azzurra e un odore da inferno.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Lo zolfo appartiene alla piccolissima famiglia degli elementi che la natura offre
      già puri: cristalli gialli depositati attorno alle fumarole vulcaniche, dove il gas che
      risale dal sottosuolo si raffredda. Ottenerlo non richiede alcuna tecnica, solo il coraggio
      di andarlo a prendere.'
    visual: Cristalli gialli di zolfo nativo attorno a una fumarola con vapori che salgono
    attendibilita: documentato
  - id: fumigante
    sezione: storia
    testo: 'La prima cosa che l''uomo impara dello zolfo è che brucia, e che il fumo di quella
      combustione uccide. Nel ventiduesimo libro dell''Odissea, dopo la strage dei pretendenti,
      Odisseo chiede alla nutrice Euriclea di portargli fuoco e zolfo per purificare la sala:
      è una delle più antiche descrizioni scritte di una fumigazione chimica. Il gesto ha
      insieme un senso rituale e uno pratico, perché l''anidride solforosa che si sprigiona
      bruciando zolfo è effettivamente un disinfettante che stermina muffe, batteri e insetti.'
    visual: Sala del palazzo di Itaca invasa dal fumo bianco dello zolfo che brucia in un
      braciere
    attendibilita: documentato
  - id: medicina_antica
    sezione: storia
    testo: 'Accanto all''uso purificatorio corre quello medico. Il papiro Ebers, redatto in
      Egitto intorno al 1550 a.C., prescrive un unguento a base di zolfo contro l''infiammazione
      granulare delle palpebre, ed è una delle testimonianze più antiche di una terapia dermatologica
      che si è dimostrata longeva: gli unguenti sulfurei contro scabbia e affezioni cutanee
      restano in farmacopea fino al Novecento.'
    visual: Papiro egizio srotolato accanto a un mortaio con polvere gialla
    attendibilita: documentato
  - id: plinio
    sezione: storia
    testo: 'I Romani ne hanno un catalogo d''usi già preciso. Plinio il Vecchio elenca quattro
      qualità di zolfo e altrettante applicazioni: la medicina, la follatura dei tessuti, lo
      sbiancamento della lana e i lucignoli delle lampade. Indica anche la fonte principale
      del mondo antico, l''isola egea di Milo.'
    visual: Banco di lavorazione romano con matasse di lana esposte ai vapori di zolfo
    attendibilita: documentato
  - id: alchimia
    sezione: storia
    testo: 'La svolta concettuale arriva con l''alchimia, che allo zolfo assegna un ruolo
      che va molto oltre l''utilità pratica. Nella teoria dei tria prima codificata da Paracelso
      nel Cinquecento, ogni sostanza materiale nasce dalla combinazione di tre principi:
      il mercurio, che dà fluidità e metallicità, il sale, che dà solidità, e lo zolfo, che
      dà combustibilità e colore. Non è lo zolfo del minerale, è un principio astratto che
      prende nome dal minerale, ma per due secoli quella triade è lo schema con cui l''Europa
      colta pensa la materia.'
    visual: Tavola alchemica con i tre simboli di zolfo, mercurio e sale disposti in triangolo
    attendibilita: documentato
  - id: polvere_da_sparo
    sezione: storia
    testo: 'In Cina lo zolfo percorre una strada parallela. I testi lo nominano dal VI secolo
      a.C., e nel III secolo d.C. lo si estrae già dalla pirite; i taoisti, che lo maneggiano
      cercando elisir di lunga vita, ne scoprono per via sperimentale la reattività violenta.
      La combinazione di zolfo, salnitro e carbone di legna che ne deriva è la polvere da
      sparo, ottenuta cercando l''immortalità e trovando esattamente il contrario.'
    visual: Bilancia con i tre mucchietti di salnitro, carbone e zolfo pronti per la miscela
    attendibilita: documentato
  - id: lavoisier
    sezione: storia
    testo: 'Lo zolfo diventa un elemento chimico, e non più un principio, nel 1777, quando
      Antoine Lavoisier lo classifica fra le sostanze semplici. Non è un ritrovamento: è il
      momento in cui una materia nota da millenni cambia statuto, da ingrediente della cosmologia
      alchemica a casella della chimica.'
    visual: Tavola delle sostanze semplici di Lavoisier con la voce «soufre» evidenziata
    attendibilita: documentato
  - id: caratteristiche_allotropi
    sezione: caratteristiche
    testo: 'Lo zolfo detiene un primato bizzarro: nessun altro elemento ha così tante forme
      cristalline. La più stabile è l''ottazolfo, molecole ad anello di otto atomi in un reticolo
      giallo limone. Fuso e versato di colpo in acqua fredda dà invece lo zolfo plastico: gli
      anelli si aprono in catene elicoidali lunghissime e la massa diventa bruna ed elastica
      come gomma, per tornare gialla e friabile nel giro di ore.'
    visual: Filo di zolfo plastico bruno estratto dall'acqua accanto ai cristalli gialli originari
    attendibilita: documentato
  - id: caratteristiche_stati
    sezione: caratteristiche
    testo: 'Chimicamente lo zolfo è versatile quanto pochi: la letteratura gli riconosce stati
      di ossidazione dal meno due al più sei, ma nella pratica quasi tutto ciò che si incontra
      sta in quattro caselle. Meno due sono i solfuri, dai minerali metallici all''uovo marcio;
      più quattro è l''anidride solforosa, quella che disinfettava la sala di Odisseo e che
      oggi conserva il vino; più sei è l''acido solforico. È questa scala di ossidazione a
      renderlo utile: lo zolfo cede e accetta elettroni con la stessa disinvoltura.'
    visual: Scala verticale con i composti tipici dello zolfo ordinati per stato di ossidazione
    attendibilita: documentato
  - id: caratteristiche_odore
    sezione: caratteristiche
    testo: 'Va sfatato un equivoco tenace: lo zolfo puro non ha odore. Puzzano i suoi composti,
      e in modo memorabile. L''idrogeno solforato è l''uovo marcio, i tioli sono l''aglio, la
      cipolla e lo spruzzo della puzzola. L''industria del gas ne aggiunge deliberatamente una
      traccia al metano, che è inodore, perché una perdita si senta prima di diventare un''esplosione:
      il naso umano li riconosce a poche parti per miliardo.'
    visual: Bombola di metano con l'etichetta dell'odorizzante accanto a uno spicchio d'aglio
    attendibilita: documentato
  - id: usi_acido_solforico
    sezione: usi
    testo: 'La destinazione principale dello zolfo è l''acido solforico, la sostanza chimica
      più prodotta al mondo in assoluto. Non finisce quasi mai nelle mani del pubblico: serve
      a fabbricare fertilizzanti fosfatici, a raffinare il petrolio, a lavorare i metalli. Il
      consumo di acido solforico di un paese è stato a lungo usato come indicatore grezzo del
      suo livello di industrializzazione.'
    visual: Impianto di contatto per acido solforico con le torri di assorbimento
    attendibilita: documentato
  - id: usi_vulcanizzazione
    sezione: usi
    testo: 'Il secondo uso è meno voluminoso ma altrettanto pervasivo. Nella vulcanizzazione,
      brevettata nel 1843, lo zolfo crea ponti fra le catene del polimero della gomma naturale,
      che smette così di essere appiccicosa a caldo e fragile a freddo: ogni pneumatico esistente
      dipende da quella reazione. Restano poi gli usi antichi, mai abbandonati, come lo zolfo
      in polvere che difende i vigneti dall''oidio.'
    visual: Sezione di pneumatico con lo schema dei ponti disolfuro fra le catene polimeriche
    attendibilita: documentato
  - id: curiosita_biologia
    sezione: curiosita
    testo: 'Lo zolfo è dentro ogni essere vivente, in due dei venti amminoacidi che compongono
      le proteine, la cisteina e la metionina. Sono i ponti disolfuro fra le cisteine a dare
      rigidità alla cheratina di capelli, unghie e piume: la stessa reazione che rende elastico
      uno pneumatico tiene in forma un capello. Una permanente dal parrucchiere non è altro
      che la rottura chimica di quei ponti e la loro ricostruzione su una forma diversa.'
    visual: Ciocca di capelli avvolta su un bigodino con lo schema dei ponti disolfuro riformati
    attendibilita: documentato
  - id: curiosita_nome
    sezione: curiosita
    testo: 'Il nome greco dello zolfo, theion, somiglia da vicino a theios, divino, e quella
      vicinanza fonetica ne ha fissato per secoli l''aura sacra e insieme infernale. È la sostanza
      che nella Genesi piove col fuoco su Sodoma e Gomorra e che nell''Apocalisse forma lo stagno
      ardente. Nessun altro elemento chimico ha una carriera religiosa così lunga.'
    visual: Incisione antica della distruzione di Sodoma con la pioggia di fuoco e zolfo
    attendibilita: documentato
  pronuncia: []
contenuti_estesi:
  hook: 'Lo zolfo è l''elemento che nessuno ha dovuto cercare: sta giallo e puro sui
    fianchi dei vulcani, e per quattromila anni all''umanità è bastato chinarsi a
    raccoglierlo. Proprio perché era facile da avere, la sua storia non è quella di
    una scoperta ma di un prezzo: quando l''industria chimica europea ha cominciato
    a divorarlo, a scavarlo sotto la Sicilia sono stati dei bambini. Oggi nessuno
    estrae più zolfo, e ne abbiamo più di prima: lo togliamo dal petrolio perché avvelena
    l''aria, e ce ne restano quasi settanta milioni di tonnellate l''anno fra le mani.'
  beats:
  - id: contesto-nativo
    sezione: contesto
    testo: 'Quasi tutti gli elementi che l''umanità usa hanno richiesto un''invenzione
      per essere ottenuti: una fornace, un riducente, una corrente elettrica. Lo zolfo
      no. È il decimo elemento per abbondanza nell''universo e il quinto sulla Terra,
      e appartiene alla ristretta compagnia di quelli che si trovano già puri, in
      forma nativa, senza che nessuno debba separarli da nulla. Sulla Terra la maggior
      parte dello zolfo sta legata dentro solfuri e solfati, ma là dove il gas vulcanico
      risale e si raffredda il minerale si deposita giallo e riconoscibile. Il nome
      che la tradizione gli ha dato in inglese, brimstone, dice esattamente questo:
      pietra che brucia. Non c''è stato bisogno di scoprirlo perché non c''era niente
      da scoprire: bisognava solo andare dove stava, e quello è sempre stato un posto
      scomodo.'
    attendibilita: documentato
  - id: contesto-origine-stellare
    sezione: contesto
    testo: 'L''abbondanza dello zolfo ha una ragione che sta dentro le stelle. Il
      suo nucleo si forma per fusione di un nucleo di silicio con uno di elio, una
      reazione che appartiene al processo alfa: la catena che costruisce gli elementi
      saltando di quattro unità in quattro unità e che produce, per questo, gli elementi
      più comuni dell''universo. Lo zolfo è uno dei suoi prodotti, ed è per questo
      che se ne trova ovunque si guardi. Nei meteoriti è di casa: le condriti ordinarie
      ne contengono in media il 2,1 per cento, e quelle carbonacee arrivano al 6,6,
      quasi sempre sotto forma di troilite, il solfuro di ferro. La materia da cui
      la Terra si è formata era già abbondantemente solforosa prima che la Terra esistesse.'
    attendibilita: documentato
  - id: contesto-ottazolfo
    sezione: contesto
    testo: 'La forma in cui lo zolfo si presenta normalmente è una molecola ad anello
      di otto atomi, l''ottazolfo, ciclo-S8: un ottagono increspato che sta impacchettato
      in un cristallo giallo limone, morbido e inodore. Fonde a 115,21 gradi e bolle
      a 444,6, temperature basse per un solido minerale, ed è questa docilità termica
      che tornerà decisiva quando qualcuno penserà di scioglierlo sottoterra invece
      di scavarlo. Già a 95,2 gradi, prima ancora di fondere, l''anello comincia a
      cambiare impacchettamento e la forma alfa passa lentamente alla beta, senza
      che la molecola si modifichi: cambia solo il modo in cui gli anelli si dispongono
      l''uno accanto all''altro.'
    attendibilita: documentato
  - id: contesto-molte-forme
    sezione: contesto
    testo: 'L''anello di otto atomi è solo la forma più comune. Lo zolfo esiste in
      un numero di allotropi che nella tavola periodica ha pochissimi confronti, e
      ciascuno di essi si presenta a sua volta in polimorfi diversi, cioè in strutture
      cristalline distinte fatte delle stesse molecole: si distinguono con le lettere
      greche, alfa, beta e via elencando. A complicare il quadro c''è che lo zolfo
      è merce da secoli, e le sue forme hanno accumulato nomi tradizionali prima che
      qualcuno ne capisse la struttura. Il risultato è una nomenclatura stratificata
      in cui convivono il linguaggio dei cristallografi e quello dei mercanti.'
    attendibilita: documentato
  - id: contesto-discusso-primato-allotropi
    sezione: contesto
    testo: 'Su quante forme abbia lo zolfo, e su come si collochi rispetto agli altri
      elementi, le fonti non dicono la stessa cosa. La nota di questo vault attribuisce
      allo zolfo il primato del maggior numero di forme cristalline; la voce di Wikipedia
      dedicata agli allotropi dello zolfo è invece esplicita nel collocarlo al secondo
      posto, dietro il carbonio. La divergenza non è capziosa, perché dipende da che
      cosa si conta: se si contano gli allotropi veri e propri, cioè le molecole diverse,
      oppure se si contano anche i polimorfi, cioè i modi diversi di impacchettare
      la stessa molecola, che nello zolfo sono numerosissimi. Nessuna delle fonti
      consultate esplicita quale criterio adotta. Questo approfondimento segue la
      voce sugli allotropi e dice secondo, non primo; il primato resta una questione
      aperta di conteggio, non di chimica.'
    attendibilita: discusso
  - id: contesto-fiamma
    sezione: contesto
    testo: 'Acceso, lo zolfo fa una cosa che nessuno che l''abbia visto dimentica:
      fonde in un liquido rosso sangue e brucia con una fiamma azzurra. È questa coppia
      di colori, insieme all''odore pungente di ciò che se ne sprigiona, ad avergli
      guadagnato per millenni una reputazione soprannaturale. Un minerale giallo che
      si liquefa in rosso e arde in azzurro non somiglia a niente altro nel repertorio
      dei materiali antichi, e l''immaginazione religiosa ci si è appoggiata sopra
      con notevole costanza.'
    attendibilita: documentato
  - id: contesto-nel-corpo
    sezione: contesto
    testo: 'Lo zolfo non è soltanto un minerale da raccogliere: è dentro ogni cellula
      vivente, ed è l''ottavo elemento per peso nel corpo umano, all''incirca quanto
      il potassio e un po'' più del sodio e del cloro. Un uomo di settanta chili ne
      contiene circa centoquaranta grammi. Non li fabbrica: gli arrivano dagli amminoacidi
      solforati contenuti nelle proteine vegetali e animali che mangia, perché negli
      animali l''assimilazione dello zolfo passa essenzialmente per la dieta, a differenza
      delle piante, che il solfato lo assorbono dalle radici e lo riducono nei cloroplasti.
      Ogni volta che si sente dire che qualcosa «puzza di zolfo» conviene ricordare
      che si sta parlando di un componente strutturale di chi lo dice.'
    attendibilita: documentato
  - id: vicenda-altopiano
    sezione: vicenda
    testo: 'La vicenda umana dello zolfo non ha uno scopritore da raccontare, perché
      non c''è stata scoperta. Ha invece un luogo, ed è la Sicilia centrale: l''altopiano
      gessoso-solfifero che si stende fra le province di Caltanissetta, Enna e Agrigento,
      dove il minerale affiora e dove per un certo periodo si è estratto più zolfo
      che in qualsiasi altra parte del mondo. Non era una novità dell''Ottocento:
      nella zona si trovano tracce di coltivazione mineraria che risalgono al 200
      avanti Cristo. Ma fino a che lo zolfo servì per medicina, fumigazioni e lucignoli,
      la raccolta restò una faccenda di superficie. A cambiare tutto fu la chimica
      europea.'
    attendibilita: documentato
  - id: vicenda-leblanc
    sezione: vicenda
    testo: 'Nel 1787 il metodo Leblanc rende possibile fabbricare la soda su scala
      industriale, e la soda serve a tutto: vetro, sapone, tessuti, carta. Il procedimento
      ha bisogno di acido solforico, e l''acido solforico ha bisogno di zolfo. Da
      quel momento il minerale giallo che i contadini raccoglievano sull''altopiano
      smette di essere un rimedio da farmacia e diventa una materia prima strategica.
      La voce dedicata alle miniere siciliane usa un paragone che vale la pena riportare
      per intero: lo zolfo assunse allora un''importanza strategica pari a quella
      che nell''età contemporanea ha avuto l''uranio. È una frase forte, ed è la chiave
      di tutto ciò che viene dopo.'
    attendibilita: documentato
  - id: vicenda-capitali
    sezione: vicenda
    testo: I capitali arrivano prima degli operai. Durante le guerre napoleoniche
      diversi capitalisti britannici cominciano a interessarsi alle coltivazioni a
      cielo aperto vicine ai porti della Sicilia meridionale; dopo il 1815 entrano
      anche le compagnie francesi, tirate dalla domanda di acido solforico. Fra il
      1828 e il 1830 le esportazioni verso le fabbriche di Marsiglia superano le trentacinquemila
      tonnellate, e nella seconda metà degli anni Trenta lo zolfo è la prima voce
      dell'export isolano, con un valore annuo di 1.671.500 ducati. Sull'altopiano,
      intanto, si scava sempre più in profondità, perché l'affioramento non basta
      più.
    attendibilita: documentato
  - id: vicenda-esportazione-senza-sviluppo
    sezione: vicenda
    testo: 'I giacimenti siciliani furono la fonte dominante per più di un secolo.
      Alla fine del Settecento circa duemila tonnellate l''anno arrivavano a Marsiglia
      per fare acido solforico destinato al processo Leblanc, e quando nel 1824 la
      Gran Bretagna in via di industrializzazione abolì i dazi sul sale la domanda
      di zolfo siciliano schizzò. Qui sta il nodo che le fonti registrano senza giri
      di parole: al crescente controllo britannico su estrazione, raffinazione e trasporto
      si accompagnò il fallimento di quell''esportazione lucrosa nel trasformare l''economia
      arretrata e impoverita dell''isola. La ricchezza passava dalla Sicilia; non
      ci restava.'
    attendibilita: documentato
  - id: vicenda-carusi-chi-erano
    sezione: vicenda
    testo: 'Scavare in profondità significa portare fuori il minerale, e in quelle
      miniere il minerale lo portavano fuori i bambini. In siciliano si chiamavano
      carusi, plurale di carusu, che vuol dire semplicemente «ragazzo» e viene dal
      latino carus, caro, amato. Dalla metà dell''Ottocento ai primi del Novecento
      la parola designò una figura precisa del lavoro minerario: il ragazzo che stava
      accanto al picuneri, l''uomo col piccone, e che caricava sulle spalle il materiale
      staccato per risalire con quello fino alla superficie. La parola più tenera
      del dialetto è finita a nominare questo.'
    attendibilita: documentato
  - id: vicenda-succursu
    sezione: vicenda
    testo: 'Il meccanismo con cui finivano là sotto si chiamava succursu di murti,
      sussidio di morte: una somma anticipata dal picuneri o dal proprietario della
      miniera alla famiglia o all''orfanotrofio, in cambio della quale il bambino
      diventava di fatto proprietà di chi l''aveva pagata. Venivano «reclutati» anche
      a cinque o sette anni. In teoria il genitore poteva riscattarli restituendo
      il denaro; nella Sicilia di quegli anni accadeva di rado, perché quel denaro
      era già stato speso per mangiare. Molti restarono carusi tutta la vita, e non
      pochi nella miniera non solo lavoravano ma mangiavano e dormivano. Il debito
      non si estingueva lavorando: era il lavoro a essere l''interesse del debito.'
    attendibilita: documentato
  - id: vicenda-franchetti-sonnino
    sezione: vicenda
    testo: 'Nel 1876 due politici del continente, Leopoldo Franchetti e Sidney Sonnino,
      vanno in Sicilia a condurre un''inchiesta non ufficiale sulle condizioni dell''isola,
      e nel loro rapporto le zolfare occupano pagine che si leggono male ancora oggi.
      I bambini lavorano sottoterra dalle otto alle dieci ore al giorno, dovendo compiere
      un numero prestabilito di viaggi. I più piccoli portano sulle spalle carichi
      di venticinque o trenta chili; quelli fra i sedici e i diciotto anni ne portano
      settanta e ottanta. L''inchiesta produce un effetto immediato e minuscolo: un
      decreto governativo dello stesso 1876 alza l''età minima per il lavoro in miniera
      a dieci anni.'
    attendibilita: documentato
  - id: vicenda-eta-minima
    sezione: vicenda
    testo: 'La storia dell''età minima nelle zolfare è una scala che sale con una
      lentezza che dice più di molti commenti: dieci anni nel 1876, quattordici nel
      1905, sedici nel 1934. Ci vollero cinquantotto anni perché il limite arrivasse a
      sedici. E la legge, annota chi osservava le miniere nel 1911, non
      era applicata con rigore: il limite scritto e il limite praticato erano due
      cose diverse, come del resto si intuisce dal fatto stesso che sia stato necessario
      riscriverlo tre volte.'
    attendibilita: documentato
  - id: vicenda-grotte
    sezione: vicenda
    testo: 'Gli zolfatari non aspettarono in silenzio che la legge li raggiungesse.
      Nell''ottobre del 1893, negli anni dei Fasci Siciliani, a Grotte, paese minerario
      della provincia di Agrigento, si tenne un congresso di minatori con circa millecinquecento
      partecipanti fra operai e piccoli produttori. Le richieste degli operai erano
      tre: alzare a quattordici anni l''età minima per il lavoro in miniera, ridurre
      l''orario, fissare un salario minimo. I piccoli produttori, dal canto loro,
      chiedevano misure contro lo sfruttamento da parte dei grandi proprietari che
      controllavano il mercato dello stoccaggio e ne intascavano i profitti. Il limite
      dei quattordici anni arriverà dodici anni dopo.'
    attendibilita: documentato
  - id: vicenda-rossi
    sezione: vicenda
    testo: 'A raccontarlo al resto d''Italia fu un giornalista. Nell''ottobre del
      1893 Adolfo Rossi, inviato del quotidiano liberale romano «La Tribuna», scese
      nella zolfara di Virdilio per documentare le condizioni dei carusi e ne intervistò
      alcuni. La sua descrizione è un elenco di effetti fisici: cominciano a lavorare
      a otto o nove anni, hanno le spalle incurvate dalla fatica eccessiva, i denti
      storti, gli occhi infossati per la denutrizione, la fronte già segnata da rughe
      premature. E il salario, quando c''era, spesso non era denaro: era farina di
      cattiva qualità, conteggiata a un prezzo più alto di quello dei paesi vicini.'
    attendibilita: documentato
  - id: vicenda-rossi-giudizio
    sezione: vicenda
    testo: 'Rossi era un corrispondente di guerra di lungo corso, uno che di atrocità
      ne aveva viste. Scrisse che nessuno spettacolo lo aveva colpito tanto quanto
      la condizione dei carusi nella zolfara. Il suo giudizio non è quello di un cronista:
      «Questo lavoro barbaro imposto a bambini così teneri è cosa che grida vendetta;
      è la negazione di ogni principio di umanità. È una vergogna essere nati in un
      paese dove simile barbarie esiste ancora». Vale la pena notare che sta parlando
      del proprio paese, e che lo scrive su un quotidiano di Roma.'
    attendibilita: documentato
  - id: vicenda-washington
    sezione: vicenda
    testo: 'Nel 1910 arrivò in Sicilia un osservatore che aveva un metro di paragone
      che nessun altro poteva avere. Booker T. Washington, educatore afroamericano
      nato schiavo, era venuto in Europa per conoscere di persona la condizione delle
      classi povere e lavoratrici del continente. Di quella visita restano poche righe
      che valgono per un intero trattato: «Non sono pronto, al momento, a dire fino
      a che punto creda a un inferno fisico nel mondo a venire, ma una miniera di
      zolfo in Sicilia è la cosa più simile all''inferno che mi aspetti di vedere
      in questa vita». Chi scrive è uno che l''inferno terreno lo aveva conosciuto
      in un''altra forma.'
    attendibilita: documentato
  - id: vicenda-washington-crudelta
    sezione: vicenda
    testo: Washington non si fermò all'immagine dell'inferno, e descrisse il meccanismo.
      Da quella schiavitù non c'era speranza di libertà, perché né il genitore né
      il bambino avrebbero mai avuto denaro sufficiente a restituire il prestito iniziale.
      I bambini venivano percossi e pizzicati per spremere dai loro corpi sovraccarichi
      l'ultima goccia di forza; quando le percosse non bastavano, l'uso era di bruciacchiare
      loro i polpacci con le lanterne per rimetterli in piedi. Se tentavano la fuga,
      venivano ripresi e picchiati, e qualche volta uccisi. È un passaggio che si
      cita per intero perché riassumerlo lo attenua, e attenuarlo sarebbe una forma
      di cortesia verso la parte sbagliata.
    attendibilita: documentato
  - id: vicenda-oliver
    sezione: vicenda
    testo: 'Lo stesso 1910 portò a Lercara Friddi il medico britannico Sir Thomas
      Oliver, che l''anno successivo pubblicò quel che aveva visto sul «British Medical
      Journal». Il minerale staccato dagli uomini, scrive, viene portato in superficie
      sulle spalle di ragazzi scalzi e malvestiti, su per gradini ripidi e consumati;
      e poiché ai carusi non sempre viene data una luce, la salita e la discesa si
      fanno al buio. Gli incidenti, aggiunge, sono molti: il ragazzo scivola, rotola
      giù per i gradini con il suo carico e nella caduta travolge gli altri che stanno
      salendo. È la relazione di un medico, e questo cambia il tipo di dettaglio che
      riporta.'
    attendibilita: documentato
  - id: vicenda-oliver-misure
    sezione: vicenda
    testo: 'Oliver fece la cosa che fa un medico: misurò. Rimase colpito dalla bassa
      statura e dallo sviluppo difettoso degli uomini che trasportavano il minerale
      sulle spalle; alcuni di quelli che misurò, pur avendo trent''anni e più, erano
      alti appena quattro piedi, poco più di un metro e venti, e nello sviluppo mentale
      erano rimasti bambini. La conseguenza che ne registra ha la freddezza di un
      dato amministrativo ed è per questo terribile: quegli uomini erano così piccoli
      di statura e così deformati nel fisico che nei distretti minerari dello zolfo
      il governo faceva fatica a trovare coscritti per l''esercito.'
    attendibilita: documentato
  - id: vicenda-gobbe
    sezione: vicenda
    testo: 'Il corpo di un carusu portava la miniera addosso per sempre. Chi aveva
      cominciato da bambino a caricarsi il minerale sulle spalle arrivava all''età
      adulta con una grossa gobba sulla schiena, proprio là dove il carico poggiava,
      la colonna deviata, gli arti inferiori deformati, il torace distorto; le ginocchia
      storte per il peso erano la regola, e la perdita parziale o totale della vista
      per lesioni agli occhi non era rara. Erano analfabeti, senza scuola, spesso
      maltrattati. Il paese minerario di Lercara Friddi si prese dai comuni vicini
      un soprannome che descrive esattamente ciò che si vedeva per strada: u paisi
      di jmmuruti, il paese dei gobbi.'
    attendibilita: documentato
  - id: vicenda-pirandello
    sezione: vicenda
    testo: 'La zolfara è entrata nella letteratura italiana per mano di un premio
      Nobel. Luigi Pirandello raccontò l''asservimento dei bambini come bestie da
      soma nelle miniere, costretti a trascinare il minerale dalle profondità della
      terra, in due novelle: «Il fumo», del 1901, e «Ciàula scopre la luna», del 1912.
      Nel 1992 Aurelio Grimaldi ha diretto «La discesa di Aclà a Floristella», film
      che racconta un giovane carusu orribilmente maltrattato nelle miniere di zolfo,
      che tenta la fuga. È uno dei pochi capitoli della storia industriale italiana
      ad avere una letteratura propria, scritta da chi gli stava accanto.'
    attendibilita: documentato
  - id: impatto-due-alchimie
    sezione: impatto
    testo: 'Prima di diventare una materia prima, lo zolfo era stato per secoli una
      categoria del pensiero, e conviene notare che due tradizioni lontane gli hanno
      assegnato ruoli speculari. Nella tradizione indiana della rasaśāstra, dove opera
      insieme al mercurio a partire dall''ottavo secolo, lo zolfo si chiama gandhaka,
      «il puzzolente», e rappresenta il principio femminile, il sangue mestruale della
      dea Gauri, mentre il mercurio è la sua controparte maschile, il seme di Shiva.
      In Europa e nel mondo islamico, che si rifacevano alla teoria zolfo-mercurio
      dei metalli ricavata da testi arabi del nono secolo, l''immaginario è esattamente
      rovesciato: lo zolfo è il maschile e il mercurio il femminile, e dalla loro
      unione nascono i metalli. Quella teoria dominò il Medioevo e sopravvisse fino
      al Settecento, quando Lavoisier dimostrò che i metalli sono elementi distinti.'
    attendibilita: documentato
  - id: impatto-flogisto
    sezione: impatto
    testo: 'L''ostacolo che tenne lo zolfo fuori dalla chimica moderna per un secolo
      porta un nome famoso: il flogisto. Molti chimici erano convinti che lo zolfo
      non fosse una sostanza a sé ma ne contenesse diverse, fra cui un distinto principio
      infiammabile; nella tavola di Étienne François Geoffroy quel «principio solforoso»
      comparve come voce autonoma, e Geoffroy stesso finì per identificarlo con il
      flogisto, la sostanza immaginaria che si riteneva uscisse dai corpi durante
      la combustione. Per cento anni la teoria fu largamente accettata, e lo zolfo
      ne era una delle prove: bruciava così bene da sembrare fatto della materia stessa
      del fuoco. A demolirla furono i lavori di Lavoisier sulla combustione e sull''ossigeno.'
    attendibilita: documentato
  - id: impatto-lavoisier
    sezione: impatto
    testo: 'Il passaggio di stato dello zolfo — da principio della cosmologia alchemica
      a elemento chimico — si compie in due tempi, e vale la pena distinguerli perché
      le date che si incontrano sono entrambe corrette. Lavoisier usò lo zolfo negli
      esperimenti sulla combustione di cui scrisse nel 1777, ed è a quell''anno che
      le schede attribuiscono il suo riconoscimento come elemento. La collocazione
      formale nella «tavola delle sostanze semplici» arriva però nel 1789, con il
      Traité Élémentaire de Chimie, considerato il primo manuale di chimica moderna.
      Non fu un ritrovamento: nessuno andò da nessuna parte a prendere niente. Fu
      un cambio di statuto, deciso a tavolino, per una materia che l''umanità maneggiava
      da quattromila anni.'
    attendibilita: documentato
  - id: impatto-frasch-invenzione
    sezione: impatto
    testo: 'Ciò che mise fine alle zolfare siciliane non fu una legge ma un tubo.
      Nel 1867 dei minatori avevano trovato zolfo nella roccia di copertura di un
      duomo salino in Louisiana, ma sotto c''erano sabbie mobili e la miniera era
      impossibile. A risolvere il problema fu Herman Frasch, nato nel Württemberg
      il giorno di Natale del 1851, emigrato da ragazzo con una nave da Brema e diventato
      negli Stati Uniti chimico, ingegnere minerario e inventore; prima dello zolfo
      si era occupato di petrolio, e alla Standard Oil aveva venduto un brevetto per
      la raffinazione della paraffina. Nel 1894 ebbe l''idea di non scavare affatto:
      attraversare le sabbie mobili con delle tubazioni e prendere lo zolfo da sotto.
      Il 24 dicembre 1894 il primo zolfo fuso arrivò in superficie.'
    attendibilita: documentato
  - id: impatto-frasch-come
    sezione: impatto
    testo: 'Il congegno è di una semplicità che spiega perché abbia vinto. Si calano
      nel giacimento tre tubi concentrici. Dal più esterno si inietta acqua surriscaldata
      a centosessantacinque gradi, a una pressione di venticinque o trenta atmosfere:
      lo zolfo, che fonde a centoquindici gradi, si scioglie e cola nel tubo intermedio.
      Ma lo zolfo fuso è più denso dell''acqua e la sola pressione non basta a farlo
      salire; allora dal tubo più interno si soffia aria calda che lo rende schiumoso
      e quindi più leggero, e lo spinge fino in superficie. Ne esce zolfo puro al
      99,7 o 99,8 per cento, senza che nessuno sia sceso sottoterra. Il minerale che
      i carusi portavano sulle spalle qui arriva su da solo, in una tubazione.'
    attendibilita: documentato
  - id: impatto-spindletop
    sezione: impatto
    testo: 'Il metodo funzionava, ma per anni non conveniva: scaldare tutta quell''acqua
      costava troppo. La Union Sulphur Company era stata costituita nel 1896 apposta
      per sfruttarlo, e dovette aspettare. A sbloccare la situazione fu un evento
      che non aveva niente a che fare con lo zolfo: la scoperta del giacimento petrolifero
      di Spindletop in Texas, nel 1901, che inondò la regione di olio combustibile
      a basso prezzo. Dal 1903, a Sulphur Mines in Louisiana, il processo Frasch diventò
      economicamente conveniente. È una coincidenza che vale la pena tenere a mente,
      perché il petrolio tornerà alla fine di questa storia a uccidere anche il metodo
      Frasch.'
    attendibilita: documentato
  - id: impatto-union-sulphur
    sezione: impatto
    testo: 'Per dodici anni quel vantaggio fu un monopolio legale. La Union Sulphur
      Company dominò il mercato mondiale dello zolfo finché i suoi brevetti non scaddero,
      nel 1908, estraendo da sotto le paludi della Louisiana giacimenti fino ad allora
      inaccessibili. Il suo successo fece nascere una città che porta ancora il nome
      della merce: Sulphur, in Louisiana. Quando la protezione brevettuale finì, l''azienda
      si spostò su petrolio e gas naturale — e si noti la direzione del movimento,
      perché è esattamente quella che decenni dopo avrebbe reso lo zolfo un sottoprodotto
      degli idrocarburi anziché una merce da estrarre.'
    attendibilita: documentato
  - id: impatto-sicilia-fuori
    sezione: impatto
    testo: 'Il 1901 è l''anno in cui la Sicilia dello zolfo tocca il suo massimo:
      trentanovemila unità lavorative e cinquecentoquarantamila tonnellate di minerale
      estratto. È anche l''anno di Spindletop. Il processo Frasch richiede giacimenti
      di un tipo particolare — duomi salini o depositi stratificati in roccia permeabile
      racchiusa fra strati impermeabili — e alle miniere siciliane non era applicabile.
      Non era una questione di arretratezza né di volontà: la geologia dell''altopiano
      gessoso-solfifero non si prestava. Da un giorno all''altro, il lavoro di trentanovemila
      persone si trovò a competere con un tubo, e perse.'
    attendibilita: documentato
  - id: impatto-declino-politico
    sezione: impatto
    testo: Il resto è una lunga discesa, punteggiata di tentativi. La prima guerra
      mondiale complicò gli approvvigionamenti e svuotò le miniere di braccia, perché
      gran parte della manodopera finì sotto le armi; alla fine del conflitto l'industria
      americana dello zolfo si era presa buona parte del mercato mondiale. Nel 1927
      il fascismo nazionalizzò il sottosuolo minerario creando l'Ente Nazionale Zolfi
      Italiani con sede a Roma e accentrando lì ogni attività estrattiva, commerciale
      ed economica; l'industria non ne fu rianimata. Nel 1962 arrivò l'Ente Minerario
      Siciliano, con lo stesso scopo protezionistico e lo stesso esito.
    attendibilita: documentato
  - id: impatto-chiusura
    sezione: impatto
    testo: Le misure protezionistiche rallentarono il declino ma non lo fermarono,
      e la liberalizzazione voluta dal mercato unico europeo lo portò a termine. Nel
      1976 tutta la produzione dell'isola non superava le ottantacinquemila tonnellate,
      mentre nel solo 1901 dall'altopiano erano state cavate cinquecentoquarantamila
      tonnellate di minerale. Dal 1975 una serie di leggi dispose la chiusura progressiva
      delle miniere — Musala, Zimbalio, Gaspa La Torre, Baccarato, Giangagliano, Floristella,
      Grottacalda, Giumentaro, per citare le maggiori. Oggi non ne resta in attività
      nessuna. Floristella e Grottacalda, dove Aclà tentava la fuga nel film, sono
      un parco minerario.
    attendibilita: documentato
  - id: impatto-acido-solforico
    sezione: impatto
    testo: 'Tutto questo è accaduto per una sola sostanza: l''acido solforico, che
      le fonti chiamano senza enfasi un prodotto chimico di base molto importante,
      al punto che fino agli anni Duemila la produzione nazionale di acido solforico
      era considerata un buon indicatore della forza industriale di un paese. Nel
      2004 il mondo ne fabbricava circa centottanta milioni di tonnellate; nel 2022
      la stima era di duecentosessanta. Circa il sessanta per cento va in fertilizzanti
      — perfosfati, fosfato e solfato d''ammonio — e un altro venti per cento all''industria
      chimica, dai detersivi ai coloranti, dai farmaci all''antigelo. Quasi nessuno
      lo compra, e quasi tutto ciò che si compra è passato per le sue mani.'
    attendibilita: documentato
  - id: impatto-processi
    sezione: impatto
    testo: 'L''industrializzazione dell''acido solforico comincia nel 1746 a Birmingham,
      quando John Roebuck prende a produrlo dentro camere foderate di piombo. Il vantaggio
      non stava in una resistenza chimica miracolosa ma in tre fatti pratici: quelle
      camere erano più robuste, costavano meno e si potevano fare molto più grandi
      dei recipienti di vetro usati fino ad allora. Con vari perfezionamenti il metodo
      restò lo standard per quasi due secoli, ed era tanto solido che ancora nel 1946
      forniva un quarto di tutto l''acido solforico fabbricato nel mondo. Le sue due
      concentrazioni tipiche hanno lasciato nomi che il commercio usa ancora: acido
      di camera e acido di torre. A soppiantarlo è stato il processo di contatto,
      che passa per l''anidride solforica su un catalizzatore e dà acido concentrato.'
    attendibilita: documentato
  - id: impatto-mesoamerica
    sezione: impatto
    testo: 'Il secondo grande impiego industriale dello zolfo è la vulcanizzazione
      della gomma, e conviene cominciare da molto prima di quanto si creda. Nelle
      culture mesoamericane antiche la gomma serviva a fare palle da gioco, suole
      di sandali, fasce elastiche e contenitori impermeabili, e veniva trattata con
      succhi vegetali ricchi di zolfo: una forma primitiva di vulcanizzazione, secoli
      prima che in Europa qualcuno sospettasse che la gomma si potesse stabilizzare.
      Il fatto è documentato e viene regolarmente dimenticato quando si racconta la
      storia come se fosse cominciata in un laboratorio del Massachusetts.'
    attendibilita: documentato
  - id: impatto-goodyear
    sezione: impatto
    testo: 'Il problema che Charles Goodyear cercava di risolvere era concreto: la
      gomma di allora non sopportava né il caldo né il freddo né gli acidi, e gli
      articoli tornavano indietro dai clienti appiccicosi e in decomposizione. Nel
      1839, alla Eagle India Rubber Company di Woburn, in Massachusetts, Goodyear
      scoprì che mescolare gomma e zolfo sopra una stufa calda la rendeva rigida.
      Chiamò il procedimento vulcanizzazione, e ci mise altri cinque anni a perfezionarlo:
      il brevetto americano numero 3633 porta la data del 15 giugno 1844. La parola
      fu suggerita da William Brockedon in onore di Vulcano, il dio associato al calore
      e allo zolfo dei vulcani.'
    attendibilita: documentato
  - id: impatto-discusso-brevetto
    sezione: impatto
    testo: 'Chi abbia brevettato per primo la vulcanizzazione è una questione che
      le fonti lasciano aperta, ed è il motivo per cui le date che si incontrano non
      coincidono mai. L''inglese Thomas Hancock depositò il suo brevetto il 21 novembre
      1843, otto settimane prima che Goodyear facesse lo stesso negli Stati Uniti
      il 30 gennaio 1844; il brevetto americano definitivo di Goodyear è poi del giugno
      successivo. Le ricostruzioni divergono su un punto preciso: se Hancock fosse
      arrivato al procedimento dopo avere esaminato campioni di gomma americana provenienti
      da Goodyear, e soprattutto se esaminare quei campioni potesse bastare a ricostruire
      il processo. La nota base di questo vault data la vulcanizzazione al 1843, che
      è la data di Hancock; questo approfondimento tiene entrambe le date e dichiara
      che la priorità è contesa.'
    attendibilita: discusso
  - id: impatto-cosa-fa
    sezione: impatto
    testo: 'Quel che lo zolfo fa alla gomma è cucirla. Le lunghe catene del polimero,
      che da sole scivolano l''una sull''altra e rendono il materiale appiccicoso
      a caldo e fragile a freddo, vengono legate fra loro da ponti solforati: il risultato
      è più rigido e più duraturo, e cambia anche le proprietà elettriche. La trasformazione
      è sostanzialmente irreversibile, come accade a tutti i polimeri termoindurenti,
      e questo è insieme il suo pregio e il suo problema, perché una gomma vulcanizzata
      non si rifonde per farne un''altra. Tubi, suole, giocattoli, gomme da cancellare
      e soprattutto pneumatici escono tutti da quella reazione.'
    attendibilita: documentato
  - id: impatto-polvere
    sezione: impatto
    testo: 'C''è poi l''uso che ha fatto dello zolfo una merce strategica molto prima
      della chimica industriale. La polvere nera è il più antico esplosivo chimico
      conosciuto, e consiste di tre ingredienti: zolfo, carbone di legna — che è per
      gran parte carbonio — e nitrato di potassio, il salnitro. La ripartizione dei
      ruoli è precisa: lo zolfo e il carbone fanno da combustibili, il salnitro da
      ossidante, cioè fornisce alla combustione l''ossigeno che l''aria non farebbe
      in tempo a portare. La composizione standard adottata dai pirotecnici, e rimasta
      tale, risale addirittura al 1780: settantacinque parti in peso di salnitro,
      quindici di carbone di conifera, dieci di zolfo. Le proporzioni erano variate
      per secoli e da paese a paese prima di assestarsi lì.'
    attendibilita: documentato
  - id: impatto-polvere-origine
    sezione: impatto
    testo: 'Le prime formule scritte stanno in testi taoisti e hanno un tono involontariamente
      comico. Il Taishang Shengzu Jindan Mijue, dell''808, riporta una miscela di
      sei parti di zolfo, sei di salnitro e una di aristolochia. Una cinquantina d''anni
      più tardi lo Zhenyuan miaodao yaolüe registra il risultato di esperimenti analoghi
      con parole che valgono per un avvertimento di sicurezza: alcuni hanno scaldato
      insieme zolfo, realgar e salnitro con miele, ne sono usciti fumo e fiamme, si
      sono bruciati le mani e il viso, e perfino la casa in cui lavoravano è andata
      a fuoco. Gli alchimisti cinesi cercavano l''elisir di lunga vita: la polvere
      da sparo fu, con ogni probabilità, il sottoprodotto accidentale di quella ricerca.'
    attendibilita: documentato
  - id: controversie-smith
    sezione: controversie
    testo: 'Che l''aria delle città bruciasse la pietra si era notato molto presto:
      nel Seicento John Evelyn aveva commentato lo stato pessimo dei marmi Arundel,
      corrosi dall''aria acida e inquinata di Londra. Ma la dimostrazione del nesso
      arriva nel 1852, quando Robert Angus Smith mostra a Manchester il legame fra
      la pioggia acida e l''inquinamento atmosferico; vent''anni dopo, nel 1872, è
      lo stesso Smith a coniare l''espressione «pioggia acida». Il fenomeno ha dunque
      un nome da più di centocinquant''anni. Lo studio sistematico, però, comincia
      in Europa solo negli anni Sessanta del Novecento, e negli Stati Uniti e in Canada
      negli anni Settanta.'
    attendibilita: documentato
  - id: controversie-transfrontaliero
    sezione: controversie
    testo: 'La svolta concettuale fu capire che il problema viaggiava. Waldemar Christofer
      Brøgger fu il primo a riconoscere il trasporto degli inquinanti a lunga distanza
      attraverso i confini, dal Regno Unito verso la Norvegia; quasi un secolo più
      tardi la questione fu studiata sistematicamente da Brynjulf Ottar negli anni
      Settanta, sulla scia del lavoro dello scienziato del suolo svedese Svante Odén.
      Nel frattempo, nel 1955, due scienziati svedesi avevano osservato che le precipitazioni
      sulla Svezia nel loro complesso erano decisamente più acide di quanto il solo
      equilibrio con l''anidride carbonica potesse spiegare. Il punto era politicamente
      esplosivo: l''acido cadeva su un paese e lo zolfo era stato bruciato in un altro.'
    attendibilita: documentato
  - id: controversie-trattati
    sezione: controversie
    testo: 'La risposta dovette quindi essere diplomatica prima che tecnica. Dal 1979
      i paesi europei si riunirono per ratificare i principi generali discussi nell''ambito
      della Convenzione UNECE sull''inquinamento atmosferico transfrontaliero a lunga
      distanza, nata esattamente per combattere quel tipo di inquinamento; nel 1985
      seguì il Protocollo di Helsinki sulla riduzione delle emissioni di zolfo. È
      il modello che tornerà per l''ozono e per il clima: un inquinante che attraversa
      le frontiere obbliga a scrivere un trattato, perché nessuno può risolvere da
      solo un problema che non ha prodotto da solo.'
    attendibilita: documentato
  - id: controversie-cap-and-trade
    sezione: controversie
    testo: 'Nel 1990 il Congresso degli Stati Uniti approvò gli emendamenti al Clean
      Air Act il cui Titolo IV istituiva un sistema di scambio di quote, il cosiddetto
      cap and trade, per controllare le emissioni di anidride solforosa e di ossidi
      di azoto. L''obiettivo era una riduzione complessiva di circa dieci milioni
      di tonnellate di anidride solforosa dalle centrali elettriche, vicina al cinquanta
      per cento. Si procedette in due fasi: la prima partì nel 1995 e limitò a 8,7
      milioni di tonnellate le emissioni delle centodieci centrali maggiori, la seconda
      cominciò nel 2000 ed estese il vincolo a quasi tutte le centrali del paese.
      Invece di prescrivere a ciascun impianto quanto ridurre, lo Stato fissava un
      tetto complessivo e lasciava che le quote si scambiassero.'
    attendibilita: documentato
  - id: controversie-esito
    sezione: controversie
    testo: 'L''esito merita di essere riportato con le cifre, perché è uno dei pochi
      casi in cui una politica ambientale ha fatto quello che prometteva. Dagli anni
      Novanta le emissioni statunitensi di anidride solforosa sono scese del quaranta
      per cento, e i livelli di pioggia acida del sessantacinque per cento rispetto
      al 1976. Nel 2007 le emissioni totali erano 8,9 milioni di tonnellate, e l''obiettivo
      di lungo termine del programma risultava raggiunto in anticipo sulla scadenza
      di legge del 2010. L''Unione Europea, che aveva scelto la regolazione convenzionale
      invece del mercato delle quote, nello stesso periodo ha ottenuto un calo superiore
      al settanta per cento: due strumenti diversi, risultati dello stesso ordine.'
    attendibilita: documentato
  - id: controversie-scrubber
    sezione: controversie
    testo: 'Lo strumento tecnico che ha reso possibile quel calo è la desolforazione
      dei fumi, in gergo lo scrubber: si lava il fumo della centrale con una sospensione
      di calcare o di calce — oppure, sulle navi, con acqua di mare — che cattura
      l''anidride solforosa prima che esca dal camino. È di gran lunga il metodo prevalente:
      circa il settantanove per cento degli impianti censiti usava il lavaggio a umido
      con calce o calcare. E il residuo non è per forza un rifiuto: ossidando il solfito
      di calcio che si forma, con un passaggio chiamato ossidazione forzata, si ottiene
      solfato di calcio biidrato, cioè gesso, di qualità sufficiente per farne pannelli
      da cartongesso. Lo zolfo che per un secolo era stato il problema diventa un
      materiale da vendere.'
    attendibilita: documentato
  - id: controversie-pinatubo
    sezione: controversie
    testo: 'La controversia che riguarda lo zolfo oggi non nasce da una miniera ma
      da un vulcano. Nel 1991 l''eruzione del Pinatubo immise nella stratosfera un''enorme
      quantità di aerosol solforati e fece scendere la temperatura media globale di
      circa mezzo grado per un periodo fino a tre anni. L''osservazione ha suggerito
      un''idea: se un vulcano può raffreddare il pianeta, potrebbe farlo anche l''uomo,
      iniettando deliberatamente zolfo nella stratosfera. È la proposta nota come
      iniezione di aerosol stratosferici, e i gas precursori considerati sono proprio
      l''anidride solforosa e l''idrogeno solforato.'
    attendibilita: documentato
  - id: controversie-sai-valutazione
    sezione: controversie
    testo: 'La valutazione dell''IPCC è più sfumata di come la si cita di solito,
      in un senso o nell''altro: è il metodo di modificazione della radiazione solare
      più studiato, e c''è ampio accordo sul fatto che potrebbe contenere il riscaldamento
      sotto il grado e mezzo. Il condizionale però pesa, perché lo farebbe in modo
      imperfetto e con effetti collaterali possibili, tanto più se usato male. E la
      ricerca è ancora giovane: al 2021 gli aerosol già presenti nella stratosfera
      erano poco conosciuti e non esisteva una sostanza candidata che si fosse imposta
      sulle altre. Si discute di regolare il termostato di un pianeta con una tecnologia
      di cui non si conosce ancora l''ingrediente.'
    attendibilita: discusso
  - id: controversie-ozono
    sezione: controversie
    testo: 'Il rischio specifico degli aerosol solforati ha un nome che il Novecento
      ha già imparato a temere: l''assottigliamento dello strato di ozono. Le preoccupazioni
      sono sostenute da modelli, con una precisazione importante: il danno si produrrebbe
      soltanto se quantità sufficienti di aerosol raggiungessero o si depositassero
      nelle nubi stratosferiche polari prima che i livelli di clorofluorocarburi e
      degli altri gas lesivi dell''ozono scendano naturalmente a valori sicuri. Proprio
      per questo è stata proposta l''iniezione di aerosol non solforati, per esempio
      di calcite, cioè calcare, che raffredderebbe ugualmente contrastando al tempo
      stesso la perdita di ozono. La conclusione è ironica: se la geoingegneria solare
      si farà, potrebbe farsi senza zolfo.'
    attendibilita: discusso
  - id: controversie-h2s
    sezione: controversie
    testo: 'Fra i composti dello zolfo ce n''è uno che alla tossicità unisce una proprietà
      particolarmente insidiosa: rovescia contro la vittima la difesa che dovrebbe
      proteggerla. L''idrogeno solforato si sente benissimo: puzza di uovo marcio
      a concentrazioni bassissime. Ma l''avvertimento si spegne proprio quando servirebbe.
      Fra le cento e le centocinquanta parti per milione il nervo olfattivo viene
      paralizzato dopo poche inalazioni e l''odore scompare, e con esso la percezione
      del pericolo; fra le trecentoventi e le cinquecentotrenta compare l''edema polmonare
      con possibilità di morte; a ottocento parti per milione bastano cinque minuti
      per uccidere metà delle persone esposte, e oltre le mille il collasso è immediato,
      anche dopo una sola inspirazione. È un veleno che comincia con l''anestetizzare
      il sistema d''allarme.'
    attendibilita: documentato
  - id: controversie-fulmine
    sezione: controversie
    testo: 'C''è un equivoco millenario che vale la pena sciogliere, perché spiega
      metà della reputazione dello zolfo. Nell''Iliade e nell''Odissea il fulmine
      di Zeus è accompagnato dall''odore di zolfo: colpisce davanti ai cavalli di
      Diomede lasciando puzza e fiamme, abbatte una nave riempiendola di fumo sulfureo.
      Nel Settecento il teologo Jonathan Edwards definiva il fulmine «una corda di
      zolfo». Solo che il fulmine non contiene zolfo e non produce odoranti solforati:
      quell''odore è ozono, identificato nell''Ottocento. Per tremila anni l''umanità
      ha attribuito allo zolfo l''odore della folgore, e la confusione è durata anche
      dopo la scoperta, perché chi non conosceva l''ozono continuava a chiamarlo zolfo.'
    attendibilita: documentato
  - id: controversie-dura-europos
    sezione: controversie
    testo: 'L''uso bellico dello zolfo non aspetta la polvere da sparo. Nel terzo
      secolo, durante l''assedio di Dura Europos, l''esercito persiano lo impiegò
      come arma chimica: bruciò pece e zolfo dentro le gallerie scavate sotto le mura,
      producendo una nube tossica di anidride solforosa che uccise i soldati romani
      che vi si trovavano. È uno dei primi episodi documentati di guerra chimica,
      ed è perfettamente coerente con il resto della storia di questo elemento: la
      prima cosa che l''umanità ha imparato dello zolfo è che il fumo della sua combustione
      uccide, e l''ha usata prima per disinfettare, poi per fare la guerra.'
    attendibilita: documentato
  - id: eredita-claus
    sezione: eredita
    testo: 'Il capitolo finale porta la data di un brevetto britannico del 1883, rilasciato
      al chimico tedesco Carl Friedrich Claus, che lavorava in Inghilterra. Il processo
      che porta il suo nome recupera zolfo elementare dalle miscele gassose che contengono
      idrogeno solforato: in pratica, lo toglie dal gas naturale e dai flussi delle
      raffinerie. Per decenni fu una tecnologia di nicchia; oggi è lo standard delle
      raffinerie, degli impianti di trattamento del gas e della gassificazione, e
      resta il più importante processo di desolforazione dell''industria petrolchimica.
      Già nel 2005 lo zolfo di scarto degli impianti che lavorano idrocarburi costituiva
      la grandissima parte dei sessantaquattro milioni di tonnellate prodotte nel
      mondo quell''anno.'
    attendibilita: documentato
  - id: eredita-paradosso
    sezione: eredita
    testo: 'Il risultato è il rovesciamento completo della storia che avete appena
      letto. Quasi tutto lo zolfo elementare del mondo è oggi un sottoprodotto: non
      viene estratto perché serve, viene tolto dal petrolio e dal gas perché è un
      contaminante, e poi ci si ritrova ad averlo. Dagli anni Settanta questo zolfo
      indesiderato ha abbassato il prezzo al punto da mettere fuori mercato le miniere
      Frasch, cioè la tecnologia che aveva messo fuori mercato la Sicilia. L''ultima
      miniera Frasch statunitense ha chiuso nel 2000, quella irachena nel 2003; il
      metodo sopravvive in Messico, Ucraina e Polonia. In poco più di un secolo lo
      zolfo è passato dall''essere una merce strategica per cui si mandavano i bambini
      sottoterra all''essere un residuo di cui ci si deve liberare.'
    attendibilita: documentato
  - id: eredita-prontosil
    sezione: eredita
    testo: 'Prima di lasciare la chimica per la biologia, lo zolfo ha un capitolo
      medico che merita di essere raccontato, perché è l''atto di nascita della terapia
      antibatterica. I sulfamidici furono i primi antibatterici a largo spettro efficaci
      per via sistemica, e aprirono la strada alla rivoluzione degli antibiotici.
      Il primo si chiamava Prontosil, e la ricerca da cui uscì cominciò nel 1932 nei
      laboratori della Bayer, allora parte del gigantesco trust chimico tedesco IG
      Farben. L''ipotesi di partenza era curiosa: i coloranti derivati dal catrame
      di carbone si legano preferenzialmente a batteri e parassiti, e forse si potevano
      usare per aggredirli dentro il corpo. Dopo anni di tentativi infruttuosi su
      centinaia di coloranti, la squadra guidata dal medico Gerhard Domagk ne trovò
      uno che funzionava: un colorante rosso.'
    attendibilita: documentato
  - id: eredita-bioattivazione
    sezione: eredita
    testo: 'C''era però un''anomalia che nessuno sapeva spiegare: il Prontosil non
      aveva alcun effetto in provetta, e funzionava soltanto nell''animale vivo. La
      soluzione arrivò da una squadra francese dell''Istituto Pasteur guidata da Ernest
      Fourneau — Daniel Bovet, Federico Nitti e i coniugi Jacques e Thérèse Tréfouël
      — che scoprì come il farmaco venisse spezzato in due dentro il corpo, liberando
      dalla porzione colorante, inattiva, una molecola più piccola e incolore: la
      sulfanilamide. La scoperta fondò il concetto di bioattivazione e distrusse i
      sogni di profitto dell''azienda tedesca, perché la sulfanilamide era stata sintetizzata
      nel 1906, era d''uso corrente nell''industria dei coloranti e il suo brevetto
      era scaduto da un pezzo. Chiunque poteva produrla, e chiunque lo fece.'
    attendibilita: documentato
  - id: eredita-elixir
    sezione: eredita
    testo: 'La corsa ai sulfamidici della fine degli anni Trenta vide centinaia di
      produttori mettere in commercio forme diverse del farmaco senza che esistesse
      alcun obbligo di sperimentazione. Nell''autunno del 1937 il conto arrivò: il
      cosiddetto disastro dell''elisir di sulfanilamide avvelenò con glicole dietilenico
      almeno cento persone. La reazione legislativa fu il Federal Food, Drug, and
      Cosmetic Act del 1938, la legge che diede alla Food and Drug Administration
      statunitense l''autorità di vigilare sulla sicurezza di alimenti, farmaci, dispositivi
      medici e cosmetici. La regolamentazione moderna dei farmaci nasce da un composto
      solforato venduto male, e i sulfamidici restarono l''unico antibatterico a largo
      spettro disponibile fino alla penicillina, accompagnando i primi anni della
      seconda guerra mondiale.'
    attendibilita: documentato
  - id: eredita-proteine
    sezione: eredita
    testo: 'Mentre l''industria ne faceva un residuo, la biologia continuava a trattarlo
      come materiale da costruzione. Dei venti amminoacidi che compongono le proteine,
      due contengono zolfo: la cisteina e la metionina. Due cisteine possono legarsi
      fra loro formando la cistina, che nelle proteine funziona da reticolante, cioè
      cuce insieme punti diversi della catena; il ponte disolfuro che ne risulta è
      una delle modificazioni post-traduzionali più comuni, cioè uno di quei ritocchi
      che la cellula applica a una proteina dopo averla fabbricata. È la stessa cucitura
      che lo zolfo fa alla gomma nella vulcanizzazione, e il legame ha letteralmente
      la stessa lunghezza che ha nello zolfo elementare.'
    attendibilita: documentato
  - id: eredita-chemiosintesi
    sezione: eredita
    testo: 'C''è poi un intero ramo della vita che dallo zolfo non ricava un mattone
      ma l''energia. Intorno alle sorgenti idrotermali degli abissi, dove la luce
      del sole non arriva, popolazioni animali numerose sono sostenute dalla produzione
      dei microrganismi chemiosintetici, e lo stesso accade presso le emissioni fredde,
      i clatrati di metano, le carcasse di balena sul fondo e certe acque di grotta
      isolate. I vermi tubicoli giganti non mangiano affatto: ospitano i batteri che
      fanno il lavoro per loro. Si è ipotizzato che la chemiosintesi sia stata il
      primo tipo di metabolismo comparso sulla Terra, precedendo la respirazione cellulare
      e la fotosintesi, e che nella sua forma anaerobica possa sostenere vita sotto
      la superficie di Marte o di Europa, la luna di Giove.'
    attendibilita: documentato
  - id: eredita-winogradsky
    sezione: eredita
    testo: 'La cosa notevole è che qualcuno l''aveva previsto. Sergej Winogradsky
      aveva proposto l''idea che esistessero organismi capaci di ricavare energia
      dall''ossidazione di composti inorganici, lo zolfo fra questi, quasi novant''anni
      prima che se ne vedesse uno. La conferma arrivò negli anni Settanta con la scoperta
      delle sorgenti idrotermali oceaniche: nel 1977 l''Alvin, il primo sommergibile
      per grandi profondità al mondo, trovò le sorgenti calde e le creature strane
      che ci vivevano attorno. È uno dei casi in cui una previsione teorica ha dovuto
      aspettare che si costruisse la macchina capace di andare a verificarla.'
    attendibilita: documentato
  - id: eredita-fotosintesi-senza-ossigeno
    sezione: eredita
    testo: 'I batteri solfurei verdi fanno qualcosa di ancora più spiazzante: la fotosintesi,
      ma senza produrre ossigeno. Sono un intero phylum, i Chlorobiota, anaerobi obbligati
      che metabolizzano zolfo, e la differenza con le piante sta in un punto solo:
      al posto dell''acqua usano prevalentemente ioni solfuro come donatori di elettroni.
      Fissano il carbonio percorrendo all''indietro il ciclo degli acidi tricarbossilici,
      cioè lo stesso ciclo che nei nostri mitocondri serve a bruciare le molecole,
      usato in senso inverso per costruirle. Ricordano una cosa poco intuitiva: la
      fotosintesi che conosciamo è una fra quelle possibili, e per una parte della
      biosfera lo zolfo fa il lavoro che per noi fa l''acqua.'
    attendibilita: documentato
  - id: eredita-ciclo
    sezione: eredita
    testo: 'Tutti questi passaggi stanno dentro un ciclo biogeochimico che sposta
      lo zolfo fra rocce, oceano, atmosfera ed esseri viventi, e su cui l''attività
      umana ha avuto un effetto maggiore. Bruciando carbone, gas naturale e altri
      combustibili fossili abbiamo aumentato molto la quantità di zolfo presente nell''atmosfera
      e nell''oceano, e insieme impoverito il serbatoio delle rocce sedimentarie.
      Senza l''intervento umano, quello zolfo sarebbe rimasto chiuso nelle rocce per
      milioni di anni, in attesa di essere sollevato da eventi tettonici e liberato
      lentamente dall''erosione. Noi lo tiriamo fuori con una trivella. La voce che
      descrive il ciclo riassume la posizione dello zolfo in una formula che vale
      per tutta questa storia: è un inquinante e una risorsa economica allo stesso
      tempo.'
    attendibilita: documentato
  - id: eredita-io
    sezione: eredita
    testo: 'Se si vuole vedere che aspetto abbia un mondo governato dallo zolfo, bisogna
      guardare Io, la luna di Giove: centinaia di centri vulcanici e colate estese
      ne fanno il corpo più vulcanicamente attivo del sistema solare. Il tipo di pennacchio
      più comune si forma quando una colata di lava avanza sopra la brina di anidride
      solforosa che ricopre il terreno e la vaporizza di colpo, scagliandola verso
      l''alto; i depositi che ne risultano sono cerchi chiari di raggio fra i cento
      e i duecentocinquanta chilometri, fatti soprattutto di quella brina. Sono strutture
      stabili nel tempo: quattro dei sei pennacchi di questo tipo osservati dal Voyager
      1 nel 1979 erano ancora là durante la missione Galileo e furono rivisti da New
      Horizons nel 2007.'
    attendibilita: documentato
  - id: eredita-batterie
    sezione: eredita
    testo: 'L''ultima carriera dello zolfo è quella che sta cominciando adesso, e
      nasce proprio dal fatto che ce n''è troppo. Le batterie litio-zolfo potrebbero
      soppiantare le litio-ione per densità di energia e costo più basso, usando come
      materiale attivo una sostanza abbondante invece dei metalli contesi di oggi.
      Il margine teorico è enorme: la chimica litio-zolfo promette circa 2.600 wattora
      per chilogrammo, mentre le celle reali oggi stanno fra i trecento e i quattrocentocinquanta.
      Sono anche leggere, all''incirca quanto l''acqua, perché il litio è leggerissimo
      e lo zolfo è di peso atomico moderato.'
    attendibilita: documentato
  - id: eredita-batterie-problema
    sezione: eredita
    testo: 'A tenerle fuori dal mercato è un difetto che ha un nome quasi elegante:
      l''effetto navetta dei polisolfuri. Durante il funzionamento il materiale attivo
      si scioglie nell''elettrolita e fa la spola fra i due elettrodi invece di restare
      al suo posto, e il catodo si impoverisce progressivamente: il risultato è un
      numero di ricariche troppo basso. Si aggiunge che il catodo di zolfo conduce
      male e va appesantito con altro materiale. Celle capaci di millecinquecento
      cicli sono state dimostrate nel 2017, ma le prove di durata su scala commerciale
      non sono state completate, e all''inizio del 2021 non ne esisteva in commercio
      nessuna. Se il problema verrà risolto, lo zolfo di scarto delle raffinerie diventerà
      il materiale con cui si immagazzina l''energia destinata a sostituire le raffinerie.'
    attendibilita: documentato
  - id: eredita-fumarole
    sezione: eredita
    testo: 'Vale la pena tornare, alla fine, al luogo da cui questa storia è cominciata.
      Le fumarole emettono soprattutto vapore acqueo, accompagnato dai gas che il
      magma libera raffreddandosi in profondità: fra questi ci sono composti dello
      zolfo, ossidi e idrogeno solforato, e quando la componente solforosa è rilevante
      la bocca prende un nome che in italiano suona familiare, solfatara. Il processo
      è duplice: i vapori acidi sgretolano la roccia intorno allo sfiato e contemporaneamente
      vi depositano zolfo e altri minerali. Ecco perché lo zolfo si trovava già puro
      e perché trovarlo significava avvicinarsi a una bocca che emette gas caldi e
      velenosi. La Sicilia, che di quel monopolio visse fino al processo Frasch, è
      uno dei siti dell''elenco; ce ne sono altri, in Nuova Zelanda, sfruttati dai
      Māori fino al 1950.'
    attendibilita: documentato
  - id: eredita-ijen
    sezione: eredita
    testo: 'E c''è un ultimo dato che impedisce di archiviare i carusi come una faccenda
      dell''Ottocento. In Indonesia lo zolfo si estrae ancora oggi nel modo antico:
      a mano, per una paga bassa, talvolta senza respiratori né altri dispositivi
      di protezione. Il luogo più noto è il Kawah Ijen, dove gli uomini caricano sulle
      spalle blocchi di zolfo solidificato e risalgono il cratere a piedi, dentro
      i vapori. Il mondo non ha smesso di prendere lo zolfo con le mani: ha smesso
      di farlo dove poteva vederlo. Nel 2011 se ne producevano nel mondo sessantanove
      milioni di tonnellate, quasi tutte come scarto di raffineria, e proprio per
      questo il lavoro che resta a mano è quello che non vale la pena di meccanizzare.'
    attendibilita: documentato
  - id: eredita-chiusura
    sezione: eredita
    testo: 'Resta da dire come finì per i carusi, e la risposta è meno consolante
      di quanto piacerebbe. L''impiego dei bambini cessò, si dice, negli anni Venti
      o Trenta del Novecento, ma ragazzi continuarono a portare il minerale in superficie
      fino agli anni Cinquanta. E a farlo cessare non fu una legge né un moto d''indignazione:
      fu, come in ogni altra industria mineraria, il passaggio a metodi più efficienti
      di trasporto del minerale. I bambini smisero di essere sfruttati quando smisero
      di essere il modo più conveniente di spostare un peso. È il motivo per cui questo
      approfondimento ha raccontato lo zolfo partendo da chi lo ha pagato invece che
      da chi lo ha scoperto: di scoprire, qui, non c''era niente, e tutto quello che
      c''è da capire sta nel prezzo.'
    attendibilita: documentato
composti_principali:
- nome: Acido solforico
