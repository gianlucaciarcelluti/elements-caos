contenuti:
  hook: 'Lo zolfo non è stato scoperto da nessuno: giace giallo e puro sui fianchi dei vulcani,
    dove chiunque può raccoglierlo. Il problema, per l''antichità, non era trovarlo ma capire
    che cosa fosse quella pietra che bruciava con fiamma azzurra e un odore da inferno.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Lo zolfo appartiene alla piccolissima famiglia degli elementi che la natura offre
      già puri: cristalli gialli depositati attorno alle fumarole vulcaniche, dove il gas che
      risale dal sottosuolo si raffredda. Ottenerlo non richiede alcuna tecnica, solo il coraggio
      di andarlo a prendere.'
    visual: Cristalli gialli di zolfo nativo attorno a una fumarola con vapori che salgono
    attendibilita: documentato
  - id: fumigante
    sezione: storia
    testo: 'La prima cosa che l''uomo impara dello zolfo è che brucia, e che il fumo di quella
      combustione uccide. Nel ventiduesimo libro dell''Odissea, dopo la strage dei pretendenti,
      Odisseo chiede alla nutrice Euriclea di portargli fuoco e zolfo per purificare la sala:
      è una delle più antiche descrizioni scritte di una fumigazione chimica. Il gesto ha
      insieme un senso rituale e uno pratico, perché l''anidride solforosa che si sprigiona
      bruciando zolfo è effettivamente un disinfettante che stermina muffe, batteri e insetti.'
    visual: Sala del palazzo di Itaca invasa dal fumo bianco dello zolfo che brucia in un
      braciere
    attendibilita: documentato
  - id: medicina_antica
    sezione: storia
    testo: 'Accanto all''uso purificatorio corre quello medico. Il papiro Ebers, redatto in
      Egitto intorno al 1550 a.C., prescrive un unguento a base di zolfo contro l''infiammazione
      granulare delle palpebre, ed è una delle testimonianze più antiche di una terapia dermatologica
      che si è dimostrata longeva: gli unguenti sulfurei contro scabbia e affezioni cutanee
      restano in farmacopea fino al Novecento.'
    visual: Papiro egizio srotolato accanto a un mortaio con polvere gialla
    attendibilita: documentato
  - id: plinio
    sezione: storia
    testo: 'I Romani ne hanno un catalogo d''usi già preciso. Plinio il Vecchio elenca quattro
      qualità di zolfo e altrettante applicazioni: la medicina, la follatura dei tessuti, lo
      sbiancamento della lana e i lucignoli delle lampade. Indica anche la fonte principale
      del mondo antico, l''isola egea di Milo.'
    visual: Banco di lavorazione romano con matasse di lana esposte ai vapori di zolfo
    attendibilita: documentato
  - id: alchimia
    sezione: storia
    testo: 'La svolta concettuale arriva con l''alchimia, che allo zolfo assegna un ruolo
      che va molto oltre l''utilità pratica. Nella teoria dei tria prima codificata da Paracelso
      nel Cinquecento, ogni sostanza materiale nasce dalla combinazione di tre principi:
      il mercurio, che dà fluidità e metallicità, il sale, che dà solidità, e lo zolfo, che
      dà combustibilità e colore. Non è lo zolfo del minerale, è un principio astratto che
      prende nome dal minerale, ma per due secoli quella triade è lo schema con cui l''Europa
      colta pensa la materia.'
    visual: Tavola alchemica con i tre simboli di zolfo, mercurio e sale disposti in triangolo
    attendibilita: documentato
  - id: polvere_da_sparo
    sezione: storia
    testo: 'In Cina lo zolfo percorre una strada parallela. I testi lo nominano dal VI secolo
      a.C., e nel III secolo d.C. lo si estrae già dalla pirite; i taoisti, che lo maneggiano
      cercando elisir di lunga vita, ne scoprono per via sperimentale la reattività violenta.
      La combinazione di zolfo, salnitro e carbone di legna che ne deriva è la polvere da
      sparo, ottenuta cercando l''immortalità e trovando esattamente il contrario.'
    visual: Bilancia con i tre mucchietti di salnitro, carbone e zolfo pronti per la miscela
    attendibilita: documentato
  - id: lavoisier
    sezione: storia
    testo: 'Lo zolfo diventa un elemento chimico, e non più un principio, nel 1777, quando
      Antoine Lavoisier lo classifica fra le sostanze semplici. Non è un ritrovamento: è il
      momento in cui una materia nota da millenni cambia statuto, da ingrediente della cosmologia
      alchemica a casella della chimica.'
    visual: Tavola delle sostanze semplici di Lavoisier con la voce «soufre» evidenziata
    attendibilita: documentato
  - id: caratteristiche_allotropi
    sezione: caratteristiche
    testo: 'Lo zolfo detiene un primato bizzarro: nessun altro elemento ha così tante forme
      cristalline. La più stabile è l''ottazolfo, molecole ad anello di otto atomi in un reticolo
      giallo limone. Fuso e versato di colpo in acqua fredda dà invece lo zolfo plastico: gli
      anelli si aprono in catene elicoidali lunghissime e la massa diventa bruna ed elastica
      come gomma, per tornare gialla e friabile nel giro di ore.'
    visual: Filo di zolfo plastico bruno estratto dall'acqua accanto ai cristalli gialli originari
    attendibilita: documentato
  - id: caratteristiche_stati
    sezione: caratteristiche
    testo: 'Chimicamente lo zolfo è versatile quanto pochi: la letteratura gli riconosce stati
      di ossidazione dal meno due al più sei, ma nella pratica quasi tutto ciò che si incontra
      sta in quattro caselle. Meno due sono i solfuri, dai minerali metallici all''uovo marcio;
      più quattro è l''anidride solforosa, quella che disinfettava la sala di Odisseo e che
      oggi conserva il vino; più sei è l''acido solforico. È questa scala di ossidazione a
      renderlo utile: lo zolfo cede e accetta elettroni con la stessa disinvoltura.'
    visual: Scala verticale con i composti tipici dello zolfo ordinati per stato di ossidazione
    attendibilita: documentato
  - id: caratteristiche_odore
    sezione: caratteristiche
    testo: 'Va sfatato un equivoco tenace: lo zolfo puro non ha odore. Puzzano i suoi composti,
      e in modo memorabile. L''idrogeno solforato è l''uovo marcio, i tioli sono l''aglio, la
      cipolla e lo spruzzo della puzzola. L''industria del gas ne aggiunge deliberatamente una
      traccia al metano, che è inodore, perché una perdita si senta prima di diventare un''esplosione:
      il naso umano li riconosce a poche parti per miliardo.'
    visual: Bombola di metano con l'etichetta dell'odorizzante accanto a uno spicchio d'aglio
    attendibilita: documentato
  - id: usi_acido_solforico
    sezione: usi
    testo: 'La destinazione principale dello zolfo è l''acido solforico, la sostanza chimica
      più prodotta al mondo in assoluto. Non finisce quasi mai nelle mani del pubblico: serve
      a fabbricare fertilizzanti fosfatici, a raffinare il petrolio, a lavorare i metalli. Il
      consumo di acido solforico di un paese è stato a lungo usato come indicatore grezzo del
      suo livello di industrializzazione.'
    visual: Impianto di contatto per acido solforico con le torri di assorbimento
    attendibilita: documentato
  - id: usi_vulcanizzazione
    sezione: usi
    testo: 'Il secondo uso è meno voluminoso ma altrettanto pervasivo. Nella vulcanizzazione,
      brevettata nel 1843, lo zolfo crea ponti fra le catene del polimero della gomma naturale,
      che smette così di essere appiccicosa a caldo e fragile a freddo: ogni pneumatico esistente
      dipende da quella reazione. Restano poi gli usi antichi, mai abbandonati, come lo zolfo
      in polvere che difende i vigneti dall''oidio.'
    visual: Sezione di pneumatico con lo schema dei ponti disolfuro fra le catene polimeriche
    attendibilita: documentato
  - id: curiosita_biologia
    sezione: curiosita
    testo: 'Lo zolfo è dentro ogni essere vivente, in due dei venti amminoacidi che compongono
      le proteine, la cisteina e la metionina. Sono i ponti disolfuro fra le cisteine a dare
      rigidità alla cheratina di capelli, unghie e piume: la stessa reazione che rende elastico
      uno pneumatico tiene in forma un capello. Una permanente dal parrucchiere non è altro
      che la rottura chimica di quei ponti e la loro ricostruzione su una forma diversa.'
    visual: Ciocca di capelli avvolta su un bigodino con lo schema dei ponti disolfuro riformati
    attendibilita: documentato
  - id: curiosita_nome
    sezione: curiosita
    testo: 'Il nome greco dello zolfo, theion, somiglia da vicino a theios, divino, e quella
      vicinanza fonetica ne ha fissato per secoli l''aura sacra e insieme infernale. È la sostanza
      che nella Genesi piove col fuoco su Sodoma e Gomorra e che nell''Apocalisse forma lo stagno
      ardente. Nessun altro elemento chimico ha una carriera religiosa così lunga.'
    visual: Incisione antica della distruzione di Sodoma con la pioggia di fuoco e zolfo
    attendibilita: documentato
  pronuncia: []
