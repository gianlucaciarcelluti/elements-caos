  - raffinazione del petrolio
  - elettrolita delle batterie al piombo
- nome: Anidride solforosa
  formula: SO2
  usi:
  - conservante del vino
  - sbiancamento della cellulosa
  - intermedio per l'acido solforico
- nome: Solfuro di idrogeno
  formula: H2S
  usi:
  - sintesi di solfuri metallici
  - analisi chimica qualitativa
  - produzione di acqua pesante
- nome: Pirite
  formula: FeS2
  usi:
  - fonte mineraria di zolfo
  - produzione di acido solforico
  - antiche pietre focaie
