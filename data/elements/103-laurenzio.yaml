  note_cronologia: Rivendicato da Berkeley il 14 febbraio 1961 da Ghiorso, Sikkeland, Larsh
    e Latimer — la cronologia di riferimento li comprimeva in «Ghiorso et al.» — con l'isotopo
    indicato come laurenzio-257, attribuzione poi corretta in laurenzio-258. Dubna raggiunse
