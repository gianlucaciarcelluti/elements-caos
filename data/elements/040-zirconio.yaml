  luogo: null
  epoca: pneumatica
  isolamento_anno: 1824
  note_cronologia: Klaproth riconosce nel 1789 una terra nuova, la zirconia, analizzando uno
    zircone proveniente da Ceylon; Berzelius ne ottiene nel 1824 il metallo impuro riducendo
    il fluorozirconato di potassio con il potassio. Il metallo puro e duttile arriva solo nel
    1925 con il processo alla barra di iodio di van Arkel e de Boer.
