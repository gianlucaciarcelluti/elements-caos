numero_atomico: 39
simbolo: Y
nome: Ittrio
nome_en: Yttrium
scoperta:
  anno: 1794
  anno_stimato: false
  scopritori:
    - johan-gadolin
  luogo: Åbo (Turku)
  epoca: pneumatica
  isolamento_anno: 1828
  note_cronologia: Carl Axel Arrhenius rinviene nel 1787 il minerale nero nella cava di Ytterby;
    Johan Gadolin ne pubblica nel 1794 l'analisi, riconoscendovi una terra nuova, che Anders
    Gustaf Ekeberg chiama ittria nel 1797. Il metallo è isolato nel 1828 da Friedrich Wöhler,
    riducendo il cloruro con il potassio. Nel 1843 Carl Gustaf Mosander dimostra che l'ittria
    di Gadolin conteneva in realtà tre ossidi distinti.
