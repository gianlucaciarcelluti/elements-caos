contenuti:
  hook: Per trent'anni la casella 114 è stata il centro previsto dell'isola di stabilità,
    la regione in cui i nuclei superpesanti avrebbero dovuto durare anni invece di secondi.
    Il flerovio è arrivato, e l'isola non era lì.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il flerovio è l''elemento su cui la fisica nucleare aveva scommesso più di ogni
      altro. Doveva essere la porta di una regione di nuclei insolitamente longevi, e in parte
      lo è: i suoi isotopi resistono alla fissione più dei vicini. Ma il centro dell''isola
      che si cercava non è la sua casella, e capire perché ha richiesto di fabbricarlo.'
    visual: Una mappa dei nuclidi con una regione evidenziata al centro
    attendibilita: documentato
  - id: un_atomo_nel_1998
    sezione: storia
    testo: 'Il primo atomo comparve a Dubna nel dicembre del 1998, in una collaborazione fra
      l''istituto russo e il laboratorio di Livermore guidata da Jurij Oganesjan. Il bersaglio
      era plutonio-244, il proiettile calcio-48, e l''unico nucleo prodotto sopravvisse trenta
      secondi prima di emettere una particella alfa: un tempo enorme per quella regione della
      tavola, ed è la ragione per cui il risultato fece impressione. Quell''attività non è
      però mai più stata osservata in alcun esperimento successivo, e a quale isotopo appartenesse
      resta incerto. La conferma dell''elemento richiese anni di lavoro ulteriore, e la IUPAC
      lo riconobbe nel 2011.'
    visual: Il bersaglio rotante di plutonio dell'acceleratore di Dubna
    attendibilita: documentato
  - id: il_calcio_48
    sezione: storia
    testo: 'La differenza rispetto agli elementi tedeschi sta nel proiettile. Il calcio-48
      ha venti protoni e ventotto neutroni, due numeri che corrispondono a gusci nucleari
      completi, ed è quindi un nucleo compatto e insolitamente ricco di neutroni: sparato
      contro un bersaglio di attinide, produce nuclei che portano con sé quei neutroni in
      eccesso e resistono meglio alla fissione. È l''ingrediente che ha permesso di arrivare
      fino alla fine della riga.'
    visual: Uno schema del nucleo di calcio-48 con i gusci completi
    attendibilita: documentato
  - id: doppiamente_magico
    sezione: storia
    testo: L'espressione «doppiamente magico» merita una spiegazione, perché è la chiave di
      tutta la vicenda. I protoni e i neutroni si dispongono nel nucleo per gusci, come gli
      elettroni attorno a esso, e un guscio completo rende il nucleo più compatto e più difficile
      da rompere. I numeri che completano un guscio si chiamano magici; un nucleo che li ha
      completi per entrambe le specie è doppiamente magico, ed è il caso del piombo-208, che
      non a caso è il bersaglio preferito di tutta questa parte della tavola.
    visual: Uno schema dei gusci nucleari completi di protoni e neutroni
    attendibilita: documentato
  - id: il_nome
    sezione: storia
    testo: 'Il nome, ufficializzato nel 2012, viene dal laboratorio di Dubna dedicato alle
      reazioni nucleari, che a sua volta porta il nome di Georgij Flërov. Flërov aveva scoperto
      con Konstantin Petržak la fissione spontanea, e nell''aprile del 1942 aveva scritto
      a Stalin per segnalare una cosa che nessuno aveva notato: sulle riviste americane, britanniche
      e tedesche non si pubblicava più nulla sulla fissione nucleare. Il silenzio, sostenne,
      significava che il tema era diventato segreto militare.'
    visual: Il ritratto di Georgij Flërov
    attendibilita: documentato
  - id: il_silenzio_come_prova
    sezione: storia
    testo: Aveva ragione, e da quella lettera nacque il programma atomico sovietico. È un
      episodio raro di deduzione corretta ricavata dall'assenza di dati anziché dalla loro
      presenza, e collega la casella 114 alla stessa vicenda che aveva prodotto le caselle
      da 93 a 98 dall'altra parte del mondo.
    visual: Uno scaffale di riviste scientifiche degli anni Quaranta
    attendibilita: documentato
  - id: l_isola_che_non_c_era
    sezione: caratteristiche
    testo: 'Nel 1966 nuovi calcoli avevano spostato il guscio protonico completo dal numero
      126, che ci si aspettava, al numero 114, e da allora il flerovio con centottantaquattro
      neutroni è stato considerato il nucleo doppiamente magico al centro dell''isola di stabilità.
      I dati raccolti dopo la sintesi non lo confermano: il flerovio non si comporta come
      un guscio sferico chiuso, e le previsioni attuali spostano il centro dell''isola più
      avanti, verso caselle che nessuno ha ancora raggiunto.'
    visual: Due mappe dei nuclidi con il centro dell'isola in posizioni diverse
    attendibilita: discusso
  - id: stabilita_comunque
    sezione: caratteristiche
    testo: 'L''attesa non è però andata delusa del tutto. Gli isotopi del flerovio resistono
      alla fissione spontanea molto più di quanto la sola carica nucleare farebbe prevedere,
      e questa maggiore tenuta si estende ai vicini: è un effetto di guscio reale, solo non
      centrato dove lo si era collocato. La differenza fra l''isola prevista e quella trovata
      è di poche caselle e di parecchi ordini di grandezza in durata.'
    visual: Un grafico delle emivite con una gobba evidente
    attendibilita: documentato
  - id: metallo_o_gas
    sezione: caratteristiche
    testo: Anche la chimica ha riservato una sorpresa. Il flerovio sta nel gruppo 14, sotto
      il piombo, e ci si aspettava un metallo pesante e poco volatile; gli esperimenti di
      adsorbimento condotti fra il 2007 e il 2014 lo hanno invece trovato molto più volatile
      del previsto, con un comportamento vicino a quello del copernicio e una reattività verso
      l'oro sorprendentemente debole. Alcuni calcoli recenti gli danno un punto di fusione
      sotto lo zero.
    visual: Una superficie d'oro raffreddata con i punti di deposizione segnati
    attendibilita: documentato
  - id: gli_stati_previsti
    sezione: caratteristiche
    testo: 'Nessuno stato di ossidazione del flerovio è mai stato osservato, e i valori di
      questa nota sono calcoli: si prevede che il +2 sia nettamente favorito, come nel piombo,
      e che il +4 sia molto instabile. La ragione è ancora relativistica: due dei quattro
      elettroni esterni sono trattenuti così saldamente da non partecipare quasi mai al legame.'
    visual: Uno schema degli elettroni esterni con due coppie a energie diverse
    attendibilita: documentato
  - id: isotopi
    sezione: caratteristiche
    testo: Si conoscono sei isotopi del flerovio. Il più longevo fra quelli confermati è il
      flerovio-289, che dura circa due secondi; di un flerovio-290, non confermato, si stima
      una ventina di secondi. Sono i tempi che hanno reso possibili gli esperimenti di chimica,
      e ogni neutrone in più li allunga.
    visual: Una tabella di isotopi con le emivite crescenti
    attendibilita: documentato
  - id: usi_ricerca
    sezione: usi
    testo: 'Il flerovio non ha usi e non ne avrà: non esiste in natura e se ne producono singoli
      atomi. La sua utilità è tutta nella verifica dei modelli nucleari, ed è una verifica
      che è servita soprattutto a correggerli.'
    visual: Una sala di controllo con i grafici di una campagna sperimentale
    attendibilita: documentato
  - id: perche_studiarlo
    sezione: usi
    testo: 'Sapere che l''isola di stabilità non è dove si pensava vale quanto trovarla. I
      modelli che collocavano il guscio chiuso al 114 sono gli stessi che si usano per prevedere
      se esistano elementi oltre il 118 e quanto possano durare: correggerli sposta il bersaglio
      degli esperimenti futuri, e decide dove valga la pena spendere mesi di fascio e milligrammi
      di calcio-48.'
    visual: Il confronto fra una previsione teorica e i punti sperimentali
    attendibilita: documentato
  - id: curiosita_seaborg
    sezione: curiosita
    testo: 'Nel dicembre del 1997 Glenn Seaborg disse che uno dei suoi sogni più antichi era
      vedere uno di quegli elementi magici. Quando la sintesi del flerovio fu pubblicata,
      nel 1999, Albert Ghiorso andò a dirglielo al capezzale: gli parve, raccontò poi, di
      vedergli illuminarsi lo sguardo, ma il giorno dopo Seaborg non se ne ricordava. Morì
      il 25 febbraio di quell''anno.'
    visual: Una stanza d'ospedale con due anziani scienziati
    attendibilita: documentato
  - id: curiosita_flerov_e_dubna
    sezione: curiosita
    testo: 'Con il flerovio il laboratorio di Dubna ha messo nella tavola periodica il nome
      della propria città e quello del proprio fondatore, a nove caselle di distanza: il dubnio
      nel 1997 come compenso di una disputa perduta, il flerovio nel 2012 come riconoscimento
      di una serie di scoperte vinte. In mezzo c''è tutto il cambiamento di metodo che ha
      reso possibile la seconda cosa.'
    visual: Le caselle 105 e 114 evidenziate su una tavola periodica
    attendibilita: documentato
  pronuncia:
  - termine: Georgij Flërov
