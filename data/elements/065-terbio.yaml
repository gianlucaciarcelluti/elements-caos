  luogo: Stoccolma, Svezia
  epoca: elettrolisi
  isolamento_anno: 1937
  note_cronologia: 'Mosander separò nel 1843 due terre dall''ittria, erbia e terbia, ma i
    nomi delle due finirono scambiati nella letteratura successiva: l''elemento oggi chiamato
    terbio porta il nome che Mosander aveva dato all''altro. Isolato in forma metallica nel
    1937 da Wilhelm Klemm e Heinrich Bommer.'
