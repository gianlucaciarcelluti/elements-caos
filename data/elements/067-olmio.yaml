numero_atomico: 67
simbolo: Ho
nome: Olmio
nome_en: Holmium
scoperta:
  anno: 1878
  anno_stimato: false
  scopritori:
  - jacques-louis-soret
  - marc-delafontaine
  luogo: Ginevra, Svizzera
  epoca: spettroscopia
  isolamento_anno: 1939
  note_cronologia: 'Scoperta doppia e quasi simultanea: Soret e Delafontaine ne videro le
    righe a Ginevra nel 1878 e lo chiamarono «elemento X», Cleve ne ottenne l''ossido impuro
    a Uppsala nel 1879 e gli diede il nome. L''ossido puro è del 1911, il metallo del 1939,
    per mano di Heinrich Bommer.'
  controversia: null
