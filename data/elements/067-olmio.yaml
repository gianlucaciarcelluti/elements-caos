contenuti:
  hook: A Ginevra lo chiamarono «elemento X» perché non sapevano che cosa fosse. A Uppsala,
    nello stesso anno, qualcun altro lo tirava fuori dalla stessa terra e gli dava il nome
    della propria città.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'L''olmio è il campione magnetico della tavola periodica: nessun altro elemento
      naturale ha un momento magnetico atomico più alto. È una proprietà che non serve a fare
      calamite — a temperatura ambiente il magnetismo non regge — ma a concentrare i campi
      magnetici degli elettromagneti più potenti che si sappiano costruire.'
    visual: Un cilindro di olmio metallico dentro l'espansione polare di un magnete
    attendibilita: documentato
  - id: elemento_x
    sezione: storia
    testo: 'Nel 1878, a Ginevra, Jacques-Louis Soret e Marc Delafontaine studiavano allo spettroscopio
      i residui delle terre rare e trovarono righe di assorbimento che non corrispondevano
      a nessun elemento conosciuto. Non riuscendo a isolare la sostanza che le produceva,
      la chiamarono provvisoriamente «elemento X»: era il modo onesto di annunciare che c''era
      qualcosa senza sapere che cosa.'
    visual: Uno spettro di assorbimento con righe non identificate
    attendibilita: documentato
  - id: cleve_holmia
    sezione: storia
    testo: 'Nello stesso periodo, a Uppsala, Per Teodor Cleve stava smontando l''erbia con
      il metodo che gli aveva già dato il tulio: rimuoveva sistematicamente i contaminanti
      noti e guardava che cosa restava. Quello che restava erano due sostanze nuove, e una
      era la stessa che i ginevrini avevano visto. Cleve ne ottenne l''ossido impuro e la
      chiamò holmia, da Holmia, il nome latino di Stoccolma.'
    visual: Il laboratorio di chimica dell'università di Uppsala nell'Ottocento
    attendibilita: documentato
  - id: due_scoperte_una_sola
    sezione: storia
    testo: 'Le tavole assegnano la scoperta ai ginevrini, che videro per primi, e il nome
      allo svedese, che per primo isolò qualcosa di tangibile: è la stessa divisione che si
      era vista per il tallio fra Crookes e Lamy, e che la spettroscopia rendeva inevitabile.
      Vedere una riga e tenere in mano una polvere erano ormai due traguardi diversi, e non
      sempre li raggiungeva la stessa persona.'
    visual: Due pubblicazioni scientifiche del 1878 e 1879 a confronto
    attendibilita: documentato
  - id: ossido_e_metallo
    sezione: storia
    testo: 'L''ossido puro arrivò solo nel 1911, con le migliaia di cristallizzazioni frazionate
      che questa famiglia richiedeva, e il metallo nel 1939, per mano di Heinrich Bommer.
      Sessant''anni fra l''annuncio e il primo pezzo di elemento: uno degli scarti più lunghi
      della tavola periodica, e tutto dovuto alla difficoltà di separare fra loro sostanze
      quasi identiche.'
    visual: Un becher con cristalli che si separano per cristallizzazione frazionata
    attendibilita: documentato
  - id: momento_magnetico
    sezione: caratteristiche
    testo: 'Il guscio f dell''olmio ospita elettroni spaiati disposti in modo da sommare i
      loro momenti magnetici invece di annullarli, e il risultato è il momento magnetico atomico
      più alto fra tutti gli elementi naturali: 10,6 magnetoni di Bohr. È una proprietà dell''atomo
      singolo, non del materiale, ed è per questo che non se ne ricavano magneti permanenti.'
    visual: Schema degli spin elettronici allineati nel guscio f dell'olmio
    attendibilita: documentato
  - id: magnetismo_freddo
    sezione: caratteristiche
    testo: 'Come materiale l''olmio è ferromagnetico solo a temperature molto basse, e a temperatura
      ambiente si comporta da paramagnete: subisce i campi magnetici invece di produrne. È
      esattamente questo, però, a renderlo utile come concentratore: inserito fra le espansioni
      polari di un elettromagnete, ne raccoglie e ne intensifica il campo.'
    visual: Le espansioni polari di un elettromagnete da laboratorio
    attendibilita: documentato
  - id: proprieta_generali
    sezione: caratteristiche
    testo: 'Per il resto è un lantanide ordinario: metallo argenteo, relativamente tenero
      e malleabile, che all''aria secca resiste bene e in aria umida si ossida lentamente;
      nei composti sta stabilmente nello stato +3 e i suoi sali sono gialli o rosati. Le sue
      righe di assorbimento sono così nette e così poco sensibili all''ambiente chimico da
      essere usate per tarare gli spettrofotometri.'
    visual: Una cuvetta con soluzione di olmio usata per la taratura di uno spettrofotometro
    attendibilita: documentato
  - id: abbondanza
    sezione: caratteristiche
    testo: Nella crosta terrestre è a 1,3 parti per milione, poco più del terbio, e come tutti
      i lantanidi pesanti si ricava dalla monazite, dallo xenotime e dalle argille ad adsorbimento
      ionico della Cina meridionale. Non ha minerali propri e non ne ha mai avuti.
    visual: Sabbie di monazite in un impianto di trattamento
    attendibilita: documentato
  - id: usi_laser
    sezione: usi
    testo: 'Il cristallo di ittrio-alluminio granato drogato con olmio emette a circa 2,1
      micrometri, una lunghezza d''onda che l''acqua assorbe molto bene: il colpo si esaurisce
      in pochi decimi di millimetro di tessuto, e questo ne fa un bisturi ottico che taglia
      e coagula senza danneggiare quello che sta appena sotto. È il laser con cui si frantumano
      i calcoli renali e si opera l''ipertrofia prostatica, due interventi che con questa
      tecnica si fanno per via endoscopica, e negli ultimi decenni ha sostituito la chirurgia
      tradizionale in buona parte dell''urologia.'
    visual: Una fibra laser introdotta in un endoscopio in sala operatoria
    attendibilita: documentato
  - id: usi_magneti_e_nucleare
    sezione: usi
    testo: Nei laboratori, i puntali in olmio degli elettromagneti servono a raggiungere i
      campi statici più intensi disponibili; nei reattori nucleari l'olmio fa da veleno bruciabile,
      cioè da assorbitore di neutroni che si consuma man mano che il combustibile invecchia,
      compensando da solo la perdita di reattività.
    visual: Barre di controllo calate nel nocciolo di un reattore
    attendibilita: documentato
  - id: usi_colore
    sezione: usi
    testo: 'L''ossido colora i vetri di giallo-arancio e la zirconia cubica di rosa, ed è
      uno dei pochi impieghi in cui l''olmio si vede: il resto del suo lavoro avviene dentro
      cristalli laser, magneti e noccioli di reattore, dove non lo guarda nessuno.'
    visual: Vetri colorati con ossido di olmio in controluce
    attendibilita: documentato
  - id: curiosita_taratura
    sezione: curiosita
    testo: 'Le righe di assorbimento dell''olmio sono così strette e così stabili che un filtro
      di vetro all''olmio è lo standard con cui si verifica la scala delle lunghezze d''onda
      degli spettrofotometri di mezzo mondo: si mette il filtro nel cammino ottico, si guarda
      dove cadono i picchi e si corregge lo strumento. Un elemento trovato grazie a righe
      che nessuno riconosceva è diventato il metro con cui si controllano le righe di tutti
      gli altri.'
    attendibilita: documentato
  - id: curiosita_nomi
    sezione: curiosita
    testo: 'Fra il 1878 e il 1879 Cleve, dalla sola erbia, tirò fuori due elementi e li battezzò
      l''uno con il nome latino di Stoccolma e l''altro con quello mitico dell''estremo nord:
      olmio e tulio. È il momento in cui la nomenclatura chimica diventa una carta geografica
      della Scandinavia.'
    attendibilita: documentato
