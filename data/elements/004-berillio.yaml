numero_atomico: 4
simbolo: Be
nome: Berillio
nome_en: Beryllium
scoperta:
  anno: 1798
  anno_stimato: false
  scopritori:
  - louis-nicolas-vauquelin
  luogo: Parigi
  epoca: pneumatica
  isolamento_anno: 1828
  note_cronologia: 'Vauquelin individua nel 1798 una terra nuova nel berillo e nello
    smeraldo, su sollecitazione del mineralogista René Just Haüy, che aveva osservato
    l''identità cristallografica dei due minerali. Il metallo è isolato nel 1828,
    indipendentemente e quasi in contemporanea, da Friedrich Wöhler e Antoine Bussy, per
    riduzione del cloruro di berillio con il potassio. Campioni di berillio puro non
    furono disponibili prima del 1957.'
  controversia: 'Per oltre un secolo l''elemento ebbe due nomi. Gli editori degli Annales
    de chimie proposero glucine, poi glucinium, per il sapore dolce di alcuni suoi sali; il
    nome berillio si deve a Wöhler, che lo isolò e lo trasse dal minerale d''origine. La
    Francia continuò a usare glucinium mentre la Germania usava Beryllium, con la duplice
    conseguenza di un simbolo chimico incerto fra Gl e Be. La disputa fu chiusa solo nel
    1949, quando la IUPAC adottò berillio come nome standard.'
