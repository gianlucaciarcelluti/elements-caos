  note_cronologia: Scoperta indipendente e quasi simultanea di Georges Urbain a Parigi, Carl
    Auer von Welsbach a Vienna e Charles James nel New Hampshire, tutti nel 1907. James rinunciò
    a pubblicare; la Commissione internazionale per i pesi atomici assegnò la priorità a Urbain
    nel 1909, e la IUPAC fissò il nome lutetium solo nel 1949.
