numero_atomico: 91
simbolo: Pa
nome: Protoattinio
nome_en: Protactinium
scoperta:
  anno: 1913
  anno_stimato: false
  scopritori:
  - kasimir-fajans
  - oswald-helmuth-gohring
  luogo: Karlsruhe, Germania
  epoca: spettroscopia
  isolamento_anno: null
  note_cronologia: 'Scoperto due volte e con due nomi: nel 1913 Fajans e Göhring individuarono
    l''isotopo a vita brevissima e lo chiamarono brevium; fra il 1917 e il 1918 Otto Hahn
    e Lise Meitner, e indipendentemente Frederick Soddy e John Cranston, trovarono l''isotopo
    a vita lunga. Il nome protoattinio, proposto da Meitner, fu confermato dalla IUPAC nel
    1949.'
  controversia: null
