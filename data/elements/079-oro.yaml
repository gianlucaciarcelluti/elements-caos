nome: Oro
nome_en: Gold
scoperta:
  anno: -40000
  anno_stimato: true
  scopritori: []
  luogo: null
  epoca: antichita
  isolamento_anno: null
  note_cronologia: 'Oro nativo raccolto, non estratto: la data convenzionale segna la più
    antica testimonianza d''uso, non un atto di scoperta.'
  controversia: 'La data di -40000 è convenzionale e va presa per quello che è. Deriva dalla
    segnalazione di piccole quantità di oro nativo in grotte spagnole frequentate nel Paleolitico
    superiore, un dato che circola largamente nella letteratura divulgativa ma che non poggia
    su un singolo ritrovamento datato con precisione e ampiamente discusso, come accade invece
    per il rame o per il ferro meteoritico. Ciò che è solidamente documentato è molto più
    tardo: la più antica oreficeria del mondo è quella della necropoli calcolitica di Varna,
    in Bulgaria, datata fra il 4600 e il 4200 a.C., con oltre tremila oggetti d''oro per circa
    sei chili complessivi. Fra la raccolta di pagliuzze e l''oreficeria di Varna corrono decine
    di millenni: la prima è un gesto, la seconda una tecnica.'
