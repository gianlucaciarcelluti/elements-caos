  note_cronologia: Demarçay sospettò l'esistenza dell'elemento già nel 1896, osservando righe
    che nei campioni di samario non tornavano, e riuscì a isolarlo solo nel 1901. È lo stesso
    spettroscopista che confermò ai coniugi Curie la presenza del radio nei loro campioni.
