  note_cronologia: 'Bergman riconosce nella pirolusite un metallo nuovo intorno al 1770 e
    non riesce a estrarlo. Nel 1774 Carl Wilhelm Scheele analizza il minerale e conferma la
    presenza dell''elemento senza isolarlo; nello stesso anno Johan Gottlieb Gahn ottiene il
    metallo riducendo il biossido con il carbone. Le fonti attribuiscono il riconoscimento a
    Bergman, Scheele e altri, e l''isolamento a Gahn.'
