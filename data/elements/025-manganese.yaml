contenuti:
  hook: Con questo minerale gli uomini hanno dipinto i bisonti sulle pareti delle grotte e
    schiarito il vetro dei Romani. Che dentro ci fosse un metallo lo si capì solo nel 1770.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il manganese è un metallo grigio, duro e fragile, che praticamente nessuno ha
      mai visto e senza il quale non esisterebbe l''acciaio. È il dodicesimo elemento per
      abbondanza nella crosta terrestre e il quarto metallo più usato al mondo, eppure non
      compare mai da solo in un oggetto: lavora sempre dentro qualcos''altro, disciolto in
      una lega o mascherato in un ossido, il che spiega perché la sua fama sia
      sproporzionatamente piccola rispetto alla sua importanza.'
    visual: Lingotto di manganese elettrolitico dalla superficie grigia e cristallina
    attendibilita: documentato
  - id: pitture_rupestri
    sezione: storia
    testo: 'Il biossido di manganese è uno dei più antichi materiali con cui l''uomo abbia
      lasciato un segno. I neri delle pitture rupestri sono in buona parte ossidi di
      manganese: nella grotta di Gargas, nei Pirenei, li si trova in opere datate fra i
      trentamila e i ventiquattromila anni fa, e lo stesso pigmento compare a Lascaux. I
      Neanderthal ne raccoglievano blocchi che si possono strofinare come pastelli, e sulla
      destinazione di quei blocchi gli archeologi discutono ancora.'
    visual: Blocchetto di biossido di manganese con le facce consumate dallo sfregamento
    attendibilita: documentato
  - id: sapone_dei_vetrai
    sezione: storia
    testo: 'Il secondo mestiere del minerale è l''opposto del primo: invece di annerire,
      schiarisce. Il ferro presente come impurità nella sabbia colora il vetro di un verde
      bottiglia che i vetrai egizi e romani volevano eliminare, e una piccola aggiunta di
      pirolusite lo neutralizza otticamente, restituendo un vetro incolore. La tecnica
      attraversò il Medioevo e arrivò intatta all''età moderna con un nome che dice tutto,
      sapone dei vetrai.'
    visual: Due coppe di vetro affiancate, una verdastra e una perfettamente incolore
    attendibilita: documentato
  - id: magnes
    sezione: storia
    testo: 'Il nome viene da un equivoco antico. La pirolusite somiglia alla magnetite ed era
      chiamata anch''essa magnes, pietra di Magnesia, dalla regione della Tessaglia da cui
      provenivano entrambi i minerali neri; per distinguerle si prese a dire che l''una era
      di sesso maschile e l''altra femminile. Da quella confusione linguistica sono usciti tre
      termini che oggi indicano cose diverse: magnete, magnesio e manganese, imparentati fra
      loro e non con ciò che nominano.'
    visual: Frammento di magnetite e frammento di pirolusite, indistinguibili a occhio nudo
    attendibilita: documentato
  - id: bergman_scheele_gahn
    sezione: storia
    testo: 'Che nella pirolusite ci fosse un metallo sconosciuto lo sostiene intorno al 1770
      Torbern Bergman, il professore di chimica di Uppsala, che però non riesce a cavarlo dal
      minerale. Nel 1774 Carl Wilhelm Scheele ne esamina un campione, vi ritrova calce, silice
      e ferro, e conferma che oltre a questi c''è un elemento nuovo, ma neanche lui riesce a
      separarlo. A risolvere il problema è nello stesso anno Johan Gottlieb Gahn, che scalda
      il biossido con il carbone in un crogiolo e ottiene un granulo di metallo impuro.'
    visual: Crogiolo aperto con il granulo metallico fra i residui di carbone
    attendibilita: documentato
  - id: divisione_del_lavoro
    sezione: storia
    testo: 'La vicenda mostra una divisione del lavoro che nel Settecento svedese si ripete
      spesso: c''è chi individua l''anomalia, chi la circoscrive analiticamente e chi trova
      l''espediente tecnico per portarla a compimento. Le fonti attribuiscono infatti il
      riconoscimento dell''elemento a Bergman, a Scheele e ad altri, e l''isolamento a Gahn,
      che era un metallurgista di mestiere e possedeva le fornaci giuste. Nessuno dei tre
      avrebbe concluso da solo.'
    visual: I tre laboratori svedesi collegati dalle lettere che si scambiavano
    attendibilita: documentato
  - id: caratteristiche_stati
    sezione: caratteristiche
    testo: 'Il manganese è il campione degli stati di ossidazione: la letteratura ne registra
      una gamma che va da meno tre a più sette, e i più comuni nella pratica sono più due,
      più quattro e più sette. A ciascuno corrisponde un colore diverso, il che rende i suoi
      composti un catalogo cromatico da manuale, dal rosa pallido dello ione più due al viola
      intenso del permanganato, uno degli ossidanti più usati nei laboratori didattici di
      tutto il mondo.'
    visual: Fila di provette con i composti di manganese ai diversi stati di ossidazione
    attendibilita: documentato
  - id: caratteristiche_fragile
    sezione: caratteristiche
    testo: 'Come metallo puro è quasi inservibile: durissimo e talmente fragile da
      polverizzarsi sotto il martello, si ossida in superficie all''aria e reagisce lentamente
      con l''acqua. Il paradosso della sua utilità sta qui, perché tutto ciò che di prezioso
      fa lo fa in soluzione solida dentro il ferro, dove pochi punti percentuali bastano a
      cambiare la natura meccanica della lega.'
    visual: Barra di manganese puro spezzata di netto con frattura vetrosa
    attendibilita: documentato
  - id: caratteristiche_fotosintesi
    sezione: caratteristiche
    testo: 'In biologia il manganese occupa un posto che nessun altro elemento potrebbe
      prendere. Al centro del fotosistema II delle piante c''è un complesso di quattro atomi
      di manganese e uno di calcio: è la struttura che rompe la molecola d''acqua e libera
      l''ossigeno, cioè il punto esatto in cui la fotosintesi produce l''aria che respiriamo.
      L''ossigeno dell''atmosfera esce, letteralmente, da un catalizzatore al manganese.'
    visual: Il complesso a quattro atomi di manganese del fotosistema II
    attendibilita: documentato
  - id: usi_acciaio
    sezione: usi
    testo: 'Fino al novanta per cento del manganese consumato nel mondo va all''industria
      dell''acciaio, e vi svolge due mestieri: durante l''affinazione cattura l''ossigeno e
      soprattutto lo zolfo, che altrimenti renderebbero il metallo fragile a caldo, e come
      elemento di lega ne aumenta tenacità e resistenza. Ne bastano dai sei ai nove
      chilogrammi per tonnellata di acciaio, e il servizio geologico degli Stati Uniti
      registra che per questo impiego non esiste sostituto soddisfacente.'
    visual: Colata di acciaio con l'aggiunta della ferrolega di manganese
    attendibilita: documentato
  - id: usi_batterie
    sezione: usi
    testo: 'Il secondo impiego per volume è dentro le pile che si comprano al supermercato:
      il biossido di manganese è il materiale catodico delle pile alcaline e delle vecchie
      zinco-carbone, dove riceve gli elettroni che lo zinco cede. La chimica delle batterie
      gliene sta assegnando un altro, perché i catodi al litio-nichel-manganese-cobalto delle
      auto elettriche sostituiscono con il manganese, abbondante ed economico, parte del
      cobalto che non lo è.'
    visual: Sezione di una pila alcalina con il catodo nero al biossido di manganese
    attendibilita: documentato
  - id: curiosita_noduli
    sezione: curiosita
    testo: 'Sui fondali oceanici, a migliaia di metri di profondità, il manganese si raccoglie
      da solo in concrezioni tondeggianti grandi come patate, i noduli polimetallici, che
      crescono di pochi millimetri per milione di anni attorno a un frammento di conchiglia o
      a un dente di squalo. Contengono anche nichel, rame e cobalto, e sono l''oggetto del
      dibattito sull''estrazione mineraria in mare profondo, dove il giacimento coincide con
      un ecosistema che nessuno ha ancora finito di descrivere.'
    visual: Noduli polimetallici sparsi sul sedimento abissale
    attendibilita: documentato
  - id: curiosita_hadfield
    sezione: curiosita
    testo: 'Nel 1882 Robert Hadfield brevettò un acciaio con circa il dodici per cento di
      manganese che si comporta in modo contrario all''intuizione: è relativamente tenero
      finché lo si lascia stare, ma quando viene percosso la superficie si incrudisce e
      diventa durissima, mentre il cuore resta tenace. Più lo si martella, più resiste. Da
      allora è il materiale delle mascelle dei frantoi, dei cingoli delle scavatrici e degli
      scambi ferroviari.'
    visual: Cuore di uno scambio ferroviario in acciaio al manganese lucidato dall'uso
    attendibilita: documentato
  pronuncia:
  - termine: Johan Gottlieb Gahn
    ipa: ˈjuːan ˈɡɔtliːb ɡɑːn
    nota: Alla svedese; la h finale non si pronuncia.
  - termine: Torbern Bergman
    ipa: ˈtuːrbæɳ ˈbærjman
    nota: Alla svedese.
