nome: Cadmio
nome_en: Cadmium
scoperta:
  anno: 1817
  anno_stimato: false
  scopritori:
  - karl-samuel-hermann
  - friedrich-stromeyer
  - johann-christoff-heinrich-roloff
  luogo: Gottinga
  epoca: elettrolisi
  isolamento_anno: 1817
  note_cronologia: 'Scoperta multipla e quasi simultanea: Roloff sospettò arsenico
    in una partita di ossido di zinco, Hermann la rianalizzò e vi trovò un metallo
    ignoto, Stromeyer arrivò allo stesso metallo per una via indipendente e lo isolò
    dandogli il nome che è rimasto.'
