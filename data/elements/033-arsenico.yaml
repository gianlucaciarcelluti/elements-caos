nome: Arsenico
nome_en: Arsenic
scoperta:
  anno: 300
  anno_stimato: true
  scopritori: []
  luogo: Panopoli, Egitto romano
  epoca: antichita
  isolamento_anno: 1250
  note_cronologia: 'La data convenzionale rimanda a Zosimo di Panopoli, alchimista greco-egizio
    attivo intorno al 300 d.C., che descrive l''arrostimento del realgar e la successiva
    riduzione ad arsenico grigio. L''isolamento che la tradizione chimica accredita come
    primo è però quello attribuito ad Alberto Magno intorno al 1250.'
  controversia: 'La cronologia dell''arsenico è confusa in molte esposizioni divulgative,
    che oscillano fra il 2500 a.C. e il XIII secolo senza dire di che cosa parlano. Le tre
    date corrispondono a tre cose diverse. I bronzi arsenicali del V-IV millennio a.C. non
    presuppongono alcuna conoscenza dell''arsenico come sostanza: il metallo veniva da minerali
    di rame che lo contenevano già. Zosimo di Panopoli, verso il 300 d.C., descrive un procedimento
    che dall''arrostimento del realgar porta all''arsenico grigio, ed è la prima ricetta
    riconoscibile; a Jabir ibn Hayyan si attribuisce un''operazione analoga prima dell''815.
    L''attribuzione ad Alberto Magno, intorno al 1250, resta quella corrente nei testi di
    storia della chimica ma è largamente convenzionale, e sconta il fatto che nessuna di
    queste operazioni era intesa come l''isolamento di un elemento, categoria che ancora
    non esisteva.'
