numero_atomico: 38
simbolo: Sr
nome: Stronzio
nome_en: Strontium
scoperta:
  anno: 1790
  anno_stimato: false
  scopritori:
  - adair-crawford
  luogo: Strontian
  epoca: pneumatica
  isolamento_anno: 1808
  note_cronologia: Adair Crawford e William Cruickshank riconoscono nel 1790 che il minerale
    di Strontian differisce dalla witherite e contiene una terra non ancora descritta; Thomas
    Charles Hope ne dà nel 1793 la caratterizzazione distesa e propone il nome strontites.
    La cronologia adotta il 1790, l'anno del riconoscimento, e non il 1808 dell'isolamento.
  controversia: 'La paternità dello stronzio si distribuisce fra almeno tre gruppi in tre
    anni. Crawford e Cruickshank, nel 1790, sono i primi a scrivere che il minerale di Strontian
    contiene una terra nuova, ma lo fanno con prudenza e senza dimostrarlo fino in fondo:
    Crawford parla di una specie di terra che non è stata finora sufficientemente esaminata.
    Nello stesso periodo, in Germania, Friedrich Gabriel Sulzer e Johann Friedrich Blumenbach
    esaminano lo stesso minerale, lo battezzano strontianite e concludono anch''essi che contiene
    una terra nuova. È Thomas Charles Hope, nel 1793, a chiudere la questione con l''analisi
    sistematica e con la prova della fiamma cremisi, e a proporre il nome. Il credito del
    1790 a Crawford registra la prima segnalazione, non la dimostrazione; e il nome di Cruickshank,
    che firmava con lui, tende a sparire dalle cronologie che riportano un solo scopritore
    per riga.'
