numero_atomico: 82
simbolo: Pb
nome: Piombo
nome_en: Lead
scoperta:
  anno: -7000
  anno_stimato: true
  scopritori: []
  luogo: null
  epoca: antichita
  isolamento_anno: null
  note_cronologia: 'La data convenzionale indica le prime tracce di fusione del piombo dalla
    galena, non un atto di scoperta: il piombo non ha scopritore.'
  controversia: Sui primi oggetti di piombo la letteratura divulgativa ripete un dato ormai
    superato. Le perline dal livello IX di Çatalhöyük, in Anatolia, sono state pubblicate
    come piombo fuso del VII millennio a.C. e da lì citate ovunque, ma le analisi successive
    indicano che si tratta di minerale sagomato, galena e cerussite, e non di metallo ottenuto
    per fusione. Il più antico oggetto sicuramente in piombo metallico quasi puro è quello
    della grotta di Ashalim, in Israele, datato alla fine del V millennio a.C. e ricondotto
    per composizione a minerali del Tauro anatolico. Resta comunque solido che la fusione
    del piombo su piccola scala inizi nel VII millennio a.C., ed è a quella fase che si riferisce
    la data usata qui.
