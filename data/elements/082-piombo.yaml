contenuti:
  hook: 'Il piombo è il metallo che l''umanità ha amato per tutte le ragioni sbagliate: facile
    da fondere, facile da lavorare, dolce al gusto. Ci sono voluti novemila anni per capire
    che avvelena.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il piombo non ha uno scopritore, e la data convenzionale del VII millennio a.C.
      indica il momento in cui compare la capacità di estrarlo dal minerale. È uno dei primissimi
      metalli fusi dall''uomo, e non per caso: si ricava con poco calore da un minerale vistoso,
      e una volta ottenuto si taglia quasi con l''unghia.'
    visual: Blocco di galena con la sua lucentezza metallica accanto a un pezzo di piombo
      fuso
    attendibilita: documentato
  - id: galena
    sezione: storia
    testo: 'Il minerale di partenza è la galena, solfuro di piombo, che si riconosce a colpo
      d''occhio per i suoi cristalli cubici grigi e brillanti. Per liberarne il metallo basta
      scaldarla in aria: molto meno del calore necessario al rame, e infinitamente meno di
      quello che chiederà il ferro. È per questo una delle prime operazioni metallurgiche
      riuscite, e le prime tracce risalgono al VII millennio a.C.'
    visual: Cristalli cubici di galena e un rudimentale focolare di fusione
    attendibilita: documentato
  - id: primi_oggetti
    sezione: storia
    testo: Sui primissimi reperti conviene essere precisi, perché la letteratura divulgativa
      li ripete in modo impreciso. Le perline dal sito neolitico di Çatalhöyük, in Anatolia,
      sono state a lungo citate come il più antico piombo fuso del mondo; analisi successive
      hanno però indicato che si tratta di minerale sagomato, galena e cerussite, non di metallo
      prodotto per fusione. Un oggetto in piombo metallico quasi puro proviene invece dalla
      grotta di Ashalim, in Israele, e risale alla fine del V millennio a.C.
    visual: Perline forate di minerale scuro accanto a un piccolo oggetto in piombo metallico
    attendibilita: documentato
  - id: argento
    sezione: storia
    testo: Il destino del piombo è legato a quello dell'argento più di quanto sembri. I due
      metalli si trovano quasi sempre insieme nello stesso minerale, e la tecnica che li separa,
      la coppellazione, produce argento e lascia piombo come sottoprodotto abbondante. Ogni
      volta che una civiltà antica ha voluto argento per monetare, ha ottenuto piombo in quantità
      molto maggiori, e ha dovuto inventarsi come impiegarlo.
    visual: Coppella incandescente con l'argento che affiora mentre il piombo si ossida
    attendibilita: documentato
  - id: roma
    sezione: storia
    testo: 'Roma porta la produzione di piombo a livelli che il mondo antico non aveva mai
      visto e che non si rivedranno per oltre un millennio. Il metallo diventa il materiale
      generico dell''ingegneria idraulica: tubature, cisterne, giunti, sigilli. La parola
      che ancora usiamo per il mestiere lo ricorda, perché plumbum è il piombo e da lì viene
      l''inglese plumber.'
    visual: Sezione di una tubatura romana in piombo con la saldatura longitudinale visibile
    attendibilita: documentato
  - id: tossicita_antica
    sezione: storia
    testo: Che il piombo facesse male era già noto agli antichi. Autori greci e romani descrivono
      i sintomi dell'intossicazione nei minatori e in chi lavorava il metallo, e Vitruvio
      raccomanda esplicitamente le tubature di terracotta al posto di quelle di piombo per
      ragioni di salubrità. Il riconoscimento sistematico del problema arriva però solo nel
      tardo Ottocento, con la medicina del lavoro.
    visual: Pagina del trattato di Vitruvio aperta sul passo relativo alle condutture
    attendibilita: documentato
  - id: caratteristiche_fisiche
    sezione: caratteristiche
    testo: 'Il piombo è tenero al punto da lasciarsi scalfire con l''unghia, con una durezza
      Mohs di appena 1,5, e fonde a 327 gradi, una temperatura che un normale fuoco di legna
      raggiunge senza difficoltà. La sua densità di 11,34 grammi per centimetro cubo lo rende
      più pesante del ferro e del rame: è il metallo comune che dà quella sensazione di peso
      sproporzionato rispetto al volume, e che per questo compare in zavorre, piombini da
      pesca e contrappesi.'
    visual: Piccolo cubo di piombo che affonda la mano che lo regge
    attendibilita: documentato
  - id: caratteristiche_chimica
    sezione: caratteristiche
    testo: 'In aria il piombo si copre rapidamente di uno strato di ossido opaco che protegge
      il metallo sottostante dall''ulteriore corrosione, e resiste bene all''acido solforico:
      è la ragione della sua fortuna nelle batterie. Nei composti compare quasi sempre nello
      stato di ossidazione +2 e molto più raramente +4, per un fenomeno chiamato effetto della
      coppia inerte.'
    visual: Lamina di piombo che passa dal grigio lucido all'opaco a contatto con l'aria
    attendibilita: documentato
  - id: caratteristiche_tossicita
    sezione: caratteristiche
    testo: 'La tossicità del piombo non dipende dalla dose isolata ma dall''accumulo: il metallo
      si deposita nelle ossa e nei tessuti molli e ci resta per anni, interferendo con i sistemi
      enzimatici e con lo sviluppo del sistema nervoso. Non esiste una soglia sotto la quale
      sia sicuro, ed è particolarmente dannoso nei bambini, in cui deficit cognitivi permanenti
      compaiono a concentrazioni molto basse.'
    visual: Schema di un osso lungo con l'accumulo di piombo evidenziato nella matrice ossea
    attendibilita: documentato
  - id: usi_batterie
    sezione: usi
    testo: 'L''uso di gran lunga dominante oggi è la batteria al piombo-acido, inventata nel
      1859 e ancora insostituita per l''avviamento dei motori a combustione e per gli accumuli
      stazionari: è pesante ed economica, esattamente ciò che serve quando il peso non è un
      problema. La produzione mondiale continua a crescere per questa ragione, e più della
      metà del piombo immesso sul mercato proviene oggi dal riciclo delle batterie esauste.'
    visual: Batteria d'auto sezionata con le piastre di piombo affiancate
    attendibilita: documentato
  - id: usi_schermatura
    sezione: usi
    testo: La densità del piombo lo rende efficace nello schermare le radiazioni ionizzanti,
      perché la probabilità che un raggio gamma venga assorbito cresce con la densità del
      materiale che attraversa. Da qui i grembiuli usati in radiologia, le pareti delle sale
      radiodiagnostiche e i contenitori per il materiale radioattivo.
    visual: Grembiule piombato appeso accanto a un tubo radiogeno
    attendibilita: documentato
  - id: usi_rimossi
    sezione: usi
    testo: Molti impieghi storici sono invece stati smantellati per legge. Il piombo tetraetile,
      aggiunto alla benzina dal 1923 come antidetonante, ha disperso il metallo nell'aria
      di tutto il pianeta per oltre mezzo secolo prima di essere eliminato a partire dagli
      anni Settanta; le vernici al piombo e le saldature per tubature di acqua potabile hanno
      seguito la stessa strada.
    visual: Vecchia pompa di benzina con la dicitura super e una vernice scrostata su un infisso
    attendibilita: documentato
  - id: curiosita_cosmesi
    sezione: curiosita
    testo: 'Il piombo è stato per secoli un cosmetico. La biacca, o cerussa, un carbonato
      basico di piombo di un bianco coprente e luminoso, si stendeva sul viso per ottenere
      il pallore di moda: la variante veneziana era la più costosa e la più ambita nell''Europa
      fra Cinquecento e Settecento. Provocava caduta dei capelli e dei denti, danni alla pelle
      e declino cognitivo, e più il danno avanzava più serviva biacca per coprirlo.'
    visual: Vasetto di biacca veneziana accanto a un ritratto di corte dal volto candido
    attendibilita: documentato
  - id: curiosita_sapa
    sezione: curiosita
    testo: 'I Romani addolcivano il vino e la frutta conservata con il sapa, uno sciroppo
      ottenuto facendo bollire a lungo il mosto. Le ricette arrivate fino a noi, da Catone
      a Columella a Plinio, prescrivono di cuocerlo in recipienti di piombo, e le riproduzioni
      di laboratorio mostrano che così il metallo passa nello sciroppo in quantità consistenti:
      l''acido dell''uva lo attacca e forma acetato, che per giunta è dolce.'
    visual: Recipiente di piombo sul fuoco con il mosto che si riduce a sciroppo
    attendibilita: documentato
  - id: curiosita_roma_declino
    sezione: curiosita
    testo: 'Da qui nasce la tesi, in circolazione dall''Ottocento, che l''avvelenamento da
      piombo abbia causato il declino dell''Impero romano. Gli studi recenti la ridimensionano
      parecchio: il vasellame di piombo compare di rado negli scavi domestici, e le analisi
      degli scheletri non mostrano l''intossicazione diffusa e trasversale alle classi sociali
      che la tesi richiederebbe. Che i Romani si avvelenassero un po'' è fuori discussione;
      che sia stato quello a far cadere l''impero è tutt''altra affermazione.'
    visual: Analisi di laboratorio su resti ossei accanto a un profilo di scavo domestico
    attendibilita: discusso
  pronuncia: []
contenuti_estesi:
  hook: 'Il piombo è l''ultimo elemento stabile della tavola: dopo di lui ogni nucleo
    decade, e tre delle grandi catene radioattive finiscono proprio dentro un suo
    isotopo. L''umanità lo ha scelto per la ragione opposta — perché è cedevole, fusibile,
    docile — e ci ha costruito tubature, monete, cosmetici e benzina. Ci sono voluti
    novemila anni e un geochimico che voleva datare la Terra per accorgersi che nel
    frattempo ne avevamo sparso addosso al pianeta uno strato misurabile.'
  beats:
  - id: contesto-ultimo-stabile
    sezione: contesto
    testo: 'Il piombo occupa un posto singolare nella tavola periodica: è l''elemento
      con il numero atomico più alto fra quelli stabili. Dopo il piombo, ogni nucleo
      è radioattivo. Questa posizione di confine non è un dettaglio da manuale, perché
      tre delle grandi catene di decadimento della materia pesante finiscono dentro
      un isotopo del piombo: la serie dell''uranio termina in piombo-206, quella dell''attinio
      in piombo-207, quella del torio in piombo-208. L''uranio e il torio che si trovano
      nelle rocce si stanno trasformando lentamente in piombo mentre leggete questa
      frase. Il metallo più terreno che l''umanità abbia maneggiato è, dal punto di
      vista nucleare, il punto in cui la materia pesante smette di disfarsi.'
    attendibilita: documentato
  - id: contesto-doppiamente-magico
    sezione: contesto
    testo: 'Il piombo-208, che da solo è poco più della metà del piombo naturale,
      è il nuclide stabile più pesante che si conosca, e c''è una ragione di struttura.
      I suoi ottantadue protoni e i suoi centoventisei neutroni corrispondono entrambi
      a gusci nucleari chiusi: in gergo è un nucleo «doppiamente magico», la configurazione
      più stabile che la fisica nucleare conosca, l''equivalente per il nucleo di
      ciò che i gas nobili sono per gli elettroni. È il motivo per cui le catene di
      decadimento si fermano lì e non proseguono. Il piombo è pesante, molle e sgraziato,
      e nondimeno è uno dei punti di quiete della materia: tutto quello che sta più
      in là, prima o poi, cade verso di lui.'
    attendibilita: documentato
  - id: contesto-abbondanza
    sezione: contesto
    testo: 'Per un metallo così pesante, il piombo è sorprendentemente comune nella
      crosta terrestre: quattordici parti per milione, il trentaseiesimo elemento
      per abbondanza. La ragione è che i suoi minerali sono leggeri, e nel corso della
      storia della Terra sono rimasti in superficie invece di sprofondare verso l''interno
      con il resto della materia densa. Il minerale principale è la galena, solfuro
      di piombo, che si accompagna quasi sempre ai minerali di zinco; gli altri sono
      suoi derivati, come l''anglesite, che è galena ossidata, e la cerussite, che
      è galena decomposta. Il piombo, insomma, l''umanità se l''è trovato a portata
      di mano, in un minerale che si riconosce a occhio.'
    attendibilita: documentato
  - id: contesto-galena
    sezione: contesto
    testo: 'La galena è uno di quei minerali che sembrano fatti apposta per farsi
      notare. Cristallizza nel sistema cubico e si presenta in cubi e ottaedri dagli
      spigoli netti, di un grigio piombo argenteo con lucentezza metallica sulle superfici
      di sfaldatura; si rompe seguendo piani perpendicolari, così che un frammento
      colpito produce altri cubi più piccoli. È fra i solfuri più abbondanti e diffusi
      della crosta, spesso in compagnia di blenda, calcite e fluorite. Un minerale
      pesante, geometrico e lucente in mezzo alla roccia opaca: non serviva una teoria
      mineraria per capire che valeva la pena raccoglierlo.'
    attendibilita: documentato
  - id: contesto-galena-semiconduttore
    sezione: contesto
    testo: 'C''è un capitolo della galena che appartiene alla storia dell''elettronica
      più che a quella della metallurgia. Il solfuro di piombo è un semiconduttore
      naturale, con un intervallo di banda di circa quattro decimi di elettronvolt,
      e questa proprietà fu sfruttata agli albori della radio: un cristallo di galena
      toccato da un filo metallico appuntito, chiamato baffo di gatto, funziona come
      diodo a contatto puntuale e raddrizza la corrente alternata, rendendo udibile
      il segnale. Le prime radio a cristallo non avevano bisogno di alimentazione:
      bastava l''antenna, un pezzo di minerale e la pazienza di cercare a mano il
      punto giusto dove appoggiare il filo.'
    attendibilita: documentato
  - id: contesto-superconduttore
    sezione: contesto
    testo: 'A temperatura ambiente il piombo è un conduttore mediocre: la sua resistività
      è quasi un ordine di grandezza più alta di quella del rame, il che lo esclude
      da qualunque impiego elettrico serio. Ma raffreddandolo abbastanza cambia natura
      e diventa superconduttore, cioè perde del tutto la resistenza. La soglia è 7,19
      kelvin, poco sopra lo zero assoluto, e nonostante sia un valore bassissimo in
      termini assoluti si tratta della temperatura critica più alta fra i superconduttori
      del cosiddetto tipo I, nonché della terza più alta fra tutti gli elementi che
      diventano superconduttori. È l''ennesima doppiezza di questo elemento: mediocre
      nella condizione in cui lo si userebbe, primatista in una che sulla Terra non
      esiste in natura e che bisogna costruirsi in laboratorio.'
    attendibilita: documentato
  - id: contesto-debolezza
    sezione: contesto
    testo: 'Il piombo è anche, fra i metalli d''uso comune, uno dei più deboli. La
      sua resistenza alla trazione è quindici volte inferiore a quella di un acciaio
      dolce, e il modulo di compressibilità racconta la stessa storia: quarantasei
      gigapascal contro i centosessanta dell''acciaio e i centotrentotto del rame.
      Per renderlo utilizzabile dove serva un minimo di tenuta lo si lega a piccole
      quantità di rame o di antimonio. Quanto alla densità, che è la sua qualità più
      celebre, conviene ridimensionare: tungsteno e oro arrivano a 19,3 grammi per
      centimetro cubo e l''osmio a 22,6, quasi il doppio del piombo. Il piombo non
      è il metallo più pesante, è il metallo pesante che costa poco.'
    attendibilita: documentato
  - id: contesto-perche-fu-il-primo
    sezione: contesto
    testo: 'Tre proprietà spiegano perché il piombo sia fra i primissimi metalli che
      l''uomo abbia saputo produrre. Fonde a trecentoventisette gradi, una temperatura
      che un fuoco di legna ben tirato raggiunge senza artifici, mentre il rame ne
      chiede quasi il triplo e il ferro molto di più. È tenero: durezza 1,5 nella
      scala di Mohs, si scalfisce con l''unghia, si martella a freddo, si taglia.
      Ed è denso, undici grammi e mezzo per centimetro cubo, più del ferro e del rame,
      tanto che un oggetto di piombo sorprende sempre la mano che lo solleva. Facile
      da ottenere, facile da lavorare, inconfondibile al tatto: il piombo era il metallo
      della minima resistenza.'
    attendibilita: documentato
  - id: contesto-coppia-inerte
    sezione: contesto
    testo: 'Il piombo sta nel gruppo del carbonio, ma non si comporta come i suoi
      parenti. Carbonio e silicio costruiscono reticoli in cui ogni atomo tiene quattro
      legami; il piombo, che pure ha quattro elettroni esterni, ne usa abitualmente
      due e tiene gli altri due per sé. Il fenomeno si chiama effetto della coppia
      inerte ed è un effetto relativistico: negli atomi pesanti gli elettroni più
      interni viaggiano così veloci che l''orbitale s si contrae e i suoi due elettroni
      diventano riluttanti a impegnarsi. Per questo il piombo nei composti è quasi
      sempre bivalente, mentre lo stato tetravalente è raro e instabile. È anche la
      ragione per cui, invece di un reticolo rigido come quello del diamante, il piombo
      adotta una struttura cubica a facce centrate, tenuta insieme dai soli elettroni
      p: la sua chimica e la sua cedevolezza hanno la stessa causa.'
    attendibilita: documentato
  - id: vicenda-nessuno-scopritore
    sezione: vicenda
    testo: 'Il piombo non ha uno scopritore, e per novemila anni non ha avuto nemmeno
      un accusatore credibile. Che facesse male si sapeva: autori greci e romani descrivono
      i sintomi nei minatori, e il riconoscimento sistematico arriva con la medicina
      del lavoro di fine Ottocento. Ma sapere che un veleno avvelena chi lo maneggia
      è un''altra cosa dal sapere quanto ce n''è nell''aria che respirano tutti. Quella
      domanda non se l''era posta nessuno, perché misurare il piombo diffuso nell''ambiente
      era tecnicamente impossibile: gli strumenti erano sporchi di piombo quanto il
      mondo che avrebbero dovuto misurare. La vicenda umana di questo elemento comincia
      quindi tardissimo, e comincia per sbaglio, da un uomo che non stava cercando
      un veleno ma l''età della Terra.'
    attendibilita: documentato
  - id: vicenda-nomi-della-malattia
    sezione: vicenda
    testo: 'Prima che ci fosse una spiegazione c''erano i nomi, e i nomi dicono chi
      si ammalava. Saturnismo, dal pianeta che l''alchimia associava al piombo; colica
      dei pittori, perché i pittori macinavano biacca; colica del Devon, dalla contea
      inglese dove il sidro veniva prodotto con presse di piombo. La malattia si manifestava
      con dolori addominali, stitichezza, mal di testa, irritabilità, disturbi della
      memoria, infertilità, formicolii alle mani e ai piedi: un elenco così generico
      da potersi confondere con dieci altre condizioni. È la ragione per cui il piombo
      ha potuto avvelenare per millenni restando invisibile. Oggi una radiografia
      lo tradisce, perché deposita nelle ossa in crescita bande dense caratteristiche.'
    attendibilita: documentato
  - id: vicenda-come-avvelena
    sezione: vicenda
    testo: 'Il meccanismo con cui il piombo fa danno spiega perché sia sfuggito così
      a lungo. Il metallo assomiglia chimicamente al calcio e allo zinco abbastanza
      da prenderne il posto: si deposita nelle ossa, dove può restare per decenni
      come una riserva che si svuota lentamente nel sangue, e si intromette nei sistemi
      enzimatici che usano quei metalli, guastandoli senza distruggere nulla di visibile.
      Non c''è un organo che collassa, c''è un funzionamento che peggiora ovunque
      un po''. La terapia esiste, e consiste nel somministrare sostanze chelanti che
      legano il metallo e ne favoriscono l''eliminazione, ma non restituisce ciò che
      il sistema nervoso in sviluppo ha già perduto.'
    attendibilita: documentato
  - id: vicenda-quanto-pesa-oggi
    sezione: vicenda
    testo: 'Il conto attuale è più alto di quanto la parola «storia» lasci intendere.
      Nel 2016 l''avvelenamento da piombo veniva associato a circa cinquecentoquarantamila
      morti l''anno nel mondo, e si stima che sia responsabile di quasi il dieci per
      cento dei casi di disabilità intellettiva di causa altrimenti sconosciuta. I
      bambini sono i più vulnerabili per due ragioni che si sommano: assorbono dall''intestino
      una quota maggiore del piombo ingerito rispetto agli adulti, e hanno più occasioni
      di ingerirlo, soprattutto se mordono oggetti verniciati. Questo non è il passato
      del piombo: è la sua attualità, e riguarda in prevalenza i paesi dove le norme
      sono più deboli.'
    attendibilita: documentato
  - id: vicenda-patterson-formazione
    sezione: vicenda
    testo: 'Clair Cameron Patterson, nato in Iowa nel 1922, arriva alla spettrometria
      di massa dalla porta di servizio della storia: durante la guerra lavora come
      scienziato civile al Progetto Manhattan, prima a Chicago e poi a Oak Ridge,
      nel Tennessee, ed è lì che impara a contare gli atomi di un isotopo alla volta.
      Aveva sposato Laurie McCleary nel 1944, anche lei spettroscopista. Finita la
      guerra torna a Chicago per il dottorato con Harrison Brown, e Brown gli affida
      un problema che sembra elegante e circoscritto: misurare il piombo dentro i
      minerali per datare le rocce. L''idea è che l''uranio si trasformi in piombo
      a ritmo noto, e che perciò il rapporto fra i due dica da quanto tempo una roccia
      esiste.'
    attendibilita: documentato
  - id: vicenda-orologio
    sezione: vicenda
    testo: 'Il metodo si regge sulla proprietà che apre questa storia: siccome le
      catene di decadimento finiscono nel piombo, ogni roccia che contenga uranio
      accumula piombo radiogenico a un ritmo fissato dalla fisica e non modificabile
      da nulla. Contare quanto piombo si è formato rispetto all''uranio rimasto significa
      leggere un cronometro partito il giorno in cui la roccia si è solidificata.
      Con George Tilton, Patterson mette a punto una variante raffinata, la datazione
      piombo-piombo, che confronta fra loro gli isotopi del piombo invece di misurare
      l''uranio. Sulla carta è un lavoro di tesi. In pratica, per farlo funzionare
      bisogna misurare quantità di piombo così piccole che qualunque granello di polvere
      del laboratorio le sommerge.'
    attendibilita: documentato
  - id: vicenda-contaminazione
    sezione: vicenda
    testo: 'È a questo punto che l''esperimento si rompe, e la rottura vale più del
      risultato. I campioni di Patterson davano valori di piombo assurdi e irriproducibili.
      Cercando l''errore, lo trovò dappertutto: il piombo contaminava l''intero laboratorio,
      i reagenti, la vetreria, l''aria, e perfino i suoi stessi capelli. Non era un
      guasto dello strumento, era il mondo a essere sporco. Per chiunque altro sarebbe
      stata una seccatura tecnica; per Patterson divenne l''osservazione della vita,
      perché implicava una domanda che nessuno aveva formulato: se il piombo è ovunque,
      da dove viene, e c''è sempre stato?'
    attendibilita: documentato
  - id: vicenda-camera-bianca
    sezione: vicenda
    testo: 'Nel 1953 Patterson e Brown si trasferiscono al Caltech, dove a Patterson
      viene concesso di costruirsi il laboratorio da zero. La sua risposta alla contaminazione
      è radicale: sigilla ogni via d''ingresso dell''aria e degli altri contaminanti,
      lava con acidi ogni apparecchio, e arriva a distillare da sé tutti i reagenti
      che gli vengono spediti, perché quelli commerciali sono già sporchi in partenza.
      Quello che ne esce è, di fatto, una delle prime camere bianche da laboratorio
      della storia. Per misurare una quantità minuscola di piombo aveva dovuto inventare
      un pezzo di mondo in cui il piombo non ci fosse: è una costruzione che oggi
      sta alla base della chimica delle tracce, e nacque come rimedio a un fastidio.'
    attendibilita: documentato
  - id: vicenda-eta-della-terra
    sezione: vicenda
    testo: 'Nel laboratorio pulito il metodo funziona. Patterson analizza il meteorite
      di Canyon Diablo — materiale che risale alla formazione del sistema solare e
      non è stato rimaneggiato da nessuna geologia — e nel 1956 pubblica «Age of Meteorites
      and the Earth»: quattro miliardi e cinquecentocinquanta milioni di anni, con
      un''incertezza di settanta milioni. Prima di quel lavoro si riteneva che la
      Terra avesse circa tre miliardi e trecento milioni di anni. La cifra di Patterson
      non è mai stata sostanzialmente smentita: è ancora quella che si insegna. Aveva
      trentaquattro anni, e la voce che lo ricorda annota che divise generosamente
      il merito con i colleghi.'
    attendibilita: documentato
  - id: vicenda-carote-di-ghiaccio
    sezione: vicenda
    testo: 'Datata la Terra, Patterson torna alla domanda che gli era rimasta in sospeso:
      da dove viene tutto quel piombo. Per rispondere gli serve un archivio dell''aria
      del passato, e lo trova nei ghiacci. Analizza carote prelevate a Camp Century,
      in Groenlandia, nel 1964, e in Antartide nel 1965, dove ogni strato annuale
      ha intrappolato la polvere dell''atmosfera del suo anno. Il risultato è una
      curva che non lascia margini interpretativi: le concentrazioni di piombo nell''aria
      cominciano a salire in modo costante e pericoloso poco dopo l''introduzione
      del piombo tetraetile nella benzina. Il contaminante che gli aveva rovinato
      la tesi veniva dai tubi di scappamento.'
    attendibilita: documentato
  - id: vicenda-1965
    sezione: vicenda
    testo: 'Nel 1965 pubblica «Contaminated and Natural Lead Environments of Man»,
      e da quel momento la sua carriera cambia natura. Il punto dell''articolo non
      è che il piombo sia velenoso, cosa nota da secoli, ma che i livelli considerati
      normali non siano affatto naturali: sono il prodotto recente dell''industria,
      e il confronto con l''ambiente preindustriale lo dimostra. Era una tesi scomoda
      per tutti, perché implicava che l''intera popolazione vivesse in una condizione
      di intossicazione lieve e permanente accettata come normale. Consapevole di
      ciò che aveva trovato, Patterson dedicò il resto della vita a fare togliere
      il piombo dall''ambiente.'
    attendibilita: documentato
  - id: impatto-coppellazione
    sezione: impatto
    testo: 'Per capire perché il mondo antico si sia ritrovato sommerso di piombo
      bisogna guardare all''argento. I due metalli stanno quasi sempre nello stesso
      minerale, e la tecnica che li separa, la coppellazione, consiste nel fondere
      il piombo argentifero in un recipiente poroso soffiandovi aria: il piombo si
      ossida e viene assorbito dalle pareti, l''argento resta a galleggiare puro.
      Ogni volta che una civiltà ha voluto argento per coniare moneta ha dovuto trattare
      enormi quantità di piombo, e se n''è ritrovato fra le mani molto più di quanto
      ne cercasse. Il piombo dell''antichità non è il prodotto di una domanda: è il
      residuo di un''altra fame.'
    attendibilita: documentato
  - id: impatto-coppella
    sezione: impatto
    testo: 'La coppellazione è un procedimento più ingegnoso di quanto il nome lasci
      pensare, e il segreto sta nel recipiente. Il fondo del focolare veniva scavato
      a forma di casseruola e rivestito di un materiale poroso ricco di calcio, come
      conchiglie, calce o cenere d''ossa: doveva essere calcareo, perché con la silice
      dell''argilla il piombo forma un silicato vischioso che impedisce l''assorbimento
      dell''ossido. Per le operazioni piccole si usavano coppelle a forma di cono
      tronco rovesciato fatte di cenere d''ossa; secondo Georg Agricola il materiale
      migliore veniva dalle corna di cervo bruciate, benché anche le lische di pesce
      funzionassero. Metallurgia di precisione, con gli strumenti di una cucina.'
    attendibilita: documentato
  - id: impatto-laurio
    sezione: impatto
    testo: 'Il caso più celebre è il Laurio, in Attica, sfruttato sistematicamente
      dal VI secolo a.C. Intorno al 483 a.C. vi si scopre un filone d''argento ricchissimo,
      e Temistocle convince gli ateniesi a non distribuirsi il ricavato ma a investirlo
      in duecento triremi. Su quella flotta si fonda la potenza navale di Atene, e
      con essa l''esito delle guerre persiane. Le miniere erano proprietà dello Stato,
      date in concessione dietro un canone fisso e una percentuale, e il lavoro era
      esclusivamente schiavile. Vale la pena tenere insieme le due cose: la flotta
      che difese la città più orgogliosa della sua libertà fu pagata con argento estratto
      da uomini che libertà non ne avevano, in gallerie sature di polvere di piombo.'
    attendibilita: documentato
  - id: impatto-roma-idraulica
    sezione: impatto
    testo: 'Roma porta la produzione a una scala che il mondo antico non aveva mai
      visto e che non si rivedrà per più di un millennio. Il piombo diventa il materiale
      generico dell''ingegneria idraulica: tubi, cisterne, giunti, sigilli, grappe
      per tenere insieme le pietre. Si lavora a freddo, si salda con se stesso, si
      ripara battendolo, e resiste alla corrosione perché si riveste di un ossido
      che protegge il metallo sotto. La parola che ancora usiamo per il mestiere ne
      conserva la memoria: plumbum è il piombo, e da lì viene l''inglese plumber.
      In Britannia le miniere di piombo furono fra le prime risorse che i Romani misero
      a reddito dopo la conquista.'
    attendibilita: documentato
  - id: impatto-acque-dure
    sezione: impatto
    testo: 'Non tutte le acque sciolgono il piombo allo stesso modo, e il fenomeno
      ha un nome tecnico: plumbosolvenza. Un''acqua plumbosolvente aggredisce i tubi
      di piombo, le condotte di allacciamento e perfino il piombo delle saldature
      usate per unire il rame. Il rimedio, oggi, è governare la chimica dell''acqua
      invece del metallo: portare il pH intorno a 7,5 con calce o soda, oppure aggiungere
      fosfati all''impianto di trattamento perché depositino un rivestimento protettivo
      dentro il tubo. Che funzioni è dimostrato, perché dove lo si è fatto la piombemia
      della popolazione è scesa. È il motivo per cui un tubo di piombo vecchio può
      restare innocuo per decenni e diventare pericoloso il giorno in cui cambia l''acqua
      che ci scorre dentro.'
    attendibilita: documentato
  - id: impatto-sapa
    sezione: impatto
    testo: 'Il veleno più efficiente entrava dalla dispensa. I Romani addolcivano
      vino e conserve con la sapa, uno sciroppo ottenuto facendo bollire a lungo il
      mosto, e le ricette che ci sono arrivate prescrivono di cuocerlo in recipienti
      di piombo. L''acido dell''uva attacca il metallo e forma acetato di piombo,
      che ha una proprietà perversa: è dolce. Tanto dolce che in epoche successive
      verrà venduto come dolcificante col nome di zucchero di Saturno. Quanto piombo
      finisse davvero nello sciroppo lo ha misurato una riproduzione storicamente
      fedele realizzata nel 2009 in recipienti rivestiti di piombo: ventinovemila
      parti per miliardo, cioè duemilanovecento volte il limite statunitense odierno
      per l''acqua potabile. Un recipiente di piombo non rendeva soltanto tossico
      lo sciroppo: lo rendeva più buono, il che è il modo migliore per garantire che
      una cattiva abitudine sopravviva a lungo.'
    attendibilita: documentato
  - id: impatto-britannia
    sezione: impatto
    testo: 'L''estrazione mineraria fu una delle attività più redditizie della Britannia
      romana, e l''abbondanza di risorse dell''isola fu probabilmente una delle ragioni
      della conquista. Il piombo vi occupa un posto di riguardo: era essenziale al
      funzionamento dell''impero, impiegato nelle condutture degli acquedotti e nelle
      tubature, nel peltro, nelle bare, nelle grondaie delle ville, oltre a essere
      la fonte da cui si ricavava l''argento. Le miniere di Charterhouse, nel Somerset,
      erano le più importanti dell''isola, e cinquantadue lastre di piombo dei Mendip
      rivestono ancora la grande vasca delle terme di Bath, a pochi chilometri di
      distanza. Nel 49 d.C., sei anni dopo la conquista, le miniere dei Mendip, del
      Derbyshire, dello Shropshire, dello Yorkshire e del Galles lavoravano già a
      pieno regime. Conquistare una provincia per il suo sottosuolo non è un''invenzione
      dell''età moderna.'
    attendibilita: documentato
  - id: impatto-rio-tinto
    sezione: impatto
    testo: 'Il costo ambientale dell''estrazione si legge meglio in un fiume che in
      un archivio. Il Río Tinto, in Andalusia, scorre in un''area sfruttata da circa
      cinquemila anni per rame, argento, oro e altri minerali, e ha un''acidità estrema,
      con un pH intorno a due, e un colore rosso cupo dovuto al ferro disciolto. Il
      drenaggio acido che esce dalle miniere è un problema ambientale grave, perché
      un''acqua tanto acida scioglie i metalli pesanti e se li porta a valle. Va detto
      con onestà che non è chiaro quanta parte di quell''acidità sia naturale e quanta
      prodotta dall''attività estrattiva: il fiume era probabilmente già particolare
      prima che qualcuno vi scavasse.'
    attendibilita: discusso
  - id: impatto-caratteri-mobili
    sezione: impatto
    testo: 'Intorno al 1450 Gutenberg risolve il problema dei caratteri mobili con
      una lega di piombo, stagno e antimonio, e quella ricetta resterà lo standard
      della stampa per cinquecentocinquant''anni. La scelta è tutta pratica: la lega
      fonde a temperatura molto più bassa del bronzo, quindi si può colare in matrici
      metalliche riutilizzabili invece che in stampi di sabbia da distruggere ogni
      volta; l''antimonio la indurisce, e per giunta ha la proprietà rara di espandersi
      raffreddando, riempiendo lo stampo fino agli spigoli e restituendo lettere nitide.
      La diffusione della parola scritta in Europa poggia per mezzo millennio su un
      metallo tenero che si lascia colare sul fuoco di casa.'
    attendibilita: documentato
  - id: impatto-edilizia
    sezione: impatto
    testo: 'In edilizia il piombo è il metallo dei punti in cui l''acqua entrerebbe.
      Lastre di piombo si usano ancora oggi per coperture, rivestimenti, scossaline,
      grondaie, giunti e parapetti di tetto: si tagliano con un coltello, si modellano
      a mano sul colmo di un muro storto e restano dove le hai messe per un secolo.
      Lo stesso metallo fa da guaina protettiva ai cavi sottomarini, regge le armature
      interne di statue e sculture, e aggiunto all''ottone e al bronzo li rende più
      facili da lavorare alla macchina utensile e più scorrevoli. Sono impieghi silenziosi,
      in cui il piombo serve perché cede: è l''unica virtù che gli abbiamo sempre
      chiesto.'
    attendibilita: documentato
  - id: impatto-vetrate
    sezione: impatto
    testo: 'Nelle cattedrali il piombo fa il lavoro che nessuno guarda. I pezzi di
      vetro colorato di una vetrata sono tenuti insieme da profilati di piombo a sezione
      di H, le cosiddette bacchette o came, che si piegano a mano seguendo il disegno
      e si saldano agli incroci. Serve un metallo abbastanza molle da assecondare
      una curva senza spezzarsi e abbastanza stabile da reggere secoli di intemperie,
      e il piombo è l''unico candidato ovvio. Le linee scure che percorrono una vetrata
      gotica, e che i pittori hanno imparato a sfruttare come contorno del disegno,
      sono la struttura portante: il vincolo tecnico diventato tratto grafico.'
    attendibilita: documentato
  - id: impatto-cristallo
    sezione: impatto
    testo: 'Aggiunto al vetro, l''ossido di piombo produce il cristallo. I numeri
      spiegano l''effetto: un vetro comune ha indice di rifrazione 1,5, con il piombo
      si sale fra 1,7 e 1,8, e cresce la dispersione, cioè la capacità di separare
      la luce nelle sue lunghezze d''onda come fa un prisma. Da qui i bagliori colorati
      che un bicchiere ordinario non sa produrre, e che la molatura a faccette sfrutta
      facendo riflettere e trasmettere la luce da ogni faccia. Il piombo aumenta anche
      la densità, da 2,4 grammi per centimetro cubo a circa 3,1, e abbassa temperatura
      di lavorazione e viscosità, rendendo il vetro più docile a caldo. Lo stesso
      metallo che le tubature portavano di nascosto nelle case, qui arrivava in tavola
      per bellezza, e per secoli nessuno ha visto una contraddizione.'
    attendibilita: documentato
  - id: impatto-biacca
    sezione: impatto
    testo: 'La biacca, carbonato basico di piombo, è stata per due millenni il bianco
      della pittura europea. Il procedimento olandese consisteva nel disporre sottili
      spirali di piombo sopra vasi contenenti aceto, impilarli e coprirli con sterco
      in decomposizione e scorza esausta da conceria: non per il calore, ma perché
      fornissero anidride carbonica. Dopo sei-quattordici settimane il piombo grigio-azzurro
      si era corroso in biacca bianca, che si raschiava via e si pestava in polvere.
      Nessun altro bianco disponibile aveva la stessa opacità e lo stesso corpo, e
      i pittori la usavano non solo per le zone chiare ma come base di quasi ogni
      impasto. La stessa sostanza, resa più fine, finiva sui volti come cosmetico:
      una ricetta del 1688 la descrive come una mistura di acqua, aceto e piombo.
      Sulla tela ha attraversato i secoli; sulla pelle provocava danni cutanei, caduta
      dei capelli e, in certi casi, la morte.'
    attendibilita: documentato
  - id: impatto-ceramica
    sezione: impatto
    testo: 'Sulla ceramica il piombo ha fatto il lavoro della lucentezza. Una vetrina
      al piombo fonde a temperatura relativamente bassa, si stende uniformemente e
      dà una superficie brillante e trasparente che esalta i colori sotto: per secoli
      è stata la soluzione ovvia per rendere impermeabile e attraente un vaso di terracotta,
      dalle invetriate romane alle maioliche. Il difetto sta dove uno meno se lo aspetta,
      cioè in cucina: se la cottura non è stata adeguata, un contenuto acido come
      aceto, agrumi o vino può ridisciogliere il piombo dalla vetrina e portarlo nel
      cibo. È un rischio che riguarda ancora oggi certe ceramiche artigianali non
      certificate.'
    attendibilita: documentato
  - id: impatto-saldature
    sezione: impatto
    testo: 'Le leghe saldanti sono un altro impiego in cui il piombo è stato per lungo
      tempo insostituibile. Unito allo stagno abbassa il punto di fusione sotto quello
      dei metalli da unire, scorre bene nel giunto e solidifica in fretta: è il principio
      con cui si sono chiuse per decenni le scatolette di latta e si sono montati
      i circuiti elettronici. Nel caso delle conserve alimentari il difetto era evidente
      una volta che si pensava a guardarlo, perché la saldatura stava a contatto diretto
      con il cibo; nell''elettronica il problema si è posto più tardi, come questione
      di smaltimento dei rifiuti. Entrambi gli usi sono stati progressivamente eliminati
      a favore di leghe senza piombo.'
    attendibilita: documentato
  - id: impatto-vernici
    sezione: impatto
    testo: 'Le vernici al piombo sono state a lungo le migliori sul mercato, e non
      per caso: coprivano con poche mani, resistevano all''umidità, non ingiallivano
      e duravano decenni su legno e ferro. Erano il prodotto che si consigliava per
      gli infissi e per le stanze dei bambini, proprio perché lavabili. Il guaio emerge
      quando la vernice invecchia e si sfoglia: le scaglie sono alla portata di un
      bambino piccolo e la vernice al piombo ha sapore dolce, il che elimina l''unico
      deterrente naturale e anzi invoglia a portarla alla bocca. Che fosse un veleno
      era noto per tempo: già nel 1886 le leggi sanitarie tedesche vietavano a donne
      e bambini di lavorare nelle fabbriche che trattavano vernici e zucchero di piombo,
      e nel 1921 la Società delle Nazioni avviò iniziative per metterle al bando.
      I divieti sono arrivati in tempi molto diversi da paese a paese, e intanto la
      vernice è rimasta sotto gli strati più recenti in un''enorme quantità di edifici
      vecchi.'
    attendibilita: documentato
  - id: impatto-batteria
    sezione: impatto
    testo: 'Nel 1859 il fisico francese Gaston Planté costruisce il primo accumulatore
      ricaricabile della storia, e lo fa con il piombo: due lastre immerse in acido
      solforico che si possono caricare e scaricare molte volte. Il principio regge
      perché il piombo resiste all''acido solforico invece di esserne divorato, e
      perché le due forme del metallo, spugna metallica e biossido, si trasformano
      l''una nell''altra in modo reversibile. È una invenzione che ha centosessantacinque
      anni e non è stata sostituita: la batteria che avvia il motore di quasi ogni
      automobile a combustione è ancora una batteria al piombo, pesante ed economica,
      esattamente ciò che serve quando il peso non è il problema.'
    attendibilita: documentato
  - id: impatto-proiettili
    sezione: impatto
    testo: 'La densità del piombo lo ha reso per secoli il materiale dei proiettili:
      a parità di volume porta più massa, quindi più energia e meno deriva, e la sua
      bassa temperatura di fusione permetteva di colare le palle in uno stampo accanto
      al fuoco, sul campo. Per i pallini da caccia si arrivò a un procedimento elegante:
      lasciar cadere il piombo fuso dall''alto di una torre, perché nella caduta la
      tensione superficiale gli desse forma sferica prima che si solidificasse in
      una vasca d''acqua. La stessa proprietà spiega i piombi da pesca e le zavorre:
      quando serve peso in poco spazio, il piombo è la soluzione che costa meno.'
    attendibilita: documentato
  - id: impatto-schermature
    sezione: impatto
    testo: 'L''ultimo grande impiego del piombo nasce nel Novecento e dipende ancora
      dalla sua densità, ma in un senso nuovo. Un raggio gamma o un raggio X viene
      assorbito tanto più facilmente quanto più sono numerosi e pesanti gli atomi
      che incontra, e il piombo, con ottantadue elettroni per atomo e undici grammi
      per centimetro cubo, è la barriera più economica disponibile. Da qui i grembiuli
      che si indossano dal dentista, le pareti delle sale di radiologia, i contenitori
      per il materiale radioattivo. C''è una simmetria che vale la pena notare: l''elemento
      in cui finiscono le catene di decadimento è anche quello che usiamo per ripararci
      dalla radioattività.'
    attendibilita: documentato
  - id: controversie-antidetonante
    sezione: controversie
    testo: 'Il 9 dicembre 1921 Thomas Midgley, chimico della General Motors, scopre
      che una piccola quantità di piombo tetraetile aggiunta alla benzina elimina
      la detonazione, il battito in testa che impediva di costruire motori a compressione
      più alta. Ci era arrivato dopo sei anni e circa trentatremila sostanze provate,
      e il piombo era il più efficace di tutte: bastava una parte su milletrecento.
      Che anche l''etanolo funzionasse era noto già nel 1921, ma il tetraetile fu
      preferito per ragioni commerciali, perché sull''etanolo, che nessuno poteva
      brevettare, si guadagnava pochissimo. Nel dicembre 1922 la American Chemical
      Society gli assegna la medaglia Nichols proprio per i composti antidetonanti.
      L''anno successivo Midgley si prende una lunga vacanza in Florida per curarsi
      da un avvelenamento da piombo, e scrive che i polmoni gli si sono rovinati e
      che gli serve aria fresca.'
    attendibilita: documentato
  - id: controversie-loony-gas
    sezione: controversie
    testo: 'La produzione industriale comincia nel 1924 e si rivela subito una strage.
      In una raffineria mal ventilata della Standard Oil in New Jersey, nei primi
      due mesi di attività, si contano diciassette casi di avvelenamento grave con
      allucinazioni e follia; cinque operai muoiono uno dopo l''altro e altri trentacinque
      restano devastati. I giornali la chiamano la fabbrica del gas della pazzia,
      «loony gas», e lo Stato del New Jersey ordina la chiusura dell''impianto di
      Bayway pochi giorni dopo. Non era un rischio ignoto: due anni prima esperti
      di salute pubblica, fra cui Alice Hamilton e Yandell Henderson, avevano scritto
      a Midgley e a Kettering avvertendoli del pericolo.'
    attendibilita: documentato
  - id: controversie-conferenza-stampa
    sezione: controversie
    testo: 'La risposta dell''industria è una scena che vale un trattato di comunicazione
      del rischio. Il 30 ottobre 1924 Midgley convoca una conferenza stampa, si versa
      il piombo tetraetile sulle mani, si porta la bottiglia sotto il naso e ne respira
      i vapori per sessanta secondi, poi dichiara di poterlo fare ogni giorno senza
      il minimo problema. Sapeva benissimo di mentire: si era gravemente ammalato
      per sovraesposizione pochi mesi prima. Un divieto viene effettivamente introdotto,
      ma è breve: nel 1929 viene revocato su raccomandazione del Surgeon General e
      di un gruppo di scienziati, dopo un''intensa attività di pressione delle aziende
      coinvolte.'
    attendibilita: documentato
  - id: controversie-kehoe
    sezione: controversie
    testo: 'Quando Patterson pubblica i suoi dati trova davanti a sé Robert Kehoe,
      scienziato autorevole e sostenitore dei produttori di piombo, che aveva stabilito
      la dottrina corrente: i livelli osservati nel sangue, nel suolo e nell''aria
      erano «normali», cioè vicini alla media, e siccome erano comuni si assumeva
      fossero innocui. Kehoe sosteneva, senza offrire prove, che gli esseri umani
      si fossero adattati all''aumento del piombo ambientale. La differenza fra i
      due si vede nei campioni che sceglievano: Kehoe misurava il piombo negli operai
      di una fabbrica di tetraetile dichiarati «non esposti» e in contadini messicani;
      Patterson lo misurava in mummie anteriori all''età del ferro e in tonni pescati
      in mare aperto.'
    attendibilita: documentato
  - id: controversie-argomento-evolutivo
    sezione: controversie
    testo: 'L''argomento con cui Patterson smonta l''idea dell''adattamento è di una
      semplicità disarmante, e viene dal suo mestiere di geocronologo: chi lavora
      con l''età della Terra ha il senso delle proporzioni temporali. Gli esseri umani
      hanno aumentato le concentrazioni di piombo in un''epoca recentissima, e qualche
      migliaio di anni di esposizione più alta è un istante sulla scala dei tempi
      darwiniana, incommensurabilmente più breve di quanto servirebbe a sviluppare
      un tratto adattativo. Non si può essersi adattati a qualcosa che è arrivato
      l''altro ieri. Il confronto con i corpi antichi non era un vezzo archeologico:
      era il gruppo di controllo che nessuno aveva pensato di cercare.'
    attendibilita: documentato
  - id: controversie-ritorsioni
    sezione: controversie
    testo: 'Le conseguenze per Patterson furono concrete. Diverse organizzazioni di
      ricerca formalmente neutrali, fra cui il servizio sanitario pubblico degli Stati
      Uniti, gli rifiutarono i contratti. Nel 1971 venne escluso da un gruppo di lavoro
      del National Research Council sulla contaminazione atmosferica da piombo, benché
      fosse ormai il massimo esperto vivente della materia: è la definizione stessa
      di conflitto d''interessi funzionante, un consesso sul piombo senza l''unico
      che l''aveva misurato davvero. Continuò comunque, e il piombo tetraetile cominciò
      a essere eliminato dalla benzina negli anni Settanta, come le vernici al piombo
      e le saldature nelle scatolette di conserva.'
    attendibilita: documentato
  - id: controversie-coda-lunga
    sezione: controversie
    testo: 'La coda della vicenda è lunga e poco edificante. Alla fine del 2014 la
      benzina al piombo era ancora legale in alcune aree di Algeria, Iraq, Yemen,
      Birmania, Corea del Nord e Afghanistan. Corea del Nord e Birmania compravano
      il tetraetile dalla Cina; Algeria, Iraq e Yemen da Innospec, l''ultima azienda
      al mondo legalmente autorizzata a produrlo. Nel 2011 diversi dirigenti di Innospec
      sono stati incriminati e incarcerati per aver corrotto compagnie petrolifere
      di Stato. È la fase finale di molte sostanze bandite: quando il mercato ricco
      si chiude, il prodotto non sparisce, si sposta dove i controlli sono più deboli
      e dove la corruzione costa meno della conformità.'
    attendibilita: documentato
  - id: controversie-il-conto
    sezione: controversie
    testo: Nel 2011 alcuni ricercatori hanno provato a mettere un numero sul danno
      complessivo del piombo tetraetile nel mondo, calcolandone l'impatto annuale
      in trecentoventidue milioni di punti di quoziente intellettivo perduti, oltre
      sessanta milioni di reati e il quattro per cento del prodotto interno lordo
      mondiale, intorno a duemilaquattrocento miliardi di dollari l'anno. Sono stime
      retroattive, con tutte le incertezze del caso, e vanno lette come un ordine
      di grandezza e non come una misura. Ma anche sbagliando di molto restano la
      valutazione più seria di che cosa costi davvero una soluzione tecnica presa
      senza guardare al di là del problema che risolve.
    attendibilita: discusso
  - id: controversie-elisabetta
    sezione: controversie
    testo: 'Un aneddoto che si ripete ovunque vuole che Elisabetta I d''Inghilterra
      si coprisse il volto di cerussa veneziana, e che il piombo l''abbia lentamente
      uccisa. Conviene maneggiarlo con cura. Alcune fonti dicono che possa averla
      usata, e la tesi dell''avvelenamento cronico come causa della morte è stata
      avanzata; ma studiose come Anna Riehl e Kate Maltby hanno obiettato che di prove
      storiche a sostegno ne esistono poche. È un caso esemplare di come funzionano
      le storie sul piombo: sono plausibili, moralmente soddisfacenti e facili da
      ricordare, il che le rende resistenti alla verifica. Che la cerussa avvelenasse
      chi la usava è documentato; che abbia ucciso quella particolare regina è un''altra
      affermazione.'
    attendibilita: discusso
  - id: controversie-declino-di-roma
    sezione: controversie
    testo: 'Sulla caduta di Roma il piombo ha una tesi tutta sua, in circolazione
      dall''Ottocento: l''aristocrazia si sarebbe avvelenata con vasellame, tubature
      e sapa, perdendo fertilità e lucidità fino a non saper più governare. Nel 1983
      il geochimico Jerome Nriagu la rilancia con uno studio sulla gotta saturnina
      fra gli aristocratici romani, malattia storicamente associata al piombo. La
      tesi resta discussa: i critici obiettano che i livelli di esposizione non erano
      abbastanza alti da produrre un danno di quella portata. La nota di questo vault
      sceglie la lettura prudente — che i Romani si avvelenassero un po'' è fuori
      discussione, che sia stato quello a far cadere l''impero è un''altra affermazione
      — e qui si espone il dibattito senza chiuderlo.'
    attendibilita: discusso
  - id: controversie-ghiacci-e-roma
    sezione: controversie
    testo: Negli anni Venti di questo secolo la questione si è spostata su un terreno
      nuovo, e ancora una volta grazie ai ghiacci. Le analisi delle carote artiche
      mostrano un aumento delle emissioni di piombo a partire dal 15 a.C. circa, in
      coincidenza con l'ascesa dell'Impero, e livelli elevati fino al 165 d.C., cioè
      per tutta la Pax Romana; la causa principale è l'attività mineraria e fusoria
      per l'estrazione dell'argento. Con modelli atmosferici si è stimato che la concentrazione
      media sull'Europa superasse un nanogrammo per metro cubo, con un innalzamento
      della piombemia infantile intorno a 2,4 microgrammi per decilitro, associabile
      a una perdita stimata fra due punti e mezzo e tre di quoziente intellettivo.
      È un effetto diffuso e modesto, molto diverso dall'avvelenamento di corte della
      tesi ottocentesca.
    attendibilita: discusso
  - id: controversie-ipotesi-criminalita
    sezione: controversie
    testo: 'Una controversia più recente riguarda il crimine. L''ipotesi piombo-crimine
      osserva che la curva dell''esposizione infantile al piombo, salita con la benzina
      e scesa dopo la sua eliminazione, anticipa di circa vent''anni la curva della
      criminalità violenta, e propone un nesso causale attraverso il danno neurologico
      allo sviluppo. È un''ipotesi seria e molto discussa: convincente nella coincidenza
      temporale, difficile da isolare da tutto ciò che nel frattempo è cambiato nelle
      società osservate. Vale la pena registrarla per quello che è, una spiegazione
      parziale e contesa, senza trattarla né come una certezza né come una stravaganza.'
    attendibilita: discusso
  - id: eredita-nessuna-soglia
    sezione: eredita
    testo: 'La posizione ufficiale sul piombo è cambiata nel 2012, quando i Centers
      for Disease Control degli Stati Uniti hanno preso atto di un corpo crescente
      di studi secondo cui piombemie inferiori a dieci microgrammi per decilitro danneggiano
      comunque i bambini, con effetti irreversibili. La conseguenza logica è stata
      drastica: poiché non è stato individuato alcun livello sicuro, non ha più senso
      fissare una soglia d''intervento. Al suo posto si pubblica un valore di riferimento
      statistico, che indica dove sta la coda alta della popolazione e che si spera
      cali negli anni. È un modo diverso di ragionare sul veleno: non più quanto se
      ne può tollerare, ma quanto se ne riesce a togliere.'
    attendibilita: documentato
  - id: eredita-aria-piu-pulita
    sezione: eredita
    testo: 'L''eliminazione del piombo dalla benzina è uno dei pochi casi in cui una
      misura ambientale ha prodotto un effetto grande, rapido e misurabile sulla popolazione
      intera. L''attivismo di Patterson fu determinante anche per un secondo fronte
      meno noto, le saldature al piombo delle scatolette per alimenti, che portavano
      il metallo direttamente nel cibo conservato. Qualunque cosa si pensi del suo
      carattere spigoloso, il risultato è quantificabile: nei paesi che hanno seguito
      quella strada la piombemia media è crollata nel giro di pochi anni. Poche carriere
      scientifiche hanno cambiato in modo così diretto il sangue di miliardi di persone.'
    attendibilita: documentato
  - id: eredita-flint
    sezione: eredita
    testo: 'Che il problema non sia archiviato lo ha ricordato Flint, in Michigan.
      Fra l''aprile del 2014 e il febbraio del 2019 un cambio di fonte di approvvigionamento
      senza un adeguato trattamento anticorrosivo ha fatto sì che l''acqua aggredisse
      le vecchie condotte di piombo della città, liberandolo nei rubinetti: fra seimila
      e dodicimila bambini esposti, uno stato di emergenza sanitaria, decine di cause
      civili e una lunga scia giudiziaria. Non era un incidente esotico ma il risultato
      prevedibile di una scelta di bilancio applicata a un''infrastruttura di piombo
      che nessuno aveva sostituito. Il dettaglio che riassume tutta la vicenda è il
      conto: non aggiungere l''inibitore di corrosione faceva risparmiare alla città
      circa centoquaranta dollari al giorno.'
    attendibilita: documentato
  - id: eredita-condotte
    sezione: eredita
    testo: 'L''eredità materiale del piombo è sotto l''asfalto delle città vecchie.
      Milioni di allacciamenti idrici in piombo, posati quando era il materiale ovvio
      per un tubo che dovesse piegarsi e durare, sono ancora in esercizio, e la loro
      sostituzione è un cantiere generazionale che procede per obblighi normativi
      successivi. È un problema di una noia amministrativa totale e di un''ampiezza
      enorme, l''opposto esatto di una scoperta scientifica: non c''è nulla da capire,
      solo da scavare, strada per strada, casa per casa, con soldi pubblici che nessuno
      vede.'
    attendibilita: documentato
  - id: eredita-fine-ufficiale
    sezione: eredita
    testo: 'La benzina al piombo ha una data di morte precisa. Nel luglio 2021 l''Algeria,
      ultimo produttore rimasto, ha cessato la produzione, e il 30 agosto 2021 il
      Programma delle Nazioni Unite per l''ambiente ha dichiarato la fine ufficiale
      del suo uso nelle automobili. Fra la scoperta di Midgley e quella dichiarazione
      sono passati novantanove anni e mezzo. Il piombo tetraetile non è però del tutto
      scomparso: resta in alcuni carburanti speciali, in particolare nella benzina
      avio usata dai piccoli aerei a pistoni. È il residuo tipico di queste storie:
      l''uso di massa finisce con un annuncio, l''uso di nicchia continua per anni
      senza che nessuno ne parli.'
    attendibilita: documentato
  - id: eredita-archivio-di-ghiaccio
    sezione: eredita
    testo: Lo strumento che ha permesso di dimostrare la contaminazione è diventato
      uno dei pilastri delle scienze del clima. Una calotta glaciale accumula neve
      che non fonde mai, strato su strato, e ogni strato conserva le polveri, i gas
      e gli aerosol dell'aria di quell'anno; perforandola e leggendo la carota a ritroso
      si ottiene un archivio continuo dell'atmosfera lungo centinaia di migliaia di
      anni. Patterson ci cercava il piombo, ma nello stesso ghiaccio si leggono l'anidride
      carbonica, il metano, le eruzioni vulcaniche e le temperature del passato. Buona
      parte di ciò che sappiamo del clima antico viene da una tecnica che un geochimico
      usò per dimostrare che l'aria di oggi è sporca.
    attendibilita: documentato
  - id: eredita-regola
    sezione: eredita
    testo: 'Sul fronte dell''acqua la risposta normativa ha un nome e una data: negli
      Stati Uniti la Lead and Copper Rule, che impone di monitorare il piombo e il
      rame ai rubinetti, di trattare l''acqua perché non aggredisca le tubature e
      di sostituire le condotte quando i valori superano una soglia d''azione. È una
      norma che ha cambiato molto e che è stata rivista più volte, anche sotto la
      spinta di quanto accaduto a Flint. La sua logica merita attenzione perché è
      l''opposto di quella antica: non si chiede se l''acqua sia buona, si chiede
      se l''impianto che la porta stia rilasciando qualcosa, e si misura là dove l''acqua
      viene bevuta.'
    attendibilita: documentato
  - id: eredita-quantita
    sezione: eredita
    testo: 'Per dare una misura alla parola «ancora»: nel 2022 la produzione mondiale
      annua di piombo era intorno ai dodici milioni di tonnellate, e circa due terzi
      venivano da materiale riciclato. Non è un metallo del passato, è un metallo
      che abbiamo imparato a tenere dentro un circuito chiuso. La differenza fra l''uso
      antico e quello contemporaneo non sta nella quantità, che è cresciuta, ma nel
      fatto che oggi il piombo dovrebbe restare dentro gli oggetti e dentro le fonderie
      invece di disperdersi nell''aria, nell''acqua e nel cibo. Tutta la storia recente
      di questo elemento è il passaggio da una dispersione a un contenimento.'
    attendibilita: documentato
  - id: eredita-riciclo
    sezione: eredita
    testo: 'Il paradosso del piombo contemporaneo è che la sua produzione non è calata:
      è cambiata di destinazione e di circuito. L''uso dominante è la batteria, e
      circa due terzi del piombo prodotto oggi viene dal riciclo, in gran parte dalle
      batterie esauste che rientrano in fonderia. Il piombo ottenuto per via secondaria
      è indistinguibile da quello estratto dal minerale, e la ragione del riciclo
      non è ambientale ma economica: il piombo vale abbastanza da rendere conveniente
      recuperarlo, ed è concentrato in un oggetto che si sa dove andare a prendere.
      Il metallo che abbiamo disperso nell''atmosfera per mezzo secolo è oggi quello
      che ricicliamo meglio.'
    attendibilita: documentato
  - id: eredita-schermo-nucleare
    sezione: eredita
    testo: 'C''è un settore in cui il piombo non è in ritirata e non lo sarà: la protezione
      dalle radiazioni. Ogni reparto di medicina nucleare, ogni acceleratore, ogni
      deposito di sorgenti radioattive ha bisogno di massa densa fra sé e ciò che
      emette, e a parità di spessore nessun materiale economico fa meglio del piombo.
      Qui la sua tossicità non è un problema, perché il metallo resta sigillato in
      una struttura e nessuno lo ingerisce, e la sua inerzia chimica diventa un pregio,
      perché uno schermo deve durare decenni senza degradarsi. Il metallo che abbiamo
      tolto dalla benzina e dalle tubature resta esattamente dov''è utile e innocuo:
      fermo, spesso e lontano dalla bocca.'
    attendibilita: documentato
  - id: eredita-cronometro
    sezione: eredita
    testo: 'Resta la prima delle due eredità, quella per cui Patterson aveva cominciato.
      La datazione uranio-piombo è ancora oggi il metodo di riferimento per le età
      più remote, quelle che nessun altro orologio riesce a leggere, e la cifra del
      1956 non è stata sostanzialmente scalfita da settant''anni di misure successive.
      Un pianeta minore, il 2511, porta il suo nome. C''è una simmetria in questa
      storia che non è stata cercata da nessuno: lo stesso elemento ha dato all''umanità
      il modo di sapere quanti anni ha la Terra e la prova di quanto in fretta la
      stesse sporcando, e le due cose sono state scoperte dalla stessa persona, con
      lo stesso strumento, per sbaglio.'
    attendibilita: documentato
  - id: eredita-chiusura
    sezione: eredita
    testo: 'Il piombo è un elemento che non ha mai ingannato nessuno per malizia:
      ha solo offerto esattamente quello che sembrava offrire. Era facile da fondere
      e l''abbiamo fuso, si piegava e l''abbiamo piegato, era dolce e l''abbiamo mangiato,
      era denso e ce ne siamo riparati. Ogni uso era ragionevole dato ciò che si sapeva,
      e quasi ogni uso è stato poi smantellato quando si è saputo di più. È la storia
      di un materiale che ha accompagnato la civiltà per novemila anni senza che nessuno
      lo scegliesse davvero, e che abbiamo cominciato a togliere di mezzo soltanto
      dopo aver imparato a misurarlo. Nella tavola periodica è il punto in cui la
      materia pesante smette di decadere; nella storia umana è il punto in cui abbiamo
      scoperto che comodo e innocuo non sono sinonimi.'
    attendibilita: documentato
