contenuti:
  hook: 'Il piombo è il metallo che l''umanità ha amato per tutte le ragioni sbagliate: facile
    da fondere, facile da lavorare, dolce al gusto. Ci sono voluti novemila anni per capire
    che avvelena.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il piombo non ha uno scopritore, e la data convenzionale del VII millennio a.C.
      indica il momento in cui compare la capacità di estrarlo dal minerale. È uno dei primissimi
      metalli fusi dall''uomo, e non per caso: si ricava con poco calore da un minerale vistoso,
      e una volta ottenuto si taglia quasi con l''unghia.'
    visual: Blocco di galena con la sua lucentezza metallica accanto a un pezzo di piombo
      fuso
    attendibilita: documentato
  - id: galena
    sezione: storia
    testo: 'Il minerale di partenza è la galena, solfuro di piombo, che si riconosce a colpo
      d''occhio per i suoi cristalli cubici grigi e brillanti. Per liberarne il metallo basta
      scaldarla in aria: molto meno del calore necessario al rame, e infinitamente meno di
      quello che chiederà il ferro. È per questo una delle prime operazioni metallurgiche
      riuscite, e le prime tracce risalgono al VII millennio a.C.'
    visual: Cristalli cubici di galena e un rudimentale focolare di fusione
    attendibilita: documentato
  - id: primi_oggetti
    sezione: storia
    testo: Sui primissimi reperti conviene essere precisi, perché la letteratura divulgativa
      li ripete in modo impreciso. Le perline dal sito neolitico di Çatalhöyük, in Anatolia,
      sono state a lungo citate come il più antico piombo fuso del mondo; analisi successive
      hanno però indicato che si tratta di minerale sagomato, galena e cerussite, non di metallo
      prodotto per fusione. Un oggetto in piombo metallico quasi puro proviene invece dalla
      grotta di Ashalim, in Israele, e risale alla fine del V millennio a.C.
    visual: Perline forate di minerale scuro accanto a un piccolo oggetto in piombo metallico
    attendibilita: documentato
  - id: argento
    sezione: storia
    testo: Il destino del piombo è legato a quello dell'argento più di quanto sembri. I due
      metalli si trovano quasi sempre insieme nello stesso minerale, e la tecnica che li separa,
      la coppellazione, produce argento e lascia piombo come sottoprodotto abbondante. Ogni
      volta che una civiltà antica ha voluto argento per monetare, ha ottenuto piombo in quantità
      molto maggiori, e ha dovuto inventarsi come impiegarlo.
    visual: Coppella incandescente con l'argento che affiora mentre il piombo si ossida
    attendibilita: documentato
  - id: roma
    sezione: storia
    testo: 'Roma porta la produzione di piombo a livelli che il mondo antico non aveva mai
      visto e che non si rivedranno per oltre un millennio. Il metallo diventa il materiale
      generico dell''ingegneria idraulica: tubature, cisterne, giunti, sigilli. La parola
      stessa che ancora usiamo per il mestiere lo ricorda, perché plumbum è il piombo e da
      lì viene l''idraulico inglese, plumber. La conduttura urbana di una città romana era,
      in gran parte, un oggetto di piombo.'
    visual: Sezione di una tubatura romana in piombo con la saldatura longitudinale visibile
    attendibilita: documentato
  - id: tossicita_antica
    sezione: storia
    testo: Che il piombo facesse male era già noto agli antichi. Autori greci e romani descrivono
      i sintomi dell'intossicazione nei minatori e in chi lavorava il metallo, e l'architetto
      Vitruvio raccomanda esplicitamente le tubature di terracotta al posto di quelle di piombo
      per ragioni di salubrità. Il riconoscimento sistematico del problema, però, arriva solo
      nel tardo Ottocento, quando la medicina del lavoro comincia a misurare invece di osservare.
    visual: Pagina del trattato di Vitruvio aperta sul passo relativo alle condutture
    attendibilita: documentato
  - id: caratteristiche_fisiche
    sezione: caratteristiche
    testo: 'Il piombo è tenero al punto da lasciarsi scalfire con l''unghia, con una durezza
      Mohs di appena 1,5, e fonde a 327 gradi, una temperatura che un normale fuoco di legna
      raggiunge senza difficoltà. La sua densità di 11,34 grammi per centimetro cubo lo rende
      più pesante del ferro e del rame: è il metallo comune che dà quella sensazione di peso
      sproporzionato rispetto al volume, e che per questo compare in zavorre, piombini da
      pesca e contrappesi.'
    visual: Piccolo cubo di piombo che affonda la mano che lo regge
    attendibilita: documentato
  - id: caratteristiche_chimica
    sezione: caratteristiche
    testo: 'In aria il piombo si copre rapidamente di uno strato di ossido opaco che protegge
      il metallo sottostante dall''ulteriore corrosione, e resiste bene all''acido solforico:
      è la ragione della sua fortuna nelle batterie. Nei composti compare quasi sempre nello
      stato di ossidazione +2 e molto più raramente +4, per un fenomeno chiamato effetto della
      coppia inerte.'
    visual: Lamina di piombo che passa dal grigio lucido all'opaco a contatto con l'aria
    attendibilita: documentato
  - id: caratteristiche_tossicita
    sezione: caratteristiche
    testo: 'La tossicità del piombo non dipende dalla dose isolata ma dall''accumulo: il metallo
      si deposita nelle ossa e nei tessuti molli e ci resta per anni, interferendo con i sistemi
      enzimatici e con lo sviluppo del sistema nervoso. Non esiste una soglia sotto la quale
      sia sicuro, ed è particolarmente dannoso nei bambini, in cui deficit cognitivi permanenti
      compaiono a concentrazioni molto basse.'
    visual: Schema di un osso lungo con l'accumulo di piombo evidenziato nella matrice ossea
    attendibilita: documentato
  - id: usi_batterie
    sezione: usi
    testo: 'L''uso di gran lunga dominante oggi è la batteria al piombo-acido, inventata nel
      1859 e ancora insostituita per l''avviamento dei motori a combustione e per gli accumuli
      stazionari: è pesante ed economica, esattamente ciò che serve quando il peso non è un
      problema. La produzione mondiale continua a crescere per questa ragione, e più della
      metà del piombo immesso sul mercato proviene oggi dal riciclo delle batterie esauste.'
    visual: Batteria d'auto sezionata con le piastre di piombo affiancate
    attendibilita: documentato
  - id: usi_schermatura
    sezione: usi
    testo: La densità del piombo lo rende efficace nello schermare le radiazioni ionizzanti,
      perché la probabilità che un raggio gamma venga assorbito cresce con la densità del
      materiale che attraversa. Da qui i grembiuli usati in radiologia, le pareti delle sale
      radiodiagnostiche e i contenitori per il materiale radioattivo.
    visual: Grembiule piombato appeso accanto a un tubo radiogeno
    attendibilita: documentato
  - id: usi_rimossi
    sezione: usi
    testo: Molti impieghi storici sono invece stati smantellati per legge. Il piombo tetraetile,
      aggiunto alla benzina dal 1923 per eliminare la detonazione nei motori, ha disperso
      il metallo nell'aria di tutto il pianeta per oltre mezzo secolo prima di essere eliminato
      progressivamente a partire dagli anni Settanta; le vernici al piombo e le saldature
      per tubature di acqua potabile hanno seguito la stessa strada.
    visual: Vecchia pompa di benzina con la dicitura super e una vernice scrostata su un infisso
    attendibilita: documentato
  - id: curiosita_cosmesi
    sezione: curiosita
    testo: 'Il piombo è stato per secoli un cosmetico. La biacca, o cerussa, un carbonato
      basico di piombo di un bianco coprente e luminoso, si stendeva sul viso per ottenere
      il pallore di moda: la variante veneziana era la più costosa e la più ambita nell''Europa
      fra Cinquecento e Settecento. Provocava caduta dei capelli e dei denti, danni alla pelle
      e declino cognitivo, e più il danno avanzava più serviva biacca per coprirlo.'
    visual: Vasetto di biacca veneziana accanto a un ritratto di corte dal volto candido
    attendibilita: documentato
  - id: curiosita_roma_declino
    sezione: curiosita
    testo: 'La tesi secondo cui l''avvelenamento da piombo avrebbe causato il declino dell''Impero
      romano circola dall''Ottocento e va presa con cautela. I Romani effettivamente addolcivano
      il vino con il sapa, uno sciroppo d''uva cotto in recipienti di piombo che ne assorbiva
      quantità notevoli. Gli studi recenti, però, ridimensionano molto lo scenario: il vasellame
      di piombo è raro negli scavi domestici e le analisi degli scheletri non mostrano l''intossicazione
      diffusa che la tesi richiederebbe.'
    visual: Recipiente per la cottura del mosto accanto a un'analisi di laboratorio su resti
      ossei
    attendibilita: tradizionale
  pronuncia: []
composti_principali:
- nome: Galena
  formula: PbS
  usi:
  - minerale principale del piombo
  - rilevatori a cristallo delle prime radio
- nome: Ossido di piombo
  formula: PbO2
  usi:
  - piastre positive delle batterie al piombo-acido
- nome: Biacca
  formula: 2PbCO3·Pb(OH)2
  usi:
  - pigmento bianco per pittura
  - cosmetici storici, oggi vietati
- nome: Piombo tetraetile
  formula: Pb(C2H5)4
  usi:
  - antidetonante per benzina, dismesso per tossicità
