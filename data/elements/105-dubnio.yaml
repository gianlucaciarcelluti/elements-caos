numero_atomico: 105
simbolo: Db
nome: Dubnio
nome_en: Dubnium
scoperta:
  anno: 1970
  anno_stimato: false
  scopritori:
  - georgy-flerov
  - albert-ghiorso
  luogo: Dubna e Berkeley
  epoca: nucleare
  isolamento_anno: null
  note_cronologia: 'Credito condiviso, come per il rutherfordio. La cronologia di riferimento
    comprime le due squadre in «Flerov et al.» e «Ghiorso et al.»: qui restano i due capi,
    perché la commissione congiunta ha riconosciuto nel 1993 che il primo esperimento decisamente
    riuscito fu quello di Berkeley dell''aprile 1970, seguito da vicino da quello di Dubna
    del giugno successivo, e le fonti non isolano un elenco simmetrico di nomi per le due
    parti. La casella ha avuto quattro nomi proposti — hahnium da Berkeley, bohrium e poi
    nielsbohrium da Dubna, joliotium dalla IUPAC nel 1994 — prima che nel 1997 fosse chiamata
    dubnium in riconoscimento della sede dell''istituto sovietico.'
