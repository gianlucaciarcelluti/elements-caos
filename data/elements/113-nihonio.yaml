numero_atomico: 113
simbolo: Nh
nome: Nihonio
nome_en: Nihonium
scoperta:
  anno: 2004
  anno_stimato: false
  scopritori:
  - kosuke-morita
  luogo: Wako, Giappone
  epoca: nucleare
  isolamento_anno: null
  note_cronologia: 'La data adottata è quella del primo atomo fabbricato al RIKEN. La collaborazione
    fra Dubna e Livermore aveva osservato l''elemento 113 già nel 2003, ma come tappa della
    catena di decadimento dell''elemento 115: nel dicembre 2015 la IUPAC ha assegnato la priorità
    ai giapponesi perché la loro catena è ancorata a nuclei già noti. Il nome è ufficiale
    dal 28 novembre 2016.'
  controversia: null
proprieta:
  gruppo: 13
  periodo: 7
  blocco: p
  categoria: metallo_di_transizione
  massa_atomica: 286.0
  configurazione_elettronica: '*[Rn] 5f14 6d10 7s2 7p1'
  gusci:
