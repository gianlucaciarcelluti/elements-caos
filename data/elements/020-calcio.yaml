  - gusci e scheletri degli organismi marini
  - fondente per la siderurgia
- nome: Ossido di calcio (calce viva)
  formula: CaO
  usi:
  - malte e cementi
  - correzione dei suoli acidi
- nome: Solfato di calcio (gesso)
  formula: CaSO4
  usi:
  - intonaci e pannelli
  - forme e calchi ortopedici
- nome: Idrossiapatite
  formula: Ca5(PO4)3(OH)
  usi:
  - struttura minerale di ossa e denti
