nome: Calcio
nome_en: Calcium
scoperta:
  anno: 1739
  anno_stimato: false
  scopritori:
  - johann-heinrich-pott
  luogo: Berlino
  epoca: alchimia
  isolamento_anno: 1808
  note_cronologia: 'Pott riconosce la terra calcarea come terra a sé nelle Observationes et
    animadversiones chymicae del 1739. Il metallo è isolato solo nel 1808, per elettrolisi,
    da Humphry Davy.'
  controversia: 'Attribuire a Pott la scoperta del calcio richiede una precisazione. Nel
    1739 Pott riconosce la terra calcarea come una delle terre elementari, distinta dalle
    altre: è un passo reale, ma riguarda la calce, non il metallo, e Pott non sostenne mai
    che dentro la calce ci fosse un metallo. L''ipotesi che le terre fossero ossidi di
    metalli sconosciuti è di Lavoisier, mezzo secolo dopo, e la prova è di Humphry Davy nel
    1808. Molte cronologie, questa compresa, datano la scoperta al lavoro sulle terre perché
    è lì che il calcio comincia a esistere come sostanza distinta; altre la datano al 1808,
    quando qualcuno lo tiene finalmente in mano. Entrambe le date dicono qualcosa di vero e
    nessuna delle due da sola racconta la vicenda.'
