contenuti:
  hook: 'Il copernicio sta nella colonna dei metalli, sotto il mercurio. Nel 2006 due suoi
    atomi sono stati fatti passare su una superficie d''oro per rispondere a una domanda che
    di solito non si pone: è davvero un metallo?'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il copernicio chiude la serie delle sei caselle prese dal laboratorio di Darmstadt,
      ed è l''elemento su cui resta aperta la più elementare delle domande. Non se ne discute
      la posizione nella tavola né la famiglia di appartenenza: si discute se, potendone accumulare
      abbastanza, si troverebbe davanti un metallo, un liquido o un gas.'
    visual: Una goccia di mercurio accanto a un contenitore vuoto
    attendibilita: documentato
  - id: un_atomo_nel_1996
    sezione: storia
    testo: 'Il 9 febbraio 1996 il gruppo di Sigurd Hofmann bombardò piombo-208 con ioni di
      zinco-70 e ottenne un atomo di copernicio-277. Uno. Un secondo evento riportato insieme
      al primo si rivelò poi fabbricato, come il quarto atomo del darmstadtio, e fu ritirato:
      la scoperta restò appesa a un singolo nucleo autentico.'
    visual: Un unico segnale su una traccia di rivelatore
    attendibilita: documentato
  - id: tredici_anni_di_verifiche
    sezione: storia
    testo: Ci vollero tredici anni perché la scoperta fosse riconosciuta. La commissione internazionale
      la giudicò insufficiente nel 2001 e di nuovo nel 2003, per discrepanze nei dati di uno
      dei nuclei della catena di decadimento; il GSI raccolse altri dati fra il 2001 e il
      2005, e il RIKEN in Giappone rifece l'esperimento in modo indipendente. Solo allora,
      nel maggio del 2009, la IUPAC attribuì l'elemento ai tedeschi.
    visual: Due laboratori su un mappamondo collegati da una linea
    attendibilita: documentato
  - id: perche_conta_la_ripetizione
    sezione: storia
    testo: 'La ripetizione da parte di un altro laboratorio è la ragione per cui la vicenda
      si è chiusa, e non è un dettaglio burocratico: è la sola difesa contro il caso e contro
      l''errore quando la prova consiste in una manciata di eventi. Il criterio che aveva
      rallentato il roentgenio ha rallentato anche il copernicio, e in entrambi i casi ha
      funzionato.'
    visual: Due serie di dati sovrapposte che coincidono
    attendibilita: documentato
  - id: il_nome
    sezione: storia
    testo: 'Nel luglio del 2009 il GSI propose copernicium, per onorare, scrissero, uno scienziato
      che ha cambiato il nostro modo di vedere il mondo. La scelta è insolita: Niccolò Copernico
      non era né un fisico nucleare né un chimico, e la sua opera precede di quattro secoli
      l''idea stessa di elemento chimico. La IUPAC ufficializzò il nome il 19 febbraio 2010,
      cinquecentotrentasettesimo anniversario della nascita dell''astronomo.'
    visual: Il ritratto di Niccolò Copernico con il sistema eliocentrico
    attendibilita: documentato
  - id: cp_diventa_cn
    sezione: storia
    testo: 'Il simbolo proposto era Cp, e fu cambiato in Cn prima dell''ufficializzazione.
      Cp era già stato usato per il cassiopeio, vecchio nome del lutezio, e soprattutto indica
      oggi il ciclopentadienile, uno dei gruppi più comuni della chimica metallorganica: una
      formula come «CpFe» avrebbe avuto due letture incompatibili. È lo stesso genere di problema
      che aveva fatto discutere sul bohrio e sul boro.'
    visual: Una formula di struttura con l'anello ciclopentadienile
    attendibilita: documentato
  - id: sotto_il_mercurio
    sezione: caratteristiche
    testo: 'Il copernicio sta nel gruppo 12, sotto zinco, cadmio e mercurio, e quella colonna
      ha già una sua stranezza: il mercurio è l''unico metallo liquido a temperatura ambiente.
      La ragione è che i suoi elettroni esterni sono legati con insolita saldezza e partecipano
      poco al legame metallico. Nel copernicio lo stesso effetto è molto più forte.'
    visual: La colonna del gruppo 12 in una tavola periodica
    attendibilita: documentato
  - id: il_guscio_chiuso
    sezione: caratteristiche
    testo: In un atomo così pesante gli elettroni del guscio più esterno si muovono a una
      frazione notevole della velocità della luce, e la relatività li tira verso il nucleo,
      abbassandone l'energia. Il risultato è un guscio pieno e stabile che assomiglia più
      a quello di un gas nobile che a quello di un metallo, e un atomo poco disposto a legarsi
      ai propri simili.
    visual: Uno schema degli orbitali contratti dagli effetti relativistici
    attendibilita: documentato
  - id: due_atomi_sull_oro
    sezione: caratteristiche
    testo: 'L''esperimento decisivo è stato fatto a Dubna fra il 2006 e il 2007 su due atomi
      di copernicio-283, fatti scorrere lungo una superficie d''oro raffreddata a gradiente
      di temperatura. Un metallo del gruppo 12 si lega all''oro e si ferma presto; un gas
      nobile lo attraversa senza fermarsi. Il copernicio si è fermato, ma molto più in là
      del mercurio: è un metallo, il più volatile della propria colonna, con un legame all''oro
      debole.'
    visual: Una superficie d'oro con un gradiente di temperatura e due punti di deposizione
    attendibilita: documentato
  - id: gas_o_liquido
    sezione: caratteristiche
    testo: Che cosa sarebbe a temperatura ambiente resta però indeciso. Alcuni calcoli lo
      danno gassoso, altri liquido e tenuto insieme da forze deboli, con una densità stimata
      attorno ai quattordici grammi per centimetro cubo, poco più del mercurio. Nessuna delle
      due ipotesi si potrà verificare finché non se ne accumulerà una quantità visibile, cosa
      che nessuna tecnica nota permette.
    visual: Due previsioni contrapposte su uno stesso diagramma di stato
    attendibilita: discusso
  - id: isotopi
    sezione: caratteristiche
    testo: Si conoscono una dozzina di isotopi del copernicio. Il più longevo è il copernicio-285,
      che dura una trentina di secondi ed è il figlio del decadimento del flerovio; il copernicio-283,
      quello usato per la chimica, ne dura quattro. Gli isotopi ottenuti sparando zinco sul
      piombo, come l'atomo del 1996, durano meno di un millesimo di secondo.
    visual: Una catena di decadimenti che scende dal flerovio al copernicio
    attendibilita: documentato
  - id: usi_ricerca
    sezione: usi
    testo: 'Il copernicio non ha usi e non ne avrà: non esiste in natura e se ne producono
      singoli atomi. È però uno dei pochi elementi di questa parte della tavola su cui un
      esperimento chimico si è potuto fare davvero, e questo lo rende prezioso per chi calcola.'
    visual: Un apparato di cromatografia su superficie d'oro
    attendibilita: documentato
  - id: perche_studiarlo
    sezione: usi
    testo: La domanda che il copernicio mette alla prova è dove finisca il concetto stesso
      di metallo. Se un elemento della colonna dello zinco si comporta quasi da gas nobile,
      allora le famiglie della tavola periodica smettono di predire il comportamento macroscopico
      anche quando continuano a predire quello elettronico. Sapere di quanto il copernicio
      si discosti dal mercurio è il dato con cui si tarano le previsioni su tutti gli elementi
      che seguono.
    visual: Il confronto fra proprietà previste e misurate lungo il gruppo 12
    attendibilita: documentato
  - id: curiosita_copernico
    sezione: curiosita
    testo: 'Nella tavola periodica i corpi celesti abbondano — l''uranio, il nettunio e il
      plutonio dai pianeti, il cerio e il palladio da due asteroidi, l''elio dal Sole, il
      tellurio e il selenio dalla Terra e dalla Luna — ma fra le caselle intitolate a persone
      un astronomo mancava. Il copernicio l''ha aggiunto cinque secoli dopo, e la motivazione
      ufficiale non cita l''astronomia: cita il fatto di aver cambiato il modo in cui guardiamo
      il mondo.'
    visual: Un planisfero celeste rinascimentale
    attendibilita: documentato
  - id: curiosita_fine_serie
    sezione: curiosita
    testo: 'Con il copernicio finisce la serie di Darmstadt: sei caselle consecutive, dal
      107 al 112, riempite dallo stesso laboratorio fra il 1981 e il 1996 con lo stesso metodo
      e in gran parte con le stesse persone. Con quel metodo, dopo il 112, sarebbe stata riempita
      ancora una casella — il 113, in Giappone e dieci anni più tardi — ma la corsa verso
      la fine della riga era già ripartita altrove, con una tecnica diversa.'
    visual: Sei caselle consecutive evidenziate in fondo alla tavola periodica
    attendibilita: documentato
  pronuncia:
  - termine: Niccolò Copernico
    ipa: nikkoˈlɔ koˈpɛrniko
    nota: In polacco Mikołaj Kopernik.
