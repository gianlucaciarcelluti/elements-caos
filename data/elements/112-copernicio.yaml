  luogo: Darmstadt
  epoca: nucleare
  isolamento_anno: null
  note_cronologia: La data adottata è quella della sintesi, il 9 febbraio 1996; il riconoscimento
    IUPAC è del maggio 2009, dopo due giudizi di insufficienza e la ripetizione indipendente
    del RIKEN. Un secondo evento riportato insieme al primo è stato ritirato perché fabbricato.
    Il simbolo proposto, Cp, è stato cambiato in Cn perché già in uso per il cassiopeio e
    per il ciclopentadienile; il nome è ufficiale dal 19 febbraio 2010.
