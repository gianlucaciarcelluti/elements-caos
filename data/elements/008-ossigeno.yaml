numero_atomico: 8
simbolo: O
nome: Ossigeno
nome_en: Oxygen
scoperta:
  anno: 1771
  anno_stimato: false
  scopritori:
  - carl-wilhelm-scheele
  luogo: null
  epoca: pneumatica
  isolamento_anno: 1771
  note_cronologia: 'Scheele ottiene la sua "aria di fuoco" intorno al 1771 e la registra su un
    quaderno di laboratorio che si conserva, ma pubblica soltanto nel 1777. Joseph Priestley
    arriva allo stesso gas per via indipendente il 1° agosto 1774 ed è il primo a stamparne la
    preparazione, alla fine del 1775. Antoine-Laurent Lavoisier ne capisce la natura, lo
    battezza e ne fa il perno della chimica moderna.'
  controversia: 'Chi ha scoperto l''ossigeno è la domanda di paternità più discussa della storia
    della chimica, e la risposta cambia a seconda di che cosa si intenda per scoprire. Il primo
    a preparare il gas e a studiarne le proprietà è Scheele, intorno al 1771: lo chiama aria di
    fuoco e ne annota tutto, poi lascia passare anni prima di dare il manoscritto alle stampe.
    Il primo a pubblicare è Priestley, che arriva allo stesso gas nell''agosto del 1774 senza
    sapere nulla del lavoro svedese e lo stampa l''anno dopo, restando convinto fino alla morte
    che il flogisto esistesse. Nell''ottobre di quello stesso anno Priestley cena a Parigi da
    Lavoisier e gli racconta l''esperimento; nel giro di pochi giorni arriva a Lavoisier anche
    una lettera di Scheele che descrive una preparazione analoga. Lavoisier non scopre il gas
    per primo e non lo pubblica per primo: capisce che cos''è. Pesando tutto ciò che entra e
    tutto ciò che esce dalle sue reazioni dimostra che la combustione non è perdita di flogisto
    ma combinazione con questo gas, e nel 1779 gli dà il nome che porta ancora. Chi assegna la
    scoperta a Scheele premia la priorità cronologica, chi la assegna a Priestley la priorità di
    stampa, chi la assegna a Lavoisier la comprensione: tutte e tre le scelte sono difendibili,
    ed è per questo che la questione non si chiude.'
