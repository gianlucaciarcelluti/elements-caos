numero_atomico: 36
simbolo: Kr
nome: Cripton
nome_en: Krypton
scoperta:
  anno: 1898
  anno_stimato: false
  scopritori:
  - william-ramsay
  - morris-travers
  luogo: Londra, Regno Unito
  epoca: spettroscopia
  isolamento_anno: null
  note_cronologia: Primo dei tre gas nobili trovati da Ramsay e Travers nel 1898, ricavato
    dal residuo dell'aria liquida quasi completamente evaporata. Fra il 1960 e il 1983 la
    definizione del metro è stata basata su una riga spettrale del cripton-86.
  controversia: null
proprieta:
  gruppo: 18
  periodo: 4
  blocco: p
  categoria: gas_nobile
  massa_atomica: 83.7982
  configurazione_elettronica: '[Ar] 3d10 4s2 4p6'
  gusci:
  - 2
