contenuti:
  hook: Per ventitré anni la lunghezza del metro non è stata la sbarra di platino conservata
    a Sèvres, ma un numero di lunghezze d'onda della luce arancione emessa da un gas trovato
    nel residuo dell'aria evaporata.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il cripton è un gas nobile presente nell''aria in ragione di una parte per milione,
      incolore e quasi del tutto inerte. Il suo momento di gloria è stato metrologico: fra
      il 1960 e il 1983 il metro è stato definito come un multiplo della lunghezza d''onda
      di una delle sue righe spettrali.'
    visual: Un tubo di scarica al cripton con il suo bagliore biancastro
    attendibilita: documentato
  - id: il_residuo
    sezione: storia
    testo: 'Nel maggio del 1898 William Ramsay e Morris Travers lavoravano su quello che restava
      dopo aver fatto evaporare quasi tutta l''aria liquida: pochi centimetri cubi di gas
      che nessuno aveva ancora esaminato. Lo spettro mostrò due righe brillanti, una gialla
      e una verde, che non appartenevano a nulla di conosciuto.'
    visual: Il fondo di un recipiente criogenico con il residuo dell'aria liquida
    attendibilita: documentato
  - id: kryptos
    sezione: storia
    testo: 'Lo chiamarono cripton, dal greco kryptos, «nascosto», e la scelta descriveva due
      cose insieme: il modo in cui era stato trovato, in fondo a tutto e dopo aver tolto il
      resto, e il carattere di un gas che era rimasto nell''aria che tutti respiravano senza
      dare il minimo segno di sé per l''intera storia della chimica.'
    visual: Un'ampolla sigillata etichettata con il nome del gas
    attendibilita: documentato
  - id: il_primo_dei_tre
    sezione: storia
    testo: Il cripton fu il primo dei tre gas che Ramsay e Travers trovarono in quell'anno,
      e il metodo che aveva funzionato per lui — liquefare l'aria e raccogliere le frazioni
      secondo il punto di ebollizione — li portò nelle settimane successive al neon e allo
      xenon. Erano le tre caselle che restavano vuote nella colonna aperta dall'argon quattro
      anni prima.
    visual: La colonna dei gas nobili completata nella tavola periodica
    attendibilita: documentato
  - id: il_metro
    sezione: storia
    testo: 'Nel 1960 la Conferenza generale dei pesi e delle misure abbandonò il prototipo
      materiale del metro — la sbarra di platino-iridio conservata a Sèvres, che andava confrontata
      a mano e che si poteva danneggiare — e lo ridefinì come 1.650.763,73 lunghezze d''onda,
      nel vuoto, della radiazione emessa dal cripton-86 nella transizione fra due livelli
      energetici precisi. Era la prima volta che un''unità fondamentale veniva agganciata
      a una proprietà atomica invece che a un oggetto: chiunque avesse una lampada al cripton-86
      e un interferometro poteva ricostruirsi il metro in casa propria.'
    visual: Il prototipo del metro in platino iridio in una teca
    attendibilita: documentato
  - id: poi_la_luce
    sezione: storia
    testo: 'Quella definizione durò fino al 1983, quando fu sostituita da una più precisa
      ancora: il metro come la distanza percorsa dalla luce nel vuoto in una frazione fissata
      di secondo. Il cripton aveva fatto da ponte fra il metro-oggetto e il metro-costante
      di natura, ed è un ruolo che nessun altro elemento ha avuto.'
    visual: Un interferometro laser per misure di lunghezza
    attendibilita: documentato
  - id: inerzia_e_composti
    sezione: caratteristiche
    testo: 'Come gli altri gas nobili ha il guscio esterno completo e non forma legami in
      condizioni ordinarie, ma non è del tutto inerte: nel 1963 è stato preparato il difluoruro
      di cripton, che si ottiene facendo reagire il gas con il fluoro a bassissima temperatura
      ed è uno degli ossidanti più potenti che si conoscano.'
    visual: Cristalli bianchi di difluoruro di cripton in una fiala raffreddata
    attendibilita: documentato
  - id: proprieta
    sezione: caratteristiche
    testo: È incolore, inodore e insapore, con una densità circa tre volte quella dell'aria,
      e liquefa a 120 kelvin. Nella scarica elettrica emette una luce biancastra tendente
      al verde-azzurro, meno vistosa di quella del neon ma con righe spettrali molto nette,
      che è la ragione per cui è servito alla metrologia.
    visual: Lo spettro a righe del cripton con le righe principali evidenziate
    attendibilita: documentato
  - id: provenienza
    sezione: caratteristiche
    testo: 'Si ricava per distillazione frazionata dell''aria liquida negli stessi impianti
      che producono ossigeno e azoto, e in quantità minime: l''aria ne contiene circa una
      parte per milione, il che vuol dire che per un litro di cripton bisogna trattare un
      milione di litri d''aria. Una piccola frazione del cripton atmosferico è radiogenica,
      prodotta dalla fissione spontanea dell''uranio nella crosta, e un''altra piccola frazione
      arriva dai reattori nucleari, che liberano cripton-85 nei trattamenti del combustibile
      esausto.'
    visual: Un impianto di separazione dell'aria con le sue colonne
    attendibilita: documentato
  - id: usi_illuminazione
    sezione: usi
    testo: Nelle lampade a incandescenza il cripton riduce l'evaporazione del filamento più
      dell'argon e permette temperature di lavoro più alte, cioè più luce a parità di consumo;
      nei tubi fluorescenti a risparmio energetico è mescolato all'argon per lo stesso motivo,
      e nei flash fotografici ad alta velocità dà una luce bianca con lo spettro adatto alla
      pellicola.
    visual: Una lampada allo cripton accanto a una tradizionale
    attendibilita: documentato
  - id: usi_laser
    sezione: usi
    testo: Il laser a fluoruro di cripton è uno degli strumenti della ricerca sulla fusione
      a confinamento inerziale, dove serve un impulso ultravioletto molto energetico e molto
      breve; laser a cripton ionizzato si usano in medicina e nella ricerca, dove servono
      righe nel rosso e nel giallo che l'argon non dà.
    visual: La camera di un esperimento di fusione a confinamento inerziale
    attendibilita: documentato
  - id: usi_datazione
    sezione: usi
    testo: 'Il cripton-81, prodotto nell''atmosfera dai raggi cosmici, ha un''emivita di duecentoventinovemila
      anni e serve a datare acque sotterranee molto antiche: campioni di falda in cui il carbonio-14
      è ormai esaurito si datano contando gli atomi di cripton-81 rimasti, con tecniche che
      ne rivelano poche migliaia per litro d''acqua.'
    visual: Un pozzo di campionamento di acque profonde
    attendibilita: documentato
  - id: curiosita_metro
    sezione: curiosita
    testo: 'Nella storia delle unità di misura il cripton occupa un posto singolare: è l''unico
      elemento chimico su cui sia mai stata basata la definizione di una lunghezza. Il chilogrammo
      è rimasto un oggetto fino al 2019, il secondo dipende dal cesio, la lunghezza è passata
      per il cripton e poi per la velocità della luce.'
    attendibilita: documentato
  - id: curiosita_supereroe
    sezione: curiosita
    testo: 'Il pianeta natale di Superman, Krypton, e la kryptonite che lo indebolisce hanno
      preso il nome dall''elemento, non il contrario: il fumetto è del 1938, quarant''anni
      dopo la scoperta. È probabilmente il caso in cui il nome di un elemento chimico è arrivato
      al pubblico più vasto, e nel modo meno chimico possibile.'
    attendibilita: documentato
  pronuncia:
  - termine: kryptos
    ipa: kryˈptos
    nota: Greco antico, «nascosto».
