numero_atomico: 30
simbolo: Zn
nome: Zinco
nome_en: Zinc
scoperta:
  anno: -1000
  anno_stimato: true
  scopritori: []
  luogo: Zawar, Rajasthan, India
  epoca: antichita
  isolamento_anno: 1746
  note_cronologia: 'La data convenzionale colloca lo zinco nell''area mineraria indiana del
    Rajasthan, dove l''attività estrattiva è documentata dalla metà del I millennio a.C.
    La distillazione dello zinco metallico è però più tarda; in Europa Andreas Marggraf
    ne pubblica l''isolamento nel 1746, quattro anni dopo la distillazione di Anton von
    Swab.'
  controversia: 'La data del 1000 a.C. non regge come data del metallo, e va letta per quello
    che è: una convenzione che segnala l''antichità dell''ottone e del distretto minerario
    indiano, non la produzione di zinco puro. L''archeologia di Zawar, in Rajasthan, documenta
    estrazione mineraria almeno dal VI secolo a.C., ma quello che se ne ricavava allora erano
    argento e piombo. Lo zinco metallico più antico prodotto dall''uomo che si conosca viene
    dallo stesso sito e risale al IX secolo d.C., mentre la fusione dello zinco su scala industriale,
    con le batterie di storte in argilla, sembra cominciare intorno al XII secolo. L''ottone,
    invece, precede tutto questo di millenni: ma l''ottone si fa senza mai vedere lo zinco.'
