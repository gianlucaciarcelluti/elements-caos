  note_cronologia: 'Scoperta indipendente e quasi simultanea: Jöns Jacob Berzelius e Wilhelm
    Hisinger a Bastnäs, Martin Heinrich Klaproth a Berlino, entrambi nel 1803. Isolato in
    forma metallica nel 1875 da William Francis Hillebrand e Thomas Norton.'
