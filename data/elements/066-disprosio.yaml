  note_cronologia: Lecoq de Boisbaudran lo separò dall'ossido di olmio nel 1886, dopo più
    di trenta precipitazioni successive; il nome viene dal greco dysprositos, «difficile da
    raggiungere». L'elemento puro arrivò solo negli anni Cinquanta del Novecento, con lo scambio
    ionico messo a punto da Frank Spedding.
