  luogo: Palermo, Italia
  epoca: spettroscopia
  isolamento_anno: null
  note_cronologia: 'Primo elemento prodotto artificialmente: Perrier e Segrè lo identificarono
    nel 1937 in una lamina di molibdeno irraggiata nel ciclotrone di Berkeley e spedita loro
    da Ernest Lawrence. La casella 43 era stata rivendicata più volte — davyum, lucium, nipponium,
    masurium — senza che nessun annuncio reggesse. Il nome fu scelto nel 1947.'
