  note_cronologia: Marignac separò l'itterbia dall'erbia nel 1878; nel 1907 Georges Urbain
    la divise a sua volta in neoitterbia e lutecia, cioè nell'itterbio odierno e nel lutezio.
    Il metallo fu ottenuto nel 1936 da Wilhelm Klemm e Heinrich Bommer, e l'itterbio quasi
    puro solo nel 1953, con lo scambio ionico.
