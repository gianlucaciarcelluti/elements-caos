numero_atomico: 22
simbolo: Ti
nome: Titanio
nome_en: Titanium
scoperta:
  anno: 1791
  anno_stimato: false
  scopritori:
    - william-gregor
  luogo: Manaccan, Cornovaglia
  epoca: pneumatica
  isolamento_anno: 1875
  note_cronologia: William Gregor riconosce l'elemento nel 1791 nella sabbia nera del torrente
    di Manaccan, in Cornovaglia; Klaproth lo ritrova indipendentemente nel rutilo nel 1795 e
    gli dà il nome dei Titani. Il metallo quasi puro è ottenuto nel 1875 da Dmitrij Kirillov;
    una purezza del 99,9 per cento arriva solo nel 1910 con Matthew Hunter, e la produzione
    industriale con il processo Kroll degli anni Trenta e Quaranta.
