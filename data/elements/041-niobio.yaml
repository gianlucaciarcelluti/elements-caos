  note_cronologia: Il columbium annunciato da Hatchett nel 1801 era con ogni probabilità
    una miscela di niobio e tantalio; dal 1809 al 1846 i due elementi furono ritenuti
    la stessa sostanza, sulla scorta del confronto fra gli ossidi fatto da William
    Hyde Wollaston. Isolato nel 1864 da Christian Wilhelm Blomstrand. Il nome niobium
    prevalse su columbium solo nel 1949.
