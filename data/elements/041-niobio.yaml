contenuti:
  hook: Un minerale spedito dal Connecticut a Londra rimase in un cassetto per quasi
    settant'anni. Quando qualcuno lo analizzò ne uscì un elemento che avrebbe passato
    il secolo e mezzo successivo a litigare sul proprio nome.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il niobio è un metallo grigio chiaro, duttile quanto il ferro e leggero
      per essere un refrattario, che quasi nessuno vede mai: nove decimi di quello
      estratto se ne vanno in acciai a cui bastano poche centinaia di grammi per tonnellata,
      e gran parte del resto nei magneti superconduttori.'
    visual: Cristalli di niobio metallico dalla superficie iridescente
    attendibilita: documentato
  - id: hatchett_museo
    sezione: storia
    testo: Nel 1801 Charles Hatchett stava esaminando i minerali del British Museum
      quando si fermò su un campione etichettato come columbite, arrivato in Inghilterra
      dal Connecticut nel 1734 e da allora rimasto nelle collezioni. Lo fuse con carbonato
      di potassio, sciolse il prodotto in acqua e per precipitazione ne ricavò l'ossido
      di un metallo che nessuno conosceva. Chiamò l'elemento columbium, da Columbia,
      il nome poetico degli Stati Uniti.
    visual: Un cassetto di minerali di museo con etichette manoscritte ottocentesche
    attendibilita: documentato
  - id: miscela_iniziale
    sezione: storia
    testo: 'Che cosa avesse davvero in mano è meno chiaro di quanto suoni. Hatchett
      non arrivò mai al metallo, si fermò all''ossido, e il suo columbium era con
      ogni probabilità una miscela dell''elemento nuovo con il tantalio, che sarebbe
      stato annunciato l''anno seguente: i due stanno negli stessi minerali e nessuna
      tecnica dell''epoca sapeva dividerli.'
    visual: Polvere bianca di ossido metallico in un crogiolo
    attendibilita: discusso
  - id: wollaston_identita
    sezione: storia
    testo: Nel 1809 William Hyde Wollaston mise a confronto i due ossidi, quello ricavato
      dalla columbite e quello ricavato dalla tantalite. Le densità che misurò erano
      diverse — 5,918 contro 7,935 grammi per centimetro cubo — ma concluse ugualmente
      che le due sostanze fossero la stessa cosa, e tenne il nome tantalio. Friedrich
      Wöhler confermò, e per quasi quarant'anni il columbium di Hatchett smise di
      esistere.
    visual: Due bilance analitiche con campioni di ossido a confronto
    attendibilita: documentato
  - id: rose_pelopio
    sezione: storia
    testo: 'Nel 1846 il chimico tedesco Heinrich Rose riprese la tantalite e sostenne
      che conteneva due metalli distinti, che battezzò con i nomi dei figli di Tantalo:
      niobio, da Niobe, e pelopio, da Pelope. Il pelopio si rivelò poi una miscela
      dei due, e la stessa fine fecero altri elementi annunciati in quegli anni, l''ilmenio
      e il dianio: se ne discusse sulle riviste fino al 1871.'
    visual: Una statua ellenistica di Niobe
    attendibilita: documentato
  - id: blomstrand_metallo
    sezione: storia
    testo: La questione chimica si chiuse nel decennio successivo. Nel 1864 Christian
      Wilhelm Blomstrand, all'università di Lund, ottenne il metallo scaldando il
      cloruro di niobio in atmosfera di idrogeno, e insieme ai lavori di Henri Sainte-Claire
      Deville, Louis Troost e Jean Charles Galissard de Marignac stabilì che gli elementi
      erano due e non di più, e che il niobio di Rose era il columbium di Hatchett.
    visual: Un'ampolla di vetro con cristalli metallici appena ridotti
    attendibilita: documentato
  - id: nome_columbium
    sezione: storia
    testo: Il nome invece resistette ancora un secolo. In America si scriveva columbium,
      in Europa niobium, e le due letterature andarono avanti in parallelo fino alla
      conferenza dell'Unione di chimica di Amsterdam del 1949, che scelse niobium;
      la IUPAC lo adottò l'anno dopo, in uno scambio che accettava tungsten al posto
      di wolfram per riguardo all'uso nordamericano e niobium per riguardo a quello
      europeo. Qualche metallurgista statunitense scrive columbium ancora oggi, e
      la parola compare nelle norme ASTM.
    visual: Due riviste scientifiche aperte, una americana e una europea, con nomi
      diversi per lo stesso elemento
    attendibilita: documentato
  - id: caratteristiche_fisiche
    sezione: caratteristiche
    testo: 'Il niobio fonde a 2477 gradi, ma è meno denso degli altri metalli refrattari,
      con 8,57 grammi per centimetro cubo, e a temperatura ambiente si lavora con
      la stessa facilità del ferro. All''aria non si ossida quasi: lo strato che si
      forma è sottilissimo e con il tempo dà al metallo una sfumatura azzurrina.'
    visual: Una lamina di niobio con riflessi bluastri
    attendibilita: documentato
  - id: superconduttivita
    sezione: caratteristiche
    testo: 'È anche un superconduttore, e in questo detiene un primato: a pressione
      ambiente nessun altro elemento resta superconduttore fino a una temperatura
      così alta, 9,2 kelvin. È inoltre uno dei tre soli elementi superconduttori di
      tipo II, insieme al vanadio e al tecnezio, cioè capaci di reggere campi magnetici
      intensi senza perdere lo stato.'
    visual: Una cavità a radiofrequenza in niobio raffreddata da vapori di elio liquido
    attendibilita: documentato
  - id: minerali_produzione
    sezione: caratteristiche
    testo: 'In natura accompagna sempre il tantalio: sta nel pirocloro delle carbonatiti
      e nella columbite-tantalite, il minerale che in Africa centrale si chiama coltan.
      La geografia della produzione è quasi monopolistica: secondo lo USGS nel 2025
      il Brasile ha fornito circa il 93 per cento delle 112.000 tonnellate mondiali
      e il Canada il cinque, mentre gli Stati Uniti non estraggono niobio dal 1959.'
    visual: Una miniera a cielo aperto di pirocloro in Brasile
    attendibilita: documentato
  - id: usi_acciai
    sezione: usi
    testo: 'L''impiego che assorbe quasi tutto il niobio estratto è il ferroniobio
      negli acciai basso-legati ad alta resistenza: poche centinaia di grammi per
      tonnellata affinano il grano del metallo e ne alzano il carico di rottura, e
      da lì il niobio passa a oleodotti, carrozzerie e travi. Negli Stati Uniti, nel
      2025, il 77 per cento del consumo è andato agli acciai e il 23 alle superleghe
      per turbine.'
    visual: Un tubo d'acciaio per oleodotto in fase di saldatura
    attendibilita: documentato
  - id: usi_magneti
    sezione: usi
    testo: La quota restante vale però quanto la fama dell'elemento. I fili di niobio-titanio
      e di niobio-stagno sono il materiale dei magneti superconduttori della risonanza
      magnetica e degli acceleratori di particelle — il Large Hadron Collider ne monta
      centinaia di tonnellate — e le cavità a radiofrequenza degli acceleratori lineari
      si ricavano da niobio puro.
    visual: Un magnete superconduttore avvolto in bobine di filo niobio-titanio
    attendibilita: documentato
  - id: curiosita_monete
    sezione: curiosita
    testo: Anodizzando il niobio si ottiene uno strato di ossido che diffrange la
      luce, e quindi colore senza pigmenti. L'Austria ne conia dal 2003 monete commemorative
      bimetalliche in argento e niobio, con il centro blu, verde, viola o giallo;
      per la stessa proprietà, unita al fatto che il metallo è inerte e non dà allergie,
      il niobio si usa in gioielleria e negli impianti medici.
    attendibilita: documentato
  - id: curiosita_bell_labs
    sezione: curiosita
    testo: 'Che il niobio sia superconduttore si sapeva da tempo, ma è del 1961 la
      scoperta che ne ha fatto un materiale industriale: al Bell Labs si vide che
      il niobio-stagno regge la superconduttività anche attraversato da correnti fortissime
      e immerso in campi magnetici intensi. Prima di allora nessun materiale lo faceva,
      e i magneti superconduttori potenti non erano costruibili.'
    attendibilita: documentato
