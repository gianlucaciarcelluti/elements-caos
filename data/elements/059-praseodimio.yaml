  note_cronologia: 'Il praseodimio nasce dalla divisione del didimio, che Mosander aveva ricavato
    nel 1841 e che per quarantaquattro anni fu considerato un elemento: von Welsbach lo separò
    nel 1885 in praseodimio e neodimio per cristallizzazione frazionata del nitrato doppio
    di ammonio.'
