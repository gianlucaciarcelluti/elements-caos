numero_atomico: 104
simbolo: Rf
nome: Rutherfordio
nome_en: Rutherfordium
scoperta:
  anno: 1969
  anno_stimato: false
  scopritori:
  - georgy-flerov
  - albert-ghiorso
  luogo: Dubna e Berkeley
  epoca: nucleare
  isolamento_anno: null
  note_cronologia: 'Credito condiviso. La cronologia di riferimento comprime le due squadre
    in «Flerov et al.» e «Ghiorso et al.»: qui restano i due capi, perché la commissione congiunta
    ha riconosciuto nel 1993 che le prove di Dubna e quelle di Berkeley si equivalevano, e
    le fonti non isolano un elenco simmetrico di nomi per le due parti. Dubna rivendicò l''elemento
    nel 1964 proponendo il nome kurchatovium; Berkeley lo produsse nel 1969 con catene di
    decadimento verificabili e propose rutherfordium. Il nome attuale è fissato dalla IUPAC
    nel 1997, dopo una proposta del 1994 che assegnava alla casella il nome dubnium.'
  controversia: null
proprieta:
  gruppo: 4
  periodo: 7
  blocco: d
  categoria: metallo_di_transizione
  massa_atomica: 267.0
  configurazione_elettronica: '[Rn] 5f14 6d2 7s2'
