numero_atomico: 116
simbolo: Lv
nome: Livermorio
nome_en: Livermorium
scoperta:
  anno: 2000
  anno_stimato: false
  scopritori:
  - yuri-oganessian
  - kenton-moody
  luogo: Dubna
  epoca: nucleare
  isolamento_anno: null
  note_cronologia: 'Un atomo prodotto a Dubna il 19 luglio 2000 da curio-248 e calcio-48,
    nella collaborazione fra l''istituto russo e il laboratorio di Livermore; l''attribuzione
    iniziale all''isotopo 292 e stata corretta in 293 nel 2002, e la IUPAC ha riconosciuto
    la scoperta il primo giugno 2011. Il nome, adottato nel maggio 2012, riconosce il Lawrence
    Livermore National Laboratory: Dubna avrebbe voluto per questa casella il nome della propria
    regione, che e finito invece sulla 115. Una rivendicazione del 1999 del laboratorio di
    Berkeley, basata su dati fabbricati, era stata ritirata.'
  controversia: null
proprieta:
  gruppo: 16
  periodo: 7
  blocco: p
  categoria: metallo_post_transizione
  massa_atomica: 293.0
  configurazione_elettronica: '*[Rn] 5f14 6d10 7s2 7p4'
  gusci:
