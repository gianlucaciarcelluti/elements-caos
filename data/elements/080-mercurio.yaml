contenuti:
  hook: 'Un metallo che si versa. Per tremila anni il mercurio è stato l''anomalia che nessuna
    teoria della materia riusciva a sistemare, e la sostanza su cui l''umanità ha riposto le
    sue speranze più assurde: fare oro, non morire mai.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il mercurio è l''unico metallo liquido a temperatura ambiente, e questo lo ha reso
      fin dall''inizio un oggetto scandaloso. Pesa quasi quattordici volte l''acqua, non bagna
      ciò che tocca, si spezza in goccioline che corrono e si riuniscono: un materiale che sembra
      vivo, e che per millenni è stato trattato come tale.'
    visual: Goccia di mercurio che rotola su un piano di vetro senza lasciare traccia
    attendibilita: documentato
  - id: cinabro
    sezione: storia
    testo: 'La storia del mercurio comincia dal suo minerale. Il cinabro, solfuro di mercurio,
      è una pietra rosso acceso, macinata come pigmento fin dal Neolitico: quel rosso è il vermiglione,
      il colore più prezioso della pittura antica. Riscaldandolo, però, il minerale si decompone
      e il metallo se ne stacca come vapore che ricondensa in gocce: un passaggio semplicissimo
      da eseguire e difficilissimo da immaginare.'
    visual: Frammento di cinabro rosso acceso accanto alla polvere di vermiglione macinata
    attendibilita: documentato
  - id: egitto
    sezione: storia
    testo: 'Del metallo liquido si sono trovate tracce in tombe egizie del XVI-XV secolo a.C.,
      ed è a questi reperti che si riferisce la data convenzionale usata qui. Il ritrovamento
      però non spiega l''uso: non sappiamo se servisse a un rituale o alla cosmesi, e la scarsità
      dei reperti non consente di dire che gli egizi lo usassero correntemente.'
    visual: Piccolo contenitore di alabastro con residui metallici in un corredo funerario
      egizio
    attendibilita: documentato
  - id: qin
    sezione: storia
    testo: 'La testimonianza antica più spettacolare arriva dalla Cina. Le Memorie di uno storico
      di Sima Qian raccontano che nel mausoleo del primo imperatore Qin Shi Huang, morto nel
      210 a.C., i cento fiumi della Cina e il grande mare fossero riprodotti in mercurio corrente,
      sotto una volta di costellazioni. La camera sepolcrale non è mai stata aperta, ma dagli
      anni Ottanta le indagini geochimiche del tumulo misurano concentrazioni di mercurio enormemente
      superiori a quelle dei terreni circostanti: il racconto, per una volta, ha un riscontro
      fisico.'
    visual: Rilievo del tumulo di Xi'an con la mappa delle concentrazioni di mercurio nel suolo
    attendibilita: documentato
  - id: elisir
    sezione: storia
    testo: 'Lo stesso imperatore che si fece seppellire fra i fiumi di mercurio lo assumeva
      da vivo. L''alchimia cinese contava il cinabro fra gli ingredienti dell''elisir di lunga
      vita, sul ragionamento che una sostanza incorruttibile trasmettesse la propria incorruttibilità
      a chi la beveva. Le storie ufficiali registrano una lunga sequenza di imperatori e funzionari
      morti per questi preparati, almeno cinque nella sola dinastia Tang. Del caso meglio ricostruito,
      Xianzong morto nell''820, le cronache descrivono collera incontrollabile e paranoia crescente:
      sintomi che oggi si leggono come intossicazione.'
    visual: Coppa cerimoniale cinese accanto a un mortaio di cinabro in un laboratorio alchemico
    attendibilita: documentato
  - id: alchimia_occidentale
    sezione: storia
    testo: 'In Occidente il mercurio ha una posizione teorica altrettanto centrale: gli alchimisti
      lo consideravano la materia prima da cui tutti i metalli sono formati, e facevano dipendere
      le differenze fra piombo, argento e oro da quanto zolfo vi si fosse combinato. È una teoria
      sbagliata ma non stupida, perché giustifica il progetto della trasmutazione: se i metalli
      sono tutti la stessa cosa mal cotta, basta correggere la ricetta.'
    visual: Manoscritto alchemico con il simbolo del mercurio al centro di uno schema dei sette
      metalli
    attendibilita: documentato
  - id: amalgama
    sezione: storia
    testo: 'C''è un motivo pratico per cui il mercurio conta tanto: scioglie l''oro e l''argento
      in amalgami, leghe pastose da cui il metallo prezioso si recupera per evaporazione. Il
      processo del patio, del 1558, applica il principio all''argento americano e rende il mercurio
      una materia prima strategica dell''impero spagnolo: la sola miniera peruviana di Huancavelica
      ne produrrà oltre centomila tonnellate in tre secoli, in condizioni di lavoro che uccidevano
      gli operai indigeni con regolarità.'
    visual: Cortile del processo patio con i mucchi di minerale d'argento impastati di mercurio
    attendibilita: documentato
  - id: caratteristiche_liquido
    sezione: caratteristiche
    testo: 'Perché il mercurio è liquido, mentre lo zinco e il cadmio che gli stanno sopra
      nel gruppo sono solidi normalissimi? La risposta sta nella relatività. In un atomo così
      pesante gli elettroni interni viaggiano a una frazione consistente della velocità della
      luce, e questo contrae gli orbitali esterni legando gli elettroni di valenza troppo strettamente
      perché li si possa condividere con gli atomi vicini. Il legame metallico ne esce indebolito:
      il mercurio fonde a meno trentanove gradi, il punto più basso di ogni metallo stabile.'
    visual: Confronto fra i tre elementi del gruppo, zinco e cadmio solidi accanto al mercurio
      liquido
    attendibilita: documentato
  - id: caratteristiche_chimica
    sezione: caratteristiche
    testo: 'Chimicamente il mercurio è avaro. Tutti i suoi composti comuni stanno in due soli
      stati di ossidazione, più uno e più due, e il primo ha una particolarità: nello ione mercuroso
      gli atomi restano attaccati fra loro a coppie, cosa che nessun altro metallo comune fa.
      La letteratura elenca anche un meno due, che il mercurio raggiunge nei mercuriuri, composti
      esotici in cui è un metallo ancora più elettropositivo, il cesio, a cedere elettroni a lui;
      le pretese di valenze superiori, riproposte fino al 2007, restano contestate.'
    visual: Modello dello ione mercuroso con i due atomi legati fra loro
    attendibilita: documentato
  - id: caratteristiche_tossicita
    sezione: caratteristiche
    testo: 'La tossicità del mercurio dipende dalla forma. Il metallo liquido ingerito attraversa
      l''intestino quasi indisturbato, ma i suoi vapori, che si sviluppano già a temperatura
      ambiente, passano dai polmoni al cervello e vi si accumulano. I peggiori di tutti sono
      i composti organici come il metilmercurio, che i batteri producono nelle acque inquinate:
      risalgono la catena alimentare e si concentrano nei pesci grandi. È la via che a Minamata,
      in Giappone, negli anni Cinquanta ha avvelenato un''intera baia.'
    visual: Schema della catena alimentare marina con la concentrazione crescente di metilmercurio
    attendibilita: documentato
  - id: usi_storici
    sezione: usi
    testo: 'Per due secoli il mercurio è stato lo strumento di misura per eccellenza. Termometri,
      barometri e sfigmomanometri sfruttavano la stessa combinazione di doti: una densità che
      tiene corta la colonna, una dilatazione regolare su un intervallo ampio e la proprietà di
      non bagnare il vetro, che lascia il menisco netto e la lettura ripetibile. Nessun altro
      liquido le aveva tutte insieme, ed è per questo che la pressione del sangue si misura
      ancora oggi in millimetri di mercurio.'
    visual: Barometro a mercurio con la colonna e la scala graduata in millimetri
    attendibilita: documentato
  - id: usi_ritirata
    sezione: usi
    testo: 'Poi si è smesso, e in fretta. Il mercurio è uscito prima dagli ospedali, poi dalle
      case, infine dai processi industriali che lo usavano a tonnellate, sostituito da sensori
      elettronici che costano meno e non versano nulla se cadono. La Convenzione di Minamata,
      in vigore dal 2017, ha reso il ritiro un obbligo di legge, e le miniere occidentali hanno
      chiuso, l''ultima statunitense nel 1992. Il grosso del mercurio che finisce oggi nell''ambiente
      non viene però dagli oggetti, ma dalla combustione del carbone e dall''estrazione artigianale
      dell''oro, dove i cercatori lo maneggiano a mani nude come quattro secoli fa.'
    visual: Cassoni sigillati di mercurio recuperato da uno stabilimento in smantellamento
    attendibilita: documentato
  - id: curiosita_nome
    sezione: curiosita
    testo: 'Il simbolo Hg non c''entra nulla con il nome italiano: viene da hydrargyrum, latinizzazione
      del greco hydrargyros, argento liquido. Il nome che usiamo è invece quello del pianeta,
      e prima ancora del dio messaggero, per la rapidità con cui il metallo sfugge di mano. Delle
      due promesse affidategli non ne ha mantenuta nessuna: non ha fatto oro, e ha accorciato la
      vita a chi contava di allungarla. Ha però dato alla scienza lo strumento con cui, alla
      lettera, si è misurata per tre secoli.'
    visual: Simbolo alchemico del mercurio, identico a quello astronomico del pianeta
    attendibilita: documentato
  - id: curiosita_cappellai
    sezione: curiosita
    testo: 'L''espressione inglese matto come un cappellaio ha una base occupazionale precisa.
      Dalla metà del Settecento la feltratura dei cappelli usava una soluzione di nitrato mercurico,
      e i lavoranti esposti per anni ai vapori sviluppavano tremori, timidezza patologica e
      irritabilità estrema: un quadro clinico che porta il nome di eretismo mercuriale. Negli
      Stati Uniti la pratica fu vietata solo nel dicembre del 1941.'
    visual: Laboratorio di cappellaio con i vapori sopra la vasca di feltratura
    attendibilita: documentato
  pronuncia: []
contenuti_estesi:
  hook: 'Il mercurio è l''unico metallo che si versa, e per tremilacinquecento anni
    questa sola proprietà è bastata a renderlo magico. Ci si è cercata l''immortalità
    e la si è trovata al contrario; ci si è fatto l''oro degli altri, sciogliendo
    l''argento delle Americhe in un impasto che uccideva chi lo rimestava; ci si è
    misurata la febbre, la pressione e il tempo atmosferico per tre secoli. La ragione
    per cui è liquido non sta nella chimica ordinaria: sta negli effetti relativistici,
    cioè in elettroni che corrono così veloci da non lasciarsi più condividere fra
    atomo e atomo.'
  beats:
  - id: contesto-anomalia
    sezione: contesto
    testo: 'Per capire quanto sia strano il mercurio conviene metterlo accanto ai
      vicini. Fonde a meno trentanove gradi; il cadmio, che gli sta sopra nel gruppo,
      fonde a trecentoventuno; l''oro, che gli sta accanto nel periodo, a millesessantaquattro.
      Non è una differenza di grado, è un salto di categoria: fra il mercurio e i
      suoi vicini di tavola periodica ci sono centinaia di gradi, e nessuno dei due
      confini è graduale. Le forze di legame fra atomo e atomo di mercurio sono semplicemente
      molto più deboli, e la contrazione lantanidica — la spiegazione che si dava
      un tempo — rende conto dell''anomalia solo in parte.'
    attendibilita: documentato
  - id: contesto-relativita
    sezione: contesto
    testo: La spiegazione completa arriva dalla relatività, ed è una delle poche occasioni
      in cui la teoria di Einstein si vede a occhio nudo, in una sostanza che si può
      tenere in mano. Un nucleo con una carica grande costringe gli elettroni a velocità
      elevate; a quelle velocità la massa relativistica dell'elettrone aumenta, l'elettrone
      passa più tempo vicino al nucleo e l'orbitale si contrae. Nel mercurio l'orbitale
      6s², quello che dovrebbe fornire gli elettroni al legame metallico, è talmente
      contratto da contribuire pochissimo a qualunque legame chimico. Il risultato
      è che gli atomi di mercurio si tengono insieme soprattutto per forze di van
      der Waals, le stesse deboli attrazioni che tengono insieme i liquidi molecolari.
      Il mercurio è liquido perché, chimicamente, si comporta a malapena da metallo.
    attendibilita: documentato
  - id: contesto-pseudo-nobile
    sezione: contesto
    testo: 'La conseguenza estrema di quella contrazione si vede allo stato gassoso.
      Il vapore di mercurio è quasi tutto monoatomico: gli atomi se ne stanno per
      conto proprio, e la molecola biatomica Hg₂ si forma raramente e si spezza con
      pochissima energia, proprio perché legami forti non ce ne sono. È un comportamento
      che nella tavola periodica appartiene a un''altra famiglia, quella dei gas nobili,
      e infatti il mercurio gassoso viene talvolta chiamato pseudo gas nobile. Un
      metallo che allo stato di vapore si comporta come un gas nobile: l''anomalia
      è coerente dal solido al gassoso, il che la rende ancora più notevole.'
    attendibilita: documentato
  - id: contesto-cinabro
    sezione: contesto
    testo: 'In natura il mercurio metallico è raro; quello che si trova è il suo solfuro,
      il cinabro, una pietra di un rosso acceso che l''umanità ha macinato come pigmento
      molto prima di sapere che cosa contenesse. La distanza fra le due cose — una
      polvere rossa e un metallo liquido — spiega perché il mercurio arrivi tardi
      nella cronologia: bisogna immaginare che scaldando quel rosso se ne stacchi
      qualcosa, e quel qualcosa non somiglia in nulla alla pietra di partenza. Il
      passaggio è banale da eseguire e quasi impossibile da prevedere, ed è forse
      per questo che, una volta scoperto, è sembrato una specie di miracolo.'
    attendibilita: documentato
  - id: contesto-intervallo
    sezione: contesto
    testo: 'C''è un secondo primato, meno noto del primo e altrettanto conseguente.
      Il mercurio non ha soltanto il punto di congelamento più basso fra i metalli:
      ha anche il punto di ebollizione più basso, appena trecentocinquantasette gradi.
      Le due cose insieme gli danno il campo di esistenza allo stato liquido più stretto
      di qualunque metallo in condizioni normali. È il motivo per cui emette vapore
      già a temperatura ambiente, cosa che da un metallo nessuno si aspetta: il pericolo
      del mercurio non è quello che sta nella boccetta, ma la parte di esso che in
      ogni momento sta nell''aria sopra la boccetta.'
    attendibilita: documentato
  - id: contesto-vermiglione
    sezione: contesto
    testo: 'Il rosso che si ricava macinando il cinabro ha un nome con una storia
      curiosa. In italiano e in inglese si chiama vermiglione, dal francese antico
      vermeillon, che risale al latino vermiculus, «piccolo verme»: il nome allude
      al colore della tintura di cocciniglia ricavata dall''insetto Kermes vermilio,
      molto usata in Europa. Un pigmento minerale, dunque, battezzato con il nome
      di un colorante animale che gli somigliava. È stato il rosso principale della
      pittura europea dal Rinascimento fino al Novecento, quando è stato quasi interamente
      sostituito da un pigmento sintetico nuovo, il rosso di cadmio — che però è tossico
      anche lui, tanto che si studiano rimpiazzi ulteriori.'
    attendibilita: documentato
  - id: contesto-vermiglione-sintetico
    sezione: contesto
    testo: 'Macinare il cinabro era costoso e pericoloso, e Teofrasto ne descriveva
      già il procedimento nel De Lapidibus, il primo libro scientifico sui minerali.
      Presto si cercò una strada migliore: i cinesi furono probabilmente i primi a
      fabbricare vermiglione sintetico, già nel quarto secolo avanti Cristo, e l''alchimista
      greco Zosimo di Panopoli ne scrisse un metodo. All''inizio del nono secolo il
      persiano Jabir ibn Hayyan lo descrisse con precisione in un libro di ricette
      di colori, e la ricetta è di una semplicità disarmante: si mescola mercurio
      con zolfo ottenendo un composto nero, lo si scalda in un pallone finché non
      vaporizza e ricondensa in alto, si rompe il vetro e si raccoglie il rosso. Il
      rosso si otteneva distruggendo il recipiente che lo aveva prodotto.'
    attendibilita: documentato
  - id: contesto-densita
    sezione: contesto
    testo: 'Le cifre che ne hanno fatto per tre secoli lo strumento di misura per
      eccellenza sono due. La densità, anzitutto: 13,546 grammi per centimetro cubo,
      quasi quattordici volte l''acqua, che tiene corta la colonna e permette a un
      barometro di stare in una stanza invece che in un cortile. Poi la dilatazione,
      che è regolare ma sorprendentemente piccola: circa lo 0,018 per cento di volume
      per ogni grado Celsius. È il capillare a rendere leggibile quel nulla, perché
      il canale è talmente sottile rispetto al bulbo che una variazione minima di
      volume si traduce in uno spostamento visibile lungo la scala. Lo strumento non
      misura il mercurio: amplifica geometricamente ciò che il mercurio fa.'
    attendibilita: documentato
  - id: vicenda-cinabro-usi
    sezione: vicenda
    testo: 'Prima di essere un metallo, il mercurio è stato per millenni un colore,
      e l''elenco dei suoi impieghi attraversa continenti che non si conoscevano fra
      loro. Nel Vicino Oriente antico il cinabro serviva anche da cosmetico, una specie
      di rossetto; nel Nuovo Mondo lo si usa dalla cultura olmeca; in Cina compare
      sulle ossa oracolari già in epoca Zhou, e alla fine della dinastia Song entra
      nella colorazione delle lacche, dando origine alla lacca intagliata rossa che
      è l''uso più noto di questo minerale. A Roma era una pittura murale di gran
      pregio, e soprattutto da interni: all''aperto, esposto alla luce del sole, il
      rosso si scuriva.'
    attendibilita: documentato
  - id: vicenda-roma-sapeva
    sezione: vicenda
    testo: 'C''è un dettaglio, in queste stesse fonti, che cambia il tono di tutta
      la storia successiva: la tossicità della componente mercuriale del cinabro era
      riconosciuta già nell''antica Roma. Non si tratta dunque di un pericolo scoperto
      tardi, quando ormai il danno era fatto; si tratta di un pericolo noto da duemila
      anni e accettato ogni volta, a ogni giro della storia, perché il vantaggio andava
      a qualcuno e il costo a qualcun altro. È la chiave per leggere tutto quello
      che viene dopo: Almadén, Potosí, i cappellai, Minamata. In nessuno di quei casi
      il problema è stato non sapere.'
    attendibilita: documentato
  - id: vicenda-liandanshu
    sezione: vicenda
    testo: 'Per capire quanto il mercurio pesi nella storia cinese basta il nome della
      disciplina che se ne occupava. L''alchimia cinese si chiama liàndānshù, e l''espressione
      significa letteralmente «metodo per raffinare il cinabro»: non una pratica in
      cui il cinabro è uno degli ingredienti, ma una pratica che dal cinabro prende
      il proprio nome. A differenza di quella europea, che puntava soprattutto alla
      trasmutazione dei metalli, la tradizione cinese metteva al centro la longevità
      e la purificazione dello spirito, della mente e del corpo. Il fine era diverso;
      la sostanza da cui si partiva, la stessa.'
    attendibilita: documentato
  - id: vicenda-ragionamento-elisir
    sezione: vicenda
    testo: 'Il ragionamento che portava a ingerirlo non era assurdo: era rigoroso
      a partire da premesse sbagliate. Oro e mercurio, quest''ultimo sotto forma di
      cinabro, erano le sostanze più ambite da manipolare e da ingerire perché si
      riteneva che possedessero un''essenza interiore di longevità, essendo chimicamente
      inerti e resistenti all''alterazione, al contrario di metalli comuni come il
      rame e il ferro che arrugginiscono e si corrodono. L''ipotesi era che quell''essenza
      si trasferisse a chi li consumava, allungandogli la vita. A rafforzare la convinzione
      contribuivano il colore rosso del cinabro e la difficoltà della sua raffinazione,
      che agli occhi degli alchimisti lo collegavano alla ricerca dell''immortalità.
      Cercavano l''incorruttibile e lo trovarono: il mercurio non si corrompe, si
      limita a corrompere chi lo beve.'
    attendibilita: documentato
  - id: vicenda-qin-racconto
    sezione: vicenda
    testo: Prima delle miniere americane, il mercurio aveva già avuto il suo momento
      più spettacolare, e lo si legge in un testo del primo secolo avanti Cristo.
      Descrivendo il mausoleo del primo imperatore Qin, Sima Qian scrive che vi furono
      riprodotti i cento fiumi, lo Yangtze, il Fiume Giallo e il grande mare, simulati
      con il mercurio e messi a scorrere meccanicamente; sopra stavano le rappresentazioni
      delle costellazioni celesti, sotto i caratteri del territorio. Gli artigiani
      ebbero ordine di fabbricare balestre e frecce innescate per colpire chiunque
      fosse entrato, e le candele si fecero con grasso di «uomo-pesce», calcolato
      per ardere a lungo senza spegnersi. È la descrizione di un planetario funebre
      in scala imperiale, con dentro un metallo che nessuno poteva avvicinare.
    attendibilita: documentato
  - id: vicenda-discusso-qin
    sezione: vicenda
    testo: 'Il racconto ha un riscontro fisico, e insieme una contestazione che vale
      la pena riportare. Nel tumulo sono stati rilevati livelli di mercurio anomali,
      il che dà credito alla versione di Sima Qian: in un punto la misura ha raggiunto
      1.440 parti per miliardo, mentre gli altri cinquantatré punti hanno dato una
      media intorno alle 205. Esiste però anche la tesi che quel mercurio sia in realtà
      il prodotto di inquinamento industriale locale, e le fonti la registrano senza
      liquidarla. C''è poi la ragione per cui la questione resta aperta e probabilmente
      resterà tale: alcuni studiosi ritengono che, se il palazzo sotterraneo venisse
      scavato, il mercurio volatilizzerebbe rapidamente. La tomba si difende da sola,
      con la stessa sostanza che dovrebbe custodire.'
    attendibilita: discusso
  - id: vicenda-medina
    sezione: vicenda
    testo: 'La vicenda umana del mercurio comincia da un problema contabile. A metà
      del Cinquecento era noto in Spagna che la produzione d''argento americana stava
      calando: i minerali ad alto tenore si esaurivano e i costi di produzione salivano.
      Bartolomé de Medina, mercante spagnolo di successo, si appassionò alla questione
      e mise a punto un procedimento che recuperava l''argento dal minerale per amalgamazione
      con il mercurio. Lo usò su scala industriale a Pachuca, in Messico, nel 1554,
      e nel giro di pochi anni quel metodo sostituì la fusione come via principale
      per estrarre argento in tutte le colonie spagnole d''America.'
    attendibilita: documentato
  - id: vicenda-discusso-data-patio
    sezione: vicenda
    testo: 'Sulla data di quel procedimento le fonti non concordano, e la divergenza
      vale la pena dichiararla. La nota base di questo vault colloca il processo del
      patio nel 1558; la voce dedicata al processo lo data al 1554, anno del primo
      impiego su scala da parte di Medina a Pachuca; e la voce sull''amalgamazione
      in tino dice, en passant, che il patio era in uso «dalla sua invenzione nel
      1557». Tre date in tre fonti, e non sono necessariamente in contraddizione:
      una tecnica di questo tipo ha una data di prima sperimentazione, una di primo
      impiego industriale e una di licenza o riconoscimento ufficiale, e le fonti
      non sempre dicono quale stanno usando. Questo approfondimento segue il 1554
      delle voci e dichiara la discrepanza invece di comporla in silenzio.'
    attendibilita: discusso
  - id: vicenda-potosi-rinascita
    sezione: vicenda
    testo: A Potosí, la montagna d'argento delle Ande, quel procedimento fece la differenza
      fra la fine e la continuazione. Entro il 1565 i minatori avevano esaurito il
      minerale che si poteva fondere direttamente, e la produzione era crollata; l'amalgamazione
      con mercurio la fece risorgere, perché permetteva di lavorare i minerali a basso
      tenore e quelli contenenti solfuro d'argento, cioè esattamente ciò che si trovava
      scendendo in profondità. Nel 1609, sempre a Potosí, fu messo a punto un secondo
      metodo di amalgamazione, il processo in tino, meglio adatto alle condizioni
      locali. È il mercurio a stabilire per quanti altri decenni quella montagna sarebbe
      stata scavata.
    attendibilita: documentato
  - id: vicenda-tino
    sezione: vicenda
    testo: 'Il difetto del processo del patio era il tempo: settimane di trattamento
      per ogni partita di minerale, perché tutto avveniva a freddo in cortili all''aperto.
      Nel 1609, a Potosí, Alvaro Alonso Barba mise a punto l''alternativa veloce:
      mescolare il minerale con sale e mercurio, talvolta con solfato di rame, e scaldare
      il tutto in recipienti bassi di rame. Il tempo di trattamento scese a dieci
      o venti ore. La scelta fra i due metodi dipendeva da due variabili molto concrete:
      il clima, perché il caldo accelerava il processo del patio rendendo inutile
      il fuoco, e la disponibilità e il costo del combustibile per scaldare i tini.
      La metallurgia coloniale si decideva sulla legna.'
    attendibilita: documentato
  - id: vicenda-costo-mercurio
    sezione: vicenda
    testo: 'C''è una cifra che spiega da sola perché Almadén abbia dovuto produrre
      duecentocinquantamila tonnellate di mercurio, e perché il metallo liquido sia
      una voce di bilancio dell''impero spagnolo: nei processi di amalgamazione la
      perdita di mercurio era in genere da una a due volte il peso dell''argento recuperato.
      Per ogni chilo d''argento che partiva verso la Spagna, fra uno e due chili di
      mercurio non tornavano indietro. Non è una dispersione accidentale: è il costo
      diretto del metodo, e andava a finire nei luoghi dove il metodo si applicava.'
    attendibilita: documentato
  - id: vicenda-mita
    sezione: vicenda
    testo: 'Il lavoro lo fornivano gli indigeni, e lo fornivano per obbligo. Il sistema
      si chiamava mita ed era la versione spagnola di un istituto andino preispanico
      che indirizzava il lavoro verso opere pubbliche e progetti agricoli collettivi:
      la forma fu conservata, lo scopo rovesciato. I lavoratori venivano prelevati
      da un''area di quasi duecentomila miglia quadrate, e le cifre della coscrizione
      dicono tutto il resto: tredicimila uomini all''anno, circa uno ogni sette maschi
      adulti della popolazione indigena. Non era una tassa sul reddito né sui raccolti:
      era una tassa sulle persone, riscossa in corpi.'
    attendibilita: documentato
  - id: vicenda-mitayos
    sezione: vicenda
    testo: 'Ai mitayos toccavano i lavori meno desiderabili. Mentre gli operai più
      qualificati staccavano il minerale, loro dovevano portarlo in superficie dentro
      ceste, sacchi di cuoio o di stoffa; i carichi pesavano spesso fra le cento e
      le trecento libbre, cioè fra i quarantacinque e i centotrentacinque chilogrammi,
      e andavano portati su per scale malferme in pozzi stretti e ripidi, illuminati
      soltanto da una candela legata alla fronte. Molti morirono o rimasero gravemente
      feriti per cadute, incidenti e per le condizioni di vita della miniera. Chi
      ha letto l''approfondimento dello zolfo riconoscerà la scena: sono i carusi
      siciliani con tre secoli di anticipo e a quattromila metri di quota.'
    attendibilita: documentato
  - id: vicenda-mercurio-uccide
    sezione: vicenda
    testo: 'All''infortunio si aggiungeva la malattia, e in due forme. La prima era
      la polmonite, resa quasi inevitabile dal salto termico fra il caldo dei pozzi
      profondi e il gelo della superficie, che a Potosí sta a sedicimila piedi, quasi
      cinquemila metri. La seconda era il mercurio: l''avvelenamento, annotano le
      fonti, tolse la vita a molti fra gli addetti alla raffinazione. È il punto in
      cui questo elemento smette di essere lo sfondo tecnico della storia e ne diventa
      il protagonista: il metallo che rendeva possibile l''argento uccideva chi lo
      maneggiava, e lo faceva in silenzio, senza il rumore di un crollo in galleria.'
    attendibilita: documentato
  - id: vicenda-demografia
    sezione: vicenda
    testo: 'Gli effetti non restarono dentro la miniera. La mita di Potosí produsse
      spostamenti demografici enormi: mogli e figli si trasferivano con i lavoratori,
      e altre migliaia di persone fuggivano dai villaggi tradizionali rinunciando
      ai diritti sulla terra del proprio ayllu pur di sottrarsi alla leva. L''area
      interessata da questi spostamenti andava, in termini approssimativi, da Quito
      a Buenos Aires: un continente rimescolato dalla domanda di un solo metallo.
      Entro la fine del diciassettesimo secolo l''alto Perù aveva perduto quasi il
      cinquanta per cento della propria popolazione indigena.'
    attendibilita: documentato
  - id: vicenda-cina
    sezione: vicenda
    testo: 'Vale la pena chiedersi dove andasse tutto quell''argento, perché la risposta
      cambia la scala della storia. Le miniere dell''America spagnola erano in quel
      periodo le fonti d''argento più abbondanti del mondo, e la domanda più forte
      veniva dalla Cina; gli spagnoli la soddisfacevano attraverso il commercio fra
      l''America Latina e le Filippine, con i galeoni di Manila. Il risultato fu un
      boom minerario spettacolare. La catena completa è questa: mercurio spagnolo
      e peruviano per amalgamare argento andino, estratto da lavoratori coscritti,
      per pagare merci cinesi. Una catena commerciale che lega tre continenti, e al
      centro c''è un metallo liquido.'
    attendibilita: documentato
  - id: vicenda-chisso
    sezione: vicenda
    testo: 'La seconda volta in cui il mercurio presenta il conto è nel Novecento,
      in Giappone, e stavolta le vittime non lavorano in miniera: mangiano pesce.
      Nel 1908 la Chisso apre uno stabilimento chimico a Minamata, sulla costa occidentale
      del Kyūshū; produce prima fertilizzanti, poi acetilene, acetaldeide, acido acetico,
      cloruro di vinile. Il ciclo catalitico impiegato ha una reazione secondaria
      che produce metilmercurio, un composto organico del mercurio, in quantità tutt''altro
      che trascurabile: circa il cinque per cento dello scarico. Quel composto altamente
      tossico finì regolarmente nella baia di Minamata, e gli scarichi complessivi
      di mercurio dalla fabbrica proseguirono dal 1932 al 1968.'
    attendibilita: documentato
  - id: vicenda-gatti
    sezione: vicenda
    testo: 'I primi ad ammalarsi furono gli animali, e per anni nessuno collegò le
      cose. Intorno al 1950 cominciarono le segnalazioni di gatti che avevano convulsioni,
      impazzivano e morivano; la gente del posto chiamò quel che vedeva «malattia
      del gatto danzante», per i movimenti scomposti delle bestie. Non erano soli:
      i corvi cadevano dal cielo, le alghe smisero di crescere sul fondale, i pesci
      galleggiavano morti in superficie. Una baia intera stava dando segnali per mezzo
      decennio prima che qualcuno cominciasse a leggerli.'
    attendibilita: documentato
  - id: vicenda-bambina
    sezione: vicenda
    testo: 'La data in cui la faccenda diventa umana è il 21 aprile 1956. Quel giorno
      una bambina di cinque anni viene visitata all''ospedale della fabbrica Chisso
      a Minamata, e i medici non sanno che pensare dei suoi sintomi: difficoltà a
      camminare, difficoltà a parlare, convulsioni. Due giorni dopo la sorella minore
      comincia a manifestare gli stessi segni e viene ricoverata anche lei. È la madre
      a dire ai medici che anche la figlia della vicina ha problemi simili. Da quell''indicazione
      parte un''indagine casa per casa che porta al ricovero di altri otto pazienti.
      La malattia aveva già un nome nella bocca della gente prima di averne uno nei
      registri.'
    attendibilita: documentato
  - id: vicenda-stigma
    sezione: vicenda
    testo: 'La reazione iniziale fu quella che si ha davanti a un''epidemia: i pazienti
      vennero isolati e le loro case disinfettate a scopo precauzionale. Il contagio
      fu smentito poco dopo — non c''era nulla da contagiare, era veleno — ma quella
      prima risposta lasciò un segno che durò decenni, perché contribuì alla stigmatizzazione
      e alla discriminazione che i sopravvissuti di Minamata subirono dalla propria
      comunità. È una delle conseguenze meno raccontate degli avvelenamenti industriali:
      chi ne è colpito viene prima ammalato e poi evitato, e la seconda ferita se
      la infligge il vicinato.'
    attendibilita: documentato
  - id: vicenda-denaro-simpatia
    sezione: vicenda
    testo: 'Nel novembre del 1959 i pazienti protestarono davanti ai cancelli della
      Chisso, e ne uscì un accordo che le cronache chiamano «denaro di simpatia»:
      non un risarcimento, perché avrebbe implicato una responsabilità, ma un gesto
      di compassione. Le cifre meritano di essere riportate per esteso, perché dicono
      quanto valesse una vita in quella trattativa: ai pazienti adulti centomila yen
      l''anno, circa novecento diciassette dollari dell''epoca; ai bambini trentamila
      yen, duecento settantacinque dollari; alle famiglie dei morti un versamento
      unico di trecentoventimila yen, circa duemilanovecento dollari. Una volta sola,
      per un figlio.'
    attendibilita: documentato
  - id: vicenda-congenita
    sezione: vicenda
    testo: 'C''era poi una categoria di vittime che nessuno aveva previsto, perché
      contraddiceva quel che si credeva di sapere: i bambini nati dopo. Si riteneva
      che la placenta proteggesse il feto dai veleni; il metilmercurio la attraversa.
      Dopo anni di studio e l''autopsia di due bambini, i medici annunciarono che
      si trattava di una forma congenita della malattia di Minamata fino ad allora
      non riconosciuta, con microcefalia, danno cerebrale esteso e sintomi simili
      a quelli della paralisi cerebrale infantile. Il 29 novembre 1962 la commissione
      di certificazione si riunì e riconobbe come pazienti i due bambini morti e sedici
      ancora vivi. Erano nati malati da madri che non avevano sintomi.'
    attendibilita: documentato
  - id: vicenda-conti
    sezione: vicenda
    testo: Il conto finale si legge in due modi, e nessuno dei due consola. L'avvelenamento
      e le morti, di esseri umani e di animali, proseguirono per trentasei anni, mentre
      la Chisso e il governo della prefettura di Kumamoto facevano poco per fermare
      l'epidemia. Al marzo 2001 le persone ufficialmente riconosciute malate erano
      2.265, e oltre diecimila avevano ricevuto un compenso economico dall'azienda;
      entro il 2004 la Chisso aveva pagato ottantasei milioni di dollari, e nello
      stesso anno le fu ordinato di bonificare la contaminazione. Il 29 marzo 2010
      si arrivò a un accordo per indennizzare le vittime non ancora certificate. Cinquantaquattro
      anni dopo la bambina di cinque anni, si discuteva ancora di chi avesse diritto
      a essere chiamato vittima.
    attendibilita: documentato
  - id: vicenda-niigata
    sezione: vicenda
    testo: 'E poi accadde di nuovo. Nel 1965, lungo le rive del fiume Agano nella
      prefettura di Niigata, comparve un secondo focolaio: la fabbrica responsabile,
      della Showa Denko, usava un processo chimico con catalizzatore al mercurio molto
      simile a quello della Chisso. Perfino i segnali premonitori si ripeterono identici:
      fra l''autunno del 1964 e la primavera del 1965 i gatti che vivevano lungo il
      fiume furono visti impazzire e morire, esattamente come a Minamata quindici
      anni prima. Sapere non era bastato. Le due malattie di Minamata sono considerate
      due delle quattro grandi malattie da inquinamento del Giappone.'
    attendibilita: documentato
  - id: impatto-almaden
    sezione: impatto
    testo: 'Per rifornire l''America di mercurio la corona spagnola disponeva di un
      asso che nessun altro impero aveva: Almadén, in Castiglia. Il nome viene dall''arabo
      al-maʻdin, che vuol dire «la miniera» e basta, come se in quel luogo non ci
      fosse altro da nominare; era insediamento minerario già in epoca romana, poi
      moresco, e passò ai cristiani nel 1151. I suoi giacimenti hanno prodotto la
      maggior quantità di mercurio metallico liquido del mondo: circa duecentocinquantamila
      tonnellate. Il controllo di quel buco nel terreno valeva quanto il controllo
      delle flotte, perché senza mercurio l''argento americano restava dentro la roccia.'
    attendibilita: documentato
  - id: impatto-condanna-a-morte
    sezione: impatto
    testo: 'Che cosa significasse lavorare in quelle miniere lo dicono le fonti con
      una formula che non richiede commento. Estrarre e lavorare il cinabro era pericoloso:
      causava tremori, perdita dei sensi e morte, perché il mercurio veniva distillato
      dal minerale e i lavoratori erano esposti ai suoi fumi tossici. E sulle miniere
      spagnole di Almadén, duecentoventicinque chilometri a sudovest di Madrid, la
      letteratura riporta un giudizio secco: lavorarvi era considerato equivalente
      a una condanna a morte, per la ridotta aspettativa di vita di minatori che erano
      schiavi o forzati. Non era un rischio del mestiere: era il mestiere.'
    attendibilita: documentato
  - id: impatto-almaden-forzati
    sezione: impatto
    testo: 'C''è però una frase, nella voce dedicata ad Almadén, che merita di essere
      letta lentamente. A causa della tossicità del mercurio e dei suoi sottoprodotti
      per gli esseri umani, dice, la miniera ha impiegato nel corso della sua lunga
      storia, di volta in volta, lavoro penale, lavoro schiavile e prigionieri di
      guerra. Il nesso causale è dichiarato: non si trattava di manodopera a basso
      costo per convenienza, ma di persone che non potevano rifiutare, mandate in
      un posto dove chi poteva scegliere non andava. La stessa logica che a Potosí
      si chiamava mita, applicata dall''altra parte dell''oceano con un altro nome.'
    attendibilita: documentato
  - id: impatto-almaden-museo
    sezione: impatto
    testo: 'La miniera ha smesso di lavorare nel 2002, per effetto del divieto europeo
      di estrazione del mercurio: duemila anni di attività finiti con un atto normativo.
      Dal 2006 il primo livello, cinquanta metri sotto terra, è visitabile dal pubblico,
      e nel 2012 Almadén è stata dichiarata patrimonio dell''umanità insieme a Idrija,
      in Slovenia, sotto una candidatura intitolata «Patrimonio del mercurio». È una
      conclusione che dice qualcosa sull''epoca: il luogo da cui è uscito il metallo
      che ha finanziato un impero e ucciso i suoi minatori è diventato un museo, e
      lo si visita scendendo negli stessi pozzi.'
    attendibilita: documentato
  - id: impatto-termometro
    sezione: impatto
    testo: 'L''altro impero costruito sul mercurio è quello della misura, e comincia
      con un abbandono. Nel 1659 l''astronomo Ismael Boulliau smise di usare il mercurio
      nei termometri, avendo stabilito che rispondeva alle variazioni di temperatura
      meno prontamente dell''alcol: un giudizio ragionevole e sbagliato nelle conseguenze.
      Nel 1713 Daniel Gabriel Fahrenheit riprese in mano la questione e cominciò a
      sperimentare; nel 1717 vendeva termometri a mercurio commercialmente. La loro
      superiorità su quelli ad alcol li rese popolarissimi, e con essi si diffuse
      la scala che quel costruttore aveva messo a punto per i propri strumenti. La
      scala Fahrenheit è sopravvissuta al proprio termometro di quasi tre secoli.'
    attendibilita: documentato
  - id: impatto-numero
    sezione: impatto
    testo: 'Il punto non è lo strumento ma quel che ha reso possibile: sostituire
      un aggettivo con un numero. La febbre smette di essere «alta» e diventa trentanove
      e due; l''aria smette di essere «fredda» e diventa meno tre. Sembra un dettaglio
      e invece è la precondizione di intere discipline, perché senza misure ripetibili
      non si possono confrontare esperimenti fatti in luoghi e in anni diversi. Per
      due secoli quella colonnina argentea è stata l''interfaccia fra il mondo fisico
      e i registri di laboratorio, e la medicina clinica moderna comincia, in senso
      molto letterale, quando si mette un termometro sotto l''ascella di un paziente.'
    attendibilita: documentato
  - id: impatto-sifilide
    sezione: impatto
    testo: 'Prima di essere uno strumento, il mercurio è stato per secoli un farmaco,
      e non del tutto a torto. In Europa lo si usava già nel 1363 per curare le malattie
      della pelle, e quando la sifilide cominciò a diffondersi i preparati mercuriali
      furono fra i primi rimedi impiegati contro di essa. Il motivo per cui funzionavano,
      almeno un po'', è che il mercurio è fortemente antimicrobico: nel Cinquecento
      si trovò che in certi casi bastava ad arrestare lo sviluppo della malattia,
      applicato sulle ulcere come unguento o inalato come suffumigio, e lo si somministrava
      anche per ingestione. Non era superstizione: era un antibiotico prima degli
      antibiotici, con il difetto di non saper distinguere fra il microbo e il paziente.'
    attendibilita: documentato
  - id: impatto-cura-peggiore
    sezione: impatto
    testo: 'Il limite di quella terapia è enunciato nelle fonti con una chiarezza
      che non lascia scampo. Una volta che la malattia aveva preso piede, le quantità
      e le forme di mercurio necessarie a controllarne lo sviluppo eccedevano la capacità
      del corpo umano di tollerarlo, e la cura diventava peggiore e più letale della
      malattia stessa. Nacque così una categoria clinica paradossale, l''avvelenamento
      da mercurio di origine medica: gente che moriva non della sifilide ma di ciò
      che le era stato dato contro. È la stessa logica che si ritrova nell''elisir
      di lunga vita cinese, applicata però con intenzione terapeutica e non con ambizione
      di immortalità.'
    attendibilita: documentato
  - id: impatto-cloro-soda
    sezione: impatto
    testo: 'L''uso che ne ha consumato di più, però, non si vede in nessuna casa.
      Il processo cloro-soda ricava cloro e soda caustica dall''acqua salata, e una
      delle sue tecnologie storiche impiega una cella con catodo di mercurio liquido.
      Il metodo ha un pregio reale, perché dà soda caustica priva di cloro, e un difetto
      che le fonti non attenuano: richiede parecchie tonnellate di mercurio per impianto.
      In un normale ciclo di produzione qualche centinaio di libbre l''anno finiscono
      in ambiente e vi si accumulano; per giunta il cloro e la soda che ne escono
      sono essi stessi contaminati da tracce di mercurio. È da qui, non dai termometri
      rotti, che è arrivata la gran parte del mercurio industriale disperso.'
    attendibilita: documentato
  - id: impatto-membrana
    sezione: impatto
    testo: 'La sostituzione è arrivata, e per una volta senza bisogno di un disastro
      che la imponesse: il processo a membrana, sviluppato negli ultimi sessant''anni,
      è semplicemente migliore. Ha una efficienza energetica superiore e non usa sostanze
      pericolose — né il mercurio della cella a mercurio né l''amianto della cella
      a diaframma, che era l''altra tecnologia storica. In cambio la soda che produce
      contiene cloro e va depurata, il che è un problema di impianto, non di salute
      pubblica. Vale la pena ricordare quanto è vecchia questa industria: la produzione
      elettrolitica su scala industriale è cominciata nel 1892, quasi novant''anni
      dopo che William Cruikshank aveva ottenuto cloro elettrolizzando salamoia.'
    attendibilita: documentato
  - id: impatto-otturazioni
    sezione: impatto
    testo: 'C''è poi l''impiego che quasi tutti gli adulti si portano in bocca o se
      lo sono portato: l''amalgama dentale, cioè mercurio legato a una polvere di
      argento, stagno e rame. Ha dominato l''odontoiatria per oltre un secolo perché
      costa poco, dura a lungo e si mette in opera anche in condizioni non ideali,
      cosa che i materiali compositi tollerano molto meno. Il paradosso è evidente
      e ha alimentato una controversia lunghissima: il materiale con cui si sono riparati
      i denti per oltre un secolo conteneva, in peso, circa metà di un veleno noto
      come tale fin dall''antichità.'
    attendibilita: documentato
  - id: controversie-tre-mercuri
    sezione: controversie
    testo: 'Parlare di «tossicità del mercurio» senza specificare quale mercurio è
      il modo più rapido per dire qualcosa di sbagliato, perché le forme si comportano
      in maniera profondamente diversa. Il metallo liquido ingerito attraversa l''intestino
      quasi senza essere assorbito, ed è per questo che i termometri rotti hanno fatto
      meno danni di quanto la fama del metallo suggerisca. I vapori, che il mercurio
      emette già a temperatura ambiente, passano invece dai polmoni al sangue e da
      lì al sistema nervoso centrale. E i composti organici, il metilmercurio soprattutto,
      sono un''altra cosa ancora: attraversano le membrane biologiche come se non
      ci fossero.'
    attendibilita: documentato
  - id: controversie-catena
    sezione: controversie
    testo: 'Il meccanismo che rende il metilmercurio un problema di sanità pubblica
      e non solo industriale si chiama biomagnificazione, e conviene distinguerlo
      dal bioaccumulo. Bioaccumulo significa che un organismo trattiene una sostanza
      invece di eliminarla, accumulandola nel corso della vita. Biomagnificazione
      significa che la concentrazione cresce salendo di livello nella catena alimentare,
      perché ogni predatore incamera il carico di tutte le prede che mangia. Il risultato
      è che l''acqua può contenere quantità trascurabili e il pesce grande in cima
      alla catena quantità pericolose: il veleno si concentra proprio dove l''essere
      umano va a prenderlo.'
    attendibilita: documentato
  - id: controversie-eretismo
    sezione: controversie
    testo: 'L''avvelenamento cronico da vapori di mercurio ha un nome clinico, eretismo,
      e un quadro sintomatologico che merita di essere letto per intero, perché non
      somiglia a quello che si immagina parlando di un veleno. Colpisce l''intero
      sistema nervoso centrale e si manifesta come un cambiamento del carattere: irritabilità,
      scarsa fiducia in sé, depressione, apatia, timidezza; nei casi estremi, con
      esposizione prolungata, delirio, alterazioni della personalità e perdita di
      memoria. Chi ne soffre ha spesso difficoltà nelle relazioni sociali. Ai sintomi
      psichici si accompagnano riduzione della forza fisica, mal di testa, dolori
      diffusi, tremori e battito cardiaco irregolare. È un veleno che cambia chi sei
      prima di attaccare quello che fai.'
    attendibilita: documentato
  - id: controversie-mestieri
    sezione: controversie
    testo: 'L''eretismo è quasi sempre una malattia professionale, e l''elenco dei
      mestieri a rischio è, a leggerlo di seguito, un riassunto di questo approfondimento:
      gli impianti cloro-soda, le fabbriche di termometri, la soffiatura del vetro,
      la produzione di lampade fluorescenti, l''edilizia, gli studi dentistici e le
      miniere d''oro e d''argento. Ogni uso che abbiamo raccontato compare in questa
      lista dal lato di chi lo eseguiva. È il motivo per cui la storia del mercurio
      non si può raccontare soltanto attraverso gli oggetti che ha reso possibili:
      gli oggetti stanno nelle case, il danno sta nei luoghi dove venivano fabbricati.'
    attendibilita: documentato
  - id: controversie-discusso-cappellai
    sezione: controversie
    testo: 'Il caso dei cappellai è quello che di quella lista è entrato nel linguaggio
      comune, e va raccontato con una cautela in più di quella che di solito riceve.
      Il fatto tecnico non è in discussione: nell''Inghilterra del Settecento e dell''Ottocento
      il mercurio si usava nella produzione del feltro, materiale corrente nella fabbricazione
      dei cappelli, e l''uso prolungato di quei preparati causava fra i cappellai
      un eretismo da avvelenamento. La nota base di questo vault, come molte divulgazioni,
      fa discendere da qui l''espressione inglese «matto come un cappellaio». La voce
      consultata è più prudente: dice che questa è talvolta indicata come l''origine
      della frase, formulazione che segnala un''attribuzione ricorrente e non una
      derivazione accertata. La malattia dei cappellai è documentata; che le abbia
      dato il nome quel modo di dire resta probabile e non dimostrato.'
    attendibilita: discusso
  - id: controversie-mimetismo
    sezione: controversie
    testo: 'Il motivo per cui il metilmercurio arriva dove nessun veleno dovrebbe
      arrivare è un inganno molecolare di raffinatezza notevole. Il composto si lega
      alla cisteina, e il complesso che ne risulta viene riconosciuto dalle proteine
      che trasportano gli amminoacidi come se fosse metionina, un amminoacido essenziale.
      Grazie a questo mimetismo viene trasportato liberamente in tutto il corpo: attraversa
      la barriera ematoencefalica, che dovrebbe proteggere il cervello, e attraversa
      la placenta, dove viene assorbito dal feto in via di sviluppo. Per la stessa
      ragione, e per il suo forte legame con le proteine, non viene eliminato facilmente:
      l''emivita nel sangue umano è di circa cinquanta giorni. Il corpo non lo respinge
      perché non lo riconosce come estraneo: gli apre la porta scambiandolo per un
      nutriente.'
    attendibilita: documentato
  - id: controversie-dosi-basse
    sezione: controversie
    testo: 'Questo spiega perché il problema non finisca con i casi clamorosi. Oltre
      agli avvelenamenti conclamati come quelli di Minamata, diversi studi indicano
      che il metilmercurio è collegato a deficit di sviluppo sottili nei bambini esposti
      nell''utero: perdita di punti di quoziente intellettivo, prestazioni ridotte
      nei test sulle abilità linguistiche, sulla memoria e sull''attenzione. Non sono
      sintomi che portino qualcuno in ospedale, e proprio per questo sono più insidiosi
      da governare: non si vedono su un individuo, si vedono su una popolazione, e
      la raccomandazione che ne discende — quali pesci mangiare in gravidanza e quanti
      — arriva alle persone come un''avvertenza nutrizionale invece che come la conseguenza
      di una storia industriale.'
    attendibilita: documentato
  - id: controversie-calomelano
    sezione: controversie
    testo: 'Il farmaco mercuriale che le fonti chiamano «popolare medicina vittoriana»
      si chiamava calomelano. Che cosa significasse per chi lo riceveva lo raccontano
      due storie documentate. Nella sua autobiografia del 1859 la sarta scozzese Elizabeth
      Storie descrive la propria vita di donna disabile, conseguenza di un grave avvelenamento
      da mercurio subìto quando un medico tentò di curare con somministrazioni prolungate
      di calomelano una lieve malattia infantile. Nel 1862 il soldato Carleton Burgan
      riportò una grave sfigurazione del volto per lo stesso motivo: un''infezione
      trattata con quel farmaco. Sono i casi in cui il danno non viene dall''industria
      né dall''ignoranza dei poveri, ma direttamente dal medico.'
    attendibilita: documentato
  - id: controversie-un-grammo
    sezione: controversie
    testo: 'Se si vuole una sola frase che riassuma la pericolosità di questo elemento,
      le fonti ne offrono una che vale la pena citare così com''è: tutte le forme
      del mercurio, tranne il metallo liquido elementare, producono tossicità o morte
      con meno di un grammo. Meno di un grammo: la massa di una graffetta. La distinzione
      fra le forme resta decisiva — lo stato zero esiste come vapore o metallo liquido,
      lo stato mercuroso come sali inorganici, quello mercurico come sali oppure come
      composti organomercurici — ma il margine di sicurezza, una volta usciti dal
      metallo liquido, è sottilissimo. E le vie d''ingresso sono banali: aria contaminata,
      cibo, e in certi paesi il consumo di carne di balena e di delfino, che le fonti
      indicano come fonte di avvelenamenti elevati.'
    attendibilita: documentato
  - id: controversie-wetterhahn
    sezione: controversie
    testo: 'Quanto siano pericolosi quei composti lo dice un caso singolo, e vale
      tutte le tabelle tossicologiche. Karen Wetterhahn, professoressa di chimica
      al Dartmouth College, era una specialista dell''esposizione ai metalli tossici:
      sapeva esattamente con cosa stava lavorando. Nel 1996 maneggiò dimetilmercurio
      indossando i guanti protettivi allora in uso, che si rivelarono insufficienti.
      Una o due gocce assorbite attraverso il guanto bastarono a ucciderla: morì nel
      giugno del 1997, a quarantotto anni, meno di un anno dopo l''esposizione. La
      competenza non l''ha protetta, perché il problema non era ciò che sapeva ma
      ciò che nessuno sapeva: che quel materiale attraversasse il lattice.'
    attendibilita: documentato
  - id: controversie-discusso-amalgama
    sezione: controversie
    testo: 'Sull''amalgama dentale la discussione dura da oltre un secolo e mezzo
      e non è stata composta da un verdetto unico. Su un punto gli scienziati concordano:
      le otturazioni in amalgama rilasciano vapore di mercurio elementare, e la stima
      della Food and Drug Administration statunitense è di uno-tre microgrammi al
      giorno. È sugli effetti di quella esposizione che il consenso si rompe, e gli
      studi riportano quantità diverse a seconda del metodo di misura, alcuni dei
      quali — nati per gli ambienti industriali e applicati alla bocca — sono stati
      accusati di sovrastimarle parecchio. Significativo è come si è mossa nel tempo
      la FDA stessa: prima dichiarava l''amalgama sicura per gli adulti e per i bambini
      dai sei anni in su, oggi la sconsiglia per i bambini, per le donne in gravidanza
      o che allattano e per altri gruppi a rischio. Questo approfondimento registra
      la controversia senza arbitrarla.'
    attendibilita: discusso
  - id: controversie-amalgama-storia
    sezione: controversie
    testo: Vale la pena notare quanto sia antica questa pratica, perché smentisce
      l'idea che si tratti di un'invenzione industriale recente. L'amalgama compare
      per la prima volta nella materia medica cinese di Su Kung nel 659 dopo Cristo,
      durante la dinastia Tang; in Europa, Johannes Stockerus, medico municipale di
      Ulm in Germania, la raccomandava come materiale da otturazione già nel 1528.
      Sono quasi mille e quattrocento anni di mercurio nella bocca delle persone,
      in tre continenti e in epoche che non condividevano né la chimica né la medicina,
      ma condividevano il problema pratico di chiudere un buco in un dente con qualcosa
      che durasse.
    attendibilita: documentato
  - id: eredita-quattro-malattie
    sezione: eredita
    testo: 'Minamata non è un caso isolato ma parte di una serie che il Giappone nomina
      per intero: le quattro grandi malattie da inquinamento, epidemie tossicologiche
      di origine umana avvenute nel Novecento, tutte causate dalla gestione cronicamente
      impropria dei rifiuti industriali da parte di imprese giapponesi. La prima risale
      al 1912, l''avvelenamento da cadmio della prefettura di Toyama, dovuto agli
      scarichi di una società mineraria e metallurgica e noto come malattia itai-itai;
      le altre tre appartengono agli anni Cinquanta e Sessanta, e due di esse sono
      da mercurio. La voce precisa un punto che vale la pena riportare: i due episodi
      di Minamata non erano malattie diverse, ma la stessa malattia per patologia
      ed eziologia, distinta solo dal luogo e dal tempo. Il paese ha imparato la lezione
      due volte.'
    attendibilita: documentato
  - id: eredita-sakamoto
    sezione: eredita
    testo: 'Il passaggio dalla baia al diritto internazionale ha una data e un volto.
      Nel 1972, alla Conferenza di Stoccolma sull''ambiente umano, i delegati videro
      Shinobu Sakamoto, studentessa giapponese delle medie, disabile per un avvelenamento
      da metilmercurio subìto nell''utero materno. Non era una relazione tecnica né
      una tabella di concentrazioni: era una ragazzina, e i delegati la videro. Le
      crisi sanitarie di Minamata e di Niigata sono ciò che ha portato il mercurio
      all''attenzione internazionale, ed è per questo che quarant''anni dopo il trattato
      porta il nome di quella baia.'
    attendibilita: documentato
  - id: eredita-convenzione
    sezione: eredita
    testo: Il testo fu approvato a Ginevra il 19 gennaio 2013 da delegati di quasi
      centoquaranta paesi, firmato il 10 ottobre dello stesso anno a Kumamoto, in
      Giappone, ed entrò in vigore il 16 agosto 2017, novanta giorni dopo che almeno
      cinquanta stati l'avevano ratificato; oggi conta centoventotto firmatari e centocinquantatré
      parti. La scelta del nome, annota la voce, ha un'importanza simbolica precisa,
      perché quella città attraversò un episodio devastante di avvelenamento da mercurio.
      Chiamare un trattato come il luogo di un disastro serve a impedire che il disastro
      venga dimenticato da chi firma.
    attendibilita: documentato
  - id: eredita-oro-artigianale
    sezione: eredita
    testo: 'Il paradosso della ritirata è che il mercurio è quasi sparito da dove
      si vedeva e non da dove fa più danno. Termometri, interruttori, relè e batterie
      sono usciti dalle case e dagli ospedali nell''arco di una generazione; l''estrazione
      artigianale e su piccola scala dell''oro, invece, continua a impiegarlo esattamente
      come quattro secoli fa nelle Ande, ed è oggi la maggiore singola fonte di emissioni
      di mercurio di origine umana: fino a mille tonnellate immesse in atmosfera ogni
      anno. Chi fa quel lavoro mescola il mercurio al materiale aurifero, scalda l''amalgama
      per farlo evaporare e respira quel che se ne va. La tecnologia che ha ucciso
      i mitayos è ancora in servizio, e a maneggiarla sono ancora i più poveri.'
    attendibilita: documentato
  - id: eredita-ciclo
    sezione: eredita
    testo: 'C''è una ragione per cui il mercurio richiede un trattato e non basta
      una legge nazionale: si muove, e cambia forma muovendosi. Il suo ciclo biogeochimico
      è influenzato da processi naturali e antropici che lo trasformano attraverso
      più forme chimiche e più ambienti, passando fra i tre stati di ossidazione in
      cui esiste. Le emissioni in atmosfera si distinguono in primarie, che liberano
      mercurio dalla litosfera, e secondarie, che se lo scambiano fra i serbatoi di
      superficie: sommando le une e le altre, ogni anno finiscono in atmosfera oltre
      cinquemila tonnellate di mercurio. La distinzione conta: una parte di quel mercurio
      viene immessa ora, un''altra è mercurio già presente in superficie che torna
      a circolare.'
    attendibilita: documentato
  - id: eredita-metilazione
    sezione: eredita
    testo: 'Il passaggio che rende quel ciclo un problema sanitario e non solo chimico
      avviene in acqua, ed è opera di microrganismi: sono batteri a trasformare il
      mercurio inorganico in metilmercurio. È lo stesso meccanismo osservato a Minamata,
      dove si è ipotizzato che parte del solfato di mercurio scaricato sia stato metilato
      dai batteri del sedimento; e una volta formato, quel composto si bioaccumula
      e si biomagnifica nei molluschi e nei pesci. Il punto è che l''ultimo passaggio
      della catena non lo controlla nessuno: si può smettere di scaricare mercurio,
      ma quello già depositato nei fondali continua a essere trasformato in veleno
      da organismi che non sanno di farlo.'
    attendibilita: documentato
  - id: eredita-lampade
    sezione: eredita
    testo: 'Un impiego sopravvissuto a lungo proprio mentre tutti gli altri cadevano
      è quello delle lampade fluorescenti, e la ragione è che senza mercurio non funzionano.
      Il tubo è una lampada a scarica in vapore di mercurio a bassa pressione: la
      corrente elettrica eccita il vapore, il vapore emette ultravioletto, e l''ultravioletto
      fa brillare il rivestimento di fosfori steso sul vetro, che riemette la radiazione
      come luce visibile. Tre passaggi, e quello centrale è il mercurio. La convivenza
      fra utilità e pericolo ha lasciato un segno tipografico: negli Stati Uniti il
      simbolo (Hg) è obbligatorio su tutte le lampade fluorescenti che lo contengono,
      così che chi la rompe sappia cosa ha in casa.'
    attendibilita: documentato
  - id: eredita-led
    sezione: eredita
    testo: 'Quelle lampade non erano un capriccio: convertono l''energia elettrica
      in luce visibile molto più efficientemente delle lampade a incandescenza, e
      per decenni sono state la scelta sensata ovunque servisse illuminare a lungo
      e a basso costo — uffici, scuole, fabbriche, supermercati. È il motivo per cui
      il mercurio è rimasto nei soffitti del mondo sviluppato molto dopo essere uscito
      dagli ospedali. A chiudere la partita non è stata una lampada al mercurio migliore,
      né un divieto: è stata una tecnologia che risolve lo stesso problema per un''altra
      strada, il diodo a emissione di luce, che produce luce senza bisogno di alcun
      vapore metallico.'
    attendibilita: documentato
  - id: eredita-nome
    sezione: eredita
    testo: 'Resta il nome, che è l''unica cosa del mercurio a non aver fatto danni.
      Il dio romano che lo battezza è quello del commercio, dell''eloquenza, dei messaggi,
      dei viaggiatori, dei confini, della fortuna, del guadagno — e anche, nello stesso
      elenco, dell''inganno e dei ladri. Gli si deve il nome del mercoledì, dies Mercurii.
      Il metallo prende quel nome dal pianeta, con cui l''alchimia medievale lo associava,
      e il simbolo chimico racconta invece un''altra storia: Hg viene dal latino hydrargyrum,
      a sua volta dal greco hydrárgyros, «argento d''acqua». In inglese è rimasto
      anche il nome comune quicksilver, argento vivo. Chi lo chiamò così non prometteva
      niente: diceva solo quello che vedeva.'
    attendibilita: documentato
  - id: eredita-chiusura
    sezione: eredita
    testo: 'Di tutte le promesse che gli sono state affidate, il mercurio non ne ha
      mantenuta nessuna. Non ha fatto l''oro, perché la trasmutazione non esisteva;
      non ha allungato la vita a chi lo beveva, l''ha accorciata; non ha guarito la
      sifilide se non a prezzo di uccidere il malato prima della malattia. Ha invece
      mantenuto una promessa che nessuno gli aveva chiesto, e cioè di misurare: per
      tre secoli la febbre, la pressione e il tempo atmosferico sono passati per una
      colonnina di questo metallo, e il millimetro di mercurio è ancora l''unità con
      cui si scrive la pressione del sangue. Il conto di tutto il resto lo hanno pagato
      altri: i mitayos che salivano dai pozzi di Potosí con una candela legata in
      fronte, i cappellai che perdevano il carattere prima della memoria, i bambini
      nati malati sulla baia di Minamata. Ha un trattato internazionale intitolato
      al luogo di uno dei propri disastri, e forse è la definizione più onesta che
      se ne possa dare.'
    attendibilita: documentato
