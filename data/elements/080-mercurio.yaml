  note_cronologia: 'La data convenzionale si riferisce ai ritrovamenti di mercurio in tombe
    egizie del XVI-XV secolo a.C. Il cinabro, il minerale da cui si estrae, era già usato
    come pigmento nel Neolitico: il metallo liquido viene dopo, e richiede di sapere che
    riscaldando quel rosso se ne ricava.'
