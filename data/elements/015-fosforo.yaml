contenuti:
  hook: Un alchimista bollì cinquemila litri di urina cercando l'oro, e trovò una
    luce che non si spegneva.
  beats:
  - id: contesto
    sezione: incipit
    testo: 'Il fosforo è l''elemento che brilla senza bruciare: il primo mai scoperto
      con una data, un luogo e un nome d''autore certi, in un''epoca in cui gli altri
      elementi erano ancora materiali senza teoria.'
    visual: Bagliore verde pallido nel buio di un laboratorio del Seicento
    attendibilita: documentato
  - id: alchimista
    sezione: storia
    testo: 'Hennig Brand è un mercante di vetro caduto in disgrazia, ad Amburgo, che
      nella seconda metà del Seicento decide di reinventarsi alchimista. Come tanti
      nel suo secolo insegue la pietra filosofale, la sostanza leggendaria capace
      di trasformare i metalli comuni in oro. Non ha formazione scientifica, ma ha
      un''idea che ai chimici di professione non era venuta: se il corpo umano produce
      sostanze dal colore dell''oro, forse l''oro si nasconde proprio lì.'
    visual: Ritratto immaginario di Brand nel suo laboratorio ad Amburgo
    attendibilita: documentato
  - id: urina
    sezione: storia
    testo: 'Brand si procura quantità enormi di urina umana, raccolta da soldati e
      conoscenti, e la lascia fermentare per giorni prima di farla bollire in grandi
      caldaie fino a ridurla a una pasta densa e scura. Le stime più citate parlano
      di circa cinquemila litri di liquido di partenza per ogni ciclo di distillazione:
      un''operazione lunga, puzzolente e costosa, condotta senza alcuna garanzia di
      successo.'
    visual: Caldaie fumanti in un laboratorio alchemico, odore denso nell'aria
    attendibilita: documentato
  - id: scoperta
    sezione: storia
    testo: 'Nel 1669 Brand scalda il residuo nero fino all''incandescenza e nel collo
      della storta vede condensare vapori bianchi che, raffreddandosi, lasciano una
      sostanza cerosa. Al buio, quella sostanza emette una luce verde pallida e continua,
      senza fiamma né calore percepibile. Non ha trovato l''oro: ha trovato qualcosa
      che nessuno aveva mai visto prima, un materiale che sembra portare la luce dentro
      di sé.'
    visual: Storta di vetro con vapori bianchi che condensano in una sostanza cerosa
      e luminosa
    attendibilita: documentato
  - id: nome
    sezione: storia
    testo: 'Brand chiama la sostanza "phosphorus mirabilis", dal greco antico che
      significa "portatore di luce": lo stesso nome con cui i greci indicavano Venere
      quando compare all''alba. È il primo elemento della storia a ricevere un nome
      scelto apposta per descrivere una sua proprietà osservata, invece di ereditarlo
      da un minerale o da un dio.'
    visual: La stella del mattino sopra l'orizzonte, accostata al bagliore del fosforo
    attendibilita: documentato
  - id: segreto
    sezione: storia
    testo: 'Come molti alchimisti del suo tempo, Brand tiene il procedimento segreto
      per anni, sperando di venderlo o di usarlo per attirare un mecenate. Il segreto
      dura poco: nel giro di qualche anno il chimico tedesco Johann Kunckel e il chimico
      e fisico inglese Robert Boyle indipendentemente riescono a riprodurre la preparazione,
      e la notizia della sostanza luminosa si diffonde nelle corti e nelle accademie
      scientifiche d''Europa.'
    visual: Lettere e manoscritti che circolano tra le corti scientifiche europee
    attendibilita: documentato
  - id: caratteristiche_generali
    sezione: caratteristiche
    testo: 'Il fosforo appena preparato da Brand, quello che oggi si chiama fosforo
      bianco, è un solido ceroso e traslucido che si scioglie a poco più di quarantaquattro
      gradi e prende fuoco da solo a contatto con l''aria a temperature di poco superiori.
      Per questo va conservato sott''acqua: esposto all''atmosfera si accende spontaneamente,
      un comportamento che nel Seicento appariva a metà tra il prodigio e il pericolo.'
    visual: Un frammento di fosforo bianco conservato sott'acqua in un contenitore
      di vetro
    attendibilita: documentato
  - id: allotropi
    sezione: caratteristiche
    testo: 'Con il tempo si scoprì che il fosforo esiste in forme diverse, dette allotropi,
      con proprietà quasi opposte. Il fosforo rosso, ottenuto scaldando quello bianco
      al riparo dall''aria, è stabile, non tossico e non si accende spontaneamente:
      è quello usato oggi nei fiammiferi. Il fosforo nero, la forma più stabile in
      assoluto, ha una struttura a strati che ricorda la grafite e conduce persino
      l''elettricità.'
    visual: Tre campioni affiancati — bianco ceroso, rosso polveroso, nero lucido
    attendibilita: documentato
  - id: chimica
    sezione: caratteristiche
    testo: 'Nella tavola periodica il fosforo occupa il gruppo dell''azoto, di cui
      condivide alcuni comportamenti chimici pur essendo molto più reattivo. Non si
      trova mai libero in natura: si lega quasi sempre all''ossigeno formando fosfati,
      i sali dell''acido fosforico, che sono la forma in cui questo elemento circola
      nelle rocce, nel suolo e negli organismi viventi.'
    visual: Formula di struttura di un fosfato accanto a un campione di roccia fosfatica
    attendibilita: documentato
  - id: reattivita_bianco
    sezione: caratteristiche
    testo: 'La particolare instabilità del fosforo bianco dipende dalla sua struttura
      molecolare: è composto da unità tetraedriche di quattro atomi, P4, tenute insieme
      da legami tesi e facilmente rompibili, che reagiscono con l''ossigeno dell''aria
      liberando energia sotto forma di luce e calore. È questo stesso meccanismo,
      ossidazione lenta a bassa temperatura, a produrre il bagliore verde osservato
      per la prima volta da Brand, un fenomeno oggi chiamato chemiluminescenza.'
    visual: Modello molecolare tetraedrico P4 che si ossida emettendo luce verde
    attendibilita: documentato
  - id: usi_biologia
    sezione: usi
    testo: 'Il fosforo è indispensabile alla vita: entra nella struttura del DNA e
      dell''RNA, nelle membrane cellulari e nell''ATP, la molecola che le cellule
      usano per immagazzinare e trasportare energia. Senza fosforo nella dieta, animali
      e piante non potrebbero sostenere il metabolismo che le tiene in vita.'
    visual: Doppia elica del DNA con i gruppi fosfato evidenziati nello scheletro
    attendibilita: documentato
  - id: usi_agricoltura
    sezione: usi
    testo: 'L''uso industriale più massiccio del fosforo riguarda l''agricoltura:
      la roccia fosfatica estratta dalle miniere viene trasformata in acido fosforico
      e quindi in fertilizzanti, che restituiscono ai campi il fosforo asportato dai
      raccolti. Senza questo apporto costante, i terreni intensamente coltivati si
      impoverirebbero nel giro di poche stagioni.'
    visual: Campi coltivati con un trattore che distribuisce fertilizzante
    attendibilita: documentato
  - id: usi_quotidiani
    sezione: usi
    testo: Il fosforo rosso accende la testa dei fiammiferi di sicurezza, mentre i
      suoi composti compaiono in detersivi, bevande gassate come acidificante e persino
      nei fuochi d'artificio, dove alcuni composti fosforati contribuiscono agli effetti
      di scia luminosa.
    visual: Fiammifero acceso accanto a una lattina di bevanda gassata
    attendibilita: documentato
  - id: usi_estrazione
    sezione: usi
    testo: 'Il fosforo elementare per uso industriale si ottiene oggi non più dall''urina
      ma dalla roccia fosfatica, scaldata in forni elettrici insieme a sabbia silicea
      e coke fino a liberare vapori di fosforo che vengono poi condensati sott''acqua:
      lo stesso principio di conservazione che già gli alchimisti del Seicento avevano
      intuito empiricamente.'
    visual: Forno elettrico industriale per la produzione di fosforo dalla roccia
      fosfatica
    attendibilita: documentato
  - id: aneddoto_urina
    sezione: curiosita
    testo: Per un certo periodo il prezzo dell'urina salì alle stelle nelle città
      tedesche, perché altri sperimentatori, saputo del segreto di Brand, cercarono
      di procurarsene quantità industriali per riprodurre l'esperimento senza conoscerne
      esattamente il procedimento.
    attendibilita: tradizionale
  - id: aneddoto_venduto
    sezione: curiosita
    testo: Brand finì per vendere la sua formula, ormai non più tanto segreta, al
      chimico tedesco Daniel Kraft, che la portò in tournée per le corti europee mostrando
      il fosforo luminoso come un fenomeno da meraviglia, prima ancora che ne fosse
      compresa la natura chimica.
    attendibilita: tradizionale
  pronuncia:
  - termine: Hennig Brand
    ipa: ˈhɛnɪç bʁant
    nota: Alla tedesca, non all'inglese.
  - termine: phosphorus mirabilis
    ipa: ˈpʰɔːs.pʰo.rus miˈra.bi.lis
    nota: Latino scientifico, pronuncia restituta.
contenuti_estesi:
  hook: 'Il fosforo è il primo elemento con un certificato di nascita: un anno, una
    città, un uomo. Tutto quello che è venuto dopo — i fiammiferi, le mascelle marcite,
    il guano, i fertilizzanti, le bombe su Amburgo, i laghi verdi — comincia in una
    cantina che puzza di urina.'
  beats:
  - id: contesto-prima-scoperta
    sezione: contesto
    testo: 'Fino al 1669 nessun elemento era mai stato scoperto. Oro, rame, ferro,
      zolfo, mercurio: l''umanità li usava da millenni, ma nessuno li aveva trovati
      — erano arrivati senza che qualcuno ne registrasse l''istante, come arriva il
      fuoco o il pane. Il fosforo è il primo elemento «scoperto» nel senso pieno della
      parola: non era noto agli antichi, non stava in nessun minerale conosciuto,
      e un giorno preciso qualcuno lo ha visto per la prima volta. Per capire quanto
      fosse strano quel momento bisogna ricordare cosa significava «elemento» nell''Europa
      del Seicento: non un tipo di atomo, ma un principio — terra, acqua, aria, fuoco
      per gli aristotelici, sale, zolfo e mercurio per i paracelsiani. Nessuna di
      queste liste prevedeva che si potesse trovarne uno nuovo. Brand non cercava
      un elemento, perché l''idea stessa che gli elementi si potessero cercare non
      esisteva ancora.'
    attendibilita: documentato
  - id: contesto-boyle-scettico
    sezione: contesto
    testo: 'Otto anni prima, nel 1661, Robert Boyle aveva pubblicato a Londra «The
      Sceptical Chymist», il libro che oggi si legge come la pietra angolare della
      chimica moderna: una critica agli elementi degli aristotelici e ai tre principi
      degli alchimisti, in favore di una visione corpuscolare della materia. Ma lo
      stesso Boyle era un alchimista convinto: credeva possibile la trasmutazione
      dei metalli, la sperimentava, e nel 1688 contribuì a far abrogare la legge inglese
      di Enrico IV che vietava di «moltiplicare» oro e argento. È il paradosso dell''epoca
      in cui il fosforo compare: l''uomo che stava smontando l''alchimia dall''interno
      era anche uno di quelli che avrebbero inseguito con più tenacia il segreto di
      Brand.'
    attendibilita: documentato
  - id: contesto-urina-alchimia
    sezione: contesto
    testo: 'L''urina non era una stravaganza di Brand: era un ingrediente ordinario
      dell''alchimia. Nel 1630 F. T. Kessler di Strasburgo aveva pubblicato una raccolta
      di quattrocento «processi chimici scelti», e fra questi c''era una ricetta per
      trasformare i metalli vili in argento con allume, salnitro e urina concentrata.
      La ricetta non funzionava, ma Brand la conosceva, e come molti prima di lui
      provò a combinare l''urina con altre sostanze, in centinaia di combinazioni.
      La logica era quella delle corrispondenze: il corpo umano produce un liquido
      color oro, e nel Seicento un colore non era un accidente ma un indizio. Se l''oro
      era nascosto da qualche parte, poteva essere lì.'
    attendibilita: documentato
  - id: contesto-pietra-bologna
    sezione: contesto
    testo: 'L''Europa conosceva già una cosa che brillava al buio: la pietra di Bologna,
      un minerale che, calcinato, assorbiva la luce del giorno e la restituiva per
      un po'' nell''oscurità. Era una meraviglia da collezione, ma aveva un limite:
      andava ricaricata alla luce, e il bagliore si spegneva. Quando la sostanza di
      Brand comparve, chi la vide notò subito la differenza: quella luce non diminuiva
      col tempo e non aveva bisogno di essere esposta al sole. Sembrava una «forza
      vitale» chiusa nella materia. È questa differenza — non il semplice brillare
      — a rendere il fosforo un prodigio agli occhi dei contemporanei, e a dargli
      un valore commerciale prima ancora che scientifico.'
    attendibilita: documentato
  - id: contesto-alchimia-di-corte
    sezione: contesto
    testo: 'L''alchimia nel Seicento era anche un mestiere, con datori di lavoro e
      carriere. La vita di Johann Kunckel lo mostra bene: figlio dell''alchimista
      della corte dello Holstein, fu chimico e farmacista dei duchi di Lauenburg,
      poi responsabile del laboratorio dell''Elettore di Sassonia a Dresda, da cui
      gli intrighi lo costrinsero alle dimissioni nel 1677; insegnò chimica ad Annaberg
      e Wittenberg, nel 1679 diresse a Berlino il laboratorio e la vetreria del Brandeburgo,
      e nel 1688 il re di Svezia lo chiamò a Stoccolma, dove nel 1693 fu nobilitato.
      I principi pagavano gli alchimisti per la promessa dell''oro e per i prodotti
      concreti — vetro, smalti, medicine — che il laboratorio produceva nel frattempo.
      In questo mercato un segreto valeva quanto un brevetto, e si vendeva.'
    attendibilita: documentato
  - id: contesto-segreto-venduto
    sezione: contesto
    testo: 'Brand tenne il segreto per qualche tempo, come si usava, e poi lo vendette:
      duecento talleri a Johann Daniel Kraft, di Dresda. Kraft non era interessato
      a fare oro con il fosforo ma a mostrarlo. Girò buona parte d''Europa con la
      sostanza luminosa, esibendola nelle corti come un fenomeno da meraviglia, e
      arrivò fino a Londra, dove la mostrò a Robert Boyle. È il momento in cui il
      fosforo passa dal laboratorio di un alchimista squattrinato alla rete delle
      accademie: Kraft vende lo spettacolo, non la ricetta, ma per un chimico come
      Boyle lo spettacolo era già un indizio.'
    attendibilita: documentato
  - id: contesto-caccia-di-boyle
    sezione: contesto
    testo: 'Da qualche allusione di Kraft, Boyle aveva capito che la materia prima
      era l''urina, o forse le feci. Ma sapere l''ingrediente non bastava. Il suo
      primo assistente, Bilger, non riuscì a produrre nulla; poi Boyle assunse Johann
      Becher, alchimista tedesco in cerca di lavoro a Londra, che gli raccomandò un
      giovane connazionale, Ambrose Godfrey, arrivato nel 1679 a diciannove anni con
      la moglie. Nemmeno loro ci riuscirono. Becher però sapeva chi possedeva il segreto:
      Brand, ad Amburgo. Godfrey fu mandato a trovarlo e tornò con la chiave che mancava
      — il calore. Non un fuoco qualunque: temperature altissime, quelle a cui una
      storta di vetro rischia di spaccarsi.'
    attendibilita: documentato
  - id: contesto-storta-spaccata
    sezione: contesto
    testo: 'Al ritorno Godfrey preparò una nuova partita di urina e scaldò tanto da
      spaccare la storta. Fu un fallimento, e fu la prova che erano sulla strada giusta:
      nel recipiente rotto Boyle vide il residuo brillare debolmente. Da quel momento
      produrre fosforo divenne il lavoro di Godfrey, che ci prese la mano. Il suo
      procedimento era lo stesso di Brand — ridurre l''urina a un residuo, scaldarlo
      con violenza, raccogliere il vapore che condensa — e arrivò a due prodotti:
      il fosforo solido, quello che oggi chiamiamo bianco, e una miscela con «olio
      di urina» che restava liquida a temperatura ambiente.'
    attendibilita: documentato
  - id: contesto-boyle-pubblica
    sezione: contesto
    testo: 'Intanto anche Johann Kunckel, nel 1678, era riuscito a riprodurre la sostanza
      per conto suo. Nel 1680 Boyle ottenne il fosforo e fece la cosa che distingue
      la scienza dall''alchimia: pubblicò il metodo. Non solo: migliorò il procedimento
      aggiungendo sabbia alla reazione, e fu il primo a usare il fosforo per accendere
      stecchini di legno con la punta intinta nello zolfo. Erano i progenitori dei
      fiammiferi, centocinquant''anni prima che qualcuno li mettesse in commercio.
      In undici anni il fosforo era passato da segreto d''alchimista a procedura stampata
      e ripetibile: è il tragitto che, in piccolo, farà tutta la chimica nel secolo
      successivo.'
    attendibilita: documentato
  - id: contesto-prima-industria
    sezione: contesto
    testo: 'Godfrey non tornò in Germania. Dal 1707 fece del fosforo un''attività
      commerciale, a Londra, e fu uno dei primi e più riusciti fabbricanti d''Europa:
      farmacista, membro della Royal Society, inventore di una macchina brevettata
      per spegnere gli incendi — un''ironia per chi aveva passato la vita a maneggiare
      la sostanza più infiammabile che si conoscesse. Con lui il fosforo ha già la
      forma che terrà per due secoli: un prodotto che si compra e si vende, con un
      fabbricante, un prezzo e dei clienti — medici, sperimentatori, curiosi — quando
      ancora nessuno sapeva dire cosa fosse.'
    attendibilita: documentato
  - id: vicenda-origini-contese
    sezione: vicenda
    testo: 'Di Hennig Brand si sa poco, e quel poco non concorda. Nacque intorno al
      1630. Alcune fonti lo descrivono di origini popolari, apprendista vetraio da
      giovane; ma la corrispondenza della sua seconda moglie, Margaretha, lo presenta
      come un uomo di condizione elevata. Le due versioni non si conciliano, e non
      c''è un documento che le decida: il vetraio caduto in disgrazia della nota base
      è la versione più diffusa, non la più certa. Vale la pena tenerlo a mente per
      tutto il racconto che segue — il primo scopritore di un elemento è anche uno
      dei meno documentati.'
    attendibilita: discusso
  - id: vicenda-soldato-e-doti
    sezione: vicenda
    testo: 'Quello che le fonti concordano nel dire è che Brand fu ufficiale subalterno
      durante la Guerra dei Trent''anni, e che lasciato l''esercito poté dedicarsi
      all''alchimia grazie alla dote consistente della prima moglie. Quando lei morì,
      quei soldi erano finiti: li aveva spesi tutti nella ricerca della pietra filosofale.
      Sposò allora Margaretha, una vedova ricca, e con le sue risorse riprese la ricerca.
      È una biografia comune fra gli alchimisti del tempo: un capitale che si consuma
      in fornaci e vetreria, un matrimonio che lo rimpiazza. Il fosforo, quando arriva,
      è pagato con la dote di due donne.'
    attendibilita: documentato
  - id: vicenda-ricetta
    sezione: vicenda
    testo: La ricetta di Brand è arrivata fino a noi, ed è meno misteriosa di quanto
      il segreto lasciasse credere. Lasciare l'urina a riposo per giorni, finché emana
      un odore pungente. Farla bollire fino a ridurla a uno sciroppo denso. Scaldare
      finché ne distilla un olio rosso, e metterlo da parte. Lasciar raffreddare il
      resto, che si separa in una parte superiore nera e spugnosa e una inferiore
      salina. Buttare il sale, rimescolare l'olio rosso nella materia nera. Scaldare
      la miscela con forza per sedici ore. Escono prima fumi bianchi, poi un olio,
      poi il fosforo, che si fa passare in acqua fredda perché solidifichi. Sedici
      ore di fuoco vivo, nel Seicento, sono una spesa enorme di legna e di sonno.
    attendibilita: documentato
  - id: vicenda-il-momento
    sezione: vicenda
    testo: 'Il momento della scoperta, intorno al 1669, è descritto così: Brand scalda
      i residui dell''urina bollita finché la storta diventa rovente, e all''improvviso
      fumi luminosi la riempiono e ne cola un liquido che prende fuoco appena esce.
      Riesce a raccoglierne in un vaso e a coprirlo; lì il liquido solidifica e continua
      a emettere un bagliore verde pallido. Non è una scoperta per ragionamento: è
      una cosa che succede davanti agli occhi, pericolosa, imprevista, e che l''uomo
      che la osserva ha la presenza di spirito di non lasciar bruciare. Molte scoperte
      della chimica successiva avranno la stessa forma — un residuo che si comporta
      in modo strano — ma questa è la prima.'
    attendibilita: documentato
  - id: vicenda-resa
    sezione: vicenda
    testo: 'I numeri della ricetta dicono quanto fosse inefficiente. Con circa cinquemilasettecento
      litri di urina Brand ottenne appena centoventi grammi di fosforo. Il sale che
      buttava via conteneva la maggior parte del fosfato: se avesse macinato e scaldato
      tutto il residuo avrebbe ricavato molte volte tanto. Un litro di urina adulta
      contiene circa un grammo e quattro di sali di fosforo, che corrispondono a circa
      un decimo di grammo di fosforo bianco: dai suoi cinquemilasettecento litri erano
      estraibili, in teoria, più di seicento grammi. Brand ne prese un quinto, gettando
      il resto per un errore di procedura che nessuno avrebbe potuto correggergli,
      perché nessuno sapeva cosa stesse cercando.'
    attendibilita: documentato
  - id: vicenda-cosa-succedeva-davvero
    sezione: vicenda
    testo: 'Quello che succedeva nella storta, Brand non poteva saperlo, ma oggi si
      scrive in una riga. L''urina contiene fosfati — soprattutto fosfato di sodio,
      il «sale microcosmico» degli alchimisti — e sostanze organiche a base di carbonio.
      Al calore forte, l''ossigeno del fosfato reagisce con il carbonio e se ne va
      come monossido di carbonio, lasciando il fosforo elementare, che esce sotto
      forma di gas. Il gas condensa in un liquido sotto i duecentottanta gradi e solidifica
      sotto i quarantaquattro, nella forma bianca. È la stessa reazione che l''industria
      usa ancora oggi, con la roccia fosfatica al posto dell''urina, il coke al posto
      delle sostanze organiche e i forni elettrici al posto del fuoco di legna: in
      tre secoli e mezzo è cambiato tutto tranne la chimica.'
    attendibilita: documentato
  - id: vicenda-putrefazione-inutile
    sezione: vicenda
    testo: 'Anche il primo passo era inutile. Lasciar putrefare l''urina per giorni,
      finché puzza, non serve a nulla: gli scienziati venuti dopo scoprirono che l''urina
      fresca dà la stessa quantità di fosforo. Brand la faceva marcire perché la putrefazione,
      nell''alchimia, era una fase necessaria di ogni trasformazione — la materia
      doveva morire prima di rinascere in una forma più nobile. Il passaggio era teologia,
      non chimica. Ed è una delle ragioni per cui la scoperta ha impiegato tanto a
      diventare procedura: dentro la ricetta vera erano mescolati gesti che venivano
      da un''altra idea del mondo.'
    attendibilita: documentato
  - id: vicenda-il-nome
    sezione: vicenda
    testo: 'La chiamò «phosphorus mirabilis», il portatore di luce miracoloso. La
      parola greca, Φωσφόρος, era il nome del dio della stella del mattino, cioè del
      pianeta Venere quando compare prima dell''alba. È un nome scelto per una proprietà
      osservata, ed è già un piccolo atto di scienza: nessun elemento prima aveva
      avuto un nome che descrivesse cosa fa invece di dove sta o a chi somiglia. Ma
      è anche un nome che porta con sé il mito, la meraviglia, l''aggettivo «mirabilis»
      — e tutto questo il fosforo lo terrà per un secolo, esibito nelle corti come
      un''apparizione.'
    attendibilita: documentato
  - id: vicenda-oro-mancato
    sezione: vicenda
    testo: 'Brand non capì cosa aveva in mano, perché non poteva. Tenne il segreto
      e continuò a lavorare sul fosforo cercando di usarlo per produrre oro, senza
      riuscirci. Dal suo punto di vista non aveva scoperto un elemento — la parola
      non aveva quel significato — ma un passo intermedio: una sostanza che portava
      dentro la luce, e la luce era da sempre il segno dell''oro. La scoperta che
      oggi chiamiamo del fosforo, per l''uomo che l''ha fatta, è stata un fallimento
      durato anni. È l''aspetto più malinconico della storia e anche il più istruttivo:
      si può trovare una cosa nuova senza avere gli strumenti per sapere di averla
      trovata.'
    attendibilita: documentato
  - id: vicenda-la-fine-e-il-quadro
    sezione: vicenda
    testo: 'Non si sa nemmeno quando morì: intorno al 1692 secondo alcuni, intorno
      al 1710 secondo altri, con quasi vent''anni di scarto. L''immagine che quasi
      tutti hanno di lui è un quadro dipinto un secolo dopo, nel 1771, da Joseph Wright
      of Derby: «L''alchimista, in cerca della pietra filosofale, scopre il fosforo».
      Wright non ambienta la scena in una stanza del Seicento ma in una cripta gotica,
      con archi e finestre a punta come in una chiesa; l''alchimista è inginocchiato
      davanti al vaso che splende, le mani protese nel gesto con cui El Greco dipingeva
      san Francesco che riceve le stigmate. Il bagliore è molto più forte di quello
      vero, e del procedimento — secchi di urina putrida — non si vede nulla. Il quadro
      inquietò chi lo vide, non fu venduto alla prima esposizione, Wright lo rimaneggiò
      nel 1795 e fu ceduto solo dopo la sua morte. Oggi è a Derby, ed è la scena madre
      della scoperta: non com''è avvenuta, ma come il Settecento voleva che fosse
      avvenuta — una rivelazione.'
    attendibilita: documentato
  - id: vicenda-le-brache-di-godfrey
    sezione: vicenda
    testo: 'Chi maneggiava il fosforo lo pagava sulla pelle, letteralmente. Godfrey
      non era sempre prudente: aveva spesso le dita coperte di vesciche che tardavano
      a guarire, per aver toccato il solido. Una volta, andando da Boyle, una fiala
      gli si ruppe addosso e bruciò dei buchi nelle brache; Boyle, si racconta, non
      poté guardarlo «senza un certo stupore e anche un sorriso». È un aneddoto senza
      fonte precisa, e come tale va preso; ma dice una cosa vera, che le fonti confermano
      altrove — nel Seicento nessuno sapeva ancora quanto il fosforo bianco fosse
      velenoso, e chi lo produceva lo trattava con la confidenza che si ha con le
      cose familiari.'
    attendibilita: tradizionale
  - id: impatto-lavoisier-1772
    sezione: impatto
    testo: 'Il primo grande servizio che il fosforo rese alla scienza fu di bruciare
      bene. Nell''autunno del 1772 Antoine Lavoisier, che aveva appena rivolto la
      sua attenzione al fenomeno della combustione, presentò all''Accademia di Parigi
      una nota, il 20 ottobre, in cui riferiva che il fosforo bruciando si combina
      con una grande quantità d''aria, produce «spirito acido di fosforo» e — questo
      era il punto — aumenta di peso. In una seconda nota sigillata scrisse di essere
      persuaso che l''aumento di peso delle calci metalliche fosse dovuto alla stessa
      causa. È l''inizio della fine del flogisto, la sostanza immaginaria che avrebbe
      dovuto uscire dai corpi quando bruciano: se il fosforo bruciato pesa di più,
      qualcosa è entrato, non uscito. La chimica moderna comincia con una bilancia
      e un pezzo di fosforo.'
    attendibilita: documentato
  - id: impatto-elemento-1777
    sezione: impatto
    testo: 'Nel 1769 Johan Gottlieb Gahn e Carl Wilhelm Scheele mostrarono che le
      ossa contengono fosfato di calcio, ottenendo fosforo elementare dalla cenere
      d''ossa: la sostanza di Brand non era una curiosità dell''urina ma un costituente
      dello scheletro. Nel 1777 Lavoisier riconobbe il fosforo come elemento, e nel
      1789, nel Traité, lo mise nella sua tabella delle trentatré sostanze che nessun
      mezzo chimico noto riusciva a scomporre — accanto all''ossigeno, all''idrogeno,
      allo zolfo, ai diciassette metalli, e anche alla luce e al calorico, che elementi
      non erano. Centootto anni dopo la cantina di Amburgo, il phosphorus mirabilis
      aveva finalmente una definizione: non più un portatore di luce, ma un corpo
      semplice.'
    attendibilita: documentato
  - id: impatto-cenere-d-ossa
    sezione: impatto
    testo: 'Le ossa presero il posto dell''urina. La cenere d''ossa fu la principale
      fonte industriale di fosforo fino agli anni Quaranta dell''Ottocento, con un
      procedimento in tre passi: macinare le ossa e trattarle con acido solforico,
      che trasforma il fosfato tricalcico in fosfato monocalcico; disidratare quest''ultimo
      fino al metafosfato; e infine mescolarlo con carbone in un recipiente di ferro,
      distillando il vapore di fosforo da una storta. Due terzi del fosforo diventavano
      fosforo bianco, un terzo restava nel residuo, e il monossido di carbonio prodotto
      si bruciava in una torcia. È la stessa reazione di Brand — l''ossigeno del fosfato
      che se ne va con il carbonio — con una materia prima che si trovava a tonnellate,
      nei macelli e nei campi di battaglia.'
    attendibilita: documentato
  - id: impatto-sauria
    sezione: impatto
    testo: Nel 1830, o nel gennaio 1831, uno studente di chimica del Collège de l'Arc
      di Dole, in Francia, Charles Sauria, sostituì il trisolfuro di antimonio della
      capocchia dei fiammiferi con il fosforo bianco. Il risultato era un fiammifero
      che si accendeva sfregandolo su qualunque superficie, emetteva fumi tossici
      senza odore e andava conservato in scatole di metallo a chiusura ermetica perché
      non prendesse fuoco da solo. Soppiantò in fretta le formule precedenti a base
      di zolfo. Sauria non brevettò l'invenzione, che in Germania fu venduta con il
      nome di «Congreves», dal pioniere inglese dei razzi. Con un gesto da studente,
      il fosforo entrò nelle tasche di tutti — e nei polmoni di chi lo lavorava.
    attendibilita: documentato
  - id: impatto-capocchia
    sezione: impatto
    testo: 'La capocchia dei primi fiammiferi era una piccola bomba chimica: fosforo
      bianco, un composto che libera ossigeno — clorato di potassio, biossido di piombo
      o un nitrato — e un legante. Erano sensibili al modo in cui li si conservava,
      velenosi se ingeriti, pericolosi se sfregati per caso contro una superficie
      ruvida. Ma il danno peggiore lo facevano prima, in fabbrica: i vapori del fosforo
      bianco erano tossici per gli operai, e provocavano una necrosi delle ossa della
      mascella che prese un nome da gergo, «phossy jaw», la mascella fosforica. Per
      mezzo secolo un oggetto da un soldo ha avuto questo prezzo nascosto, pagato
      da chi lo produceva e non da chi lo usava.'
    attendibilita: documentato
  - id: impatto-lorinser
    sezione: impatto
    testo: 'Il primo caso fu diagnosticato nel 1839 a Vienna da Friedrich Wilhelm
      Lorinser: una fabbricante di fiammiferi esposta ai vapori del fosforo per cinque
      anni. Lorinser chiamò la malattia «Phosphorimus chronicus», e nel 1844 ne riferì
      ventidue casi, stabilendo gli effetti tossici del fosforo bianco nei fiammiferi.
      Da quel momento la malattia era documentata, descritta, attribuita alla sua
      causa. Quello che non c''era ancora era la volontà di eliminarla: il fosforo
      bianco restò l''ingrediente attivo della maggior parte dei fiammiferi dagli
      anni Quaranta dell''Ottocento agli anni Dieci del Novecento — settant''anni
      dopo la diagnosi.'
    attendibilita: documentato
  - id: impatto-mascella
    sezione: impatto
    testo: 'La malattia cominciava con un mal di denti persistente e gengive gonfie;
      poi si formava pus, che perforava la mucosa in fistole, i denti cadevano, gli
      ascessi tornavano. Dopo tre mesi si staccava il sequestro, un frammento di osso
      morto, poroso e leggero; entro sei mesi la mascella era in necrosi, più spesso
      quella inferiore. Le ossa colpite brillavano al buio di una luce bianco-verdastra
      — la stessa di Brand. Nei casi cronici la malattia toccava il cervello e dava
      convulsioni. L''unica cura era chirurgica: asportare l''osso, con quel che seguiva
      per la capacità di mangiare, e la denutrizione. Senza intervento si moriva per
      il cedimento degli organi, con l''osso che marciva in bocca. È la faccia dell''elemento
      che i ritratti di Brand non mostrano.'
    attendibilita: documentato
  - id: impatto-bryant-may
    sezione: impatto
    testo: 'A Londra la Bryant & May aveva costruito nel 1861, a Bow, una fabbrica
      modello in stile veneziano, con venticinque macchine a vapore. Sapeva della
      mascella fosforica, e aveva una politica: se un''operaia si lamentava di mal
      di denti, le si diceva di farseli togliere subito o di considerarsi licenziata.
      L''azienda fu coinvolta in tre degli episodi industriali più divisivi dell''Ottocento
      inglese — lo sfruttamento del lavoro a domicilio, le multe sulle paghe, lo scandalo
      della mascella fosforica — e in tutti e tre la logica era la stessa: il fosforo
      era la materia prima, le operaie il materiale di consumo.'
    attendibilita: documentato
  - id: impatto-bow-in-cifre
    sezione: impatto
    testo: 'La fabbrica di Bow, in cifre. Le operaie riempivano telai di stecchini
      che venivano intinti nella pasta al fosforo, asciugati in forno e poi tagliati
      a metà da una macchina, perché ogni stecchino era doppio; un''operaia esperta
      finiva millequattrocento telai in un turno di dieci ore, cioè dieci milioni
      di fiammiferi. Le riempitrici prendevano uno scellino ogni cento telai; i fiammiferi
      finivano in scatole da cento, legate in mazzi da dodici. Dieci milioni di capocchie
      al fosforo bianco passavano ogni giorno sotto il naso di chi era pagata a telaio:
      la mascella fosforica non era un incidente, era una proporzione.'
    attendibilita: documentato
  - id: impatto-le-multe
    sezione: impatto
    testo: 'Le paghe di Bow erano già basse — le minori di quattordici anni prendevano
      circa quattro scellini la settimana — ma poche le portavano a casa intere: i
      capireparto multavano, e trattenevano direttamente dal salario. Tre pence per
      avere i piedi sporchi, e molte lavoravano scalze perché le scarpe costavano
      troppo; multe per il banco in disordine, per aver parlato. Le operaie avevano
      già scioperato nel 1881, nel 1885 e nel 1886, per le paghe e per le multe, senza
      risultato. Uno storico ha osservato che le ragazze erano più preoccupate del
      salario che della sicurezza: un''osservazione che dice meno della loro incoscienza
      che della loro fame.'
    attendibilita: documentato
  - id: impatto-sciopero-1888
    sezione: impatto
    testo: 'Il 23 giugno 1888 Annie Besant e Herbert Burrows pubblicarono sul loro
      settimanale da mezzo penny, «The Link», un articolo sulle condizioni della fabbrica.
      La direzione pretese che le operaie firmassero una smentita; rifiutarono. Intorno
      al 2 luglio un''operaia fu licenziata con un altro pretesto, e fu la scintilla:
      entro la fine del primo giorno circa millequattrocento donne e ragazze avevano
      smesso di lavorare. La direzione offrì subito di riassumere la licenziata, ma
      ormai le richieste erano altre — prima di tutto le multe. Una delegazione, Sarah
      Chapman, Mary Cummings e la signora Naulls, andò dai dirigenti e non ne fu soddisfatta;
      il 6 luglio l''intera fabbrica era ferma, e un centinaio di loro andò da Besant
      a chiederle aiuto.'
    attendibilita: documentato
  - id: impatto-vittoria
    sezione: impatto
    testo: 'Con l''aiuto di Besant lo sciopero vinse: migliori condizioni di lavoro
      e di paga per una forza lavoro quasi tutta femminile che maneggiava il fosforo
      bianco. Nello stesso 1888 nacque la Union of Women Matchmakers, il più grande
      sindacato di donne e ragazze del paese, che ispirò un''ondata di organizzazione
      collettiva fra gli operai dell''industria. Lo sciopero delle fiammiferaie non
      pose fine all''uso del fosforo bianco — quello sarebbe arrivato vent''anni dopo
      — ma è una delle date da cui si fa partire il movimento sindacale moderno in
      Gran Bretagna. Un elemento scoperto nell''urina, passato per le ossa, era diventato
      una questione di diritti.'
    attendibilita: documentato
  - id: impatto-esercito-salvezza
    sezione: impatto
    testo: 'Nel 1891 William Booth e l''Esercito della Salvezza aprirono una fabbrica
      di fiammiferi che usava il fosforo rosso, molto più sicuro e più caro, e fecero
      campagna presso i negozianti perché vendessero solo quelli. Era una dimostrazione,
      non un''industria: provare che il fiammifero senza veleno esisteva, e che il
      suo prezzo era una scelta. L''alternativa c''era da quarant''anni. La storia
      del fosforo rosso spiega perché ci volle così tanto.'
    attendibilita: documentato
  - id: impatto-fosforo-rosso
    sezione: impatto
    testo: 'Il fosforo rosso fu presentato da Anton Schrötter all''Accademia delle
      scienze di Vienna il 9 dicembre 1847 — altri, come Berzelius, l''avevano senza
      dubbio già avuto fra le mani senza riconoscerlo. Si ottiene scaldando il fosforo
      bianco al riparo dall''aria, e ha proprietà quasi opposte: non si accende da
      solo, non è velenoso. In Inghilterra Arthur Albright lo produceva già nel 1851,
      in recipienti sigillati, e lo espose alla Grande Esposizione del Crystal Palace.
      In Svezia i fratelli Lundström, che dal 1847 circa avevano una fabbrica di fiammiferi
      a Jönköping, ricevettero da Albright un campione di fiammiferi al fosforo rosso
      — e lo persero, così che il fiammifero di sicurezza, con il fosforo sulla scatola
      invece che sulla capocchia, arrivò solo ai primi anni Cinquanta.'
    attendibilita: documentato
  - id: impatto-i-divieti
    sezione: impatto
    testo: 'I divieti arrivarono uno alla volta. La Finlandia proibì il fosforo bianco
      nei fiammiferi nel 1872, la Danimarca nel 1874, la Francia nel 1897, la Svizzera
      nel 1898, i Paesi Bassi nel 1901. Nel settembre 1906 la Convenzione di Berna
      lo vietò a livello internazionale, impegnando ogni paese firmatario a legiferare.
      Il Regno Unito, dove la mascella fosforica era stata uno scandalo nazionale,
      approvò la sua legge solo nel dicembre 1908, in vigore dal primo gennaio 1910.
      Fra la diagnosi di Lorinser e il divieto inglese passano settantun anni: il
      tempo che un veleno noto ha impiegato a uscire da un prodotto di consumo quando
      la sostituzione costava di più.'
    attendibilita: documentato
  - id: impatto-sesquisolfuro
    sezione: impatto
    testo: 'Intorno al 1900 due chimici francesi, Henri Sévène ed Emile David Cahen,
      inventarono il fiammifero moderno «da sfregare ovunque», sostituendo il fosforo
      bianco con il sesquisolfuro di fosforo, P₄S₃: non tossico, non piroforico, si
      accende per attrito. Per un po'' questi fiammiferi ebbero grande fortuna, poi
      furono soppiantati dal fiammifero di sicurezza al fosforo rosso, che è quello
      che accendiamo oggi. Il composto è ancora nella capocchia di alcuni fiammiferi,
      ed è il motivo per cui la nota base lo elenca fra i composti principali: è la
      versione domestica e innocua di ciò che nel 1830 aveva cominciato ad avvelenare
      le fabbriche.'
    attendibilita: documentato
  - id: impatto-la-macchina-continua
    sezione: impatto
    testo: 'Il fiammifero cambiò anche come oggetto industriale. Nel 1901 l''americana
      Diamond Match Company comprò una fabbrica a Litherland, vicino a Liverpool,
      e vi installò una macchina continua capace di produrre seicentomila fiammiferi
      l''ora, venduti con i marchi Captain Webb, Puck e Swan Vesta. La Bryant & May,
      quella dello sciopero, non riuscì a reggere la concorrenza, e nel 1905 ne cedette
      la maggioranza. Il lavoro a telaio delle ragazze di Bow — millequattrocento
      telai in dieci ore — era diventato in pochi anni un mestiere da macchina: la
      sicurezza arrivò nei fiammiferi insieme all''automazione, e non prima.'
    attendibilita: documentato
  - id: impatto-liebig
    sezione: impatto
    testo: 'Mentre il fosforo bruciava sulle capocchie, un chimico tedesco lo stava
      spostando al centro dell''agricoltura. Justus von Liebig, nella sua teoria della
      nutrizione minerale, identificò azoto, fosforo e potassio come elementi essenziali
      alla crescita delle piante, e rese popolare la «legge del minimo» di Carl Sprengel:
      una pianta non cresce in proporzione alle risorse totali disponibili ma è limitata
      dalla risorsa più scarsa, come una botte con le doghe di altezza diversa, che
      si riempie solo fino alla più corta. Per questo è stato chiamato il padre dell''industria
      dei fertilizzanti. La doga più corta, nei suoli coltivati, era spessissimo il
      fosforo.'
    attendibilita: documentato
  - id: impatto-lawes-1842
    sezione: impatto
    testo: 'Nel 1842 John Bennet Lawes, proprietario terriero inglese, brevettò un
      concime ottenuto trattando i fosfati con acido solforico — il superfosfato —
      e con quello diede inizio all''industria dei concimi artificiali. L''anno dopo
      assunse il chimico Joseph Henry Gilbert e insieme sperimentarono per più di
      mezzo secolo, nella tenuta di Rothamsted, coltivando piante e nutrendo animali:
      quella tenuta è diventata Rothamsted Research, ancora oggi un istituto di ricerca
      agraria. La reazione di Lawes è la stessa che l''industria della cenere d''ossa
      usava per il fosforo: acido solforico sul fosfato di calcio. Cambia solo la
      destinazione — non la storta, ma il campo.'
    attendibilita: documentato
  - id: impatto-guano
    sezione: impatto
    testo: Prima delle miniere, il fosforo dei campi europei venne dagli uccelli.
      Nel 1609 l'Inca Garcilaso de la Vega aveva descritto nei «Comentarios Reales»
      come gli Inca della costa raccogliessero il guano per concimare; i Moche lo
      avevano fatto prima di loro, trasportandolo in barca. All'inizio dell'Ottocento
      Alexander von Humboldt lo fece conoscere in Europa dopo averlo trovato in quantità
      sfruttabili sulle isole al largo del Sudamerica, dove su alcune isole lo strato
      superava i trenta metri. Il commercio internazionale partì dopo il 1840, con
      un accordo fra un imprenditore peruviano, una casa mercantile di Liverpool e
      un gruppo di uomini d'affari francesi; nel 1846 la sola isola di Ichaboe, al
      largo della Namibia, aveva già mandato in Gran Bretagna quattrocentosessantaduemila
      tonnellate.
    attendibilita: documentato
  - id: impatto-guano-islands-act
    sezione: impatto
    testo: 'Negli anni Cinquanta dell''Ottocento la «mania del guano» fece salire
      i prezzi in un mercato oligopolistico: il Regno Unito ne importava più di duecentomila
      tonnellate l''anno, gli Stati Uniti in totale circa settecentosessantamila.
      La paura che finisse portò il Congresso americano, il 18 agosto 1856, a varare
      il Guano Islands Act, una legge tuttora in vigore che autorizza i cittadini
      statunitensi a prendere possesso, in nome degli Stati Uniti, di qualunque isola
      disabitata contenente guano non rivendicata da altri governi, e permette al
      Presidente di difenderla con la forza militare. Decine di isole del Pacifico
      e dei Caraibi furono rivendicate così. Per il fosforo, prima ancora che per
      il petrolio, uno stato si era dato il diritto di annettere.'
    attendibilita: documentato
  - id: impatto-fine-del-guano
    sezione: impatto
    testo: 'Alla fine degli anni Sessanta le isole Chincha, il giacimento più produttivo
      del Perù, erano vicine all''esaurimento; il paese toccò il massimo delle esportazioni
      nel 1870, oltre settecentomila tonnellate, e poi il guano fu eclissato dal salnitro
      del Cile. L''età del guano finì con la Guerra del Pacifico, dal 1879 al 1883:
      il Cile invase la costa boliviana per impadronirsi di guano e salnitro, attaccò
      il Perù, che aveva un patto di difesa con la Bolivia, e con il trattato di Ancón
      del 1884 si prese la Bolivia intera costa e metà dei proventi peruviani del
      guano, oltre alle isole. All''inizio del Novecento il guano era quasi esaurito
      ovunque. Si era combattuta una guerra per gli escrementi degli uccelli, e li
      si era finiti.'
    attendibilita: documentato
  - id: impatto-roccia-e-forno
    sezione: impatto
    testo: 'La roccia fosfatica — di solito fosfato di calcio — fu usata per la prima
      volta nel 1850 per produrre fosforo, e nel 1888 James Burgess Readman introdusse
      il forno elettrico ad arco sommerso, brevettato l''anno dopo, che rese obsoleta
      la cenere d''ossa. Con il guano esaurito più o meno negli stessi anni, i fosfati
      minerali diventarono la fonte principale dei fertilizzanti, e la produzione
      crebbe enormemente dopo la seconda guerra mondiale. È la catena che il fosforo
      ha percorso in tre secoli: urina, ossa, guano, roccia. Ogni volta una fonte
      più abbondante e più lontana dal corpo da cui era partita — e ogni volta, come
      si vedrà, una fonte finita.'
    attendibilita: documentato
  - id: impatto-nauru
    sezione: impatto
    testo: 'Nauru, un''isola del Pacifico di ventuno chilometri quadrati, è la storia
      del fosforo minerale in scala ridotta. Il fosfato vi fu scoperto nel 1900 da
      Albert Fuller Ellis; la Pacific Phosphate Company cominciò a estrarlo nel 1906
      e spedì il primo carico nel 1907. Per circa un secolo l''interno dell''isola
      fu scavato a cielo aperto, con profitto e con devastazione: l''estrazione ha
      spogliato circa l''ottanta per cento del territorio, lasciando pinnacoli di
      calcare alti fino a quindici metri dove non cresce nulla. Nel 1964 si propose
      di trasferire l''intera popolazione su un''isola australiana. Le riserve si
      esaurirono negli anni Novanta, e la cattiva gestione della ricchezza accumulata
      — un caso da manuale di maledizione delle risorse — portò il paese a gravi difficoltà
      finanziarie nel decennio successivo.'
    attendibilita: documentato
  - id: controversie-arma-1914
    sezione: controversie
    testo: 'Il forno elettrico rese il fosforo bianco abbondante, e l''abbondanza
      lo rese un''arma. Nella prima guerra mondiale fu usato nelle munizioni incendiarie,
      nelle cortine di fumo e nei proiettili traccianti, e ne fu sviluppato uno speciale,
      incendiario, per sparare agli Zeppelin che sorvolavano la Gran Bretagna gonfi
      di idrogeno. La proprietà che nel 1669 aveva fatto di Brand un uomo da corte
      — accendersi da solo all''aria — era diventata una specifica militare. Da qui
      in poi la storia del fosforo ha due binari che non si incontrano: quello dei
      campi e quello delle bombe, entrambi alimentati dalla stessa roccia.'
    attendibilita: documentato
  - id: controversie-1940
    sezione: controversie
    testo: 'Nel 1940, con l''invasione tedesca della Gran Bretagna che sembrava imminente,
      la Albright and Wilson, l''azienda inglese del fosforo, propose al governo di
      usare una miscela simile al «fuoco feniano», il fosforo sciolto in solfuro di
      carbonio con cui gli incendiari nazionalisti irlandesi avevano operato nell''Ottocento.
      Ne uscì la granata n. 76, una bottiglia di vetro riempita di quella miscela
      e di lattice, e bottiglie Molotov al fosforo in benzina furono distribuite a
      civili selezionati in vista dell''invasione. Gli Stati Uniti svilupparono la
      granata M15, i britannici la n. 77: servivano soprattutto per segnalare e fare
      fumo, ma erano anche armi antiuomo efficaci, e la difficoltà di spegnere il
      fosforo che brucia, con le ustioni gravissime che provoca, aveva un forte effetto
      psicologico sul nemico.'
    attendibilita: documentato
  - id: controversie-amburgo-1943
    sezione: controversie
    testo: 'Nell''ultima settimana del luglio 1943, a partire dal 24, la Royal Air
      Force di notte e l''aviazione americana di giorno colpirono Amburgo per otto
      giorni e sette notti: l''operazione Gomorrah, dal nome della città biblica,
      allora l''attacco più pesante nella storia della guerra aerea. La città era
      stata scelta perché particolarmente vulnerabile agli incendiari, che dopo l''esperienza
      del Blitz si sapeva facessero più danni dell''esplosivo. Ne nacque una delle
      più grandi tempeste di fuoco della guerra: circa trentaquattromila morti e il
      sessanta per cento delle case distrutte. Fra le bombe incendiarie usate su larga
      scala c''erano quelle al fosforo. La voce di Wikipedia sul fosforo lo annota
      con una frase che non ha bisogno di commento: Amburgo è il luogo dove il portatore
      di luce miracoloso era stato scoperto per la prima volta.'
    attendibilita: documentato
  - id: controversie-falluja
    sezione: controversie
    testo: 'Nel novembre 2004, durante la seconda battaglia di Falluja, i cronisti
      del Washington Post aggregati alle truppe scrissero di aver visto l''artiglieria
      sparare proiettili al fosforo bianco, che creano «una cortina di fuoco che non
      si spegne con l''acqua»; gli insorti riferivano di una sostanza che scioglieva
      la pelle. L''8 novembre 2005 la RAI trasmise il documentario «Falluja, la strage
      nascosta», con immagini di combattenti e civili, donne e bambini compresi, che
      secondo gli autori erano morti per ustioni da fosforo. Gli ambasciatori americani
      a Londra e a Roma smentirono; il 15 novembre il Dipartimento della Difesa confermò
      di aver usato il fosforo bianco come arma incendiaria per stanare i combattenti
      dalle posizioni. Il 30 novembre il generale Peter Pace disse alla BBC: «Non
      è un''arma chimica. È un incendiario, e usarlo rientra pienamente nel diritto
      di guerra». È la frase su cui la controversia si regge ancora.'
    attendibilita: documentato
  - id: controversie-protocollo-iii
    sezione: controversie
    testo: Il fosforo bianco in sé non è vietato. Il Protocollo III della Convenzione
      sulle armi convenzionali definisce arma incendiaria «qualunque arma o munizione
      progettata principalmente per incendiare oggetti o causare ustioni alle persone»,
      e ne vieta l'uso deliberato contro i civili; ma esenta dalla definizione le
      munizioni che «possono avere effetti incendiari accessori, come illuminanti,
      traccianti, fumogeni o sistemi di segnalazione» — ed è come fumogene che le
      munizioni al fosforo vengono di norma classificate. È la zona grigia che organizzazioni
      come Human Rights Watch chiedono di chiudere includendo esplicitamente le testate
      al fosforo nella Convenzione. Nel 2006 Israele dichiarò di averle usate in Libano
      «contro obiettivi militari in campo aperto», nel rispetto delle convenzioni;
      nel 2023 Amnesty International e Human Rights Watch lo accusarono di averle
      usate in modo indiscriminato a Dhayra, sempre in Libano, ferendo almeno nove
      civili. La materia di Brand è, da un secolo, un problema di diritto internazionale
      irrisolto.
    attendibilita: documentato
  - id: controversie-sahara
    sezione: controversie
    testo: 'Due terzi delle riserve di fosfato sfruttabili del pianeta stanno in un
      solo paese, il Marocco: cinquanta miliardi di tonnellate stimate, contro i tre
      virgola due della Cina, che è seconda. Una parte di quelle riserve non è in
      Marocco ma nel Sahara Occidentale, territorio non autonomo che il Marocco occupa
      e la Repubblica Sahrawi rivendica. La miniera di Bou Craa, gestita da una controllata
      del gruppo statale OCP, produce circa tre milioni di tonnellate l''anno, un
      decimo della produzione marocchina, e le manda alla costa su un nastro trasportatore
      automatico lungo circa cento chilometri — il più lungo del mondo, la cui polvere
      si vede dallo spazio. Bou Craa passò sotto controllo marocchino con la spartizione
      dell''aprile 1976, dopo gli accordi di Madrid; gli attacchi del Fronte Polisario
      fermarono l''estrazione quell''anno e sabotarono più volte il nastro, finché
      nei primi anni Ottanta il Muro marocchino non chiuse la zona. Chi compra quel
      fosfato compra anche una disputa territoriale irrisolta.'
    attendibilita: documentato
  - id: controversie-laghi-verdi
    sezione: controversie
    testo: 'L''altra controversia è più silenziosa e più diffusa. Il fosforo che manca
      nei campi abbonda nei laghi: i fosfati che dilavano dai terreni concimati, dalle
      fogne e — fino agli anni Settanta, quando furono messi al bando — dai detersivi
      a base di tripolifosfato di sodio, nutrono le alghe, che esplodono in fioriture,
      muoiono, e consumando ossigeno nel decomporsi soffocano pesci e fondali. Il
      fenomeno si chiama eutrofizzazione, «buona nutrizione», e fu riconosciuto come
      inquinamento a metà Novecento; negli anni Settanta gli esperimenti sui laghi
      interi dell''Experimental Lakes Area, in Ontario, dimostrarono che nelle acque
      dolci è proprio il fosforo il nutriente limitante. La legge del minimo di Liebig
      vale anche al contrario: l''elemento che decide quanto cresce il grano decide
      anche quanto crescono le alghe.'
    attendibilita: documentato
  - id: controversie-picco
    sezione: controversie
    testo: 'Quanto durerà? È la domanda più discussa e meno risolta. Prima delle scoperte
      recenti — grandi giacimenti trovati in Norvegia nel 2023 — le riserve commerciali
      e a buon mercato della Terra si stimavano esaurite in cinquanta-cento anni;
      ma le previsioni variano enormemente a seconda dei modelli e delle ipotesi sui
      volumi estraibili, e il solo punto su cui tutti concordano è che la produzione
      futura dipenderà pesantemente dal Marocco. Chi parla di «picco del fosforo»
      ha dalla sua un precedente, Nauru, e il fatto che il fosforo non ha sostituti:
      l''azoto si può fissare dall''aria, il fosforo no. Chi lo nega ha dalla sua
      la storia delle stime, sempre smentite da nuovi giacimenti. È un dibattito sull''incertezza,
      e come tale va riportato.'
    attendibilita: discusso
  - id: controversie-kunckel-dove
    sezione: controversie
    testo: Una controversia minuscola dice quanto sia fragile questa storia anche
      nei dettagli. La voce di Wikipedia sul fosforo scrive che Johann Kunckel riprodusse
      la sostanza «in Svezia nel 1678», e quella su Brand lo chiama «chimico svedese»;
      ma la biografia dello stesso Kunckel lo dà nel 1677 dimissionario da Dresda,
      poi a insegnare ad Annaberg e Wittenberg, nel 1679 a Berlino, e in Svezia soltanto
      dal 1688, nobilitato nel 1693. Nel 1678 era in Germania, ed era tedesco. Non
      è un errore che cambi la storia dell'elemento, ma è il tipo di incoerenza che
      si trova appena si mettono due fonti una accanto all'altra — e il motivo per
      cui la nota base lo chiama tedesco, e qui non si dice dove fosse quando ci riuscì.
    attendibilita: discusso
  - id: eredita-corpo
    sezione: eredita
    testo: 'Un adulto contiene circa settecento grammi di fosforo, dall''ottantacinque
      al novanta per cento nelle ossa e nei denti, sotto forma di apatite, il resto
      nei tessuti molli e nei liquidi. La quota cresce con l''età: mezzo per cento
      della massa in un neonato, fra lo zero virgola sessantacinque e l''uno virgola
      uno in un adulto. Gahn e Scheele, nel 1769, avevano trovato il fosforo nella
      cenere d''ossa; oggi sappiamo che è lo scheletro stesso a essere fatto di fosfato,
      e che l''urina di Brand era solo il modo in cui il corpo se ne libera quando
      ne ha troppo. I cinquemilasettecento litri di Amburgo erano ossa in transito.'
    attendibilita: documentato
  - id: eredita-atp
    sezione: eredita
    testo: 'Il resto del fosforo, quello fuori dalle ossa, fa girare la vita. L''adenosina
      trifosfato, ATP, è la molecola con cui le cellule immagazzinano e spendono energia,
      e la spendono rompendo un legame fra due gruppi fosfato. I numeri sono difficili
      da credere: l''energia usata dalle cellule di un adulto richiede ogni giorno
      l''idrolisi di cento-centocinquanta moli di ATP, il che significa che una persona
      consuma in un giorno una quantità di ATP pari al proprio peso corporeo. Poiché
      la quantità presente nell''organismo è solo di un decimo di mole per litro,
      ogni molecola viene ricostruita e riusata mille-millecinquecento volte al giorno,
      al ritmo di circa nove per dieci alla venti molecole al secondo. Il fosforo
      non è un componente: è la valuta.'
    attendibilita: documentato
  - id: eredita-fosforo-32
    sezione: eredita
    testo: 'Il fosforo ha ventidue isotopi conosciuti e uno solo stabile, il 31, che
      è il cento per cento di quello naturale. Due dei radioattivi hanno una vita
      adatta ai laboratori: il fosforo 32, che emette elettroni energetici e ha un''emivita
      di quattordici giorni e mezzo, e il 33, più mite, di venticinque. Con il 32
      si marcano sonde di DNA e RNA per rintracciare geni e trascritti — i Southern
      e Northern blot della biologia molecolare — con il 33 si sequenzia il DNA. Sono
      isotopi da maneggiare con guanti, camice e occhiali, perché gli elettroni del
      32 attraversano la pelle e la cornea, e il fosforo ingerito finisce nelle ossa
      e negli acidi nucleici; e vanno schermati con materiali leggeri, acqua o plastica,
      non con il piombo, che ne trasforma l''energia in raggi X. È l''elemento di
      Brand usato per leggere il codice della vita, e pericoloso esattamente per la
      ragione per cui è indispensabile.'
    attendibilita: documentato
  - id: eredita-ipervalenza
    sezione: eredita
    testo: 'Nella tavola il fosforo sta nel gruppo quindici, quello dell''azoto, e
      ne ripete gli stati di ossidazione principali, meno tre, più tre e più cinque,
      con tutti quelli intermedi meno comuni ma noti. È meno elettronegativo dell''azoto
      e dello zolfo, più del silicio e dell''arsenico, e sensibilmente meno del carbonio.
      Ma ha una cosa che l''azoto non ha: è l''elemento con il numero atomico più
      basso a mostrare ipervalenza, cioè a formare più legami per atomo di quanti
      la regola dell''ottetto permetterebbe. Solo a ottocentotrenta gradi il tetraedro
      P₄ si rompe e compare P₂, una molecola con un triplo legame che è la copia dell''azoto
      atmosferico: la parentela c''è, ma il fosforo la nasconde a temperatura ambiente.'
    attendibilita: documentato
  - id: eredita-ciclo-lento
    sezione: eredita
    testo: 'A differenza del carbonio, dell''azoto e dell''acqua, il fosforo non passa
      per l''aria: non forma gas in condizioni ordinarie, e la fosfina si produce
      solo in situazioni isolate. Il suo ciclo va dalla roccia al suolo, dal suolo
      alle piante e agli animali, e da questi di nuovo al suolo e all''oceano, dove
      sedimenta e torna roccia. Attraverso gli organismi viaggia in fretta; attraverso
      il suolo e il mare è lentissimo, uno dei cicli biogeochimici più lenti che esistano.
      È questo il motivo strutturale dei fertilizzanti: il ciclo naturale non riesce
      a rigenerare un suolo coltivato in modo intensivo, e quello che il raccolto
      porta via bisogna rimetterlo a mano. La roccia estratta oggi è il sedimento
      di mari vecchi di milioni di anni, e il ciclo che la riporterà in fondo al mare
      non ha fretta.'
    attendibilita: documentato
  - id: eredita-industria-oggi
    sezione: eredita
    testo: 'Quasi tutta la produzione industriale di oggi è estrarre roccia fosfatica
      e trasformarla in acido fosforico per i fertilizzanti, in acidi concentrati
      che arrivano al settanta-settantacinque per cento di pentossido di fosforo.
      Il resto va in pesticidi, additivi alimentari, detersivi. I primi produttori
      di minerale nel 2024 erano Cina, Marocco, Stati Uniti e Russia. Il fosforo elementare
      di Brand, quello bianco che brucia, è ormai una nicchia rispetto al fosfato
      che nutre: la storia dell''elemento è andata nella direzione opposta a quella
      dell''alchimista, che voleva estrarre dalla materia vivente qualcosa di più
      nobile, e ha finito per restituire alla materia vivente ciò che le si era tolto.'
    attendibilita: documentato
  - id: eredita-ritorno-all-urina
    sezione: eredita
    testo: 'E così, tre secoli e mezzo dopo, si torna alla cantina. Gli impianti di
      depurazione con una fase dedicata alla rimozione del fosforo producono fanghi
      ricchi di fosfato, che si possono incenerire per recuperarlo dalle ceneri; oppure
      si aggiunge magnesio ai reflui per far precipitare la struvite, un fosfato di
      ammonio e magnesio da cui il fosforo si riestrae. Esistono tecniche per recuperarlo
      direttamente dall''urina, separata alla fonte. Nessuna di queste tecnologie
      è ancora conveniente ai prezzi attuali del fosforo sul mercato mondiale — ma
      i prezzi cambiano, e Nauru insegna in che direzione. La ricetta di Brand, riletta
      oggi, non è una bizzarria alchemica: è il primo impianto di recupero del fosforo
      dalle acque reflue, con una resa del venti per cento.'
    attendibilita: documentato
  - id: eredita-fosforo-nero
    sezione: eredita
    testo: 'Intanto l''elemento continuava a cambiare faccia. Nel 1865 Johann Wilhelm
      Hittorf, scaldando fosforo rosso in un tubo sigillato a cinquecentotrenta gradi,
      ne fece sublimare cristalli opachi e brillanti: il fosforo violetto. Nel 1914
      Percy Bridgman, che avrebbe avuto il Nobel per le alte pressioni, comprimendo
      fosforo bianco a dodicimila atmosfere ottenne il fosforo nero, la forma stabile
      a temperatura e pressione ordinarie: nero, sfaldabile, conduttore, con una struttura
      a strati corrugati a nido d''ape che ricorda la grafite, e il meno reattivo
      di tutti. Dallo stesso atomo escono un solido che si accende da solo e un solido
      che non reagisce con niente: la differenza è solo in come gli atomi si dispongono,
      e il fosforo è l''elemento in cui questa lezione si vede meglio.'
    attendibilita: documentato
  - id: eredita-fosforo-giallo
    sezione: eredita
    testo: 'Il «fosforo giallo» di cui parlano i giornali e le cronache di guerra
      non è una forma a sé: è fosforo bianco che sta lentamente degradando in rosso,
      un processo che luce e calore accelerano. Il fosforo bianco invecchiato o impuro
      — quello di qualità militare, per esempio — appare giallo per questo. È un dettaglio
      che chiude il cerchio degli allotropi: bianco, rosso, violetto e nero sono quattro
      modi di disporre gli stessi atomi, e il giallo è il bianco colto a metà strada
      verso il rosso, la sostanza di Brand che, lasciata a sé, diventa da sola quella
      di Schrötter.'
    attendibilita: documentato
  - id: eredita-il-cerchio
    sezione: eredita
    testo: La storia del fosforo ha una forma, ed è un cerchio. Comincia con l'urina
      umana in una cantina di Amburgo; passa alle ossa, poi agli escrementi degli
      uccelli sulle isole del Pacifico, poi alle rocce sedimentarie; e oggi, con le
      riserve concentrate in un solo paese e le stime che oscillano, torna a guardare
      i fanghi delle fogne e l'urina. Ogni passaggio ha allontanato la fonte dal corpo
      umano e l'ha resa più abbondante, e ogni fonte si è esaurita o sta per farlo.
      Il primo elemento con un certificato di nascita è anche il primo di cui l'umanità
      ha dovuto chiedersi se ne avrà abbastanza. Brand cercava l'oro e trovò la luce;
      noi abbiamo trovato che quella luce era il nostro scheletro, e che non si fabbrica.
    attendibilita: documentato
