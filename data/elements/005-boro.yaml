contenuti:
  hook: Nel 1787 quattro chimici francesi diedero un nome a una sostanza che nessuno di
    loro aveva mai visto. Ci vollero ventun anni perché qualcuno la mettesse in mano a
    qualcun altro.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il boro è un semimetallo scuro, durissimo e pessimo conduttore, che sta al
      quinto posto della tavola periodica e non somiglia a nessuno dei suoi vicini. Da
      millenni l''umanità ne maneggia il sale più comune, il borace, senza sapere che
      cosa contenesse; oggi il boro tiene insieme il vetro che non si crepa, i detersivi,
      i magneti più potenti mai costruiti e il controllo delle reazioni nucleari.'
    visual: Cristalli bianchi di borace accanto a un frammento di boro cristallino nero
    attendibilita: documentato
  - id: borace_antico
    sezione: storia
    testo: 'Il borace arriva in Europa molto prima del boro, lungo le rotte carovaniere
      dal Tibet, dove veniva raccolto sulle rive dei laghi salati e venduto agli
      orafi. Serviva da fondente per la saldatura: cosparso su un giunto, scioglie gli
      ossidi che impediscono al metallo fuso di aderire. Era una merce preziosa e
      misteriosa, di cui si conosceva perfettamente l''uso e per nulla la composizione.'
    visual: Sacchi di borace grezzo su una carovana lungo la rotta himalayana
    attendibilita: documentato
  - id: nomenclatura_1787
    sezione: storia
    testo: 'Nel 1787 esce a Parigi la Méthode de nomenclature chimique, firmata da
      Louis-Bernard Guyton de Morveau, Antoine-Laurent Lavoisier, Claude Louis
      Berthollet e Antoine François de Fourcroy. Non è un trattato di scoperte ma una
      riforma del linguaggio: propone di sostituire i nomi tradizionali, opachi e pieni
      di alchimia, con nomi che dichiarino di che cosa è fatta una sostanza. È il testo
      che trasforma l''olio di vetriolo in acido solforico, e con esso la chimica in una
      disciplina in cui il nome contiene già la teoria.'
    visual: Frontespizio della Méthode de nomenclature chimique con la tavola delle
      sostanze
    attendibilita: documentato
  - id: radicale_borico
    sezione: storia
    testo: 'Dentro quella riforma c''è una previsione. Lavoisier riteneva che ogni acido
      fosse ossigeno combinato con un radicale combustibile, e applicando la regola
      all''acido borico i quattro autori conclusero che dovesse esistere un radicale
      borico, mai visto e mai isolato. Gli assegnarono un nome e un posto nella tavola
      delle sostanze semplici. È un episodio raro: il boro entra nella chimica come una
      casella vuota che la teoria dichiara necessaria, ventun anni prima che qualcuno la
      riempia.'
    visual: Riga della tavola delle sostanze semplici con il radicale borico elencato
    attendibilita: documentato
  - id: corsa_1808
    sezione: storia
    testo: 'La casella si riempie nel 1808, e si riempie due volte. A Londra Humphry Davy
      passa una corrente attraverso una soluzione di borati, ottiene un deposito bruno e
      poi, per averne di più, riduce l''acido borico con il potassio metallico: chiama la
      sostanza boracium. A Parigi Joseph Louis Gay-Lussac e Louis Jacques Thénard fanno
      la stessa cosa con il ferro al posto del potassio e arrivano al risultato pochi
      giorni prima di lui. I due laboratori erano in guerra fra loro come i rispettivi
      paesi, e nessuno dei due sapeva dell''altro.'
    visual: Crogiolo con acido borico e limatura di ferro portati al calore rosso
    attendibilita: documentato
  - id: purezza
    sezione: storia
    testo: 'Nessuno dei tre, in realtà, aveva boro puro in mano. La sostanza bruna che si
      passavano era piena di impurezze, e ottenere boro davvero puro si rivelò così
      difficile che il primo campione degno di quel nome è attribuito a Ezekiel
      Weintraub soltanto nel 1909, un secolo dopo. Nel 1812 Davy cambiò idea sul nome:
      capito che la sostanza non era un metallo, sostituì boracium con boron, per
      analogia con il carbon, cioè il carbonio, a cui il boro chimicamente assomiglia.'
    visual: Fiala da laboratorio con polvere bruna di boro amorfo impuro
    attendibilita: documentato
  - id: caratteristiche_legami
    sezione: caratteristiche
    testo: 'Il boro ha un problema aritmetico che ne definisce tutta la chimica: possiede
      tre elettroni di valenza ma quattro caselle disponibili per ospitarli, e questo
      deficit lo rende avido di coppie di elettroni altrui. Nei suoi composti quasi
      sempre allo stato più tre, arriva a costruire legami in cui due elettroni tengono
      insieme tre atomi invece di due, una soluzione che nel resto della tavola periodica
      è quasi sconosciuta e che gli permette di formare gabbie e poliedri.'
    visual: Modello dell''icosaedro di dodici atomi di boro, l''unità della sua struttura
    attendibilita: documentato
  - id: caratteristiche_durezza
    sezione: caratteristiche
    testo: 'Quelle gabbie rendono il boro elementare straordinariamente duro e refrattario:
      fonde oltre i duemila gradi e il suo carburo è fra i materiali più duri che si
      conoscano, secondo soltanto al diamante e al nitruro di boro cubico. È anche un
      semiconduttore, non un metallo, e la sua resistenza elettrica cala col riscaldamento
      invece di crescere, comportandosi al contrario di un filo di rame.'
    visual: Piastra di carburo di boro per corazzature accanto a una punta da trapano
    attendibilita: documentato
  - id: caratteristiche_neutroni
    sezione: caratteristiche
    testo: 'La proprietà nucleare del boro è la sua ragione strategica. Uno dei suoi due
      isotopi naturali, il boro-10, cattura i neutroni lenti con un''efficacia enorme, e
      lo fa senza diventare a sua volta pericolosamente radioattivo. È il materiale con
      cui si fabbricano le barre di controllo dei reattori: si abbassano fra il
      combustibile, assorbono i neutroni che alimentano la reazione a catena e la
      spengono.'
    visual: Barre di controllo al boro sospese sopra il nocciolo di un reattore
    attendibilita: documentato
  - id: usi_vetro
    sezione: usi
    testo: 'L''impiego che assorbe più boro è il vetro borosilicato, quello che non si
      spacca passando dal forno al lavandino perché si dilata pochissimo col calore: è il
      vetro della vetreria di laboratorio, delle pirofile da cucina e degli specchi dei
      telescopi. Segue la lana di vetro isolante, poi le ceramiche tecniche. Nei
      detersivi il perborato ha svolto a lungo il ruolo di sbiancante, liberando ossigeno
      attivo nell''acqua di lavaggio.'
    visual: Beute e provette di vetro borosilicato allineate su una griglia
    attendibilita: documentato
  - id: usi_magneti
    sezione: usi
    testo: 'Una quota piccola ma decisiva finisce nei magneti al neodimio-ferro-boro, i
      più potenti che si sappiano produrre e i motori di ogni auricolare, hard disk,
      motore elettrico e turbina eolica. In agricoltura il boro è un micronutriente
      indispensabile alle piante, che senza di esso non costruiscono correttamente le
      pareti cellulari; la finestra fra la dose necessaria e quella tossica è però fra
      le più strette di tutta la fertilizzazione.'
    visual: Magnete al neodimio accanto a un sacco di fertilizzante boratato
    attendibilita: documentato
  - id: curiosita_borace_ventimule
    sezione: curiosita
    testo: 'Nella Death Valley californiana, fra il 1883 e il 1889, il borace veniva
      portato fuori dal deserto da carri trainati da venti muli, in convogli che con le
      bestie superavano i cinquanta metri di lunghezza e coprivano duecentosessanta
      chilometri di nulla fino alla ferrovia, in dieci giorni di viaggio. Il
      dettaglio è rimasto nella cultura americana come marchio commerciale e come titolo
      di una serie televisiva, ed è probabilmente l''unico caso in cui un elemento chimico
      abbia dato il nome a un western.'
    visual: Convoglio di venti muli con i carri del borace nella Death Valley
    attendibilita: documentato
  - id: curiosita_terapia
    sezione: curiosita
    testo: 'La stessa avidità di neutroni che spegne i reattori è stata trasformata in
      una terapia oncologica. Si somministra al paziente un composto di boro che si
      accumula selettivamente nelle cellule tumorali, poi si irraggia la zona con
      neutroni lenti: la cattura avviene solo dove c''è il boro, e le particelle emesse
      hanno un raggio d''azione di pochi millesimi di millimetro, cioè grosso modo il
      diametro di una cellula. Il danno resta confinato dove serve.'
    visual: Fascio di neutroni diretto sul distretto trattato in una sala di terapia
    attendibilita: documentato
