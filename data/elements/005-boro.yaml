numero_atomico: 5
simbolo: B
nome: Boro
nome_en: Boron
scoperta:
  anno: 1787
  anno_stimato: false
  scopritori:
  - louis-bernard-guyton-de-morveau
  - antoine-laurent-lavoisier
  - claude-louis-berthollet
  - antoine-francois-de-fourcroy
  luogo: Parigi
  epoca: pneumatica
  isolamento_anno: 1809
  note_cronologia: 'La data del 1787 è quella della Méthode de nomenclature chimique,
    firmata da Guyton de Morveau, Lavoisier, Berthollet e Fourcroy, in cui il costituente
    ipotetico dell''acido borico riceve un nome. Davy ottiene la sostanza per via
    elettrochimica e poi riducendo l''acido borico con il potassio nel 1808, pubblicando
    nel 1809 e battezzandola boracium; nel 1812 corregge il nome in boro dopo averne
    stabilito la natura non metallica. Nello stesso 1808, a pochi giorni di distanza,
    Gay-Lussac e Thénard ottengono la stessa sostanza a Parigi riducendo l''acido borico
    con il ferro.'
  controversia: 'Il boro è un caso in cui la data di scoperta registra il battesimo e non
    l''incontro. Nel 1787 nessuno aveva visto il boro: i quattro autori della riforma
    della nomenclatura chimica stavano applicando in modo sistematico la teoria di
    Lavoisier secondo cui ogni acido contiene ossigeno legato a un radicale combustibile,
    e dedussero che dietro l''acido borico dovesse esserci un radicale borico. Diedero
    dunque un nome a una previsione teorica, che risultò corretta ventun anni dopo. Le
    cronologie che datano il boro al 1787 registrano il momento in cui l''elemento entra
    nel linguaggio della chimica; quelle che lo datano al 1808 registrano il momento in
    cui entra in una provetta. La priorità del 1808 è a sua volta contesa fra Davy e la
    coppia Gay-Lussac e Thénard, separati da giorni. A rigore nessuno dei tre gruppi
    ottenne boro puro: la sostanza che si maneggiava era per buona parte impura, e il
    primo campione ragionevolmente puro è attribuito a Ezekiel Weintraub nel 1909.'
