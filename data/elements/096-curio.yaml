  note_cronologia: Il curio fu prodotto nell'estate del 1944, prima dell'americio, e annunciato
    insieme a lui alla fine del 1945. In questo racconto compare comunque dopo, perché a parità
    d'anno l'ordine segue il numero atomico. Anche qui la cronologia di riferimento comprimeva
    la squadra in «Seaborg et al.».
