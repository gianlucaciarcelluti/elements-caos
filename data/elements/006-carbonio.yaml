contenuti:
  hook: 'Il carbonio è l''elemento che l''umanità ha usato per ventisei millenni senza sapere
    di usarlo: il carboncino delle pitture rupestri e il diamante sono la stessa sostanza,
    e per accorgersene ci sono voluti fino al 1796.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Con il carbonio la parola scoperta cambia significato. Non c''è mai stato un momento
      in cui qualcuno lo ha trovato: c''è stato un momento, molto tardo, in cui si è capito
      che sostanze apparentemente irriconciliabili — la fuliggine nera e tenera, il diamante
      trasparente e durissimo — erano fatte dello stesso identico elemento.'
    visual: Un bastoncino di carboncino e un diamante grezzo affiancati sullo stesso piano
    attendibilita: documentato
  - id: carboncino
    sezione: storia
    testo: 'La data convenzionale di ventiseimila anni fa segna la prima testimonianza d''uso,
      non la comprensione. È l''epoca delle grandi pitture rupestri del Paleolitico superiore,
      tracciate con carbone di legna: il pigmento nero più antico e più diffuso della storia
      umana, ottenuto semplicemente lasciando bruciare del legno senza abbastanza aria. Chi
      lo usava non aveva alcuna nozione di elemento chimico, e non ne aveva bisogno.'
    visual: Mano che traccia una figura animale su parete calcarea con un tizzone spento
    attendibilita: documentato
  - id: diamanti_grafite
    sezione: storia
    testo: 'Le altre due forme note fin dall''antichità arrivano da mondi lontanissimi fra
      loro. Il diamante è documentato in India già nel primo millennio a.C., raccolto nei
      depositi alluvionali e apprezzato per una durezza che nessun''altra pietra eguagliava.
      La grafite, tenera e untuosa, viene usata per segnare e per rivestire stampi da fonderia,
      e per secoli è confusa con il piombo: il nome inglese della mina della matita, lead,
      conserva ancora oggi quell''errore.'
    visual: Diamante grezzo, blocco di grafite lucida e una matita affiancati
    attendibilita: documentato
  - id: lavoisier
    sezione: storia
    testo: 'Il primo a mettere sotto esame la questione è Antoine Lavoisier. Nella primavera
      del 1772, a Parigi, brucia un diamante concentrandogli addosso la luce del sole con
      una lente gigantesca di ottantaquattro centimetri di diametro, in un recipiente chiuso.
      Il gas prodotto intorbida l''acqua di calce esattamente come quello del carbone che
      brucia. Lavoisier osserva la coincidenza, ma non se la sente di trarne la conclusione:
      si limita a dire che diamante e carbone appartengono entrambi alla classe dei combustibili.'
    visual: La grande lente ustoria di Lavoisier che concentra il sole su un diamante in una
      campana di vetro
    attendibilita: documentato
  - id: tennant
    sezione: storia
    testo: 'La prova decisiva arriva nel 1796 dall''inglese Smithson Tennant, che riscalda
      centosessanta milligrammi di diamante in un tubo d''oro chiuso insieme a nitrato di
      potassio, e misura. Quantità uguali di diamante e di carbone di legna producono, bruciando,
      quantità uguali di anidride carbonica: se il prodotto è identico, la sostanza di partenza
      deve esserlo. Il carbonio diventa così il primo elemento di cui si dimostra che può
      esistere in forme fisicamente opposte, quelle che oggi chiamiamo allotropi.'
    visual: Bilancia analitica e tubo d'oro sigillato in un laboratorio di fine Settecento
    attendibilita: documentato
  - id: caratteristiche_legami
    sezione: caratteristiche
    testo: 'La particolarità del carbonio sta in una combinazione che nessun altro elemento
      possiede allo stesso grado: quattro elettroni disponibili per legarsi, e la capacità
      di legarsi soprattutto a se stesso, formando catene e anelli lunghi quanto si vuole
      senza perdere stabilità. Da qui derivano i circa duecento milioni di composti oggi noti,
      un numero che supera quello di tutti gli altri elementi messi insieme, e da qui deriva
      l''esistenza stessa della chimica organica come disciplina separata.'
    visual: Modello molecolare di una catena carboniosa che si ramifica in anelli
    attendibilita: documentato
  - id: caratteristiche_allotropi
    sezione: caratteristiche
    testo: Le forme del carbonio puro mostrano quanto conti la disposizione degli atomi rispetto
      alla loro natura. Nel diamante ogni atomo è legato ad altri quattro in una struttura
      tridimensionale rigida, ed è la sostanza naturale più dura conosciuta. Nella grafite
      gli atomi si dispongono in fogli piani sovrapposti che scorrono l'uno sull'altro, ed
      è tenera al punto da lasciare una traccia su un foglio, oltre a condurre l'elettricità.
      Stessa materia, proprietà opposte.
    visual: Confronto fra reticolo tetraedrico del diamante e piani sovrapposti della grafite
    attendibilita: documentato
  - id: caratteristiche_moderne
    sezione: caratteristiche
    testo: Il repertorio si è allargato in tempi recenti. Nel 1985 vengono sintetizzati i
      fullereni, gabbie sferiche di sessanta atomi, e a seguire i nanotubi; nel 2004 viene
      isolato il grafene, un singolo foglio di grafite spesso un atomo, il materiale più resistente
      mai misurato. Chimicamente il carbonio percorre stati di ossidazione da -4 a +4, il
      che gli consente di comportarsi da ossidante o da riducente a seconda del partner.
    visual: Modello di un fullerene sferico accanto a un foglio esagonale di grafene
    attendibilita: documentato
  - id: usi_energia
    sezione: usi
    testo: 'Sul piano delle quantità, l''uso dominante del carbonio resta bruciarlo. Carbone,
      petrolio e gas naturale sono composti del carbonio, e la loro combustione produce anidride
      carbonica: è lo stesso gas che Tennant misurava nel suo tubo d''oro, e la sua accumulazione
      in atmosfera è oggi il principale motore del riscaldamento globale.'
    visual: Ciminiera industriale e giacimento di carbone visti in sequenza
    attendibilita: documentato
  - id: usi_materiali
    sezione: usi
    testo: Negli usi non energetici il carbonio compare come struttura più che come combustibile.
      L'acciaio è ferro con qualche decimo di percento di carbonio, ed è quella minima aggiunta
      a fare la differenza fra un metallo tenero e uno che tiene il filo; le fibre di carbonio
      danno telai più leggeri e più rigidi dell'acciaio a parità di peso; il nerofumo rinforza
      la gomma degli pneumatici; il carbone attivo, la cui struttura porosa concentra in un
      solo grammo una superficie di centinaia di metri quadrati, filtra acqua, aria e veleni
      ingeriti. Gli elettrodi di grafite alimentano i forni siderurgici e gli anodi delle
      batterie al litio.
    visual: Rotolo di tessuto in fibra di carbonio accanto a un blocco di carbone attivo
    attendibilita: documentato
  - id: usi_diamante
    sezione: usi
    testo: 'Il diamante ha un uso industriale che eccede di molto quello ornamentale: la sua
      durezza lo rende l''abrasivo e il tagliente per eccellenza, nelle punte da trapano per
      roccia, nei dischi per il taglio del cemento e negli utensili di precisione. La maggior
      parte dei diamanti impiegati in industria è oggi di sintesi.'
    visual: Corona di perforazione diamantata in azione su roccia
    attendibilita: documentato
  - id: curiosita_datazione
    sezione: curiosita
    testo: 'Una minima frazione del carbonio terrestre è carbonio-14, isotopo radioattivo
      che si forma di continuo nell''alta atmosfera e decade con un tempo di dimezzamento
      di circa 5700 anni. Sul metodo di datazione che ne deriva, messo a punto nel 1949, si
      regge quasi tutta la cronologia della preistoria recente: comprese, con una certa ironia,
      le date di quelle pitture rupestri tracciate con il carbone.'
    visual: Grafico del decadimento del carbonio-14 sovrapposto a un profilo di scavo archeologico
    attendibilita: documentato
  pronuncia: []
