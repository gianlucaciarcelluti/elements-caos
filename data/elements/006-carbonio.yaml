scoperta:
  anno: -26000
  anno_stimato: true
  scopritori: []
  luogo: null
  epoca: antichita
  isolamento_anno: null
  note_cronologia: 'La data segna la più antica testimonianza d''uso, il carbone delle pitture
    rupestri, non la comprensione del carbonio come elemento: quella arriva a fine Settecento.'
  controversia: 'Il carbonio è un caso particolare fra gli elementi noti fin dalla preistoria,
    perché le sue forme sono state usate per millenni senza che nessuno sospettasse fossero
    la stessa sostanza. Carbone di legna, grafite e diamante appartenevano a categorie mentali
    del tutto diverse. Antoine Lavoisier, bruciando un diamante nel 1772, osserva che produce
    lo stesso gas del carbone ma si ferma prima di concludere che siano la stessa cosa. È
    Smithson Tennant, nel 1796, a dimostrarlo per via quantitativa: masse uguali di diamante
    e di carbone danno masse uguali di anidride carbonica. Attribuire quindi la scoperta del
    carbonio alla preistoria è corretto solo nel senso dell''uso; il riconoscimento dell''elemento
    ha una data precisa e sta a fine Settecento.'
