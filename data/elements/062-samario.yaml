  luogo: Parigi, Francia
  epoca: spettroscopia
  isolamento_anno: null
  note_cronologia: 'Lecoq de Boisbaudran ne separò l''ossido dal didimio della samarskite
    nel 1879. L''ossido puro è del 1901, per mano di Eugène-Anatole Demarçay, e il metallo
    del 1903, ottenuto da Wilhelm Muthmann: la samaria originale conteneva anche l''europio,
    che Demarçay separò negli stessi anni.'
  controversia: null
