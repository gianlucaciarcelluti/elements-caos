  - kenton-moody
  luogo: Dubna
  epoca: nucleare
  isolamento_anno: null
  note_cronologia: Quattro atomi prodotti a Dubna nell'agosto 2003 da americio-243 e calcio-48,
    nella collaborazione fra l'istituto russo e il laboratorio di Livermore. Confermato nel
    2013 da un gruppo dell'universita di Lund al GSI e nel 2015 a Berkeley; la IUPAC ha riconosciuto
    la scoperta nel dicembre 2015. Il nome, ufficiale dal 28 novembre 2016, viene dall'oblast'
    di Mosca, la regione in cui si trova Dubna, e non dalla citta di Mosca.
  controversia: null
