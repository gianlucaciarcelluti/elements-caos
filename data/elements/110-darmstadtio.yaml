  note_cronologia: 'La cronologia di riferimento comprimeva gli scopritori in «Hofmann et
    al.»: l''articolo del 1995 è firmato da tredici autori, e qui restano i tre nomi che le
    fonti secondarie isolano sempre. Victor Ninov, secondo firmatario, resta fuori dal campo
    perché il quarto evento annunciato per il 9 novembre 1994 si basava su dati da lui fabbricati
    ed è stato ritirato. Il nome è ufficiale dal 16 agosto 2003.'
