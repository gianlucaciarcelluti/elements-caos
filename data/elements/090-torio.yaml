contenuti:
  hook: Berzelius annunciò il torio due volte. La prima, nel 1815, si sbagliava, e ritrattò
    nove anni dopo. La seconda, nel 1829, aveva davanti un minerale nero mandatogli da un
    pastore norvegese.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: Il torio è un metallo argenteo, denso quanto il piombo e con un punto di fusione
      fra i più alti della tavola periodica. È debolmente radioattivo, tre volte più abbondante
      dell'uranio nella crosta terrestre, e per quasi un secolo la sua carriera principale
      è stata illuminare le strade, molto prima che qualcuno pensasse di usarlo in un reattore.
    visual: Un pezzo di torio metallico opacizzato accanto a una reticella per lampade a gas
    attendibilita: documentato
  - id: il_falso_torio
    sezione: storia
    testo: 'Nel 1815 Jöns Jacob Berzelius analizzò un campione di gadolinite e credette di
      avervi trovato una terra nuova. La battezzò in privato torio, dal nome del dio norreno
      del tuono, e per nove anni la trattò come un elemento. Nel 1824 dovette ricredersi:
      quello che aveva in mano era fosfato di ittrio, e il nome restò libero.'
    visual: Un frammento di gadolinite nera su un banco da laboratorio
    attendibilita: documentato
  - id: la_pietra_norvegese
    sezione: storia
    testo: Nel 1828 Morten Thrane Esmark, pastore protestante e mineralogista per passione,
      raccolse a Løvøya, nel sud della Norvegia, un minerale nero che non riusciva a classificare,
      e lo mandò al padre, professore di mineralogia, che a sua volta lo girò a Berzelius.
    visual: Una pietra nera lucente raccolta su una costa rocciosa
    attendibilita: documentato
  - id: scoperta_1829
    sezione: storia
    testo: Berzelius vi riconobbe l'ossido di un metallo nuovo, e stavolta aveva ragione.
      Pubblicò nel 1829, riducendo con potassio il fluoruro doppio per ottenere un campione
      impuro del metallo, e al minerale diede il nome di torite. Il nome che aveva sprecato
      quattordici anni prima trovava finalmente l'elemento giusto.
    visual: Una storta con un residuo metallico scuro dopo la riduzione con potassio
    attendibilita: documentato
  - id: radioattivita
    sezione: storia
    testo: 'Per settant''anni il torio fu un elemento come gli altri, catalogato fra i metalli
      rari e senza impieghi. Nel 1898, indipendentemente, Gerhard Carl Schmidt a Erlangen
      e Marie Curie a Parigi scoprirono che i suoi composti emettevano radiazioni come quelli
      dell''uranio: era il secondo elemento riconosciuto radioattivo, e fu esaminando i minerali
      di torio e uranio che i Curie arrivarono al polonio e al radio.'
    visual: Un elettrometro a foglie d'oro usato per misurare la ionizzazione dell'aria
    attendibilita: documentato
  - id: metallo_puro
    sezione: storia
    testo: 'Il metallo puro, invece, arrivò tardi. Solo nel 1914 Dirk Lely junior e Lodewijk
      Hamburger ne ottennero un campione al novantanove per cento, e la produzione affidabile
      richiese il processo al cristallo di iodio messo a punto negli anni Venti: fino ad allora
      il torio si maneggiava quasi sempre come ossido.'
    visual: Un filamento incandescente su cui cresce un cristallo metallico
    attendibilita: documentato
  - id: radioattivita_lenta
    sezione: caratteristiche
    testo: 'Il torio naturale è quasi tutto torio-232, che decade con un''emivita di quattordici
      miliardi di anni — più dell''età dell''universo — e proprio per questo è ancora qui
      in quantità: la sua radioattività è debole, ma la catena di decadimento che ne discende
      produce radon e altri figli molto più attivi, ed è quella, non il torio in sé, il problema
      di chi lo maneggia.'
    visual: La catena di decadimento del torio-232 disegnata a schema
    attendibilita: documentato
  - id: proprieta_fisiche
    sezione: caratteristiche
    testo: 'È denso 11,7 grammi per centimetro cubo e fonde a 1750 gradi; il suo ossido supera
      i 3300 gradi, uno dei punti di fusione più alti fra tutti gli ossidi. Appena tagliato
      è lucente, ma all''aria si opacizza passando al grigio e poi al nero, e in polvere fine
      è piroforico: si accende da solo.'
    visual: Un blocchetto metallico che passa dal lucente al grigio scuro
    attendibilita: documentato
  - id: chimica
    sezione: caratteristiche
    testo: 'La sua chimica è semplice quanto quella di un lantanide: il torio sta praticamente
      sempre nello stato +4, con ioni incolori, e i complessi in cui scende a +3 o a +2 sono
      curiosità da laboratorio, sintetizzate per capire come si comportano gli orbitali f.
      Questa monotonia lo rende più simile allo zirconio e all''afnio che agli attinidi che
      gli stanno accanto, ed è la ragione per cui la sua collocazione nella tavola periodica
      ha richiesto decenni per essere accettata.'
    visual: La riga degli attinidi con il torio in evidenza
    attendibilita: documentato
  - id: usi_reticelle
    sezione: usi
    testo: 'L''impiego che ha consumato più torio è oggi quasi scomparso. Il biossido, scaldato
      dalla fiamma di una lampada a gas, emette una luce bianca intensissima: su questo Carl
      Auer von Welsbach costruì la reticella incandescente, che fra la fine dell''Ottocento
      e i primi decenni del Novecento illuminò strade e case di mezzo mondo prima che la lampadina
      elettrica prendesse il sopravvento.'
    visual: Una reticella incandescente accesa sopra un becco a gas
    attendibilita: documentato
  - id: usi_industriali
    sezione: usi
    testo: 'Gli altri impieghi storici sfruttano la refrattarietà e l''indice di rifrazione:
      crogioli per fondere metalli ad altissima temperatura, elettrodi per la saldatura ad
      arco con tungsteno, lenti di obiettivi ad alte prestazioni. Quasi tutti sono stati abbandonati
      o sostituiti quando la radioattività dei materiali è diventata un criterio di scelta.'
    visual: Elettrodi da saldatura con la punta colorata secondo la lega
    attendibilita: documentato
  - id: usi_nucleare
    sezione: usi
    testo: 'Il futuro che gli si attribuisce da settant''anni è invece nucleare. Il torio-232
      non è fissile, ma assorbendo un neutrone diventa uranio-233, che lo è: un reattore a
      torio funziona solo se qualcosa lo innesca e lo mantiene, in cambio di una risorsa tre
      volte più abbondante dell''uranio e di scorie a vita più breve. Reattori sperimentali
      ne sono stati costruiti fin dagli anni Sessanta; una filiera commerciale, finora, no.'
    visual: Lo schema del ciclo torio-uranio 233 in un reattore
    attendibilita: documentato
  - id: curiosita_monazite
    sezione: curiosita
    testo: 'Il torio si estrae quasi esclusivamente dalla monazite, che è anche uno dei minerali
      delle terre rare: chi cerca neodimio per i magneti si ritrova fra le mani torio radioattivo
      di cui deve rispondere, ed è una delle ragioni per cui la lavorazione delle terre rare
      è finita concentrata dove le regole erano meno severe.'
    attendibilita: documentato
  - id: curiosita_nome
    sezione: curiosita
    testo: Il nome viene da Thor, il dio norreno del tuono, ed è uno dei pochi casi in cui
      un elemento porta il nome di una divinità nordica invece che greca o romana. Berzelius
      lo aveva scelto per un elemento che non esisteva, e lo tenne in serbo quattordici anni
      prima di trovargli un titolare.
    attendibilita: documentato
