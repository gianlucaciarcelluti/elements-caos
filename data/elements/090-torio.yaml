  epoca: elettrolisi
  isolamento_anno: 1914
  note_cronologia: Berzelius aveva già usato il nome «torio» nel 1815 per una terra che nel
    1824 si rivelò fosfato di ittrio. L'elemento vero arrivò nel 1829, dal minerale nero raccolto
    da Morten Thrane Esmark a Løvøya. La radioattività fu riconosciuta nel 1898, indipendentemente
    da Gerhard Carl Schmidt e Marie Curie. Isolato in forma pura al 99 per cento nel 1914
    da Dirk Lely Jr. e Lodewijk Hamburger.
