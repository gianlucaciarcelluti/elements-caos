  epoca: spettroscopia
  isolamento_anno: 1911
  note_cronologia: 'La fonte attribuiva l''isolamento del 1911 a ''H. Nilson'', ma la verifica
    indica Charles James come primo isolatore del tulio puro: lo scopritore riconosciuto qui
    è solo Cleve, autore dell''osservazione del 1879.'
  controversia: null
