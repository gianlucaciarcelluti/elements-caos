  epoca: spettroscopia
  isolamento_anno: null
  note_cronologia: Corrisponde all'eka-silicio previsto da Mendeleev nel 1869. Winkler lo
    isolò inseguendo il sette per cento di massa che non riusciva ad attribuire nell'analisi
    dell'argirodite, e in un primo momento lo credette l'eka-antimonio.
