contenuti:
  hook: 'Winkler cercava di far tornare i conti di un minerale d''argento: pesava tutto e
    gli mancava il sette per cento. Quel buco nella bilancia era un elemento che Mendeleev
    aveva descritto quindici anni prima.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il germanio è un semimetallo grigio e fragile che ha fatto da culla a tutta l''elettronica
      a stato solido: i primi transistor erano di germanio, e solo dopo il silicio lo ha sostituito
      quasi ovunque. Oggi lavora dove il silicio non arriva, cioè nell''infrarosso e nelle
      fibre ottiche.'
    visual: Un lingotto policristallino di germanio dalla superficie lucida
    attendibilita: documentato
  - id: eka_silicio
    sezione: storia
    testo: Nel 1869 Mendeleev aveva previsto un elemento nella casella vuota sotto il silicio,
      l'eka-silicio, indicandone la massa atomica intorno a 70, la densità, il colore grigio
      e perfino il comportamento del suo ossido e del suo cloruro. Era la terza delle sue
      previsioni verificabili, e la più dettagliata.
    visual: La colonna del carbonio in una tavola periodica con una casella vuota
    attendibilita: documentato
  - id: argirodite
    sezione: storia
    testo: 'Nel 1885 in una miniera presso Freiberg, in Sassonia, si trovò un minerale d''argento
      nuovo, che fu chiamato argirodite. Clemens Winkler ne fece l''analisi completa e si
      trovò davanti a un problema: sommando argento, zolfo e le altre componenti identificate
      arrivava solo al novantatré per cento del peso. Mancava un sette per cento che non riusciva
      ad attribuire a nulla di conosciuto.'
    visual: Un campione di argirodite grigio-scura in una collezione mineralogica
    attendibilita: documentato
  - id: la_caccia_al_residuo
    sezione: storia
    testo: Inseguire quel residuo gli prese mesi. Alla fine ne isolò l'elemento e ne misurò
      le proprietà, e all'inizio credette che si trattasse dell'eka-antimonio, un'altra delle
      caselle vuote; solo poco dopo si convinse che era invece l'eka-silicio, esattamente
      com'era stato descritto quindici anni prima da un chimico che quel minerale non lo aveva
      mai visto.
    visual: Un chimico ottocentesco al lavoro con storte e bilance
    attendibilita: documentato
  - id: il_nome
    sezione: storia
    testo: Winkler avrebbe voluto chiamarlo neptunium, dal pianeta la cui esistenza era stata
      anch'essa prevista prima dell'osservazione, ma quel nome era già stato usato per una
      rivendicazione precedente e rimasto in circolazione. Scelse allora germanium, dal nome
      latino della propria patria, sulla scia del gallio che aveva preso il nome dalla Francia.
    visual: Una pagina di rivista chimica tedesca del 1886
    attendibilita: documentato
  - id: previsione_e_misura
    sezione: storia
    testo: 'Il confronto fra le proprietà previste e quelle misurate è rimasto il pezzo forte
      di ogni manuale di chimica: massa atomica prevista 72, trovata 72,6; densità prevista
      5,5, trovata 5,47; il cloruro previsto liquido e bollente sotto i cento gradi, trovato
      liquido e bollente a ottantasei. Dopo il germanio nessuno discusse più la tavola periodica.'
    visual: Due colonne di numeri a confronto in un manuale di chimica
    attendibilita: documentato
  - id: semiconduttore
    sezione: caratteristiche
    testo: 'Il germanio ha la stessa struttura cristallina del diamante e del silicio e ne
      condivide il comportamento: non è né un metallo né un isolante, e la sua conducibilità
      si comanda drogandolo con quantità minime di altri elementi. È questa proprietà, incomprensibile
      fino agli anni Trenta del Novecento, ad averlo portato al centro della tecnologia del
      dopoguerra.'
    visual: Il reticolo cristallino cubico del germanio in un modello molecolare
    attendibilita: documentato
  - id: proprieta_ottiche
    sezione: caratteristiche
    testo: 'È opaco alla luce visibile ma trasparente all''infrarosso, e il suo ossido ha
      un indice di rifrazione alto con una dispersione bassa. Sono le due proprietà su cui
      si reggono i suoi usi ottici: da una parte le lenti delle termocamere, che devono lasciar
      passare il calore e non la luce, dall''altra il nucleo delle fibre ottiche, dove serve
      un vetro che rifranga un po'' più del mantello che lo circonda.'
    visual: Una lente in germanio montata su una termocamera
    attendibilita: documentato
  - id: come_lacqua
    sezione: caratteristiche
    testo: 'Come l''acqua, il silicio e il gallio, il germanio si espande solidificando: il
      solido è meno denso del liquido. È una stranezza che condivide con pochi altri materiali
      e che dipende dalla struttura aperta del reticolo, dove ogni atomo ha solo quattro vicini
      invece dei dodici di un metallo ordinario.'
    visual: Un lingotto di germanio con la superficie deformata dalla solidificazione
    attendibilita: documentato
  - id: il_primo_transistor
    sezione: usi
    testo: 'Il transistor del 1947, ai Bell Labs, era un contatto puntiforme su un cristallo
      di germanio, e per un quarto di secolo il germanio è stato il materiale dell''elettronica
      a stato solido: radioline, calcolatori, i primi computer commerciali. Il silicio lo
      ha poi sostituito quasi ovunque perché regge temperature più alte e ha correnti di dispersione
      molto più basse, ma per farlo ha richiesto un grado di purezza che negli anni Cinquanta
      nessuno sapeva raggiungere. Il germanio ha tenuto il campo finché la metallurgia del
      silicio non è maturata, e in quel frattempo ha insegnato agli ingegneri come si progetta
      un circuito a semiconduttori.'
    visual: Una replica del primo transistor a contatto puntiforme
    attendibilita: documentato
  - id: usi_ottici
    sezione: usi
    testo: 'Oggi il grosso del germanio va nelle fibre ottiche, dove il biossido drogato nel
      nucleo di vetro ne alza l''indice di rifrazione quel tanto che basta a intrappolare
      la luce, e nelle ottiche a infrarossi: le lenti delle termocamere, dei sistemi di visione
      notturna e dei sensori termici industriali sono quasi tutte di germanio.'
    visual: Il nucleo di una fibra ottica visto in sezione al microscopio
    attendibilita: documentato
  - id: usi_chimici_e_solari
    sezione: usi
    testo: Il resto si divide fra il ruolo di catalizzatore nella produzione del PET, la plastica
      delle bottiglie, e le celle solari multigiunzione per i satelliti, dove il germanio
      fa da substrato e da giunzione inferiore. La produzione mondiale si misura in poche
      centinaia di tonnellate l'anno e viene quasi tutta come sottoprodotto dello zinco e
      delle ceneri di carbone.
    visual: Un pannello solare per satelliti con celle multigiunzione
    attendibilita: documentato
  - id: curiosita_radiazione
    sezione: curiosita
    testo: 'I rivelatori di raggi gamma più precisi che esistano sono cristalli singoli di
      germanio ultrapuro, raffreddati con azoto liquido: distinguono energie che gli altri
      rivelatori confondono, e sono lo strumento con cui si identificano gli isotopi in un
      campione sconosciuto, dai reperti archeologici ai controlli sulle contaminazioni radioattive.'
    attendibilita: documentato
  - id: curiosita_neptunium
    sezione: curiosita
    testo: 'Il nome neptunium che Winkler scartò non andò perduto: fu usato nel 1940 per l''elemento
      93, il primo dei transuranici, che sta nella tavola periodica subito dopo l''uranio
      come Nettuno sta nel sistema solare subito dopo Urano. La logica del battesimo è la
      stessa che aveva in mente Winkler, con cinquant''anni di ritardo.'
    attendibilita: documentato
  pronuncia:
  - termine: Clemens Winkler
    ipa: ˈkleːmens ˈvɪŋklɐ
    nota: Tedesco.
  - termine: argirodite
    ipa: ardʒiroˈdite
    nota: Dal greco argyros, argento.
