  note_cronologia: Ultimo elemento stabile scoperto. Walter Noddack, Ida Tacke e Otto Berg
    lo annunciarono nel 1925 insieme all'elemento 43, che chiamarono masurio e che si rivelò
    un errore. Nel 1928 ne estrassero un grammo lavorando 660 chilogrammi di molibdenite.
    Nel 1908 Masataka Ogawa aveva probabilmente osservato lo stesso elemento, attribuendolo
    però alla casella 43 con il nome di nipponium.
