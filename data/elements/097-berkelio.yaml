  luogo: Berkeley, California
  epoca: nucleare
  isolamento_anno: null
  note_cronologia: 'Sintetizzato nel dicembre 1949 bombardando americio-241 con particelle
    alfa: il risultato furono poche migliaia di atomi. Il nome segue l''analogia con il terbio,
    che occupa la stessa posizione fra i lantanidi e porta a sua volta il nome del luogo della
    scoperta.'
  controversia: null
