  luogo: Parigi, Francia
  epoca: spettroscopia
  isolamento_anno: null
  note_cronologia: 'Primo elemento scoperto per via radiometrica: i Curie lo individuarono
    nel luglio 1898 seguendo l''attività residua della pechblenda dopo la rimozione di uranio
    e torio, senza averne isolato una quantità pesabile. Il nome fu scelto da Marie Curie
    per la Polonia, allora divisa fra tre imperi.'
