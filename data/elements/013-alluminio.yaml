scoperta:
  anno: 1746
  anno_stimato: false
  scopritori:
  - johann-heinrich-pott
  luogo: Berlino
  epoca: alchimia
  isolamento_anno: 1825
  note_cronologia: 'Nel 1746 Pott mostra che il precipitato ottenuto versando un alcali in
    una soluzione di allume è diverso dalla calce e dal gesso. Isolato nel 1825 da Hans
    Christian Ørsted; la purezza del suo campione è discussa, e Friedrich Wöhler ne
    perfeziona la preparazione dal 1827.'
  controversia: 'Fra la data di scoperta dell''alluminio e la sua disponibilità reale corre
    un secolo e mezzo, e ogni tappa è contesa. Nel 1746 Pott dimostra che l''allumina è una
    sostanza diversa dalla calce e dal gesso, ma non ne cava alcun metallo. Ørsted, nel
    1825, annuncia di averlo ottenuto: il suo campione era però quasi certamente una lega di
    alluminio e potassio, non il metallo puro, tanto che Friedrich Wöhler dovette rifare il
    lavoro dal 1827 e ottenne pezzi apprezzabili solo nel 1845. Attribuire l''isolamento a
    Ørsted è la convenzione corrente e ha buone ragioni, ma è una priorità di annuncio più
    che di risultato.'
