numero_atomico: 13
simbolo: Al
nome: Alluminio
nome_en: Aluminium
scoperta:
  anno: 1746
  anno_stimato: false
  scopritori:
  - johann-heinrich-pott
  luogo: Berlino
  epoca: alchimia
  isolamento_anno: 1825
  note_cronologia: La collocazione nell'epoca alchemica dipende dalla data adottata, il 1746
    dell'osservazione di Pott. L'alluminio è isolato solo nel 1825 da Hans Christian Ørsted
    — la purezza del suo campione è discussa, e Wöhler ne perfeziona la preparazione dal 1827
    — e in una cronologia per isolamento starebbe fra gli elementi di Davy e Berzelius.
  controversia: 'Fra la data di scoperta dell''alluminio e la sua disponibilità reale corre
    un secolo e mezzo, e ogni tappa è contesa. Nel 1746 Pott dimostra che l''allumina è una
    sostanza diversa dalla calce e dal gesso, ma non ne cava alcun metallo. Ørsted, nel 1825,
    annuncia di averlo ottenuto: il suo campione era però quasi certamente una lega di alluminio
    e potassio, non il metallo puro, tanto che Friedrich Wöhler dovette rifare il lavoro dal
    1827 e ottenne pezzi apprezzabili solo nel 1845. Attribuire l''isolamento a Ørsted è la
    convenzione corrente e ha buone ragioni, ma è una priorità di annuncio più che di risultato.'
