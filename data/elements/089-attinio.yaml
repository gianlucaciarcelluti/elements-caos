  note_cronologia: Debierne lo separò nel 1899 dai residui di pechblenda già sfruttati dai
    Curie per il radio. Nel 1902 Friedrich Oskar Giesel lo trovò indipendentemente e lo chiamò
    emanium, descrivendone le proprietà chimiche con più precisione; la priorità fu assegnata
    a Debierne per anzianità, ma a Giesel si riconosce la prima preparazione radiochimicamente
    pura.
