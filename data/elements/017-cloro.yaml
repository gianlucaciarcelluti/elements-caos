  luogo: null
  epoca: pneumatica
  isolamento_anno: 1774
  note_cronologia: 'Scheele prepara il gas nel 1774 facendo reagire la pirolusite con l''acido
    muriatico, ma lo interpreta come un composto e lo chiama aria di acido muriatico
    deflogisticato. Che si tratti di un elemento è dimostrato da Humphry Davy, che lo annuncia
    alla Royal Society il 15 novembre 1810 e conia il nome cloro.'
