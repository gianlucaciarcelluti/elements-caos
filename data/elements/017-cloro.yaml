contenuti:
  hook: Scheele lo produsse nel 1774 e passò il resto della vita convinto che fosse un composto.
    Ci vollero trentasei anni e Humphry Davy per stabilire che non si poteva scomporre in nulla.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il cloro è un gas giallo-verde, denso e dall''odore soffocante, e ha una doppia
      biografia difficile da conciliare: è stata la prima arma chimica della storia moderna e
      insieme una delle tecnologie sanitarie che hanno salvato più vite di qualsiasi altra. La
      stessa proprietà spiega entrambe le carriere, perché il cloro distrugge la materia
      organica, e distruggerla può significare uccidere un uomo o uccidere il batterio del tifo
      in un acquedotto.'
    visual: Ampolla di cloro gassoso giallo-verde in controluce
    attendibilita: documentato
  - id: scheele_pirolusite
    sezione: storia
    testo: 'Nel 1774 Carl Wilhelm Scheele fa reagire la pirolusite, il minerale nero di
      manganese, con l''acido muriatico, cioè l''acido cloridrico. Si sviluppa un gas
      giallo-verde dall''odore violento che sbianca la carta di tornasole invece di arrossarla
      come farebbe un acido, corrode i metalli e scolora i tessuti e i fiori. Scheele annota
      tutte queste proprietà con una precisione che ancora si legge, e sbaglia soltanto
      nell''unico punto in cui non poteva fare altrimenti.'
    visual: Storta con la pirolusite nera e il gas giallo-verde che si raccoglie
    attendibilita: documentato
  - id: nome_impossibile
    sezione: storia
    testo: 'Lo chiama aria di acido muriatico deflogisticato, un nome che è tutta la teoria del
      tempo condensata in quattro parole. Nella cornice del flogisto quel gas non poteva essere
      una sostanza semplice: doveva essere acido muriatico privato del suo flogisto. Quando poi
      Lavoisier sostituì il flogisto con l''ossigeno, l''errore cambiò forma senza sparire,
      perché la nuova teoria pretendeva che ogni acido contenesse ossigeno e quindi che il gas
      fosse un ossido di un elemento ancora ignoto, il murium.'
    visual: Schema settecentesco della composizione presunta dell'acido muriatico
    attendibilita: documentato
  - id: davy_elemento
    sezione: storia
    testo: 'La questione la chiude Humphry Davy nel 1810, e la chiude togliendo qualcosa invece
      di aggiungerlo. Prova in tutti i modi a estrarre ossigeno da quel gas, con il carbone
      incandescente e con i metalli più avidi di ossigeno che conosce, e non ne cava nulla: se
      l''ossigeno non c''è, il gas non è un ossido ma un elemento. Lo annuncia alla Royal
      Society il 15 novembre di quell''anno e lo chiama chlorine, dal greco chloros,
      verde-giallo, cioè dal suo colore e da nient''altro.'
    visual: Davy alla Royal Institution davanti all'apparato con il gas verde
    attendibilita: documentato
  - id: resistenza
    sezione: storia
    testo: 'La conclusione non fu accolta subito. Chimici della statura di Berthollet e dello
      stesso Gay-Lussac continuarono per anni a ritenere che l''ossigeno dovesse esserci e che
      semplicemente non lo si sapeva estrarre, perché ammettere il contrario significava
      smontare il pilastro dell''edificio di Lavoisier, cioè che l''ossigeno fosse il principio
      di ogni acidità. Il cloro è l''elemento che ha dimostrato falsa quella tesi, e il nome
      dell''ossigeno resta lì a ricordarla.'
    visual: Carteggio fra chimici francesi e inglesi sulla natura del gas muriatico
    attendibilita: documentato
  - id: caratteristiche_reattivita
    sezione: caratteristiche
    testo: 'Il cloro sta appena sotto il fluoro nella tavola periodica e ne ripete il carattere
      con un grado di violenza in meno: gli manca un elettrone, lo prende quasi da chiunque, e
      nella grande maggioranza dei suoi composti si trova allo stato meno uno. Legato
      all''ossigeno assume però anche stati positivi, fino a più sette nei perclorati, ed è da
      questa famiglia di composti che vengono i candeggianti e i disinfettanti, perché in essi
      il cloro è un ossidante pronto a scaricarsi.'
    visual: Ipoclorito che decolora una striscia di tessuto colorato
    attendibilita: documentato
  - id: caratteristiche_sale
    sezione: caratteristiche
    testo: 'La sua forma naturale è la più innocua che si possa immaginare. In natura il cloro
      non esiste libero: è tutto ione cloruro, disciolto negli oceani e depositato nei
      giacimenti di salgemma, e il cloruro è la sostanza che rende salato il mare e il sangue.
      Fra il gas che soffoca e lo ione che beviamo la differenza è un solo elettrone, ed è
      l''esempio più didattico del principio secondo cui le proprietà di un elemento non sono
      quelle dei suoi ioni.'
    visual: Cristalli cubici di salgemma accanto all'ampolla del gas
    attendibilita: documentato
  - id: caratteristiche_organici
    sezione: caratteristiche
    testo: 'Legato al carbonio, il cloro dà una famiglia di composti tanto utili quanto
      problematici. Il legame carbonio-cloro è stabile e conferisce alle molecole resistenza,
      non infiammabilità e potere solvente, doti che hanno reso i clorurati onnipresenti nel
      Novecento; le stesse doti li rendono però persistenti nell''ambiente, e alcuni fra i più
      noti — il DDT, i policlorobifenili, i clorofluorocarburi — sono stati vietati proprio
      perché non si degradavano.'
    visual: Bidoni di solventi clorurati con i simboli di pericolo ambientale
    attendibilita: documentato
  - id: usi_industria
    sezione: usi
    testo: 'Il cloro industriale si ottiene per elettrolisi della salamoia, un processo che
      produce contemporaneamente soda caustica e idrogeno ed è fra i maggiori consumatori di
      energia elettrica dell''industria chimica. La destinazione singola più importante è il
      cloruro di polivinile, il PVC di tubature, infissi e cavi, che da solo assorbe fra il
      trentacinque e il quaranta per cento del cloro prodotto nel mondo; il resto si
      distribuisce fra solventi, farmaci e disinfettanti.'
    visual: Celle elettrolitiche cloro-soda in un impianto industriale
    attendibilita: documentato
  - id: usi_acqua
    sezione: usi
    testo: 'L''impiego che conta di più non si misura in tonnellate. Nel 1908 l''acquedotto di
      Jersey City fu il primo negli Stati Uniti a clorare stabilmente l''acqua potabile su larga
      scala, per iniziativa del medico John Leal, e nel giro di pochi anni la febbre tifoide
      crollò nelle città che seguirono l''esempio. La disinfezione delle acque è considerata fra
      i maggiori progressi della sanità pubblica del Novecento, e si regge su dosi di cloro
      dell''ordine di un milligrammo per litro.'
    visual: Impianto di clorazione di un acquedotto municipale dei primi del Novecento
    attendibilita: documentato
  - id: curiosita_ypres
    sezione: curiosita
    testo: 'Il 22 aprile 1915 a Ypres l''esercito tedesco aprì le valvole di migliaia di bombole
      e lasciò che il vento portasse una nube di cloro sulle linee franco-algerine: è l''atto di
      nascita della guerra chimica su scala industriale. Il cloro è più denso dell''aria e
      quindi scendeva nelle trincee invece di disperdersi, il che lo rendeva atrocemente
      efficace proprio contro i soldati che vi cercavano riparo.'
    visual: Nube giallo-verde che avanza sul terreno verso le trincee
    attendibilita: documentato
  - id: curiosita_candeggina
    sezione: curiosita
    testo: 'L''avvertenza di non mescolare i prodotti per la pulizia ha un fondamento chimico
      preciso e riguarda proprio la reazione di Scheele al contrario. La candeggina contiene
      ipoclorito; se le si aggiunge un anticalcare acido, l''ipoclorito si riduce e libera cloro
      gassoso nel bagno di casa. Mescolarla invece con l''ammoniaca produce cloroammine,
      altrettanto irritanti per le vie respiratorie. Sono fra gli avvelenamenti domestici più
      frequenti, e nascono sempre dall''idea che due detergenti puliscano più di uno.'
    visual: Due flaconi di detergente domestico affiancati con il simbolo di divieto
    attendibilita: documentato
  pronuncia:
  - termine: Humphry Davy
    ipa: ˈhʌmfri ˈdeɪvi
    nota: All'inglese; il nome si scrive senza la e, Humphry.
  - termine: Claude Louis Berthollet
    ipa: klod lwi bɛʁtɔlɛ
    nota: Alla francese, con la t finale muta.
