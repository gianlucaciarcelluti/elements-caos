  note_cronologia: La data adottata è quella dell'esperimento del 2010, l'ultimo che abbia
    riempito una casella della tavola periodica; il riconoscimento IUPAC è del dicembre 2015
    e il nome è ufficiale dal 28 novembre 2016. La scoperta è attribuita a una collaborazione
