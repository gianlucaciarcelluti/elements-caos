numero_atomico: 78
simbolo: Pt
nome: Platino
nome_en: Platinum
scoperta:
  anno: -600
  anno_stimato: true
  scopritori: []
  luogo: Esmeraldas, costa pacifica dell'attuale Ecuador
  epoca: antichita
  isolamento_anno: 1752
  note_cronologia: 'La data convenzionale si riferisce alla cultura La Tolita della costa
    pacifica sudamericana, che lavorava il platino per sinterizzazione. In Europa il metallo
    entra nella letteratura scientifica con la descrizione di Henrik Teofilus Scheffer nel
    1752, dopo i campioni raccolti da Charles Wood nel 1741.'
  controversia: 'Datare la lavorazione precolombiana del platino è più difficile di quanto
    le fonti divulgative lascino intendere. La cultura La Tolita, sulla costa fra l''attuale
    Ecuador e la Colombia meridionale, è collocata all''incirca fra il 600 a.C. e il 200 d.C.,
    e la data adottata qui prende l''estremo antico di quell''intervallo. Il margine di incertezza
    è però ampio, perché la maggior parte degli oggetti di platino della regione non proviene
    da scavi controllati ma dal mercato antiquario, e senza contesto stratigrafico la datazione
    resta indiretta. Va aggiunto che quei metallurgisti non lavoravano platino puro, bensì
    granuli alluvionali di metalli del gruppo del platino, con palladio, rodio e iridio mescolati.'
