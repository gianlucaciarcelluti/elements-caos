numero_atomico: 10
simbolo: Ne
nome: Neon
nome_en: Neon
scoperta:
  anno: 1898
  anno_stimato: false
  scopritori:
  - william-ramsay
  - morris-travers
  luogo: Londra, Regno Unito
  epoca: spettroscopia
  isolamento_anno: null
  note_cronologia: Secondo dei tre gas nobili che Ramsay e Travers ricavarono nel 1898 dalla
    distillazione frazionata dell'aria liquida, fra il cripton di maggio e lo xenon di settembre.
    Il nome fu suggerito dal figlio tredicenne di Ramsay.
  controversia: null
proprieta:
  gruppo: 18
  periodo: 2
  blocco: p
  categoria: gas_nobile
  massa_atomica: 20.17976
  configurazione_elettronica: '[He] 2s2 2p6'
