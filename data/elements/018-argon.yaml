  note_cronologia: 'La scoperta nasce da un''anomalia di densità: l''azoto atmosferico pesava
    lo 0,5 per cento più di quello chimico. L''esperimento di Henry Cavendish del 1785 aveva
    già isolato lo stesso residuo inerte senza che nessuno ne traesse conclusioni.'
  controversia: null
