  note_cronologia: 'Vauquelin riceve campioni di crocoite siberiana nel 1794 e nel 1797
    stabilisce che il minerale contiene un metallo non ancora descritto, ottenendone
    l''ossido; l''anno successivo riduce l''ossido con il carbone in un forno a carbonella
    e ottiene il metallo. Il minerale era noto in Europa dal 1761, quando Johann Gottlob
    Lehmann lo descrisse come piombo rosso di Siberia.'
