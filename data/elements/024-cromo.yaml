contenuti:
  hook: 'Il rosso dei rubini, il verde degli smeraldi e il giallo degli scuolabus
    americani sono la stessa cosa: un elemento che i greci avrebbero chiamato
    semplicemente colore.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il cromo è un metallo grigio-acciaio durissimo e lucentissimo, che resiste alla
      corrosione con una tenacia che nessun altro elemento comune gli avvicina. È il
      motivo per cui l''acciaio inossidabile è inossidabile e per cui i paraurti degli
      anni Cinquanta brillavano. Il suo nome, però, non parla né di durezza né di
      lucentezza: parla di colore, perché quando fu scoperto era soprattutto questo che
      sapeva fare.'
    visual: Superficie cromata a specchio che riflette il laboratorio
    attendibilita: documentato
  - id: piombo_rosso
    sezione: storia
    testo: 'Nel 1761, sugli Urali, il mineralogista Johann Gottlob Lehmann descrive un
      minerale arancio-rosso di una bellezza insolita e lo chiama piombo rosso di Siberia.
      Un decennio dopo Peter Simon Pallas visita lo stesso giacimento e capisce che quella
      pietra vale come pigmento: macinata, dà un arancione intenso che i pittori pagano
      caro. Il minerale, che oggi chiamiamo crocoite, comincia a viaggiare verso i
      laboratori europei per essere capito.'
    visual: Cristalli aciculari aranciati di crocoite su matrice rocciosa
    attendibilita: documentato
  - id: vauquelin
    sezione: storia
    testo: 'I campioni arrivano nel 1794 sul banco di Louis Nicolas Vauquelin, a Parigi.
      Figlio di un fattore normanno, entrato in chimica come garzone di farmacia e poi come
      assistente di Antoine François de Fourcroy, Vauquelin non è un teorico: è
      probabilmente il miglior analista del suo tempo, uno che nella carriera firmerà
      centinaia di memorie fatte quasi tutte della stessa cosa, cioè smontare pazientemente
      una sostanza per vedere di che è composta. La crocoite è esattamente il suo genere di
      problema.'
    visual: Vauquelin al banco fra storte, filtri e soluzioni colorate
    attendibilita: documentato
  - id: analisi
    sezione: storia
    testo: 'Vauquelin trova il piombo che il nome del minerale prometteva, ma trova anche
      qualcos''altro che non corrisponde a nulla di noto. Nel 1797 stabilisce che si tratta
      di un metallo nuovo e ne isola l''ossido; l''anno dopo scalda quell''ossido con il
      carbone in un forno a carbonella e ne cava un metallo grigio, fragile e refrattario.
      È uno dei rari casi in cui la stessa persona scopre l''elemento e lo isola, a dodici
      mesi di distanza.'
    visual: Forno a carbonella con il crogiolo che contiene l''ossido e il carbone
    attendibilita: documentato
  - id: nome_colore
    sezione: storia
    testo: 'A colpire Vauquelin e i colleghi non è il metallo, che è opaco e poco
      maneggevole, ma quello che i suoi composti sanno fare. Passando da un sale
      all''altro si ottengono gialli squillanti, aranci, verdi profondi, viola, rossi: una
      tavolozza intera da un solo elemento. Di qui il nome, dal greco chroma, colore, che è
      una scelta insolita perché descrive non la sostanza ma il suo repertorio. Vauquelin
      riconobbe il cromo anche nel rubino e nello smeraldo.'
    visual: Serie di provette con i sali di cromo nei loro diversi colori
    attendibilita: documentato
  - id: caratteristiche_stati
    sezione: caratteristiche
    testo: 'La tavolozza ha una spiegazione precisa. Il cromo è capace di reggere un numero
      insolito di stati di ossidazione, dai negativi fino a più sei, e i più comuni sono
      più tre e più sei; a ogni stato e a ogni intorno chimico corrisponde una diversa
      disposizione degli elettroni nei suoi orbitali, che assorbe una porzione diversa
      della luce visibile e lascia passare il resto. Quel resto è il colore che vediamo. In
      pratica, ogni volta che il cromo cambia abito, cambia tinta.'
    visual: Schema dei livelli elettronici con le transizioni che assorbono la luce
    attendibilita: documentato
  - id: caratteristiche_gemme
    sezione: caratteristiche
    testo: 'La stessa chimica spiega due gemme che sembrano non avere nulla in comune. Il
      corindone puro è incolore; se qualche atomo di alluminio viene sostituito da cromo,
      diventa rosso e si chiama rubino, mentre altre impurezze lo fanno azzurro e lo
      chiamano zaffiro. Il berillo puro è anch''esso incolore; con tracce di cromo diventa
      verde e si chiama smeraldo. Il rosso più celebre e il verde più celebre della
      gioielleria escono dallo stesso elemento in due matrici diverse.'
    visual: Un rubino e uno smeraldo affiancati sotto la stessa luce
    attendibilita: documentato
  - id: caratteristiche_passivazione
    sezione: caratteristiche
    testo: 'La virtù industriale del cromo è invece invisibile. Esposto all''aria si copre
      istantaneamente di uno strato di ossido spesso pochi atomi, compatto e aderente, che
      isola il metallo sottostante e si richiude da solo se viene graffiato. La ruggine del
      ferro fa il contrario: è porosa, si sfalda e lascia procedere l''attacco verso
      l''interno. Basta portare il cromo sopra l''undici per cento in una lega di ferro
      perché quella pellicola si formi sull''intera superficie: è l''acciaio inossidabile.'
    visual: Sezione ingrandita dello strato di passivazione su una lamiera inox
    attendibilita: documentato
  - id: usi_acciai
    sezione: usi
    testo: 'La stragrande maggioranza del cromo estratto finisce in metallurgia, negli
      acciai inossidabili e negli acciai speciali da utensile, che la sua presenza rende
      insieme più duri e più resistenti al calore. Segue la cromatura galvanica, diffusasi
      dopo i perfezionamenti degli anni Venti, che deposita sul metallo un rivestimento
      lucido e resistente all''usura. La materia prima è quasi sempre la cromite, e la
      produzione mondiale è dominata dal Sudafrica, seguito da Turchia e Kazakistan.'
    visual: Vasca di cromatura galvanica con i pezzi appesi al telaio
    attendibilita: documentato
  - id: usi_pigmenti
    sezione: usi
    testo: 'I pigmenti sono l''uso più antico e quello in ritirata. Il giallo cromo ha
      colorato per un secolo gli scuolabus americani e le cassette postali, il verde cromo
      le facciate e le divise, e furono i colori che permisero agli impressionisti gialli e
      verdi che prima non esistevano in tubetto. Oggi sono in gran parte sostituiti, perché
      il piombo di alcuni e la forma esavalente di altri li hanno resi indifendibili sul
      piano sanitario e ambientale.'
    visual: Tubetti ottocenteschi di giallo di cromo su una tavolozza da pittore
    attendibilita: documentato
  - id: curiosita_esavalente
    sezione: curiosita
    testo: 'Fra le forme del cromo corre una differenza enorme: allo stato più tre è un
      oligoelemento innocuo e presente nella dieta, allo stato più sei è tossico e
      cancerogeno, e attraversa le membrane cellulari con facilità. Il cromo esavalente è
      la sostanza al centro del caso di Hinkley, in California, dove fra il 1952 e il 1966
      una compagnia elettrica scaricò centinaia di milioni di litri di acque contaminate in
      bacini non impermeabilizzati, avvelenando la falda del paese.'
    visual: Bacino di decantazione non impermeabilizzato nel deserto del Mojave
    attendibilita: documentato
  - id: curiosita_brockovich
    sezione: curiosita
    testo: 'La vicenda è finita al cinema. Un''impiegata di studio legale di nome Erin
      Brockovich, che nel 1993 stava riordinando pratiche immobiliari, notò che fra i
      documenti c''erano cartelle cliniche, tirò il filo e organizzò gli abitanti in una
      causa collettiva. Nel 1996 la compagnia accettò di pagare trecentotrentatré milioni
      di dollari a più di seicento ricorrenti, la transazione più alta della storia
      americana fino a quel momento. Il film del 2000 fece del cromo esavalente una
      questione di dominio pubblico.'
    visual: Faldoni di documenti impilati su una scrivania di studio legale
    attendibilita: documentato
  pronuncia:
