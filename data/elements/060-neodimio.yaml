  note_cronologia: L'anno 1841 e il nome di Mosander si riferiscono alla scoperta del didimio,
    che von Welsbach separò in praseodimio e neodimio solo nel 1885. La cronologia di riferimento
    indica il 1901 per il primo campione metallico, ottenuto da Wilhelm Muthmann con i suoi
    collaboratori; altre fonti datano al 1925 il primo neodimio davvero puro.
