contenuti:
  hook: 'Tennant riconobbe il suo elemento dall''odore: dalla polvere nera che l''acqua
    regia non scioglieva, trattata prima con alcali e poi con acidi, saliva un vapore
    pungente, a mezza strada fra il cloro e l''aglio.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'L''osmio è il più denso degli elementi stabili, quasi il doppio del piombo,
      ed è fra i più refrattari al calore. È anche uno dei più rari della crosta terrestre
      e uno di quelli che si usano meno: quasi tutto ciò che se ne produce finisce
      in laboratorio, non in oggetti.'
    visual: Un cubetto di osmio metallico bianco azzurrino accanto a uno di piombo
      delle stesse dimensioni
    attendibilita: documentato
  - id: residuo_nero
    sezione: storia
    testo: 'Sciogliendo la platina greggia in acqua regia restava sempre sul fondo
      una polvere scura che non voleva saperne di andare in soluzione. Joseph Louis
      Proust la considerava grafite, e per decenni fu trattata come uno scarto. Nel
      1800 il chimico inglese Smithson Tennant si era messo in società con William
      Hyde Wollaston per raffinare il platino, e nella divisione dei compiti si era
      preso la parte che sembrava senza speranza: proprio quel residuo insolubile.'
    visual: Una polvere nera finissima sul fondo di un becher dopo l'attacco con acido
    attendibilita: documentato
  - id: chimici_francesi
    sezione: storia
    testo: Nel 1803 sulla stessa polvere si lavorava anche a Parigi. Victor Collet-Descotils,
      Antoine-François de Fourcroy e Louis Nicolas Vauquelin conclusero che conteneva
      un metallo mai descritto; Vauquelin ne isolò un ossido volatile e lo battezzò
      ptène, «alato», per come il vapore se ne andava. Nessuno dei tre però ne aveva
      raccolto abbastanza per caratterizzare quello che aveva trovato.
    visual: Un laboratorio parigino di inizio Ottocento con storte e apparati di distillazione
    attendibilita: documentato
  - id: distillazione_ossido
    sezione: storia
    testo: 'Tennant, che di quel residuo ne aveva molto di più, lo trattò alternando
      alcali e acidi, e dopo l''acidificazione riuscì a distillare un ossido volatile
      dall''odore inconfondibile, simile al cloro e vagamente all''aglio. Il nome
      venne da lì: osmio, dal greco osme, odore. Quel vapore è il tetrossido di osmio,
      tossico a concentrazioni bassissime e aggressivo verso gli occhi e le vie respiratorie:
      il tratto che ha dato il nome all''elemento è anche il suo pericolo principale.'
    visual: Un apparato di distillazione con un vapore giallastro che condensa
    attendibilita: documentato
  - id: annuncio_1804
    sezione: storia
    testo: 'La lettera che annunciava alla Royal Society i due elementi trovati nella
      polvere nera, l''osmio e l''iridio, porta la data del 21 giugno 1804. A separare
      Tennant dai francesi, arrivati sulla stessa polvere alle stesse conclusioni,
      non era stato un metodo migliore ma la quantità di materiale: Tennant ne aveva
      abbastanza per caratterizzare ciò che trovava, e loro no.'
    visual: Una lettera manoscritta indirizzata alla Royal Society, datata 1804
    attendibilita: documentato
  - id: chi_era_tennant
    sezione: storia
    testo: 'Tennant era arrivato alla chimica passando per la medicina e la botanica,
      e prima del platino aveva contribuito a dimostrare che il diamante e il carbone
      sono la stessa sostanza. Nel 1813 ottenne la cattedra di chimica a Cambridge,
      ma fece in tempo a tenere un solo corso di lezioni: nel febbraio del 1815, presso
      Boulogne-sur-Mer, il ponte su cui stava passando a cavallo crollò e lo uccise.'
    visual: Ritratto di un chimico inglese di inizio Ottocento
    attendibilita: documentato
  - id: densita_contesa
    sezione: caratteristiche
    testo: 'Che l''osmio sia l''elemento stabile più denso è vero, ma di poco e non
      da sempre. I valori oggi accettati, ricavati dai parametri del reticolo cristallino
      misurati ai raggi X, sono 22,587 grammi per centimetro cubo per l''osmio e 22,562
      per l''iridio a 20 °C: la differenza cade nella terza cifra. Finché si pesarono
      campioni reali, sempre un po'' porosi o impuri, il primato passò più volte dall''uno
      all''altro, e solo negli anni Novanta le misure divennero abbastanza precise
      da assegnarlo con sicurezza.'
    visual: Un diffrattometro a raggi X con un campione metallico montato
    attendibilita: documentato
  - id: fusione_durezza
    sezione: caratteristiche
    testo: 'Fonde a 3033 °C: fra i metalli solo il tungsteno e il renio arrivano più
      in alto. È durissimo e insieme fragile, di un bianco azzurrino, e a temperatura
      ambiente resiste agli acidi. In polvere fine, però, reagisce lentamente con
      l''ossigeno dell''aria formando il tetrossido, ed è la ragione per cui l''odore
      si sente anche accanto al metallo puro.'
    visual: Cristalli di osmio metallico cresciuti per deposizione da fase vapore
    attendibilita: documentato
  - id: chimica_estrema
    sezione: caratteristiche
    testo: 'La sua chimica copre un arco insolitamente ampio, da -2 a +8, e il +8,
      che pochissimi elementi raggiungono, è quello del tetrossido. Si tratta di un
      solido giallo pallido, solubile in acqua, che sublima già a temperatura ambiente:
      è il motivo per cui l''osmio si maneggia sotto cappa e in fiale sigillate.'
    visual: Una fiala sigillata contenente cristalli gialli di tetrossido di osmio
    attendibilita: documentato
  - id: usi_leghe_microscopia
    sezione: usi
    testo: 'L''osmio metallico da solo serve a poco: è troppo duro e troppo difficile
      da lavorare. In lega con l''iridio e con gli altri metalli del gruppo forma
      però le punte dei pennini delle stilografiche, i perni degli strumenti di precisione
      e contatti elettrici destinati a durare; per un decennio, fra il 1945 e il 1955,
      fu anche la punta degli aghi dei giradischi, prima che zaffiro e diamante la
      mandassero fuori mercato perché si consumava troppo in fretta. La vera carriera
      dell''osmio è quella del suo tetrossido, che in microscopia elettronica fissa
      e colora i lipidi delle membrane cellulari, e che in chimica organica trasforma
      gli alcheni in dioli: la reazione per cui Barry Sharpless ha ricevuto una parte
      del Nobel del 2001.'
    visual: Un'immagine al microscopio elettronico di membrane cellulari colorate
    attendibilita: documentato
  - id: usi_mercato
    sezione: usi
    testo: 'Il mercato dell''osmio è minuscolo, e quanto sia minuscolo nessuno lo
      sa con precisione: la Royal Society of Chemistry stima la produzione mondiale
      intorno ai cento chilogrammi l''anno, altre fonti la danno fra qualche centinaio
      e qualche migliaio. Le statistiche dello USGS registrano per gli Stati Uniti importazioni dell''ordine del singolo
      chilogrammo annuo: nessun altro metallo del gruppo del platino si muove in quantità
      così esigue. Quasi tutto ciò che si ottiene arriva dai fanghi della raffinazione
      del nichel e del rame.'
    visual: Fanghi anodici in una raffineria di nichel
    attendibilita: documentato
  - id: curiosita_osram
    sezione: curiosita
    testo: 'Per qualche anno l''osmio illuminò le case: la lampada a filamento di
      osmio di Carl Auer von Welsbach, sviluppata nel 1898, arrivò sul mercato nel
      1902 e fu presto soppiantata dal tungsteno, molto meno raro e altrettanto capace
      di reggere l''incandescenza. Ne resta traccia in un nome che si legge ancora
      sulle confezioni, Osram, contrazione di OSmio e wolfRAM.'
    attendibilita: documentato
  - id: curiosita_ammoniaca
    sezione: curiosita
    testo: Osmio e uranio furono i primi catalizzatori a rendere economicamente sensata
      la sintesi dell'ammoniaca da azoto e idrogeno. Il gruppo che alla BASF lavorava
      con Carl Bosch comprò per questo quasi tutta la scorta mondiale di osmio, prima
      che il ferro, incomparabilmente più abbondante, lo sostituisse.
    attendibilita: documentato
