  luogo: Berkeley, California
  epoca: nucleare
  isolamento_anno: null
  note_cronologia: 'Primo elemento identificato un atomo alla volta: diciassette atomi di
    mendelevio-256 riconosciuti fra il 18 e il 19 febbraio 1955 a Berkeley, bombardando con
    particelle alfa un bersaglio di einsteinio-253 di circa un miliardo di atomi. Gli autori
    documentati sono cinque — Ghiorso, Harvey, Choppin, Thompson e Seaborg — e la cronologia
    di riferimento li comprimeva in «Seaborg et al.». Il nome fu approvato nel 1955 con il
    simbolo Mv, sostituito da Md nel 1957.'
