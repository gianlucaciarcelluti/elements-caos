contenuti:
  hook: Un chimico prussiano bruciò trentamila volte ogni pietra che riuscì a procurarsi,
    cercando la ricetta della porcellana. Trovò invece l'ordine nascosto delle rocce.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il silicio è il secondo elemento più abbondante della crosta terrestre dopo
      l''ossigeno, con oltre un quarto della sua massa: sabbia, argilla, granito, vetro sono
      tutti, in fondo, silicio legato all''ossigeno. È la materia di cui il pianeta è fatto,
      ed è anche il materiale su cui poggia l''elettronica; ma per arrivare a vederlo puro
      ci sono voluti quasi cent''anni di tentativi falliti.'
    visual: Un lingotto di silicio metallico lucente accanto a una manciata di sabbia
    attendibilita: documentato
  - id: silice_ovunque
    sezione: storia
    testo: 'La silice accompagna la tecnica umana dall''inizio. La selce scheggiata è silice
      quasi pura, e il vetro nasce fondendo sabbia con un fondente almeno dal III millennio
      a.C. Ma nessuna di queste pratiche richiedeva di sapere che cosa fosse la sabbia:
      bastava sapere che cosa ci si potesse fare. La silice era il materiale più familiare
      del mondo e insieme il più opaco alla comprensione, perché resisteva a ogni tentativo
      di scomporla.'
    visual: Lama di selce preistorica accanto a un frammento di vetro antico
    attendibilita: documentato
  - id: pott_porcellana
    sezione: storia
    testo: 'A Berlino, negli anni Trenta del Settecento, Johann Heinrich Pott riceve
      dal re di Prussia un incarico preciso e commerciale: scoprire il segreto della
      porcellana, che a Meissen si fabbrica e altrove no, e che vale come una miniera.
      Pott affronta il problema per forza bruta, sottoponendo al fuoco della fornace ogni
      minerale e ogni miscela che riesce a mettere insieme; le fonti parlano di oltre
      trentamila prove.'
    visual: Fornace da laboratorio con file di crogioli numerati in attesa
    attendibilita: documentato
  - id: pott_terre
    sezione: storia
    testo: 'La porcellana non la trova, e la commessa reale finirà per costargli il favore
      di corte. Il sottoprodotto di quel fallimento è però una cosa più grande: mettendo a
      confronto sistematicamente il comportamento al fuoco delle sostanze terrose, Pott
      arriva a separarle in famiglie distinte e riconosce come autonoma la terra
      vetrificabile, quella che fonde in vetro. È la silice, isolata concettualmente da
      calce, gesso e argilla per la prima volta.'
    visual: Tavola comparativa settecentesca delle terre con i rispettivi comportamenti al
      fuoco
    attendibilita: documentato
  - id: tentativi_falliti
    sezione: storia
    testo: 'Che dentro la silice ci fosse un elemento lo sospetta Lavoisier nel 1787, senza
      alcun modo di dimostrarlo. Il problema è la forza del legame fra silicio e ossigeno,
      fra i più tenaci della chimica: Humphry Davy ci prova con l''elettricità e non ce la
      fa; nel 1811 Gay-Lussac e Thénard, scaldando potassio con tetrafluoruro di silicio,
      ottengono davvero la sostanza, ma impura, e non si rendono conto di che cosa sia.'
    visual: Apparato di riduzione con potassio fuso in atmosfera controllata
    attendibilita: documentato
  - id: berzelius
    sezione: storia
    testo: 'La chiude Jöns Jacob Berzelius nel 1823, a Stoccolma, con la stessa reazione
      condotta meglio: riduce il fluorosilicato di potassio con potassio metallico e poi,
      soprattutto, lava ripetutamente il prodotto finché non resta una polvere bruna pulita.
      La differenza fra lui e i predecessori sta tutta in quel lavaggio ostinato e nel
      riconoscere di avere davanti un elemento nuovo. Il nome silicio viene dal latino silex,
      la selce.'
    visual: Berzelius che lava il precipitato bruno di silicio nel suo laboratorio
    attendibilita: documentato
  - id: caratteristiche_semimetallo
    sezione: caratteristiche
    testo: 'Il silicio è un semimetallo: lucido e grigio-azzurro come un metallo, ma fragile
      come il vetro e pessimo conduttore. Sta sotto il carbonio nella tavola periodica e ne
      condivide la capacità di formare quattro legami, ma è molto meno versatile nel legarsi
      a se stesso: le catene silicio-silicio sono instabili, ed è per questo che la vita è
      fatta di carbonio e non di silicio, nonostante quest''ultimo sia enormemente più
      abbondante.'
    visual: Cristallo di silicio a struttura tetraedrica accanto al reticolo del diamante
    attendibilita: documentato
  - id: caratteristiche_semiconduttore
    sezione: caratteristiche
    testo: 'La proprietà che ha cambiato il mondo è intermedia per definizione. Il silicio
      purissimo è quasi un isolante, perché fra la banda dei suoi elettroni legati e quella
      in cui possono muoversi c''è un divario di poco più di un elettronvolt; ma basta
      inserire nel reticolo pochi atomi estranei — un processo chiamato drogaggio — perché
      quel divario venga scavalcato e il materiale conduca. Un semiconduttore è un materiale
      di cui si decide se debba condurre o no.'
    visual: Reticolo di silicio con un atomo drogante evidenziato fra gli altri
    attendibilita: documentato
  - id: caratteristiche_silice
    sezione: caratteristiche
    testo: 'In natura il silicio è sempre ossidato, quasi sempre in strutture in cui ogni
      atomo sta al centro di un tetraedro di quattro ossigeni. Il modo in cui questi
      tetraedri si collegano — isolati, in catene, in fogli, in reticoli tridimensionali —
      genera l''intera famiglia dei silicati e con essa quasi tutta la mineralogia della
      crosta terrestre: dal quarzo alle miche, dai feldspati alle argille.'
    visual: Tetraedro silicio-ossigeno e le quattro forme di concatenamento dei silicati
    attendibilita: documentato
  - id: usi_tradizionali
    sezione: usi
    testo: 'Gli impieghi di massa del silicio restano quelli antichi, moltiplicati per la
      scala industriale: sabbia silicea per il vetro, argille per ceramiche e laterizi,
      silicati per il cemento. A questi si aggiungono il carburo di silicio, uno dei
      materiali più duri che si producano, usato come abrasivo e refrattario, e i siliconi,
      polimeri a scheletro silicio-ossigeno che danno guarnizioni, lubrificanti e protesi.'
    visual: Rotolo di vetro float in uscita dal forno accanto a una guarnizione siliconica
    attendibilita: documentato
  - id: usi_elettronica
    sezione: usi
    testo: 'La quota che conta di più, in valore, è minuscola in peso. Il silicio destinato
      all''elettronica viene purificato fino a livelli in cui gli atomi estranei si contano
      in poche unità per miliardo, fatto crescere in monocristalli e affettato in dischi
      sottili su cui si costruiscono i circuiti integrati. Le celle fotovoltaiche lavorano
      sullo stesso materiale, sfruttando la luce per far saltare gli elettroni nella banda
      di conduzione.'
    visual: Lingotto monocristallino di silicio e le fette lucide che se ne ricavano
    attendibilita: documentato
  - id: curiosita_valley
    sezione: curiosita
    testo: 'La valle a sud di San Francisco si chiama Silicon Valley perché lì si concentrò
      l''industria dei semiconduttori, e il nome ha finito per indicare l''intero settore
      tecnologico. Vale la pena tenere ferma la distinzione che in italiano si perde spesso:
      silicon in inglese è il silicio, l''elemento; silicone è tutt''altra cosa, la famiglia
      dei polimeri delle guarnizioni.'
    visual: Cartello stradale della Silicon Valley con lo skyline delle sedi tecnologiche
    attendibilita: documentato
  - id: curiosita_diatomee
    sezione: curiosita
    testo: 'Alcuni organismi hanno imparato a costruirsi in vetro. Le diatomee, alghe
      unicellulari diffuse in tutti i mari, si fabbricano un guscio di silice amorfa
      finemente traforato, con geometrie regolari che i microscopisti dell''Ottocento usavano
      come banco di prova per le loro lenti. Accumulandosi sui fondali, quei gusci formano la
      farina fossile, usata come filtrante e come abrasivo delicato.'
    visual: Diatomee al microscopio con i gusci silicei traforati
    attendibilita: documentato
  pronuncia:
  - termine: Jöns Jacob Berzelius
    ipa: jœns ˈjɑːkɔb bæˈseːlɪɵs
    nota: Alla svedese; la z si pronuncia come una s.
  - termine: Thénard
    ipa: teˈnaʁ
    nota: Alla francese, con la d finale muta.
