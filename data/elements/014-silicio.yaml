numero_atomico: 14
simbolo: Si
nome: Silicio
nome_en: Silicon
scoperta:
  anno: 1739
  anno_stimato: false
  scopritori:
  - johann-heinrich-pott
  luogo: Berlino
  epoca: alchimia
  isolamento_anno: 1823
  note_cronologia: 'Pott distingue la terra vetrificabile, cioè la silice, dalle altre terre
    nei lavori sulle terre a partire dal 1739. Isolato in forma amorfa pura nel 1823 da
    Jöns Jacob Berzelius.'
  controversia: 'La paternità del silicio è distribuita fra troppe persone perché una sola
    data la esaurisca. Pott, dal 1739, separa la terra vetrificabile dalle altre terre, ma
    per lui è una terra, non un elemento. Lavoisier nel 1787 sospetta che la silice sia
    l''ossido di qualcosa e non riesce a ridurla; Davy fallisce a sua volta; Gay-Lussac e
    Thénard nel 1811 producono per primi la sostanza, in forma impura, senza riconoscere di
    avere in mano un elemento nuovo. Il credito va a Berzelius nel 1823 perché è il primo a
    ottenerla pura e a capire che cos''è. Le cronologie che, come questa, fanno partire il
    silicio dal lavoro sulle terre registrano il momento in cui la silice smette di essere
    confusa con il resto: un inizio legittimo, purché non lo si scambi per una scoperta
    compiuta.'
