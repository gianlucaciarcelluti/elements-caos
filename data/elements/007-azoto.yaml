contenuti:
  hook: Uno studente di medicina chiuse un topo in un vaso di vetro e aspettò. Quello che
    restava nel vaso quando l'animale era morto costituisce i quattro quinti dell'aria.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'L''azoto è il gas di cui l''atmosfera è fatta per il settantotto per cento: la parte
      dell''aria che non fa nulla. Non brucia, non alimenta la fiamma, non sostiene la
      respirazione, e proprio per questa inerzia è passato inosservato più a lungo degli altri
      gas. Eppure è indispensabile alla vita — sta in ogni proteina e in ogni filamento di DNA —
      e strapparlo all''atmosfera è stato uno dei problemi tecnici più costosi del Novecento.'
    visual: Recipiente di azoto liquido che fuma a contatto con l'aria
    attendibilita: documentato
  - id: aria_fissa
    sezione: storia
    testo: 'La storia comincia con un maestro e una domanda mal posta. A Edimburgo Joseph Black
      aveva dimostrato che esiste un''aria fissa, quella che oggi chiamiamo anidride carbonica,
      che si libera dal calcare e spegne le candele. Restava un fatto scomodo: se da un''aria in
      cui una candela si era spenta si toglieva tutta l''aria fissa, la candela continuava a non
      accendersi. Qualcosa d''altro c''era, e non aveva ancora un nome.'
    visual: Campana di vetro con la candela spenta sopra la vasca dell'acqua
    attendibilita: documentato
  - id: rutherford_esperimento
    sezione: storia
    testo: 'Black assegna il problema a un suo studente, Daniel Rutherford, ventitreenne. Il
      procedimento è una sottrazione condotta fino in fondo: tiene un topo in una quantità
      d''aria confinata finché l''animale non muore, poi in quell''aria brucia una candela
      finché non si spegne, poi vi brucia del fosforo finché non smette di ardere, e infine fa
      passare il residuo attraverso una soluzione alcalina che assorbe l''aria fissa. Ciò che
      sopravvive a tutti questi consumi è azoto quasi puro.'
    visual: 'La sequenza dei quattro recipienti: topo, candela, fosforo, soluzione alcalina'
    attendibilita: documentato
  - id: aria_mefitica
    sezione: storia
    testo: 'Rutherford descrive il gas nella sua tesi di laurea in medicina, discussa nel
      settembre 1772, e lo chiama aria nociva, o mefitica: il nome viene dalle esalazioni che
      nell''antichità si credeva uscissero dalla terra e portassero malattia, ed è esatto nel
      modo più letterale, perché in quell''aria un animale muore. Come tutti i suoi
      contemporanei interpreta il risultato con il flogisto, e ritiene di avere in mano aria
      comune saturata di quel principio.'
    visual: Frontespizio della dissertazione De aere fixo dicto, aut mephitico
    attendibilita: documentato
  - id: quattro_insieme
    sezione: storia
    testo: 'Non era il solo ad averci messo le mani. Nello stesso giro di mesi Scheele ottiene
      lo stesso gas in Svezia e lo chiama aria viziata, Priestley lo prepara in Inghilterra come
      aria flogisticata, e Henry Cavendish lo aveva ottenuto ancora prima senza pubblicare
      nulla, per quella riluttanza alla stampa che gli fece perdere il credito di parecchie
      scoperte. A Rutherford il primato tocca per una ragione precisa: è il primo a descriverne
      il comportamento in modo compiuto e a metterlo per iscritto.'
    visual: Quattro banchi di laboratorio in quattro paesi diversi, con lo stesso apparato
    attendibilita: documentato
  - id: i_due_nomi
    sezione: storia
    testo: 'L''elemento porta due nomi in Europa perché due scuole ne colsero due qualità
      opposte. Lavoisier propose azote, dal greco per privo di vita, guardando a ciò che il gas
      non fa; nel 1790 Jean-Antoine Chaptal propose nitrogène, generatore di nitro, guardando a
      ciò che il gas produce, cioè il salnitro e l''acido nitrico. L''italiano e il francese
      hanno tenuto il primo, l''inglese e lo spagnolo il secondo: la stessa sostanza si chiama,
      a seconda del confine, per la sua sterilità o per la sua fertilità.'
    visual: Due etichette da laboratorio affiancate, azote e nitrogen, sulla stessa bombola
    attendibilita: documentato
  - id: caratteristiche_triplo_legame
    sezione: caratteristiche
    testo: 'Tutta la chimica dell''azoto discende da un solo numero. I due atomi della molecola
      sono tenuti insieme da un triplo legame la cui rottura costa novecentoquarantacinque
      chilojoule per mole, il più tenace fra tutti i legami fra due atomi uguali: è per questo
      che l''azoto attraversa i nostri polmoni senza reagire e che si può conservare la frutta
      in atmosfera di azoto. L''inerzia dell''aria non è assenza di chimica, è una barriera
      energetica.'
    visual: Modello della molecola N2 con i tre legami evidenziati
    attendibilita: documentato
  - id: caratteristiche_paradosso
    sezione: caratteristiche
    testo: 'Ne segue il paradosso biologico più grande del pianeta: gli organismi vivono immersi
      in un oceano di azoto e quasi nessuno riesce a usarlo. Le piante non lo prendono
      dall''aria ma dal suolo, sotto forma di nitrati e ammonio, e a produrli sono pochi batteri
      specializzati, alcuni liberi e altri ospitati nei noduli delle radici delle leguminose,
      che dispongono dell''unico enzima capace di spezzare quel triplo legame a temperatura
      ambiente.'
    visual: Radici di leguminosa con i noduli dei batteri azotofissatori
    attendibilita: documentato
  - id: caratteristiche_composti
    sezione: caratteristiche
    testo: 'Liberato dalla molecola, l''azoto diventa un camaleonte: nei composti assume tutti
      gli stati di ossidazione da meno tre a più cinque, dall''ammoniaca all''acido nitrico
      passando per l''intera famiglia degli ossidi. Molti dei suoi composti sono instabili
      proprio perché la molecola di azoto è così stabile: gli esplosivi organici liberano
      energia enorme in un istante perché i loro atomi di azoto si ricongiungono a coppie, e
      nulla è più comodo che tornare a casa.'
    visual: Cratere di una detonazione e la nube di gas che si allontana
    attendibilita: documentato
  - id: usi_haber
    sezione: usi
    testo: 'Nel 1909 Fritz Haber riesce a far reagire azoto e idrogeno sotto pressione altissima
      con un catalizzatore, e Carl Bosch porta il procedimento alla scala industriale. È la
      sintesi dell''ammoniaca, e non c''è invenzione chimica che abbia cambiato di più la vita
      di più persone: l''agricoltura smette di dipendere dal letame e dal guano importato, e la
      produzione di cibo si sgancia dai limiti naturali della fissazione biologica.'
    visual: Colonne di sintesi ad alta pressione di un impianto per l'ammoniaca
    attendibilita: documentato
  - id: usi_meta_umanita
    sezione: usi
    testo: 'La stima più citata è anche la più impressionante: circa la metà degli esseri umani
      oggi in vita è nutrita grazie all''azoto fissato per via industriale, secondo un calcolo
      pubblicato nel 2008 e confermato da valutazioni indipendenti successive. Il conto ha un
      rovescio, perché l''azoto in eccesso finisce nelle falde e nei fiumi e vi innesca
      fioriture algali che consumano l''ossigeno: le zone morte costiere sono il residuo della
      stessa reazione che ci sfama.'
    visual: Campo fertilizzato accanto a un estuario con una fioritura algale
    attendibilita: documentato
  - id: curiosita_azoto_liquido
    sezione: curiosita
    testo: 'A meno centonovantasei gradi l''azoto diventa un liquido incolore che si compra a
      poco più del prezzo dell''acqua minerale, ed è il freddo portatile della modernità:
      conserva gameti e vaccini, raffredda i magneti superconduttori, congela i tessuti in
      chirurgia. La sua sicurezza è insidiosa proprio perché non è tossico: evaporando in un
      ambiente chiuso sostituisce l''aria senza odore né avvertimento, e chi vi entra perde
      conoscenza senza sentire di soffocare.'
    visual: Dewar di azoto liquido aperto con il vapore freddo che scende verso il pavimento
    attendibilita: documentato
  - id: curiosita_narcosi
    sezione: curiosita
    testo: 'Sott''acqua l''azoto smette di essere inerte. Oltre i trenta metri di profondità la
      pressione lo scioglie nel sangue e nei tessuti nervosi in quantità sufficiente a produrre
      la narcosi da gas inerte, uno stato di euforia e di giudizio compromesso che i subacquei
      chiamano ebbrezza degli abissi. In risalita lo stesso azoto disciolto torna allo stato
      gassoso e, se la decompressione è troppo rapida, forma bolle nei tessuti: è la malattia
      dei cassoni.'
    visual: Subacqueo in profondità con le bolle che risalgono verso la superficie
    attendibilita: documentato
  pronuncia:
  - termine: Daniel Rutherford
    ipa: ˈdanjəl ˈrʌðəfəd
    nota: All'inglese; nessuna parentela con il fisico Ernest Rutherford.
  - termine: Fritz Haber
    ipa: fʁɪts ˈhaːbɐ
    nota: Alla tedesca.
contenuti_estesi:
  hook: Uno studente di medicina di ventidue anni chiuse un topo in un vaso di vetro
    e aspettò che morisse; poi in quell'aria bruciò una candela finché non si spense,
    poi del fosforo finché non smise di ardere, e infine tolse con una soluzione alcalina
    tutto quel che restava di reattivo. Ciò che sopravvisse a quella sottrazione ostinata
    costituisce i quattro quinti dell'aria che respiriamo. È l'elemento che non fa
    nulla — non brucia, non alimenta la fiamma, non tiene in vita un animale — e proprio
    per questo è stato il più difficile da vedere e il più costoso da domare.
  beats:
  - id: contesto-dove-sta
    sezione: contesto
    testo: 'L''azoto è il capofila leggero del gruppo quindici, quello che i chimici
      chiamano dei pnictogeni, ed è un elemento comune nell''universo: si stima sia
      il settimo per abbondanza totale nella Via Lattea e nel sistema solare. Sulla
      Terra la sua distribuzione è però sbilanciata in modo curioso. Nell''atmosfera
      è la specie chimica più abbondante e ne costituisce circa il settantotto per
      cento; nelle parti solide del pianeta è invece relativamente raro, perché i
      suoi composti sono volatili e tendono a tornarsene in aria. È un elemento che
      sta quasi tutto sopra le nostre teste e quasi per niente sotto i nostri piedi.'
    attendibilita: documentato
  - id: contesto-triplo-legame
    sezione: contesto
    testo: 'Tutta la chimica dell''azoto discende da un solo numero. I due atomi della
      molecola sono tenuti insieme da un triplo legame, condizione unica fra gli elementi
      biatomici in condizioni normali: la distanza fra i nuclei è di appena 109,76
      picometri e l''energia necessaria a separarli è di 945,41 chilojoule per mole.
      Vale la pena essere precisi su un punto che spesso si racconta male: non è il
      legame più forte in assoluto fra due atomi in una molecola biatomica — quel
      primato spetta al monossido di carbonio — ma è il secondo, e domina il comportamento
      dell''elemento. L''inerzia dell''aria non è assenza di chimica: è una barriera
      energetica.'
    attendibilita: documentato
  - id: contesto-perche-tre
    sezione: contesto
    testo: 'La ragione per cui quel legame è proprio triplo sta scritta nella configurazione
      elettronica, e vale la pena ricavarla. L''azoto ha numero atomico sette: due
      elettroni nel guscio interno e cinque in quello esterno, distribuiti come 2s²
      2p³. Tre di quei cinque elettroni sono spaiati, uno per ciascun orbitale p,
      e ciascuno cerca un partner. Quando due atomi di azoto si incontrano, ognuno
      mette a disposizione i propri tre elettroni spaiati e si formano tre legami
      in una volta sola: la molecola che ne risulta ha entrambi gli atomi completamente
      appagati, senza alcun appiglio residuo per chiunque passi. L''inerzia dell''aria
      non è una stranezza: è la conseguenza aritmetica di un numero dispari di elettroni
      esterni che si chiude alla perfezione a coppie con sé stesso.'
    attendibilita: documentato
  - id: contesto-due-facce
    sezione: contesto
    testo: 'Quella barriera ha due facce, e le fonti le mettono nella stessa frase.
      Da un lato crea difficoltà tanto agli organismi quanto all''industria nel convertire
      l''azoto molecolare in composti utili: è il problema centrale della biologia
      e dell''agricoltura. Dall''altro significa che bruciare, far esplodere o decomporre
      composti azotati per riformare azoto gassoso libera grandi quantità di energia.
      La stessa proprietà che rende difficile fabbricare un fertilizzante rende facile
      fabbricare un esplosivo: sono la salita e la discesa della medesima collina.'
    attendibilita: documentato
  - id: contesto-freddo
    sezione: contesto
    testo: 'Portato al freddo, l''azoto fa quello che fanno tutti i gas, ma a temperature
      che sulla Terra non esistono in natura: liquefa a meno centonovantasei gradi
      e congela a meno duecentodieci, assumendo una struttura cristallina esagonale
      compatta; sotto i meno duecentotrentasette passa a una forma cubica. Che quelle
      condizioni siano aliene per noi non significa che lo siano per il sistema solare:
      sulle pianure di Sputnik Planitia, su Plutone, c''è azoto solido accanto a montagne
      di ghiaccio d''acqua. Lo stesso elemento che qui è il vuoto respirabile dell''aria,
      là fuori è un terreno su cui si potrebbe camminare.'
    attendibilita: documentato
  - id: contesto-dove-vive
    sezione: contesto
    testo: 'Chi volesse cancellare l''azoto dalla biochimica si accorgerebbe che non
      resta quasi nulla. Gli amminoacidi sono per definizione composti organici che
      portano insieme un gruppo amminico e un gruppo carbossilico: l''azoto sta nel
      nome della categoria, prima ancora che nelle molecole. Ne esistono in natura
      più di cinquecento, ma quelli che compongono le proteine sono una ventina. E
      le basi azotate — adenina, citosina, guanina, timina, uracile — sono, di nuovo
      per definizione, composti contenenti azoto: sono le lettere con cui è scritto
      il DNA. Proteine e informazione genetica, le due cose che distinguono un essere
      vivente da una pietra, sono entrambe costruite intorno a un atomo che l''atmosfera
      ci offre in abbondanza e in una forma che quasi nessuno sa aprire.'
    attendibilita: documentato
  - id: contesto-fulmini
    sezione: contesto
    testo: 'Prima che esistessero le fabbriche, l''unica via non biologica per aprire
      quella molecola era il temporale. Il fulmine porta l''aria che attraversa a
      temperature tali da spezzare il triplo legame, e l''azoto si combina con l''ossigeno
      formando ossidi che la pioggia trascina al suolo. È un canale reale ma intermittente,
      appeso agli umori del cielo: per miliardi di anni la disponibilità di azoto
      utilizzabile è dipesa da quanto pioveva con tuoni, e da quanti batteri lavoravano
      sotto terra.'
    attendibilita: documentato
  - id: vicenda-black
    sezione: vicenda
    testo: 'La storia comincia da un maestro che aveva già cambiato la chimica due
      volte. Joseph Black, scozzese, professore ad Edimburgo dal 1766, è l''uomo a
      cui si devono la scoperta del magnesio, quella dell''anidride carbonica e i
      concetti di calore latente e calore specifico. C''è però un suo contributo meno
      citato e altrettanto decisivo: intorno al 1750, quando era ancora studente,
      mise a punto la bilancia analitica. È la stessa storia incontrata in questo
      vault raccontando l''ossigeno e l''idrogeno — la chimica moderna comincia quando
      qualcuno costruisce uno strumento che pesa abbastanza bene da far vedere che
      i conti non tornano.'
    attendibilita: documentato
  - id: vicenda-aria-fissa
    sezione: vicenda
    testo: 'L''aria fissa di Black era quella che oggi chiamiamo anidride carbonica,
      e il modo in cui la studiò è un modello di rigore. Scoprì che il calcare, scaldato
      o trattato con acidi, libera un gas più denso dell''aria che non sostiene né
      la fiamma né la vita animale; e che gorgogliato in una soluzione di calce quel
      gas fa precipitare carbonato di calcio. Usò proprio questo fenomeno come rivelatore,
      per dimostrare che l''anidride carbonica viene prodotta dalla respirazione animale
      e dalla fermentazione microbica. Aveva in mano un test chimico per riconoscere
      un gas invisibile: è la premessa indispensabile a tutto quello che segue.'
    attendibilita: documentato
  - id: vicenda-il-problema
    sezione: vicenda
    testo: 'Il problema che Black passò al proprio studente nasceva da un''anomalia
      che il suo stesso test non spiegava. Studiando le proprietà dell''anidride carbonica
      aveva trovato che una candela non vi brucia; ma se da un''aria in cui una candela
      si era spenta si toglieva tutta l''aria fissa, con la soluzione di calce che
      la faceva precipitare, la candela continuava a non accendersi. Restava qualcosa.
      Black non aveva tempo o voglia di inseguirlo e girò la questione a chi ce l''aveva:
      Daniel Rutherford, che stava preparando la propria tesi di laurea in medicina.'
    attendibilita: documentato
  - id: vicenda-flogisto
    sezione: vicenda
    testo: 'Per capire che cosa Rutherford credesse di avere in mano bisogna entrare
      nella teoria che allora spiegava tutto. Secondo la dottrina del flogisto, le
      sostanze combustibili contengono questo principio e bruciando lo cedono all''aria.
      Quelle che ardono bene erano dette ricche di flogisto; e il fatto che la combustione
      in uno spazio chiuso cessasse presto veniva preso come prova netta che l''aria
      potesse assorbirne solo una quantità finita. Un''aria completamente flogisticata,
      si riteneva, non avrebbe più sostenuto la combustione di alcun materiale, né
      permesso a un metallo scaldato di produrre la sua calce, né mantenuto in vita
      un essere vivente. Anche la respirazione era spiegata così: respirare serviva
      a togliere flogisto dal corpo.'
    attendibilita: documentato
  - id: vicenda-la-sottrazione
    sezione: vicenda
    testo: 'Il metodo di Rutherford è una sottrazione condotta fino in fondo, e vale
      la pena seguirne i passaggi perché è di una chiarezza quasi brutale. Tenne un
      topo in una quantità d''aria confinata finché l''animale non morì. Nell''aria
      rimasta bruciò una candela finché non si spense. In quella che restava bruciò
      del fosforo finché non volle più ardere. Poi fece passare il residuo attraverso
      una soluzione che assorbe l''anidride carbonica. Ciò che sopravvisse a tutti
      e quattro i consumi non sosteneva la combustione, e un topo non ci poteva vivere.
      Non aveva isolato una sostanza aggiungendo qualcosa: l''aveva isolata togliendo
      tutto il resto.'
    attendibilita: documentato
  - id: vicenda-aria-flogisticata
    sezione: vicenda
    testo: 'Ecco perché l''esperimento del topo, della candela e del fosforo aveva
      senso agli occhi di chi lo faceva: non era una caccia al buio, era la verifica
      di una previsione. Se l''aria può assorbire solo una quantità finita di flogisto,
      allora saturandola con ogni mezzo disponibile — un animale che respira, una
      candela, del fosforo — si deve arrivare a un residuo che non ne accetta più.
      Rutherford e Black lessero in questa chiave il gas ottenuto, e il nome che gli
      diedero, aria flogisticata, descriveva una sostanza che non esiste. È una situazione
      che vale la pena tenere a mente ogni volta che si giudica la scienza del passato:
      la procedura sperimentale era impeccabile e la teoria che la guidava era sbagliata,
      e la prima ha prodotto un risultato che è sopravvissuto alla seconda.'
    attendibilita: documentato
  - id: vicenda-aria-nociva
    sezione: vicenda
    testo: 'Rutherford riferì l''esperimento nel 1772, l''anno in cui si laureò in
      medicina a Edimburgo, e chiamò quel gas aria nociva, o aria flogisticata. Il
      secondo nome dice tutto sul quadro concettuale: lui e Black erano convinti della
      validità della teoria del flogisto e spiegarono i propri risultati in quei termini,
      ritenendo di avere in mano aria comune saturata del principio dell''infiammabilità.
      È lo stesso schema incontrato in questo vault con Scheele e con Cavendish: il
      risultato è esatto, la cornice in cui lo si legge è quella che sta per crollare.
      Vale la pena aggiungere che quel che avevano in mano non era azoto puro ma un
      residuo che ne era costituito in larghissima parte.'
    attendibilita: documentato
  - id: vicenda-discusso-quattro
    sezione: vicenda
    testo: 'Anche qui, come per l''ossigeno, la scoperta è affollata. La voce dell''elemento
      dice che l''azoto fu scoperto e isolato dal medico scozzese Daniel Rutherford
      nel 1772 e indipendentemente da Carl Wilhelm Scheele e da Henry Cavendish all''incirca
      nello stesso periodo; la nota base di questo vault aggiunge alla lista anche
      Joseph Priestley. Quattro persone, in tre paesi, nel giro di pochi mesi, con
      quattro nomi diversi per la stessa cosa. A Rutherford il credito tocca per la
      ragione che in questa serie di approfondimenti si è già vista decidere più volte:
      non è il primo a ottenerlo, è il primo a pubblicarne una caratterizzazione compiuta.'
    attendibilita: discusso
  - id: vicenda-cosa-fece-poi
    sezione: vicenda
    testo: 'Quel che fece dopo dice qualcosa sul rapporto fra una scoperta e una vita.
      Rutherford esercitò la medicina a Edimburgo dal 1775 al 1786, fu tra i fondatori
      della Royal Society of Edinburgh nel 1783, e dal 1786 fino alla morte fu professore
      di medicina e botanica e custode dell''Orto botanico reale, oltre che botanico
      del re in Scozia. In botanica è tuttora citato con l''abbreviazione standard
      «Rutherf.». Isolò l''azoto a ventidue anni, nella tesi di laurea, e passò i
      successivi quarantasette anni a fare tutt''altro. Non è la traiettoria del genio
      incompreso né quella del campione di una disciplina: è quella di un professionista
      competente che una volta, da studente, ha fatto una cosa enorme.'
    attendibilita: documentato
  - id: vicenda-etimologia
    sezione: vicenda
    testo: 'Il doppio nome merita di essere guardato da vicino, perché racconta due
      modi opposti di decidere come si chiama una cosa. Nel 1790 il chimico francese
      Jean-Antoine-Claude Chaptal propose nitrogène, dal francese nitre, salnitro,
      più il suffisso -gène, che forma: il nome dice da dove quel gas si ricava, ed
      era stato scelto quando si scoprì che l''azoto era presente nell''acido nitrico
      e nei nitrati. Lavoisier propose invece azote, dal greco antico ἀζωτικός, «senza
      vita», perché è un gas asfissiante: il nome dice che cosa quel gas fa a chi
      lo respira. Il primo è una ricetta, il secondo un avvertimento. L''italiano
      e il francese hanno tenuto l''avvertimento, l''inglese la ricetta — ma senza
      accorgersene ha conservato anche l''altro, perché la radice di Lavoisier sopravvive
      nei nomi inglesi di diversi composti azotati: idrazina, azidi, composti azo.
      Perfino chi dice nitrogen, quando scende nel dettaglio, ricomincia a dire azoto.'
    attendibilita: documentato
  - id: impatto-nitrogenasi
    sezione: impatto
    testo: 'Il problema di rompere quel triplo legame la biologia lo ha risolto una
      volta sola. Le nitrogenasi sono enzimi prodotti da certi batteri — cianobatteri
      e rizobatteri — che riducono l''azoto molecolare ad ammoniaca, e sono l''unica
      famiglia di enzimi nota a catalizzare quella reazione. Una sola. La fissazione
      dell''azoto è necessaria a tutte le forme di vita, e l''intera biosfera dipende
      da una soluzione enzimatica che è stata trovata un''unica volta e poi ereditata:
      ogni proteina di ogni essere vivente contiene atomi di azoto che sono passati
      per quell''enzima o per un impianto chimico.'
    attendibilita: documentato
  - id: impatto-dentro-enzima
    sezione: impatto
    testo: Dentro la nitrogenasi il lavoro si fa in un altro modo. Il trasferimento
      degli elettroni richiede energia chimica, e questa viene dal legame e dall'idrolisi
      dell'ATP; l'idrolisi provoca anche un cambio di conformazione nel complesso
      enzimatico, avvicinando la proteina a ferro alla proteina a ferro e molibdeno
      per rendere più agevole il passaggio degli elettroni. Quest'ultima è un eterotetramero
      di due subunità alfa e due beta, di massa intorno ai 240-250 kilodalton, e contiene
      due agglomerati ferro-zolfo detti cluster P. Esistono nitrogenasi alternative,
      che al posto del molibdeno usano altri metalli; ma quella al molibdeno è la
      più efficiente, perché spreca meno ATP nel ridurre protoni a idrogeno molecolare.
      Tant'è che quando il molibdeno è disponibile l'espressione delle varianti viene
      repressa, e l'organismo usa solo l'enzima migliore. Dove l'industria mette pressioni
      e temperature elevate, la cellula mette una macchina che si richiude su sé stessa.
    attendibilita: documentato
  - id: impatto-paradosso-ossigeno
    sezione: impatto
    testo: 'C''è però un difetto di progetto che la vita non è mai riuscita a correggere,
      e che spiega molto dell''agricoltura. La maggior parte delle nitrogenasi è inibita
      irreversibilmente dall''ossigeno molecolare, che ossida in modo distruttivo
      i cofattori ferro-zolfo: l''enzima che fissa l''azoto viene distrutto dal gas
      di cui l''atmosfera è ricca da due miliardi di anni. Gli organismi azotofissatori
      devono quindi dotarsi di meccanismi per proteggerlo dall''ossigeno, e molti
      di loro, nonostante questo, usano l''ossigeno stesso come accettore finale di
      elettroni per respirare. Tengono fuori da una parte della cellula la sostanza
      che nel resto della cellula li tiene in vita.'
    attendibilita: documentato
  - id: impatto-leguminose
    sezione: impatto
    testo: 'La soluzione più elegante a quel problema è una convivenza. Alcuni batteri
      azotofissatori vivono dentro noduli che si formano sulle radici delle piante
      leguminose, in una simbiosi in cui la pianta fornisce l''energia e un ambiente
      protetto dall''ossigeno, e il batterio fornisce azoto utilizzabile. Una parte
      dell''azoto così fissato resta nel terreno e diventa disponibile alle colture
      successive: è per questo che le leguminose hanno un ruolo chiave nella rotazione
      colturale, e che alternandole ad altre colture — o coltivandole insieme per
      una parte della stagione — un campo può dare un buon raccolto senza alcun fertilizzante
      aggiunto. È comune impiegarle anche come sovescio. La tecnica era nota e praticata
      molto prima che si sapesse che cosa fosse l''azoto: gli agricoltori conoscevano
      l''effetto da millenni e la spiegazione è arrivata alla fine dell''Ottocento.
      Chi seminava trifoglio un anno sì e uno no stava gestendo un impianto chimico
      di cui ignorava l''esistenza.'
    attendibilita: documentato
  - id: impatto-rhizobium
    sezione: impatto
    testo: 'Vale la pena guardare che cosa si scambiano esattamente i due contraenti,
      perché è un baratto e non una beneficenza. I batteri del genere Rhizobium colonizzano
      le cellule della radice e vi formano i noduli; lì dentro convertono l''azoto
      atmosferico in ammoniaca usando la nitrogenasi. Ma l''ammoniaca non se la tengono:
      viene ceduta alla pianta ospite sotto forma di composti organici azotati come
      la glutammina. La pianta, in cambio, fornisce ai batteri i composti organici
      che ha costruito con la fotosintesi. Zuccheri contro azoto: è uno scambio fra
      chi sa catturare la luce e chi sa rompere un triplo legame, e nessuno dei due
      sa fare entrambe le cose.'
    attendibilita: documentato
  - id: impatto-segatura-di-mare
    sezione: impatto
    testo: 'In mare il lavoro lo fa soprattutto un cianobatterio filamentoso che i
      marinai chiamavano segatura di mare. Il genere Trichodesmium vive nelle acque
      tropicali e subtropicali povere di nutrienti, e fu descritto per la prima volta
      dal capitano Cook nel Mar Rosso: le sue colonie sono visibili a occhio nudo
      e a volte formano fioriture estese. Si stima che da solo renda conto di quasi
      metà della fissazione dell''azoto in tutti i sistemi marini del pianeta. È anche
      l''unico diazotrofo noto capace di fissare azoto alla luce del giorno e in condizioni
      aerobiche senza ricorrere a cellule specializzate: risolve cioè in proprio il
      problema che costringe gli altri a segregare la nitrogenasi lontano dall''ossigeno.'
    attendibilita: documentato
  - id: impatto-barriera
    sezione: impatto
    testo: 'Dal punto di vista dell''azoto, il problema industriale si riassume in
      una frase: la molecola è abbondante e non ha alcuna voglia di reagire. Costituisce
      circa il 78 per cento dell''aria ed è eccezionalmente stabile. La sintesi dell''ammoniaca
      a partire da essa è addirittura esotermica, cioè in linea di principio conveniente;
      ma è sfavorita dal punto di vista dell''entropia, perché quattro equivalenti
      di gas reagenti diventano due equivalenti di gas prodotto. Soprattutto, le barriere
      cinetiche alla rottura del legame sono altissime, e per spingere avanti la reazione
      servono pressioni e temperature elevate. Non è la termodinamica a difendere
      l''azoto: è la sua lentezza.'
    attendibilita: documentato
  - id: impatto-due-vie
    sezione: impatto
    testo: 'Messe una accanto all''altra, le due strade per rompere quel legame raccontano
      due filosofie. La nitrogenasi lavora a temperatura ambiente e a pressione atmosferica
      e paga in ATP, cioè nella moneta energetica della cellula; l''industria paga
      in combustibile fossile e compra con quello le condizioni estreme che le servono.
      L''industria non è riuscita a imitare il batterio: ha aggirato il problema con
      la forza bruta, e lo ha fatto così bene da produrre oggi più azoto fissato di
      quanto ne fissi l''intera biosfera terrestre. Chi in questo vault ha letto l''approfondimento
      dell''idrogeno ha già visto quel processo dal lato del reagente che gli mancava;
      qui conta il lato dell''azoto, cioè il legame da spezzare.'
    attendibilita: documentato
  - id: impatto-prima-del-processo
    sezione: impatto
    testo: 'Prima di allora l''azoto utilizzabile si andava a prendere dove la natura
      lo aveva accumulato. Nell''Ottocento la domanda di nitrati e ammoniaca crebbe
      rapidamente, sia come fertilizzanti sia come materie prime industriali, e la
      fonte principale erano l''estrazione di giacimenti di nitro e il guano delle
      isole tropicali. All''inizio del Novecento quelle riserve erano ritenute insufficienti
      a soddisfare la domanda futura: una civiltà intera dipendeva dagli escrementi
      accumulati dagli uccelli marini su qualche scoglio del Pacifico. Il processo
      che risolse il problema richiede tre soli ingredienti — acqua, gas naturale
      e azoto atmosferico — e valse a entrambi i suoi autori il Nobel per la chimica:
      a Haber nel 1918 per la sintesi dell''ammoniaca, a Bosch nel 1931 per i contributi
      alla chimica delle alte pressioni.'
    attendibilita: documentato
  - id: impatto-goccia-a-goccia
    sezione: impatto
    testo: La prima volta che quella barriera venne superata in laboratorio, il risultato
      fu modesto in modo quasi commovente. Nell'estate del 1909 Fritz Haber, con il
      suo assistente Robert Le Rossignol, dimostrò il processo producendo ammoniaca
      dall'aria goccia a goccia, al ritmo di circa centoventicinque millilitri l'ora.
      Il procedimento fu acquistato dalla BASF, che affidò a Carl Bosch il compito
      di portare quella macchina da tavolo alla scala industriale; ci riuscì nel 1910.
      Tra il bicchierino orario di Karlsruhe e le fabbriche che oggi nutrono metà
      del pianeta passa un solo anno di ingegneria — e il fatto che il collo di bottiglia
      non fosse la chimica ma le pressioni che l'acciaio poteva reggere.
    attendibilita: documentato
  - id: impatto-ostwald
    sezione: impatto
    testo: 'L''ammoniaca però non basta: per farne concimi e per farne esplosivi serve
      l''acido nitrico, e a fornirlo è un secondo processo industriale accoppiato
      al primo. Il processo Ostwald produce acido nitrico partendo proprio dall''ammoniaca
      che il processo Haber ha sintetizzato: storicamente e praticamente i due sono
      legati, il secondo prende come materia prima ciò che il primo ha fabbricato.
      Insieme costituiscono un pilastro della chimica industriale moderna e forniscono
      la materia prima del tipo di fertilizzante più diffuso. La catena che parte
      dall''aria arriva così sia al campo di grano sia alla cava di mina, e il bivio
      è a valle.'
    attendibilita: documentato
  - id: impatto-quanto-costa
    sezione: impatto
    testo: 'Quel conto lo paghiamo ancora, ed è misurabile. Considerando anche l''energia
      necessaria a produrre l''idrogeno e a purificare l''azoto atmosferico, la produzione
      di ammoniaca è un''attività energivora: vale fra l''uno e il due per cento del
      consumo energetico mondiale, il tre per cento delle emissioni globali di carbonio
      e fra il tre e il cinque per cento del consumo di gas naturale. Il catalizzatore
      che rende possibile tutto questo è ferro metallico finemente suddiviso — lo
      stesso elemento di cui si è già raccontata la storia in questo vault, qui nel
      ruolo silenzioso di chi permette la reazione senza comparire nel prodotto. Una
      percentuale a due cifre dell''umanità mangia grazie a una polvere di ferro.'
    attendibilita: documentato
  - id: impatto-ciclo-alterato
    sezione: impatto
    testo: 'Il ciclo dell''azoto interessa agli ecologi per una ragione precisa: la
      disponibilità di azoto può determinare la velocità di processi chiave di un
      ecosistema, dalla produzione primaria alla decomposizione. È la leva che regola
      quanto in fretta un ambiente costruisce e smonta materia vivente. Ebbene, le
      attività umane — la combustione di combustibili fossili, l''uso di fertilizzanti
      azotati artificiali, il rilascio di azoto nelle acque reflue — hanno alterato
      in modo drammatico il ciclo globale, e questa modifica può ripercuotersi negativamente
      sia sull''ambiente naturale sia sulla salute umana. Abbiamo spostato la leva
      senza sapere a che cosa fosse collegata.'
    attendibilita: documentato
  - id: impatto-quasi-tutti
    sezione: impatto
    testo: 'Va detto, per equilibrio, che l''inerzia dell''azoto riguarda la molecola
      biatomica e non l''atomo. Una volta che il triplo legame è stato rotto, l''azoto
      è tutt''altro che schizzinoso: si lega a quasi tutti gli elementi della tavola
      periodica, con le sole eccezioni dei primi tre gas nobili — elio, neon e argon
      — e di alcuni elementi dalla vita brevissima che seguono il bismuto. Ne nasce
      una varietà immensa di composti binari con proprietà e applicazioni diversissime,
      chiamati genericamente nitruri tranne gli idruri, gli ossidi e i fluoruri. La
      pigrizia proverbiale dell''elemento, insomma, è tutta nel modo in cui si tiene
      per mano con sé stesso.'
    attendibilita: documentato
  - id: controversie-eutrofizzazione
    sezione: controversie
    testo: 'Il concime che non viene assorbito dalle radici non svanisce: scende nei
      fiumi e arriva al mare. Nelle acque costiere l''eutrofizzazione è un fenomeno
      comune e le fonti azotate ne sono la causa principale. La ragione è che in mare
      l''azoto è di norma il nutriente limitante, a differenza dei sistemi d''acqua
      dolce dove il ruolo spetta di solito al fosforo: per capire e controllare l''eutrofizzazione
      in acqua salata contano più i livelli di azoto che quelli di fosforo. Togliere
      il fattore limitante a un ecosistema significa togliergli il freno, e un ecosistema
      senza freno non cresce meglio: cresce fino a soffocare.'
    attendibilita: documentato
  - id: controversie-zone-morte
    sezione: controversie
    testo: 'Il meccanismo è quasi elegante nella sua perversità. I nutrienti in eccesso
      arrivano dai fiumi e producono una fioritura di materia organica; quella materia
      muore, affonda e viene respirata dai decompositori sul fondo; la respirazione
      consuma l''ossigeno disciolto e lascia acqua ipossica o anossica, in cui non
      vive più nulla. Sono le zone morte, che gli oceanografi hanno cominciato a segnalare
      in crescita per numero ed estensione negli anni Settanta. Si formano vicino
      alle coste abitate, cioè esattamente dove la vita acquatica è più concentrata:
      il Mar Baltico, il Golfo del Messico settentrionale, la baia di Chesapeake,
      e bacini chiusi come il lago Erie. L''azoto che nutre un continente asfissia
      il mare davanti alla foce.'
    attendibilita: documentato
  - id: controversie-stagionalita
    sezione: controversie
    testo: 'Nel Golfo del Messico la cosa ha perfino un ritmo annuale. In primavera
      le piogge aumentano e il Mississippi porta alla foce più acqua ricca di nutrienti;
      nello stesso periodo cresce la luce solare, e la proliferazione algale nelle
      zone morte aumenta in modo drammatico. In autunno arrivano nel Golfo le tempeste
      tropicali, che rimescolano l''acqua e disgregano le zone morte. Poi il ciclo
      ricomincia. È una stagionalità che non ha nulla di naturale: segue il calendario
      agricolo di un bacino idrografico grande come mezzo continente.'
    attendibilita: documentato
  - id: controversie-confini-planetari
    sezione: controversie
    testo: 'Nel 2009 un gruppo di scienziati guidato da Johan Rockström ha proposto
      di descrivere la stabilità del sistema Terra attraverso nove confini planetari:
      il cambiamento climatico, l''acidificazione degli oceani, la riduzione dell''ozono
      stratosferico, i flussi biogeochimici nel ciclo dell''azoto, l''uso eccessivo
      di acqua dolce, i cambiamenti nell''uso del suolo, l''erosione dell''integrità
      della biosfera, l''inquinamento chimico e il carico di aerosol atmosferici.
      Secondo quella prima valutazione tre confini erano già stati oltrepassati, e
      il ciclo dell''azoto era uno dei tre, insieme alla perdita di biodiversità e
      al clima. L''aggiornamento del 2015 ne contava quattro superati, fra cui di
      nuovo i cicli biogeochimici dell''azoto e del fosforo. Detto altrimenti: la
      nostra manomissione del ciclo dell''azoto viene collocata, da questo quadro,
      fra i primi guasti planetari in ordine di tempo — prima ancora dell''acidificazione
      degli oceani.'
    attendibilita: documentato
  - id: controversie-sensibilita
    sezione: controversie
    testo: 'C''è poi un secondo modo in cui il concime si ritorce, e non è lento come
      l''eutrofizzazione: è istantaneo. Il nitrato d''ammonio è il fertilizzante azotato
      più diffuso e insieme un esplosivo — la stessa sostanza, lo stesso sacco — perché
      rappresenta la discesa di quella collina energetica percorsa tutta in una volta.
      La cosa più inquietante è che, sulla carta, non è un esplosivo suscettibile:
      la sua sensibilità all''urto è classificata come molto bassa, e altrettanto
      bassa è quella all''attrito; la velocità di detonazione, circa duemilacinquecento
      metri al secondo, è modesta rispetto agli esplosivi militari. È catalogato come
      esplosivo e come ossidante, ma non si innesca se lo si urta. Ed è proprio questa
      mitezza a renderlo pericoloso: se ne possono ammassare migliaia di tonnellate
      in un capannone portuale per anni senza che accada nulla, e maturare così la
      convinzione che non accadrà mai. Le due stragi maggiori non sono cominciate
      con un colpo: sono cominciate entrambe con un incendio.'
    attendibilita: documentato
  - id: controversie-nitrato-ammonio
    sezione: controversie
    testo: 'La prima è del 1947. Il 16 aprile di quell''anno un incendio scoppiato
      a bordo della nave francese Grandcamp, ormeggiata nel porto di Texas City, fece
      detonare il suo carico di circa duemilacento tonnellate del composto; ne seguì
      una reazione a catena di incendi ed esplosioni su altre navi e nei depositi
      di petrolio vicini. Morirono almeno cinquecentottantuno persone, e fra queste
      tutti i vigili del fuoco volontari della città tranne uno. Il porto aveva gli
      idranti ma non possedeva autopompe proprie, e la richiesta di aiuto esterno
      partì alle 8:37. Mentre le squadre lavoravano, il boccaporto della stiva numero
      quattro saltò via per la pressione del vapore e ne uscì una colonna di fumo
      giallo-arancio: il colore tipico dei fumi di biossido di azoto. Quel fumo insolito
      attirò sulla riva una folla di circa cinquecento curiosi, molti dei quali bambini,
      convinti di trovarsi a distanza di sicurezza. Resta il più grave incidente industriale
      della storia degli Stati Uniti.'
    attendibilita: documentato
  - id: controversie-sacchi-caldi
    sezione: controversie
    testo: 'La cronaca di quella mattina merita di essere letta per intero, perché
      ogni singola decisione fu ragionevole e insieme sbagliata. Il nitrato d''ammonio
      era stato prodotto con un procedimento brevettato e mescolato ad argilla, vaselina,
      colofonia e paraffina per evitare che l''umidità lo facesse impaccare; era confezionato
      in sacchi di carta da quarantacinque chili. Gli scaricatori riferirono che i
      sacchi erano caldi al tatto già prima del carico. Il 16 aprile 1947, verso le
      otto del mattino, si notò del fumo nella stiva della Grandcamp ancora ormeggiata:
      gli uomini provarono con una damigiana d''acqua e due estintori, senza effetto,
      e la stiva si riempì di fumo. A quel punto vennero fatti uscire, e il capitano
      ordinò di non usare acqua per non rovinare il carico; fece invece sigillare
      i boccaporti e riempire la stiva di vapore per soffocare le fiamme. Difficilmente
      poteva funzionare: il nitrato d''ammonio è un ossidante, cioè porta con sé l''ossigeno
      che serve a bruciare. Soffocare un fuoco che non ha bisogno d''aria non è possibile.'
    attendibilita: documentato
  - id: controversie-dalehite
    sezione: controversie
    testo: Il seguito giudiziario fece storia quanto il disastro. Ne nacque la prima
      class action mai intentata contro il governo degli Stati Uniti, per conto di
      8.485 ricorrenti, sulla base del Federal Tort Claims Act approvato nel 1946;
      il caso arrivò fino alla Corte Suprema con il nome di Dalehite contro Stati
      Uniti. Il 13 aprile 1950 il tribunale distrettuale dichiarò il governo responsabile
      di una sequenza di atti negligenti, per omissione e per azione, imputabili a
      centosessantotto fra agenzie e loro rappresentanti, nella fabbricazione, nel
      confezionamento e nell'etichettatura del nitrato d'ammonio, aggravati da errori
      nel trasporto, nello stoccaggio, nel carico, nella prevenzione e nello spegnimento
      degli incendi. Una sostanza tanto comune da essere trattata come merce qualunque
      aveva costretto uno Stato a rispondere davanti ai propri cittadini.
    attendibilita: documentato
  - id: controversie-beirut
    sezione: controversie
    testo: 'Settantatré anni dopo, la stessa sostanza ha prodotto la più grande detonazione
      singola di nitrato d''ammonio mai registrata. Il 4 agosto 2020 a Beirut presero
      fuoco duemilasettecentocinquanta tonnellate del composto, confiscate nel 2014
      alla nave da carico MV Rhosus e stoccate nel porto per sei anni senza adeguate
      misure di sicurezza. L''esplosione liberò energia paragonabile a 1,1 chilotoni
      di tritolo, il che la colloca fra le più potenti esplosioni non nucleari mai
      documentate: almeno duecentodiciotto morti, oltre settemila feriti, circa trecentomila
      sfollati e quindici miliardi di dollari di danni. Non fu un attentato: fu un
      magazzino dimenticato.'
    attendibilita: documentato
  - id: controversie-beirut-contesto
    sezione: controversie
    testo: 'Una catastrofe chimica non cade mai su un foglio bianco. Il Libano era
      già in crisi prima dell''esplosione: lo Stato aveva dichiarato default sul debito,
      la lira libanese era crollata e il tasso di povertà aveva superato il cinquanta
      per cento. In più la pandemia di COVID-19 aveva travolto molti ospedali del
      paese, diversi dei quali erano già a corto di forniture mediche e non riuscivano
      a pagare il personale a causa della crisi finanziaria. L''onda d''urto arrivò
      su una città che non aveva margini: è il motivo per cui, a parità di tonnellate,
      la stessa sostanza fa danni diversissimi a seconda di dove la si tiene.'
    attendibilita: documentato
  - id: controversie-discusso-quanto
    sezione: controversie
    testo: 'Quanto nitrato sia effettivamente esploso a Beirut, però, è oggetto di
      stime discordanti, e vale la pena riportarle tutte. Alcuni esperti hanno calcolato
      che delle 2.750 tonnellate originarie ne restassero in magazzino soltanto fra
      le 700 e le 1.000, essendo il resto stato rimosso o rubato dal 2014 in poi.
      L''FBI statunitense ha stimato che ne fossero rimaste circa 500, cifra poi citata
      dal primo ministro libanese Hassan Diab. Altri due esperti sono giunti invece
      alla conclusione opposta, cioè che sia esplosa la maggior parte o la totalità
      del carico. La differenza non è da poco: se le cifre più basse fossero corrette,
      la detonazione più potente mai prodotta da questa sostanza sarebbe stata ottenuta
      con meno di un quinto di quanto si era creduto.'
    attendibilita: discusso
  - id: controversie-ebbrezza
    sezione: controversie
    testo: 'C''è poi un modo in cui l''azoto smette di essere inerte senza reagire
      con nulla: basta respirarlo a pressione alta. La narcosi da azoto è un''alterazione
      reversibile della coscienza che compare immergendosi in profondità, causata
      dall''effetto anestetico che certi gas esercitano ad alta pressione parziale.
      Il nome viene dal greco νάρκωσις, l''atto di intorpidire, derivato da νάρκη,
      torpore, parola che usavano già Omero e Ippocrate. Lo stato che produce somiglia
      all''ubriachezza da alcol o all''inalazione di protossido d''azoto. Può manifestarsi
      anche in immersioni poco profonde, ma di solito non si fa notare sopra i trenta
      metri. Nel 1953 Jacques-Yves Cousteau la battezzò con la formula rimasta celebre:
      «l''ivresse des grandes profondeurs», l''ebbrezza dei grandi fondali.'
    attendibilita: documentato
  - id: controversie-ebbrezza-rimedio
    sezione: controversie
    testo: 'Il fenomeno non riguarda solo l''azoto: a parte l''elio e presumibilmente
      il neon, tutti i gas respirabili hanno un effetto narcotico, per quanto di grado
      molto diverso. L''effetto è tanto maggiore quanto più il gas è solubile nei
      lipidi, e benché il meccanismo non sia ancora del tutto chiaro ci sono buone
      prove che le due proprietà siano legate. Un subacqueo può imparare a gestirne
      alcuni effetti, ma non può sviluppare tolleranza: non ci si abitua. La buona
      notizia è che risalendo di qualche metro la narcosi si annulla in pochi minuti
      senza lasciare conseguenze a lungo termine. Per scendere più giù si cambia proprio
      il gas: miscele come il trimix e l''heliox sostituiscono con l''elio, che non
      è narcotico, una parte o tutta la frazione inerte dell''aria respirata. Il rimedio
      all''azoto, insomma, è toglierlo.'
    attendibilita: documentato
  - id: controversie-bolle
    sezione: controversie
    testo: 'Il secondo pericolo è l''esatto opposto del primo: non il gas che entra
      ma il gas che vuole uscire. La malattia da decompressione — nota anche come
      male dei cassoni o, in inglese, semplicemente «the bends» — è causata dai gas
      disciolti nei tessuti che tornano allo stato gassoso formando bolle durante
      la decompressione. Colpisce soprattutto durante o poco dopo una risalita da
      un''immersione, ma non riguarda solo il mare: la si prende uscendo da un cassone
      pneumatico, decomprimendo da una saturazione, volando ad alta quota su un aereo
      non pressurizzato e perfino uscendo da un veicolo spaziale per un''attività
      extraveicolare. Ovunque la pressione cali abbastanza in fretta, l''azoto che
      avevamo sciolto nel sangue pretende di tornare a essere un gas.'
    attendibilita: documentato
  - id: eredita-ciclo
    sezione: eredita
    testo: 'Il percorso che un atomo di azoto compie fra l''atmosfera, la terra e
      il mare si chiama ciclo dell''azoto, e procede per tappe distinte: fissazione,
      ammonificazione, nitrificazione, denitrificazione. Il punto di partenza è il
      più grande serbatoio esistente, l''atmosfera con il suo settantotto per cento;
      il paradosso, che a questo punto della storia non sorprende più, è che quel
      serbatoio ha disponibilità biologica limitata, e da ciò deriva una scarsità
      di azoto utilizzabile in molti tipi di ecosistemi. Gli ecologi seguono quel
      ciclo con particolare attenzione perché la disponibilità di azoto condiziona
      la velocità di processi chiave, dalla produzione primaria alla decomposizione.'
    attendibilita: documentato
  - id: eredita-nitrificazione
    sezione: eredita
    testo: 'Fissare l''azoto è solo il primo passo del giro. Quello successivo si
      chiama nitrificazione ed è l''ossidazione biologica dell''ammoniaca a nitrato
      passando per il nitrito, un passaggio importante del ciclo dell''azoto nel suolo.
      È un processo aerobico, svolto da piccoli gruppi di batteri e archei autotrofi;
      la trasformazione dell''ammoniaca in nitrito è di solito la tappa che ne limita
      la velocità. Può avvenire in due tempi per opera di organismi diversi oppure,
      nei batteri detti comammox, interamente dentro un solo organismo. Il suolo fertile
      non è una sostanza: è una catena di montaggio microbica.'
    attendibilita: documentato
  - id: eredita-denitrificazione
    sezione: eredita
    testo: 'E infine qualcuno deve restituire all''atmosfera ciò che le è stato tolto,
      altrimenti il ciclo non è un ciclo. Se ne occupa la denitrificazione, un processo
      microbico in cui il nitrato viene ridotto fino a produrre azoto molecolare attraverso
      una serie di ossidi gassosi intermedi. A compierla sono batteri anaerobi facoltativi,
      per i quali si tratta di una forma di respirazione: in assenza di ossigeno usano
      l''azoto ossidato come accettore di elettroni, ossidando in cambio materia organica.
      La scala delle loro preferenze termodinamiche è nitrato, nitrito, ossido nitrico,
      protossido, e in fondo azoto molecolare — che chiude il ciclo. Sono organismi
      che respirano azoto al posto dell''aria, e così facendo restituiscono l''aria
      a noi.'
    attendibilita: documentato
  - id: eredita-quanto-abbiamo-cambiato
    sezione: eredita
    testo: 'Quanto quel ciclo sia stato alterato si misura in fattori moltiplicativi.
      L''ammoniaca presente in atmosfera è triplicata per effetto delle attività umane,
      e una volta in aria si comporta da aerosol che peggiora la qualità dell''aria
      e, aggregandosi alle goccioline d''acqua, dà acido nitrico, cioè pioggia acida.
      Gli ossidi di azoto hanno visto il proprio flusso verso l''atmosfera aumentare
      di sei o sette volte per effetto delle combustioni ad alta temperatura: la loro
      produzione dipende proprio dalla temperatura di combustione, e più si brucia
      caldo più se ne producono. È lo stesso azoto dell''aria che entra nei motori
      insieme all''ossigeno, e che il calore costringe a reagire.'
    attendibilita: documentato
  - id: eredita-protossido
    sezione: eredita
    testo: 'C''è poi un gas azotato che nel dibattito sul clima compare di rado e
      dovrebbe comparire spesso: il protossido di azoto, quello che i dentisti chiamavano
      gas esilarante. È il terzo contributore al riscaldamento globale dopo l''anidride
      carbonica e il metano, e la ragione non è la quantità: in atmosfera è molto
      meno abbondante dell''anidride carbonica. È la potenza. A parità di massa riscalda
      il pianeta quasi trecento volte di più. Una parte consistente di quel gas viene
      proprio dai suoli fertilizzati, dove i microrganismi lavorano l''azoto in eccesso:
      il fertilizzante non finisce soltanto nei fiumi, una quota se ne va in cielo
      come gas serra.'
    attendibilita: documentato
  - id: eredita-gas-esilarante
    sezione: eredita
    testo: 'Quello stesso gas ha però attraversato tre secoli cambiando ruolo ogni
      volta, e l''uso che oggi ne fa la medicina non ha nulla a che vedere con il
      clima. Il protossido d''azoto ha impieghi medici rilevanti, soprattutto in chirurgia
      e odontoiatria, per le sue proprietà anestetiche e antidolorifiche, tanto da
      figurare nella lista dei farmaci essenziali dell''Organizzazione mondiale della
      sanità. Il soprannome con cui tutti lo conoscono, gas esilarante, lo coniò Humphry
      Davy per descriverne gli effetti euforizzanti — lo stesso Davy che in questo
      vault si è già incontrato a proposito dell''ossigeno, negli anni in cui a Bristol
      si respiravano gas per vedere che effetto facevano. Non è però innocuo: l''abuso
      cronico può causare danni neurologici attraverso l''inattivazione della vitamina
      B12.'
    attendibilita: documentato
  - id: eredita-acqua-forte
    sezione: eredita
    testo: 'Un''ultima ironia storica riguarda le date. L''acido nitrico ha nomi antichi
      — aqua fortis, spirito di nitro, eau forte — e compare in opere posteriori al
      1300 falsamente attribuite ad Alberto Magno e a Raimondo Lullo, che ne descrivono
      la preparazione distillando una miscela di nitro e vetriolo verde. Nel Seicento
      Johann Rudolf Glauber mise a punto un procedimento per ottenerlo distillando
      nitrato di potassio con acido solforico. Gli alchimisti dunque maneggiavano,
      incidevano rami e scioglievano metalli con un composto dell''azoto quattro secoli
      prima che qualcuno isolasse l''elemento. Non è raro nella storia della chimica:
      si impara a usare una cosa molto prima di sapere che cosa sia.'
    attendibilita: documentato
  - id: eredita-sobrero
    sezione: eredita
    testo: 'La storia più amara dei composti azotati comincia a Torino. Nel 1846 il
      chimico italiano Ascanio Sobrero, che lavorava all''Università sotto Théophile-Jules
      Pelouze, sintetizzò la nitroglicerina: il primo esplosivo pratico più potente
      della polvere nera. La chiamò piroglicerina e mise in guardia con veemenza contro
      il suo uso come esplosivo. Non fu ascoltato. Ad adottarla commercialmente fu
      Alfred Nobel, che cercò modi più sicuri di maneggiare quel composto pericoloso
      dopo che un''esplosione nella fabbrica di famiglia aveva ucciso il fratello
      minore Emil Oskar e diversi operai. Il chimico che l''aveva fatta per primo
      passò la vita a dire di non usarla; l''industriale che la usò ci costruì sopra
      un premio destinato a chi giova all''umanità.'
    attendibilita: documentato
  - id: eredita-nitroglicerina-farmaco
    sezione: eredita
    testo: 'La stessa molecola ha avuto poi una seconda carriera, opposta alla prima.
      Combinata con la nitrocellulosa forma la polvere infume a doppia base, propellente
      di artiglierie e armi da fuoco fin dagli anni Ottanta dell''Ottocento. Ma la
      nitroglicerina si somministra anche ai malati di cuore, in compresse sublinguali,
      spray, unguenti e cerotti. Il motivo profondo lo si è capito solo molto più
      tardi, ed è il filo che lega la nitroglicerina all''ossido nitrico: il farmaco
      funziona perché nel corpo libera proprio quel messaggero che dice alle arterie
      di allargarsi. L''esplosivo e il vasodilatatore sono la medesima sostanza, e
      il loro segreto è lo stesso: quanto in fretta l''azoto riesce a tornare gassoso.'
    attendibilita: documentato
  - id: eredita-ossido-nitrico
    sezione: eredita
    testo: 'La sorpresa più recente è che un ossido d''azoto tossico sia anche uno
      dei messaggeri del nostro corpo. Nei mammiferi, uomo compreso, l''ossido nitrico
      è una molecola di segnalazione coinvolta in molti processi fisiologici e patologici:
      viene sintetizzato dall''organismo a partire da L-arginina, ossigeno e NADPH
      per opera degli enzimi chiamati ossido nitrico sintasi, e agisce come fattore
      rilassante di origine endoteliale. Nel 1992 fu proclamato «molecola dell''anno»;
      nel 1998 il Nobel per la medicina andò a Louis Ignarro, Robert Furchgott e Ferid
      Murad proprio per averne dimostrato il ruolo di messaggero cardiovascolare.
      Da quella scoperta è nato anche il sildenafil, cioè il Viagra. Un gas che nei
      tubi di scarico consideriamo inquinante, dentro le arterie è il segnale che
      dice ai vasi di dilatarsi.'
    attendibilita: documentato
  - id: eredita-due-terzi
    sezione: eredita
    testo: 'Vale la pena di guardare a cosa serve, oggi, l''azoto che estraiamo dall''aria
      come elemento. Circa due terzi della produzione commerciale viene impiegato
      semplicemente come gas inerte, privo di ossigeno: il confezionamento degli alimenti
      ne è l''uso più comune. Buona parte del resto va in azoto liquido per applicazioni
      criogeniche. Il che significa che la maggior parte dell''azoto che compriamo
      lo compriamo proprio per quella qualità che per due secoli lo aveva reso invisibile
      ai chimici: perché non fa niente. Un sacchetto di patatine è gonfio di azoto
      per la stessa ragione per cui un topo ci moriva dentro.'
    attendibilita: documentato
  - id: eredita-distillare-aria
    sezione: eredita
    testo: Gli impianti che fanno questo lavoro separano l'aria atmosferica nei suoi
      componenti principali, tipicamente azoto e ossigeno, e talvolta anche argon
      e altri gas rari inerti; il metodo più diffuso è la distillazione frazionata.
      Le unità criogeniche di separazione dell'aria sono costruite per fornire azoto
      oppure ossigeno, e spesso coproducono argon. La purezza elevata che serve alla
      fabbricazione dei dispositivi a semiconduttore si ottiene solo per via criogenica;
      e la distillazione dell'aria, con almeno due colonne, è l'unica fonte praticabile
      di gas rari come neon, cripton e xenon. Quando in questo vault arriveremo all'argon
      torneremo in questo stesso impianto, da un'altra porta.
    attendibilita: documentato
  - id: eredita-azoto-liquido
    sezione: eredita
    testo: 'L''azoto liquido è il freddo portatile della modernità, ed è a buon mercato
      perché è un sottoprodotto: si ottiene distillando l''aria, e chi vuole ossigeno
      si ritrova azoto in abbondanza. Conserva gameti, cellule e vaccini, raffredda
      strumentazione scientifica, congela tessuti in chirurgia. La sua pericolosità,
      però, non è quella che si immagina: non è tossico, e proprio per questo è insidioso.
      Evaporando in un ambiente chiuso sostituisce l''aria senza odore né alcun avvertimento,
      e chi vi entra perde conoscenza senza avere la sensazione di soffocare, perché
      il riflesso dell''allarme risponde all''anidride carbonica e non alla mancanza
      di ossigeno.'
    attendibilita: documentato
  - id: eredita-liquido
    sezione: eredita
    testo: 'Vale la pena guardare da vicino che cosa sia, quel liquido. A meno centonovantasei
      gradi l''azoto è incolore e mobilissimo: la sua viscosità è circa la metà di
      quella dell''acetone, vale a dire un sesto di quella dell''acqua a temperatura
      ambiente — si versa più facilmente dell''acqua. La molecola biatomica sopravvive
      intatta alla liquefazione, e fra una molecola e l''altra restano solo deboli
      interazioni di van der Waals, con pochissima attrazione reciproca: è questa
      la ragione del punto di ebollizione insolitamente basso. E si può scendere ancora,
      perché mettendolo in una camera a vuoto collegata a una pompa lo si porta senza
      difficoltà fino al punto di congelamento, meno duecentodieci gradi. A quel punto
      l''aria che respiriamo è diventata un solido, e il solido che se ne ottiene
      è poroso.'
    attendibilita: documentato
  - id: eredita-leidenfrost
    sezione: eredita
    testo: Come refrigerante ha però un limite curioso, che è anche la ragione per
      cui una goccia versata sulla mano rimbalza via invece di ustionarla. L'azoto
      liquido bolle all'istante appena tocca un oggetto più caldo, e così facendo
      avvolge quell'oggetto in uno strato isolante di bolle di azoto gassoso che rallenta
      ogni ulteriore scambio di calore. È l'effetto Leidenfrost, che si manifesta
      ogni volta che un liquido incontra una superficie molto più calda del suo punto
      di ebollizione. Il gas che si forma difende ciò che dovrebbe raffreddare.
    attendibilita: documentato
  - id: eredita-isotopi
    sezione: eredita
    testo: 'L''azoto naturale ha due soli isotopi stabili: l''azoto-14, che costituisce
      il 99,62 per cento del totale, e l''azoto-15 per il restante 0,38. Se ne conoscono
      anche tredici radioisotopi, tutti di vita brevissima: il più longevo, l''azoto-13,
      ha un''emivita di poco meno di dieci minuti. Entrambi gli stabili vengono dalla
      nucleosintesi stellare, prodotti nel ciclo CNO. E l''azoto-14 ha un ruolo che
      riguarda ogni archeologo: alcune radiazioni cosmiche provocano con esso una
      reazione nucleare negli strati alti dell''atmosfera terrestre, e il prodotto
      è il carbonio-14, che decadendo con un''emivita di 5700 anni torna a essere
      azoto-14. La datazione al radiocarbonio misura, in fondo, un prestito che l''azoto
      fa al carbonio e si riprende indietro.'
    attendibilita: documentato
  - id: eredita-plutone
    sezione: eredita
    testo: 'Queste pagine si sono aperte promettendo un terreno su cui camminare,
      e le sonde sono andate a vederlo. L''azoto solido costituisce buona parte della
      superficie di Plutone, dove si mescola a monossido di carbonio e metano solidi,
      e di Tritone, la luna di Nettuno. Su Plutone è stato osservato direttamente
      per la prima volta nel luglio 2015 dalla sonda New Horizons; su Tritone lo aveva
      già visto il Voyager 2 nell''agosto 1989. Gran parte della superficie di Tritone
      è coperta dalla forma esagonale dell''azoto solido, la fase cristallina beta.
      Anche a quelle temperature l''azoto resta piuttosto volatile: può sublimare
      formando un''atmosfera e poi ricondensare come brina. Là fuori l''aria che respiriamo
      è un paesaggio, e nevica.'
    attendibilita: documentato
  - id: eredita-inerzia-mestiere
    sezione: eredita
    testo: Messi in fila, gli usi moderni dell'azoto disegnano una figura curiosa.
      Lo compriamo per confezionare gli alimenti perché non reagisce; lo distilliamo
      dall'aria per raffreddare perché evapora a una temperatura bassissima; lo togliamo
      dalle bombole dei subacquei, sostituendolo con l'elio, perché a pressione alta
      stordisce. In tre casi su tre il valore sta in ciò che l'elemento non fa o smette
      di fare, non in ciò che produce. È il rovescio esatto della storia industriale
      raccontata poco fa, dove tutto il lavoro consisteva nel costringerlo a reagire.
      L'azoto è insieme la materia prima più contesa del Novecento e il gas che si
      sceglie proprio perché non combina nulla.
    attendibilita: documentato
  - id: eredita-chiusura
    sezione: eredita
    testo: 'Di tutti gli elementi raccontati finora, l''azoto è quello che ha attraversato
      la distanza più lunga nel giudizio che ne diamo. Per Rutherford era ciò che
      avanzava: l''aria guasta, il residuo dopo che tutte le cose interessanti erano
      state tolte. Per Lavoisier era ciò che non sostiene la vita, e gli diede un
      nome che è una negazione. Oggi sappiamo che è l''atomo delle proteine e del
      codice genetico, che la sua indolenza è una fortezza da 945 chilojoule per mole,
      che per espugnarla spendiamo una quota misurabile dell''energia mondiale e che,
      avendola espugnata, abbiamo scardinato uno dei cicli su cui poggia la stabilità
      del pianeta. Il gas che non fa nulla si è rivelato la cosa che facciamo di più.
      E ogni sera, sotto i campi e sul fondo dei mari, batteri anaerobi smontano pazientemente
      i nostri nitrati e restituiscono al cielo l''azoto molecolare, chiudendo un
      cerchio che noi abbiamo imparato solo ad aprire.'
    attendibilita: documentato
