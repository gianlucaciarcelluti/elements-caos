  note_cronologia: 'Rutherford isola il gas e ne pubblica la descrizione nella dissertazione di
    laurea in medicina discussa a Edimburgo nel settembre 1772, sotto la guida di Joseph Black.
    Nello stesso giro di mesi arrivano allo stesso gas, per vie indipendenti, anche Carl Wilhelm
    Scheele, Henry Cavendish e Joseph Priestley: a Rutherford va il credito perché è il primo a
    pubblicarne una caratterizzazione compiuta.'
