contenuti:
  hook: Uno studente di medicina chiuse un topo in un vaso di vetro e aspettò. Quello che
    restava nel vaso quando l'animale era morto costituisce i quattro quinti dell'aria.
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'L''azoto è il gas di cui l''atmosfera è fatta per il settantotto per cento: la parte
      dell''aria che non fa nulla. Non brucia, non alimenta la fiamma, non sostiene la
      respirazione, e proprio per questa inerzia è passato inosservato più a lungo degli altri
      gas. Eppure è indispensabile alla vita — sta in ogni proteina e in ogni filamento di DNA —
      e strapparlo all''atmosfera è stato uno dei problemi tecnici più costosi del Novecento.'
    visual: Recipiente di azoto liquido che fuma a contatto con l'aria
    attendibilita: documentato
  - id: aria_fissa
    sezione: storia
    testo: 'La storia comincia con un maestro e una domanda mal posta. A Edimburgo Joseph Black
      aveva dimostrato che esiste un''aria fissa, quella che oggi chiamiamo anidride carbonica,
      che si libera dal calcare e spegne le candele. Restava un fatto scomodo: se da un''aria in
      cui una candela si era spenta si toglieva tutta l''aria fissa, la candela continuava a non
      accendersi. Qualcosa d''altro c''era, e non aveva ancora un nome.'
    visual: Campana di vetro con la candela spenta sopra la vasca dell'acqua
    attendibilita: documentato
  - id: rutherford_esperimento
    sezione: storia
    testo: 'Black assegna il problema a un suo studente, Daniel Rutherford, ventitreenne. Il
      procedimento è una sottrazione condotta fino in fondo: tiene un topo in una quantità
      d''aria confinata finché l''animale non muore, poi in quell''aria brucia una candela
      finché non si spegne, poi vi brucia del fosforo finché non smette di ardere, e infine fa
      passare il residuo attraverso una soluzione alcalina che assorbe l''aria fissa. Ciò che
      sopravvive a tutti questi consumi è azoto quasi puro.'
    visual: 'La sequenza dei quattro recipienti: topo, candela, fosforo, soluzione alcalina'
    attendibilita: documentato
  - id: aria_mefitica
    sezione: storia
    testo: 'Rutherford descrive il gas nella sua tesi di laurea in medicina, discussa nel
      settembre 1772, e lo chiama aria nociva, o mefitica: il nome viene dalle esalazioni che
      nell''antichità si credeva uscissero dalla terra e portassero malattia, ed è esatto nel
      modo più letterale, perché in quell''aria un animale muore. Come tutti i suoi
      contemporanei interpreta il risultato con il flogisto, e ritiene di avere in mano aria
      comune saturata di quel principio.'
    visual: Frontespizio della dissertazione De aere fixo dicto, aut mephitico
    attendibilita: documentato
  - id: quattro_insieme
    sezione: storia
    testo: 'Non era il solo ad averci messo le mani. Nello stesso giro di mesi Scheele ottiene
      lo stesso gas in Svezia e lo chiama aria viziata, Priestley lo prepara in Inghilterra come
      aria flogisticata, e Henry Cavendish lo aveva ottenuto ancora prima senza pubblicare
      nulla, per quella riluttanza alla stampa che gli fece perdere il credito di parecchie
      scoperte. A Rutherford il primato tocca per una ragione precisa: è il primo a descriverne
      il comportamento in modo compiuto e a metterlo per iscritto.'
    visual: Quattro banchi di laboratorio in quattro paesi diversi, con lo stesso apparato
    attendibilita: documentato
  - id: i_due_nomi
    sezione: storia
    testo: 'L''elemento porta due nomi in Europa perché due scuole ne colsero due qualità
      opposte. Lavoisier propose azote, dal greco per privo di vita, guardando a ciò che il gas
      non fa; nel 1790 Jean-Antoine Chaptal propose nitrogène, generatore di nitro, guardando a
      ciò che il gas produce, cioè il salnitro e l''acido nitrico. L''italiano e il francese
      hanno tenuto il primo, l''inglese e lo spagnolo il secondo: la stessa sostanza si chiama,
      a seconda del confine, per la sua sterilità o per la sua fertilità.'
    visual: Due etichette da laboratorio affiancate, azote e nitrogen, sulla stessa bombola
    attendibilita: documentato
  - id: caratteristiche_triplo_legame
    sezione: caratteristiche
    testo: 'Tutta la chimica dell''azoto discende da un solo numero. I due atomi della molecola
      sono tenuti insieme da un triplo legame la cui rottura costa novecentoquarantacinque
      chilojoule per mole, il più tenace fra tutti i legami fra due atomi uguali: è per questo
      che l''azoto attraversa i nostri polmoni senza reagire e che si può conservare la frutta
      in atmosfera di azoto. L''inerzia dell''aria non è assenza di chimica, è una barriera
      energetica.'
    visual: Modello della molecola N2 con i tre legami evidenziati
    attendibilita: documentato
  - id: caratteristiche_paradosso
    sezione: caratteristiche
    testo: 'Ne segue il paradosso biologico più grande del pianeta: gli organismi vivono immersi
      in un oceano di azoto e quasi nessuno riesce a usarlo. Le piante non lo prendono
      dall''aria ma dal suolo, sotto forma di nitrati e ammonio, e a produrli sono pochi batteri
      specializzati, alcuni liberi e altri ospitati nei noduli delle radici delle leguminose,
      che dispongono dell''unico enzima capace di spezzare quel triplo legame a temperatura
      ambiente.'
    visual: Radici di leguminosa con i noduli dei batteri azotofissatori
    attendibilita: documentato
  - id: caratteristiche_composti
    sezione: caratteristiche
    testo: 'Liberato dalla molecola, l''azoto diventa un camaleonte: nei composti assume tutti
      gli stati di ossidazione da meno tre a più cinque, dall''ammoniaca all''acido nitrico
      passando per l''intera famiglia degli ossidi. Molti dei suoi composti sono instabili
      proprio perché la molecola di azoto è così stabile: gli esplosivi organici liberano
      energia enorme in un istante perché i loro atomi di azoto si ricongiungono a coppie, e
      nulla è più comodo che tornare a casa.'
    visual: Cratere di una detonazione e la nube di gas che si allontana
    attendibilita: documentato
  - id: usi_haber
    sezione: usi
    testo: 'Nel 1909 Fritz Haber riesce a far reagire azoto e idrogeno sotto pressione altissima
      con un catalizzatore, e Carl Bosch porta il procedimento alla scala industriale. È la
      sintesi dell''ammoniaca, e non c''è invenzione chimica che abbia cambiato di più la vita
      di più persone: l''agricoltura smette di dipendere dal letame e dal guano importato, e la
      produzione di cibo si sgancia dai limiti naturali della fissazione biologica.'
    visual: Colonne di sintesi ad alta pressione di un impianto per l'ammoniaca
    attendibilita: documentato
  - id: usi_meta_umanita
    sezione: usi
    testo: 'La stima più citata è anche la più impressionante: circa la metà degli esseri umani
      oggi in vita è nutrita grazie all''azoto fissato per via industriale, secondo un calcolo
      pubblicato nel 2008 e confermato da valutazioni indipendenti successive. Il conto ha un
      rovescio, perché l''azoto in eccesso finisce nelle falde e nei fiumi e vi innesca
      fioriture algali che consumano l''ossigeno: le zone morte costiere sono il residuo della
      stessa reazione che ci sfama.'
    visual: Campo fertilizzato accanto a un estuario con una fioritura algale
    attendibilita: documentato
  - id: curiosita_azoto_liquido
    sezione: curiosita
    testo: 'A meno centonovantasei gradi l''azoto diventa un liquido incolore che si compra a
      poco più del prezzo dell''acqua minerale, ed è il freddo portatile della modernità:
      conserva gameti e vaccini, raffredda i magneti superconduttori, congela i tessuti in
      chirurgia. La sua sicurezza è insidiosa proprio perché non è tossico: evaporando in un
      ambiente chiuso sostituisce l''aria senza odore né avvertimento, e chi vi entra perde
      conoscenza senza sentire di soffocare.'
    visual: Dewar di azoto liquido aperto con il vapore freddo che scende verso il pavimento
    attendibilita: documentato
  - id: curiosita_narcosi
    sezione: curiosita
    testo: 'Sott''acqua l''azoto smette di essere inerte. Oltre i trenta metri di profondità la
      pressione lo scioglie nel sangue e nei tessuti nervosi in quantità sufficiente a produrre
      la narcosi da gas inerte, uno stato di euforia e di giudizio compromesso che i subacquei
      chiamano ebbrezza degli abissi. In risalita lo stesso azoto disciolto torna allo stato
      gassoso e, se la decompressione è troppo rapida, forma bolle nei tessuti: è la malattia
      dei cassoni.'
    visual: Subacqueo in profondità con le bolle che risalgono verso la superficie
    attendibilita: documentato
