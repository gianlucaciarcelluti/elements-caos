numero_atomico: 99
simbolo: Es
nome: Einsteinio
nome_en: Einsteinium
scoperta:
  anno: 1952
  anno_stimato: false
  scopritori:
  - albert-ghiorso
  - stanley-thompson
  - glenn-seaborg
  luogo: Enewetak, Isole Marshall
  epoca: nucleare
  isolamento_anno: null
  note_cronologia: 'Individuato nei detriti del test termonucleare Ivy Mike del 1º novembre
    1952, raccolti con carte filtro montate su aerei. La scoperta è di una collaborazione
    fra Berkeley, Argonne e Los Alamos con una ventina di autori: qui sono citati i tre nomi
    che le fonti isolano sempre. L''annuncio pubblico arrivò solo nell''agosto 1955, alla
    conferenza di Ginevra, per via del segreto militare.'
  controversia: null
