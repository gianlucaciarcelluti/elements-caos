scoperta:
  anno: -3000
  anno_stimato: true
  scopritori: []
  luogo: null
  epoca: antichita
  isolamento_anno: null
  note_cronologia: 'La data si riferisce all''uso della stibnite, solfuro di antimonio, come
    cosmetico e non all''antimonio metallico: sul primo oggetto in antimonio metallico le
    fonti sono discordi.'
  controversia: 'Il reperto citato come più antico oggetto di antimonio metallico, un frammento
    da Tello nell''antica Caldea datato intorno al 3000 a.C. e descritto come parte di un
    vaso, è contestato: Roger Moorey ha argomentato che non si tratti di un vaso e che non
    serva postulare una perduta tecnica per rendere malleabile un materiale così fragile,
    trattandosi più verosimilmente di un piccolo ornamento ricavato da antimonio nativo. Ben
    documentato è invece l''uso del minerale, la stibnite, come cosmetico per gli occhi nell''Egitto
    predinastico dal 3100 a.C. circa; va però precisato che il kohl egizio analizzato risulta
    in prevalenza a base di galena, solfuro di piombo, e che l''antimonio prevale in altre
    aree e in altre epoche.'
