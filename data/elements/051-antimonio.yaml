contenuti:
  hook: 'L''antimonio entra nella storia come cosmetico, non come metallo: per millenni è
    stato una polvere nera con cui ci si truccava gli occhi, e nessuno lo pensava come materia
    da cui ricavare qualcosa.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: Fra gli elementi noti dall'antichità l'antimonio è il più equivoco. Non è propriamente
      un metallo ma un semimetallo, fragile invece che malleabile; il suo uso antico riguarda
      un suo composto e non l'elemento; e persino il suo nome ha un'origine incerta su cui
      circolano più spiegazioni che prove.
    visual: Cristalli aghiformi grigio-argentei di stibnite su matrice rocciosa
    attendibilita: documentato
  - id: kohl
    sezione: storia
    testo: La sostanza che apre la vicenda è la stibnite, solfuro di antimonio, un minerale
      grigio scuro e lucente facilissimo da ridurre in polvere. Nell'Egitto predinastico,
      intorno al 3100 a.C., quella polvere è già in uso come cosmetico per gli occhi, il kohl,
      e da lì si diffonde in tutto il Vicino Oriente e nel Nordafrica, dove è rimasta in uso
      senza interruzione fino a oggi.
    visual: Vasetto egizio da kohl con il bastoncino applicatore e la polvere scura
    attendibilita: documentato
  - id: kohl_precisazione
    sezione: storia
    testo: Su questo punto conviene una precisazione, perché la divulgazione tende a semplificare.
      Le analisi dei contenitori antichi mostrano che il kohl egizio era in prevalenza a base
      di galena, cioè solfuro di piombo, non di antimonio; la stibnite era comune in altre
      aree e in altre epoche, e il termine kohl indica una famiglia di preparati, non una
      ricetta unica. Antimonio e piombo si sono divisi lo stesso ruolo cosmetico per millenni.
    visual: Confronto al microscopio fra polvere di galena e polvere di stibnite
    attendibilita: documentato
  - id: tello
    sezione: storia
    testo: 'Sul primo oggetto di antimonio metallico la questione è aperta. Viene spesso citato
      un frammento rinvenuto a Tello, nell''antica Caldea, datato intorno al 3000 a.C. e descritto
      come parte di un vaso di antimonio puro, il che implicherebbe una tecnica sofisticata
      per rendere lavorabile un materiale intrinsecamente fragile. L''archeologo Roger Moorey
      ha però contestato sia che si trattasse di un vaso sia che serva ipotizzare una metallurgia
      perduta: più probabilmente è un piccolo ornamento ricavato da antimonio nativo.'
    visual: Frammento metallico antico esposto in vetrina con la sua etichetta di catalogo
    attendibilita: discusso
  - id: nome
    sezione: storia
    testo: Anche il nome porta i segni di una storia confusa. Il simbolo Sb viene dal latino
      stibium, che designa il minerale e non il metallo, ed è a sua volta imparentato con
      l'arabo al-ithmid, il nome della stessa polvere cosmetica. La parola antimonio deriva
      invece dal latino medievale antimonium, comparso negli scritti degli alchimisti, la
      cui origine resta tuttora non chiarita.
    visual: Pagina di un lessico alchemico con i simboli e i nomi dell'antimonio
    attendibilita: documentato
  - id: nome_etimologie
    sezione: curiosita
    testo: 'Sull''origine della parola antimonio circolano da secoli spiegazioni pittoresche
      e mai dimostrate. La più diffusa la scioglie come anti-monaco, perché il metallo avrebbe
      ucciso i monaci che lo maneggiavano nei laboratori dei conventi; un''altra la fa risalire
      a un greco «contro la solitudine», perché in natura non si trova mai da solo. Sono etimologie
      senza alcun riscontro documentale, e sopravvivono perché sono più belle della risposta
      vera, che è: non lo sappiamo.'
    visual: Laboratorio conventuale con alambicchi e un manoscritto aperto
    attendibilita: discusso
  - id: valentino
    sezione: storia
    testo: 'Alla fortuna dell''antimonio in età moderna contribuisce un libro, il Carro trionfale
      dell''antimonio, attribuito a un monaco benedettino del Quattrocento di nome Basilio
      Valentino. L''attribuzione è falsa: l''opera esce nel 1604 ed è con ogni probabilità
      di Johann Thölde, che se ne servì per dare autorevolezza antica a un testo suo. Il libro
      fu comunque letto e discusso per due secoli, e l''antimonio divenne uno dei rimedi più
      prescritti e più contestati della medicina moderna.'
    visual: Frontespizio secentesco del Carro trionfale dell'antimonio
    attendibilita: documentato
  - id: caratteristiche_semimetallo
    sezione: caratteristiche
    testo: 'L''antimonio ha l''aspetto di un metallo, lucido e grigio-argenteo, ma non ne
      ha il comportamento: è talmente fragile da polverizzarsi sotto un colpo di martello,
      e conduce elettricità e calore molto peggio di qualunque metallo vero. La ragione sta
      nella sua struttura, fatta di strati legati saldamente al loro interno e debolmente
      fra loro. È il motivo per cui non è mai stato usato da solo per fabbricare oggetti.'
    visual: Blocco di antimonio che si sfalda in schegge sotto un colpo secco
    attendibilita: documentato
  - id: caratteristiche_dilatazione
    sezione: caratteristiche
    testo: 'Ha una proprietà che condivide con pochissime sostanze, l''acqua fra queste: solidificando
      si dilata invece di contrarsi. Aggiunto al piombo fuso, un metallo che invece ritira,
      produce una lega che riempie perfettamente lo stampo e ne riproduce ogni dettaglio.
      Su questo si è retta per cinque secoli la tipografia a caratteri mobili, i cui caratteri
      erano leghe di piombo, stagno e antimonio.'
    visual: Cassetta tipografica con caratteri mobili in lega di piombo e antimonio
    attendibilita: documentato
  - id: caratteristiche_chimica
    sezione: caratteristiche
    testo: 'Chimicamente si colloca nello stesso gruppo dell''azoto, del fosforo e dell''arsenico,
      e ne segue il comportamento con stati di ossidazione -3, +3 e +5. La sua tossicità è
      reale e i sintomi assomigliano a quelli dell''avvelenamento da arsenico, con disturbi
      gastrointestinali e cardiaci, ma l''antimonio è meno velenoso dell''arsenico a parità
      di dose: una differenza che nella medicina di età moderna, che lo somministrava come
      emetico, non era affatto trascurabile.'
    visual: Schema del gruppo 15 della tavola periodica con antimonio evidenziato
    attendibilita: documentato
  - id: usi_ritardanti
    sezione: usi
    testo: L'uso di gran lunga principale oggi, circa la metà del consumo mondiale, è come
      ritardante di fiamma. Il triossido di antimonio non spegne nulla da solo, ma in presenza
      di composti alogenati agisce da sinergico e rende molto meno infiammabili plastiche,
      tessuti tecnici, rivestimenti di cavi e schiume per imbottiture. È presente in una quantità
      enorme di oggetti quotidiani senza che nessuno lo sappia.
    visual: Cavo elettrico e imbottitura sottoposti alla prova di infiammabilità
    attendibilita: documentato
  - id: usi_leghe
    sezione: usi
    testo: 'Il secondo impiego per volume, circa un terzo del totale, resta la lega con il
      piombo, che l''antimonio irrigidisce sensibilmente: serve alle griglie delle batterie
      al piombo-acido, dove la resistenza meccanica delle piastre determina la durata dell''accumulatore,
      e in passato ai proiettili e ai metalli antifrizione per cuscinetti. Quantità minori
      vanno nell''elettronica, come drogante del silicio e nell''antimoniuro di indio per
      i rivelatori a infrarossi, e nella lavorazione del vetro per eliminare le microbolle.'
    visual: Griglia di piombo antimoniale di una batteria in produzione
    attendibilita: documentato
  - id: curiosita_pillole
    sezione: curiosita
    testo: 'Fra il Cinquecento e l''Ottocento circolavano le cosiddette pillole perpetue,
      palline di antimonio metallico che si ingerivano come purgante. L''antimonio reagisce
      quel tanto che basta a irritare l''intestino e provocare l''effetto, poi viene espulso
      pressoché intatto: si recuperava dal vaso da notte, si lavava e si riutilizzava, e ci
      sono famiglie che se le tramandavano di generazione in generazione. La facoltà di medicina
      di Parigi le mise al bando più volte nel corso del Seicento, senza riuscire a farle
      sparire.'
    visual: Piccola sfera metallica lucida accanto a un astuccio da farmacia d'epoca
    attendibilita: documentato
  pronuncia: []
