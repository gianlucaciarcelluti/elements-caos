  epoca: antichita
  isolamento_anno: null
  note_cronologia: 'Ferro meteoritico, martellato a freddo: la siderurgia, cioè l''estrazione
    del ferro dal minerale, arriva millenni dopo e apre l''età del ferro intorno al 1200 a.C.'
  controversia: 'La data convenzionale del V millennio a.C. si riferisce al ferro meteoritico,
    non a quello estratto dai minerali, e la distinzione non è un dettaglio ma il cuore della
    vicenda. Il ferro meteoritico è già metallico quando lo si raccoglie e si lavora a freddo
    con le stesse tecniche del rame nativo; i reperti sicuri più antichi e ben analizzati
    sono le perline di Gerzeh, in Egitto, del 3200 a.C. circa, riconosciute come meteoritiche
    per la struttura di Widmanstätten e per il tenore di nichel intorno al trenta per cento.
    La siderurgia vera è un''altra cosa e arriva molto dopo: matura nel II millennio a.C.
    e diventa dominante intorno al 1200 a.C. Vale la pena precisare che non consiste nel fondere
    il ferro, cosa che i forni antichi non facevano: il bassofuoco lavora fra i 1100 e i 1300
    gradi e riduce il minerale allo stato solido, lasciando una massa spugnosa da depurare
    a martellate. Presentare il ferro come noto dal V millennio senza precisare quale ferro
    anticiperebbe la metallurgia di quasi quattromila anni.'
