contenuti:
  hook: 'Il primo ferro lavorato dall''uomo non veniva dalla Terra: cadeva dal cielo. Per
    quattromila anni il ferro è stato un metallo raro e prezioso, prima che qualcuno imparasse
    a strapparlo alla roccia.'
  beats:
  - id: incipit_generale
    sezione: incipit
    testo: 'Il ferro è l''elemento più abbondante della Terra per massa e forma gran parte
      del nucleo del pianeta, eppure è arrivato tardi. La ragione è tecnica: il ferro non
      si trova quasi mai allo stato metallico in superficie, e per estrarlo dal minerale serve
      un calore che l''umanità ha impiegato millenni a saper produrre.'
    visual: Sezione della Terra con il nucleo di ferro evidenziato accanto a un blocco di
      minerale ferroso
    attendibilita: documentato
  - id: meteoritico
    sezione: storia
    testo: 'Il ferro che si lavora prima della siderurgia viene dalle meteoriti. Circa una
      meteorite su venti è ricca di leghe ferro-nichel già metalliche, e queste masse cadute
      dal cielo si possono martellare a freddo senza fondere nulla, esattamente come si faceva
      con il rame nativo. È a questo ferro che si riferisce la data convenzionale usata qui:
      un metallo raccolto, non prodotto.'
    visual: Frammento di meteorite ferrosa sezionato, con le figure di Widmanstätten visibili
    attendibilita: documentato
  - id: gerzeh
    sezione: storia
    testo: 'I reperti sono espliciti su quanto quel metallo valesse. Le nove perline di ferro
      dalle tombe di Gerzeh, nell''Egitto settentrionale, datate intorno al 3200 a.C., sono
      state ottenute martellando frammenti meteoritici in lamine sottili e arrotolandole in
      tubi; le analisi al microscopio elettronico vi hanno riconosciuto la struttura tipica
      di una meteorite e circa il trenta per cento di nichel. Erano infilate in una collana
      insieme a lapislazzuli, oro e corniola: il ferro stava, allora, fra le pietre preziose.'
    visual: Collana ricostruita di Gerzeh con perline di ferro, oro e lapislazzuli
    attendibilita: documentato
  - id: tutankhamon
    sezione: storia
    testo: 'Il caso più celebre è il pugnale trovato nel sarcofago di Tutankhamon, del XIV
      secolo a.C. La sua lama non è mai arrugginita in tremila anni e la sua composizione,
      misurata con la fluorescenza a raggi X, mostra circa l''undici per cento di nichel e
      mezzo punto di cobalto: proporzioni che sulla Terra non esistono e che indicano senza
      ambiguità un''origine meteoritica. In una tomba piena d''oro, l''oggetto tecnicamente
      più raro era di ferro.'
    visual: Pugnale di Tutankhamon con la lama intatta accanto al suo fodero d'oro
    attendibilita: documentato
  - id: siderurgia
    sezione: storia
    testo: 'Il salto alla siderurgia vera non è, come si dice spesso, una questione di riuscire
      a fondere il ferro: nei forni antichi il ferro non fondeva affatto. Il bassofuoco lavora
      fra i 1100 e i 1300 gradi, ben sotto il punto di fusione del metallo, e il minerale
      viene ridotto allo stato solido dal monossido di carbonio che sprigiona il carbone di
      legna. La difficoltà sta lì: ottenere e mantenere un''atmosfera povera di ossigeno per
      ore, e poi lavorare a caldo la massa spugnosa che si raccoglie sul fondo, martellandola
      a lungo per spremerne fuori le scorie. La padronanza del processo matura nel II millennio
      a.C. in Eurasia, e intorno al 1200 a.C. gli utensili di ferro cominciano a soppiantare
      quelli di bronzo.'
    visual: Forno a manica primitivo con mantici e la spugna di ferro estratta dal fondo
    attendibilita: documentato
  - id: democratizzazione
    sezione: storia
    testo: 'Ciò che cambia con la siderurgia non è la qualità del metallo, che all''inizio
      è anzi peggiore del buon bronzo, ma la sua disponibilità. Il bronzo dipendeva dallo
      stagno, raro e da importare da lontanissimo; i minerali di ferro invece si trovano quasi
      ovunque. Il ferro è il primo metallo che smette di essere un lusso: arma chiunque, ara
      qualunque campo, e ridisegna gli equilibri di potere di conseguenza.'
    visual: Vomere d'aratro in ferro accanto a una spada, entrambi di fattura ordinaria
    attendibilita: documentato
  - id: caratteristiche_allotropi
    sezione: caratteristiche
    testo: 'Il ferro non ha una sola struttura cristallina: la cambia al variare della temperatura,
      passando fra forme diverse chiamate alfa, gamma e delta. Sembra un dettaglio da manuale,
      ed è invece il fondamento di tutta la metallurgia dell''acciaio, perché ciascuna forma
      scioglie il carbonio in misura diversa. Temprare una lama, cioè raffreddarla di colpo,
      significa congelare una di queste strutture prima che abbia il tempo di trasformarsi.'
    visual: Lama incandescente immersa nell'acqua con il vapore che si solleva
    attendibilita: documentato
  - id: caratteristiche_magnetismo
    sezione: caratteristiche
    testo: 'Il ferro è il ferromagnete per eccellenza, e alla sua capacità di magnetizzarsi
      si deve la parola stessa. La proprietà però ha un limite netto: sopra i 770 gradi, la
      cosiddetta temperatura di Curie, il ferro perde il ferromagnetismo e diventa semplicemente
      paramagnetico. Da questo comportamento discendono i motori elettrici, i trasformatori
      e per decenni la registrazione magnetica dei dati.'
    visual: Barra di ferro che attira limatura, e la stessa barra arroventata che non la attira
      più
    attendibilita: documentato
  - id: caratteristiche_ruggine
    sezione: caratteristiche
    testo: 'Il difetto del ferro è che ossida male. La ruggine, ossido idrato di ferro, occupa
      più volume del metallo da cui nasce, quindi si sfoglia e si stacca invece di formare
      una pellicola protettiva: sotto lo strato caduto c''è metallo fresco pronto a corrodersi
      a sua volta. È il motivo per cui il ferro va verniciato, zincato o legato al cromo per
      farne acciaio inossidabile. La sua chimica conosce parecchi stati di ossidazione, ma
      in pratica quasi tutto quello che si incontra è ferro +2 o +3.'
    visual: Lamiera arrugginita che si sfoglia mostrando il metallo vivo sottostante
    attendibilita: documentato
  - id: usi_acciaio
    sezione: usi
    testo: 'Oggi il ferro è il metallo più prodotto al mondo con un margine enorme, e quasi
      tutto finisce in acciaio, cioè ferro con una piccola percentuale di carbonio più eventuali
      altri elementi in lega. Travi, rotaie, lamiere per automobili, armature del cemento,
      tubazioni, utensili: l''infrastruttura fisica del mondo contemporaneo è, in massa, essenzialmente
      acciaio.'
    visual: Colata d'acciaio in acciaieria che riempie una siviera
    attendibilita: documentato
  - id: usi_leghe_speciali
    sezione: usi
    testo: 'Aggiungendo altri elementi si ottengono acciai con proprietà su misura: il cromo
      e il nichel danno l''inossidabile per posate e industria alimentare, il manganese la
      resistenza all''urto per macchine movimento terra, il silicio i lamierini a bassa perdita
      per i trasformatori. La ghisa, più ricca di carbonio e quindi fragile ma facile da colare,
      resta insostituibile per basamenti di macchine e ceppi freno.'
    visual: Serie di provini d'acciaio di leghe diverse con le rispettive marcature
    attendibilita: documentato
  - id: curiosita_emoglobina
    sezione: curiosita
    testo: Un corpo umano adulto contiene circa quattro grammi di ferro, per la maggior parte
      dentro l'emoglobina, la proteina che trasporta l'ossigeno nel sangue. È un atomo di
      ferro a legare l'ossigeno nei polmoni e a rilasciarlo nei tessuti, ed è la sua presenza
      a rendere rosso il sangue. Lo stesso elemento che regge i grattacieli tiene in vita
      chi ci abita.
    visual: Modello dell'eme con l'atomo di ferro al centro dell'anello
    attendibilita: documentato
  - id: curiosita_nome_celeste
    sezione: curiosita
    testo: Che il primo ferro venisse dal cielo è rimasto scritto nelle lingue. Dalla XIX
      dinastia in Egitto compare per il ferro l'espressione biA n pt, che vale letteralmente
      «ferro del cielo», e i segni proposti per la parola sumerica corrispondente contengono
      anch'essi il segno del cielo. Sono parole coniate da chi vedeva cadere il metallo e
      non aveva altro modo di procurarselo, e sopravvivono nei testi molto dopo che i forni
      avevano reso la questione irrilevante.
    visual: Geroglifico egizio per il ferro accanto a una scia meteorica notturna
    attendibilita: documentato
  pronuncia: []
