numero_atomico: 88
simbolo: Ra
nome: Radio
nome_en: Radium
scoperta:
  anno: 1898
  anno_stimato: false
  scopritori:
  - pierre-curie
  - marie-curie
  luogo: Parigi, Francia
  epoca: spettroscopia
  isolamento_anno: null
  note_cronologia: Annunciato il 26 dicembre 1898, cinque mesi dopo il polonio e con lo stesso
    metodo radiometrico; la conferma che si trattasse di un elemento nuovo venne dalle righe
    spettrali carminio osservate da Eugène-Anatole Demarçay. Il metallo fu isolato nel 1910
    da Marie Curie e André-Louis Debierne.
  controversia: null
