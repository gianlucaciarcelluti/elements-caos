<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="La scoperta degli elementi">
  <!-- Un atomo stilizzato: il nucleo e un'orbita, che è la figura ricorrente
       delle schede degli elementi. I colori sono fissi e non seguono il tema:
       la favicon si vede fuori dalla pagina, dove i token CSS non arrivano. -->
  <rect width="32" height="32" rx="6" fill="#175a8c"/>
  <ellipse cx="16" cy="16" rx="11" ry="5" fill="none" stroke="#fdfcfa" stroke-width="1.6"
           transform="rotate(-30 16 16)"/>
  <ellipse cx="16" cy="16" rx="11" ry="5" fill="none" stroke="#fdfcfa" stroke-width="1.6"
           transform="rotate(30 16 16)"/>
  <circle cx="16" cy="16" r="3.4" fill="#fdfcfa"/>
</svg>
