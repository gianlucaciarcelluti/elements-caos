[project]
name = "elements-caos"
version = "0.1.0"
description = "Vault Obsidian sulla storia cronologica degli elementi chimici"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "requests>=2.32",
]

[project.scripts]
elements-caos = "elements_caos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elements_caos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: test che scaricano il dataset reale e verificano i dati in produzione"]

[tool.ruff]
line-length = 100
target-version = "py312"
# I documenti di progetto contengono blocchi di codice illustrativi: sono
# documentazione, non sorgenti, e ruff non deve riformattarli.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# N818 pretende il suffisso "Error" sulle eccezioni. Le nostre sono nominate in
# italiano e portano "Errore" come prefisso (ErroreCaricamento, ErroreIngest):
# la regola non riconosce il pattern e segnalerebbe un falso positivo.
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
