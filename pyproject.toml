[project]
name = "elements-caos"
version = "0.1.0"
description = "Vault Obsidian sulla storia cronologica degli elementi chimici"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "requests>=2.32",
]

[project.scripts]
elements-caos = "elements_caos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elements_caos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
