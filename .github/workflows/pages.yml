name: Pubblicazione del sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta, e senza annullare quella in corso: interrompere
# un deploy a metà lascerebbe il sito in uno stato parziale.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruisci:
    name: Costruzione del sito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installa le dipendenze
        run: uv sync --all-extras --dev

      # Il sito si genera dallo stesso dataset che genera il vault: niente
      # clone di Quartz, niente npm nel percorso di pubblicazione, niente
      # cinque minuti di costruzione.
      - name: Costruisci il sito dal dataset
        run: uv run elements-caos sito --dati data --uscita public

      - name: Verifica che il sito non sia vuoto
        run: |
          # Una costruzione che fallisce a metà può lasciare un public/ con la
          # sola home: senza questo controllo il sito verrebbe pubblicato monco.
          test -f public/index.html
          pagine=$(find public -name '*.html' | wc -l)
          echo "pagine costruite: $pagine"
          if [ "$pagine" -lt 229 ]; then
            echo "::error::solo $pagine pagine: ne sono attese almeno 229" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  pubblica:
    name: Pubblicazione su GitHub Pages
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
