name: Pubblicazione del sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta, e senza annullare quella in corso: interrompere
# un deploy a metà lascerebbe il sito in uno stato parziale.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruisci:
    name: Costruzione del sito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # La cache è su ~/.npm e non su node_modules: le dipendenze si installano
      # dentro .quartz-build, che è un clone effimero di Quartz e non esiste
      # ancora quando la cache viene ripristinata.
      - name: Cache delle dipendenze npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-quartz-${{ hashFiles('scripts/costruisci_sito.sh') }}
          restore-keys: ${{ runner.os }}-quartz-

      - name: Costruisci il sito dal vault
        run: scripts/costruisci_sito.sh

      - name: Verifica che il sito non sia vuoto
        run: |
          # Una costruzione che fallisce a metà può lasciare un public/ con la
          # sola home: senza questo controllo il sito verrebbe pubblicato monco.
          test -f public/index.html
          note=$(find public -name '*.html' | wc -l)
          echo "pagine costruite: $note"
          if [ "$note" -lt 118 ]; then
            echo "::error::solo $note pagine: il vault ne ha molte di più" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  pubblica:
    name: Pubblicazione su GitHub Pages
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
